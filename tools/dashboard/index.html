<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Architect Portfolio Dashboard</title>
<style>
  :root {
    --sidebar-w: 260px;
    --bg: #f5f5f5; --bg-card: #fff; --bg-sidebar: #1e1e2e;
    --text: #333; --text-light: #888; --text-sidebar: #cdd6f4;
    --accent: #7c3aed; --border: #e2e2e2;
    --blue: #3b82f6; --green: #22c55e; --red: #ef4444;
    --orange: #f59e0b; --teal: #14b8a6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; }

  /* Sidebar */
  #sidebar { width: var(--sidebar-w); min-width: var(--sidebar-w); background: var(--bg-sidebar); color: var(--text-sidebar); padding: 20px 0; overflow-y: auto; display: flex; flex-direction: column; }
  #sidebar h1 { font-size: 15px; padding: 0 16px 16px; border-bottom: 1px solid #313244; letter-spacing: 0.5px; text-transform: uppercase; color: #cba6f7; display: flex; align-items: center; gap: 8px; }
  .dispatch-count { background: var(--accent); color: #fff; font-size: 10px; padding: 1px 7px; border-radius: 10px; font-weight: 700; }
  .dispatch-count.empty { display: none; }
  .org-group { margin-top: 12px; }
  .org-name { padding: 6px 16px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; color: #f5c2e7; }
  .org-name:hover { background: #313244; }
  .org-name .arrow { font-size: 10px; transition: transform .15s; }
  .org-name .arrow.open { transform: rotate(90deg); }
  .project-list { padding-left: 16px; }
  .project-item { padding: 4px 16px; font-size: 12.5px; cursor: pointer; border-radius: 4px; margin: 1px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; }
  .signal-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; flex-shrink: 0; }
  .signal-dot.red { background: var(--red); }
  .signal-dot.yellow { background: var(--orange); }
  .signal-dot.green { background: var(--green); }
  .project-item:hover { background: #313244; }
  .project-item.active { background: var(--accent); color: #fff; }

  /* Main */
  #main { flex: 1; overflow-y: auto; padding: 28px 36px; }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 24px; margin-bottom: 20px; }
  h2 { font-size: 22px; margin-bottom: 16px; }
  h3 { font-size: 16px; margin: 16px 0 8px; color: #555; }

  /* Badges */
  .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; margin: 2px 3px; }
  .badge-role { background: #ede9fe; color: var(--accent); }
  .badge-open { background: #dbeafe; color: var(--blue); }
  .badge-done { background: #dcfce7; color: #16a34a; }
  .badge-blocked { background: #fee2e2; color: var(--red); }
  .badge-high { background: #fee2e2; color: var(--red); }
  .badge-medium { background: #fef3c7; color: #b45309; }
  .badge-low { background: #e0f2fe; color: #0284c7; }
  .badge-agent { background: #f0fdf4; color: var(--teal); border: 1px solid #bbf7d0; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 10.5px; background: #f1f5f9; color: #64748b; margin: 1px 2px; }

  /* Tabs */
  .tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
  .tab { padding: 8px 18px; cursor: pointer; font-size: 13px; font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -2px; color: var(--text-light); }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Tables */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px 10px; border-bottom: 2px solid var(--border); font-size: 11px; text-transform: uppercase; color: var(--text-light); }
  td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:hover { background: #fafafa; }
  .expand-btn { cursor: pointer; color: var(--blue); font-size: 12px; border: none; background: none; }
  .dispatch-btn { cursor: pointer; color: #fff; font-size: 12px; border: none; background: var(--accent); padding: 3px 10px; border-radius: 4px; margin-left: 4px; }
  .dispatch-btn:hover { opacity: 0.85; }

  /* Key-value */
  .kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; font-size: 13px; margin-bottom: 12px; }
  .kv dt { color: var(--text-light); font-weight: 500; }
  .kv dd { margin: 0; }

  /* List */
  .item-list { list-style: none; padding: 0; }
  .item-list li { padding: 4px 0; font-size: 13px; border-bottom: 1px solid #f0f0f0; }
  .item-list li:last-child { border: none; }

  /* Markdown */
  .md-container { max-height: 600px; overflow-y: auto; padding: 16px; background: #fafafa; border-radius: 6px; font-size: 14px; line-height: 1.6; }
  .md-container pre { background: #1e1e2e; color: #cdd6f4; padding: 12px; border-radius: 6px; overflow-x: auto; }
  .md-container code { font-size: 13px; }
  .md-container h1, .md-container h2, .md-container h3 { margin-top: 16px; margin-bottom: 8px; }
  .md-container ul, .md-container ol { padding-left: 20px; }

  /* Env table */
  .env-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .env-card { border: 1px solid var(--border); border-radius: 6px; padding: 12px; font-size: 12.5px; }
  .env-card strong { display: block; margin-bottom: 4px; text-transform: capitalize; }
  .env-card .mono { font-family: monospace; color: var(--text-light); font-size: 11.5px; }

  /* File list for docs */
  .file-link { display: inline-block; padding: 6px 12px; margin: 4px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 13px; }
  .file-link:hover { background: #f0f0ff; border-color: var(--accent); }
  .file-link.active { background: #ede9fe; border-color: var(--accent); }

  .session-log { margin-top: 8px; padding: 8px 12px; background: #f8f8f8; border-radius: 4px; font-size: 12px; }
  .session-log .entry { padding: 3px 0; border-bottom: 1px solid #eee; }
  .session-log .entry:last-child { border: none; }
  .session-log .date { color: var(--text-light); font-family: monospace; margin-right: 8px; }

  .empty { color: var(--text-light); font-style: italic; font-size: 13px; padding: 12px 0; }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal { background: #fff; border-radius: 10px; padding: 28px; max-width: 560px; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,0.18); }
  .modal h3 { margin-top: 0; margin-bottom: 12px; font-size: 18px; color: var(--text); }
  .modal .field { margin-bottom: 14px; }
  .modal label { display: block; font-size: 12px; font-weight: 600; color: var(--text-light); margin-bottom: 4px; text-transform: uppercase; }
  .modal textarea { width: 100%; min-height: 80px; border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-size: 13px; font-family: inherit; resize: vertical; }
  .modal textarea:focus { outline: none; border-color: var(--accent); }
  .modal .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .modal .btn { padding: 8px 20px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; }
  .modal .btn-cancel { background: #f1f5f9; color: var(--text); }
  .modal .btn-dispatch { background: var(--accent); color: #fff; }
  .modal .btn-dispatch:hover { opacity: 0.9; }
  .modal input[type="text"], .modal select { width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-size: 13px; font-family: inherit; }
  .modal input[type="text"]:focus, .modal select:focus { outline: none; border-color: var(--accent); }
  .btn-add-wi { cursor: pointer; color: #fff; font-size: 12px; border: none; background: var(--accent); padding: 6px 14px; border-radius: 4px; margin-bottom: 12px; }
  .btn-add-wi:hover { opacity: 0.85; }
  .edit-btn { cursor: pointer; color: var(--accent); font-size: 12px; border: 1px solid var(--accent); background: none; padding: 3px 10px; border-radius: 4px; margin-left: 4px; }
  .edit-btn:hover { background: #ede9fe; }
  .delete-btn { cursor: pointer; color: var(--red); font-size: 12px; border: 1px solid var(--red); background: none; padding: 3px 10px; border-radius: 4px; margin-left: 4px; }
  .delete-btn:hover { background: #fee2e2; }

  /* Dispatch panels */
  .dispatch-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
  .dispatch-header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: #fafafa; }
  .dispatch-header .status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .dispatch-header .status-dot.running { background: var(--green); animation: pulse 1.5s infinite; }
  .dispatch-header .status-dot.completed { background: var(--green); }
  .dispatch-header .status-dot.failed { background: var(--red); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .dispatch-header .dispatch-title { font-size: 13px; font-weight: 600; flex: 1; }
  .dispatch-header .dispatch-meta { font-size: 11px; color: var(--text-light); }
  .dispatch-log { max-height: 350px; overflow-y: auto; padding: 12px 16px; background: #1e1e2e; color: #cdd6f4; font-family: monospace; font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .dispatch-guidance { padding: 12px 16px; background: #fffbeb; border-top: 1px solid #fde68a; font-size: 12.5px; }
  .dispatch-guidance code { background: #fef3c7; padding: 2px 6px; border-radius: 3px; font-size: 12px; }
  .dispatch-guidance .label { font-weight: 600; font-size: 11px; text-transform: uppercase; color: #92400e; margin-bottom: 4px; }

  /* Epic sidebar */
  .sidebar-section-label { padding: 10px 16px 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #6c7086; cursor: pointer; }
  .sidebar-section-label:hover { color: #cdd6f4; }
  .epic-item { padding: 4px 16px; font-size: 12px; cursor: pointer; border-radius: 4px; margin: 1px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
  .epic-item:hover { background: #313244; }
  .epic-item.active { background: var(--accent); color: #fff; }
  .epic-progress { font-size: 10px; color: #888; flex-shrink: 0; }
  .signal-dot.grey { background: #6c7086; }
  .sidebar-divider { border: none; border-top: 1px solid #313244; margin: 8px 16px; }
  .sidebar-onboard-btn { padding: 6px 16px; font-size: 11px; cursor: pointer; color: #a6adc8; }
  .sidebar-onboard-btn:hover { color: #cdd6f4; background: #313244; }

  /* Progress bar */
  .progress-bar-container { background: #e2e2e2; border-radius: 6px; height: 8px; overflow: hidden; margin: 8px 0 16px; }
  .progress-bar-fill { height: 100%; border-radius: 6px; background: var(--green); transition: width .3s; }

  /* Epic badge in tables */
  .badge-epic { background: #faf5ff; color: #7c3aed; border: 1px solid #e9d5ff; cursor: pointer; }
  .badge-epic:hover { background: #ede9fe; }

  /* Unlink button */
  .unlink-btn { cursor: pointer; color: var(--red); font-size: 11px; border: 1px solid var(--red); background: none; padding: 2px 8px; border-radius: 4px; }
  .unlink-btn:hover { background: #fee2e2; }

  /* Markdown editor modal */
  .modal-wide { max-width: 700px; }
  .modal-wide textarea { min-height: 300px; font-family: monospace; font-size: 13px; }

  /* Kill buttons */
  .kill-btn { cursor: pointer; color: #fff; font-size: 11px; border: none; background: var(--red); padding: 3px 10px; border-radius: 4px; }
  .kill-btn:hover { opacity: 0.85; }
  .kill-btn:disabled { opacity: 0.4; cursor: default; }
  .kill-all-btn { cursor: pointer; color: var(--red); font-size: 11px; border: 1px solid var(--red); background: none; padding: 4px 12px; border-radius: 4px; margin-bottom: 8px; }
  .kill-all-btn:hover { background: #fee2e2; }

  /* Terminal panels */
  .terminal-panel { background: var(--bg-card); border: 1px solid var(--accent); border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
  .terminal-header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--accent); background: #1e1e2e; }
  .terminal-header .status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .terminal-header .status-dot.running { background: var(--green); animation: pulse 1.5s infinite; }
  .terminal-header .status-dot.completed, .terminal-header .status-dot.failed, .terminal-header .status-dot.killed { background: var(--red); }
  .terminal-header .terminal-title { font-size: 13px; font-weight: 600; flex: 1; color: #cdd6f4; }
  .terminal-header .terminal-meta { font-size: 11px; color: #6c7086; }
  .terminal-container { height: 400px; background: #1e1e2e; }

  /* Interactive checkbox in modals */
  .interactive-toggle { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .interactive-toggle label { font-size: 13px; cursor: pointer; color: var(--text); text-transform: none; font-weight: 400; }
  .interactive-toggle input[type="checkbox"] { cursor: pointer; }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5/css/xterm.min.css">
</head>
<body>

<nav id="sidebar">
  <h1>Architect <span id="dispatch-badge" class="dispatch-count empty"></span></h1>
  <div id="epic-tree"></div>
  <div id="tree"></div>
</nav>

<main id="main">
  <div class="card">
    <h2>Portfolio Dashboard</h2>
    <p style="color:var(--text-light);font-size:14px">Select an organization or project from the sidebar.</p>
  </div>
</main>

<script type="module">
const $ = s => document.querySelector(s);
const api = path => fetch('/api/' + path).then(r => r.ok ? r.json() : Promise.reject(r.statusText));
const apiText = path => fetch('/api/' + path).then(r => r.ok ? r.text() : Promise.reject(r.statusText));

let markedLoaded = false;
async function loadMarked() {
  if (markedLoaded) return;
  try {
    await new Promise((ok, fail) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/marked@15/marked.min.js';
      s.onload = ok; s.onerror = fail;
      document.head.appendChild(s);
    });
    markedLoaded = true;
  } catch { markedLoaded = false; }
}
loadMarked();

function renderMd(text) {
  if (markedLoaded && window.marked) return window.marked.parse(text);
  return '<pre>' + esc(text) + '</pre>';
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// --- Data cache ---
let backlog = null;
let orgCache = {};

async function getBacklog() {
  if (!backlog) backlog = await api('backlog');
  return backlog;
}

let epicCache = null;
async function getEpics() {
  epicCache = await api('epics');
  return epicCache;
}

function epicSignalColor(epic, progress) {
  if (epic.status === 'draft') return 'grey';
  if (epic.status === 'done') return 'green';
  if (epic.status === 'cancelled') return 'grey';
  const items = progress || { done: 0, total: 0 };
  if (items.total === 0) return 'grey';
  if (items.done === items.total) return 'green';
  if (epic.priority === 'critical' || epic.priority === 'high') return 'red';
  return 'yellow';
}

async function buildEpicTree() {
  const epicTree = document.getElementById('epic-tree');
  epicTree.innerHTML = '';
  // EPICS label — always visible
  const label = document.createElement('div');
  label.className = 'sidebar-section-label';
  label.textContent = 'EPICS';
  label.onclick = () => { location.hash = '#epics'; };
  epicTree.appendChild(label);

  try {
    const epics = await getEpics();

    for (const epic of epics) {
      const item = document.createElement('div');
      item.className = 'epic-item';
      item.dataset.epicId = epic.id;
      const color = epicSignalColor(epic, epic.progress);
      const p = epic.progress || { done: 0, total: 0 };
      item.innerHTML = `<span class="signal-dot ${color}"></span><span style="flex:1;overflow:hidden;text-overflow:ellipsis">${esc(epic.id)} ${esc(epic.title)}</span><span class="epic-progress">(${p.done}/${p.total})</span>`;
      item.onclick = () => { location.hash = `#epic/${epic.id}`; };
      epicTree.appendChild(item);
    }
  } catch {}

  // Onboard button — always visible
  const onboardBtn = document.createElement('div');
  onboardBtn.className = 'sidebar-onboard-btn';
  onboardBtn.textContent = '+ Onboard Project';
  onboardBtn.onclick = () => showOnboardModal();
  epicTree.appendChild(onboardBtn);

  const divider = document.createElement('hr');
  divider.className = 'sidebar-divider';
  epicTree.appendChild(divider);
}

// --- Dispatch state ---
const activeDispatches = [];

function updateDispatchBadge() {
  const badge = $('#dispatch-badge');
  const running = activeDispatches.filter(d => d.status === 'running').length
    + activeTerminals.filter(t => t.status === 'running').length;
  if (running > 0) {
    badge.textContent = running;
    badge.classList.remove('empty');
  } else {
    badge.classList.add('empty');
  }
}

function extractStreamText(line) {
  try {
    const evt = JSON.parse(line);
    if (evt.type === 'assistant' && evt.message?.content) {
      return evt.message.content
        .filter(b => b.type === 'text')
        .map(b => b.text)
        .join('');
    }
    if (evt.type === 'content_block_delta' && evt.delta?.text) {
      return evt.delta.text;
    }
    if (evt.type === 'content_block_start' && evt.content_block?.text) {
      return evt.content_block.text;
    }
    if (evt.type === 'system' && evt.subtype === 'init') {
      return null;
    }
    if (evt.type === 'result') {
      const cost = evt.total_cost_usd ? ` (cost: $${evt.total_cost_usd.toFixed(4)})` : '';
      return `\n--- Agent finished${cost} ---\n`;
    }
    if (evt.type === 'stderr') {
      return `[stderr] ${evt.content}`;
    }
  } catch {
    return line;
  }
  return null;
}

function createDispatchPanel(dispatch) {
  const panel = document.createElement('div');
  panel.className = 'dispatch-panel';
  panel.id = `dispatch-${dispatch.id}`;
  const titleParts = [dispatch.id];
  if (dispatch.work_item_id) titleParts.push(dispatch.work_item_id);
  titleParts.push(dispatch.title || '');
  const guidancePrompt = dispatch.work_item_id
    ? `Continue ${dispatch.work_item_id}: ${dispatch.title || ''}`
    : dispatch.title || '';
  const isRunning = dispatch.status === 'running';
  panel.innerHTML = `
    <div class="dispatch-header">
      <span class="status-dot ${isRunning ? 'running' : dispatch.status}"></span>
      <span class="dispatch-title">${esc(titleParts.join(' — '))}</span>
      <span class="dispatch-meta">${new Date(dispatch.started_at).toLocaleTimeString()}</span>
      <button class="kill-btn" data-kill-dispatch="${esc(dispatch.id)}" ${!isRunning ? 'disabled' : ''}>Kill</button>
    </div>
    <div class="dispatch-log" id="log-${dispatch.id}"></div>
    <div class="dispatch-guidance">
      <div class="label">Continue from terminal</div>
      <code data-dispatch-id="${esc(dispatch.id)}">${dispatch.session_id
        ? `cd ${esc(dispatch.project_path)} && claude --resume ${esc(dispatch.session_id)}`
        : `cd ${esc(dispatch.project_path)} && claude "${esc(guidancePrompt)}"`}</code>
    </div>
  `;
  // Bind kill button
  panel.querySelector(`[data-kill-dispatch="${dispatch.id}"]`).onclick = async (e) => {
    const btn = e.target;
    btn.disabled = true;
    try {
      await fetch(`/api/dispatch/${dispatch.id}`, { method: 'DELETE' });
      dispatch.status = 'killed';
      const dot = panel.querySelector('.status-dot');
      dot.classList.remove('running');
      dot.classList.add('killed', 'failed');
      updateDispatchBadge();
    } catch {}
  };
  return panel;
}

function connectDispatchStream(dispatch) {
  const logEl = document.getElementById(`log-${dispatch.id}`);
  const dotEl = document.querySelector(`#dispatch-${dispatch.id} .status-dot`);
  if (!logEl) return;

  const es = new EventSource(`/api/dispatch/${dispatch.id}/stream`);

  es.onmessage = (e) => {
    // Check for session_id in system init events
    try {
      const evt = JSON.parse(e.data);
      if (evt.type === 'system' && evt.subtype === 'init' && evt.session_id) {
        dispatch.session_id = evt.session_id;
        const codeEl = document.querySelector(`code[data-dispatch-id="${dispatch.id}"]`);
        if (codeEl) {
          codeEl.textContent = `cd ${dispatch.project_path} && claude --resume ${evt.session_id}`;
        }
      }
    } catch {}
    const text = extractStreamText(e.data);
    if (text) {
      logEl.textContent += text;
      logEl.scrollTop = logEl.scrollHeight;
    }
  };

  es.addEventListener('done', (e) => {
    try {
      const data = JSON.parse(e.data);
      dispatch.status = data.status;
    } catch {
      dispatch.status = 'completed';
    }
    if (dotEl) {
      dotEl.classList.remove('running');
      dotEl.classList.add(dispatch.status);
    }
    updateDispatchBadge();
    es.close();
  });

  es.onerror = () => {
    dispatch.status = 'failed';
    if (dotEl) {
      dotEl.classList.remove('running');
      dotEl.classList.add('failed');
    }
    updateDispatchBadge();
    es.close();
  };
}

function getDispatchContainer() {
  let container = document.getElementById('dispatch-panels');
  if (!container) {
    container = document.createElement('div');
    container.id = 'dispatch-panels';
    // Add Kill All button at top
    const killAllBtn = document.createElement('button');
    killAllBtn.className = 'kill-all-btn';
    killAllBtn.textContent = 'Kill All Sessions';
    killAllBtn.onclick = async () => {
      if (!confirm('Kill all running dispatches and terminals?')) return;
      await Promise.all([
        fetch('/api/dispatch/all', { method: 'DELETE' }),
        fetch('/api/terminal/all', { method: 'DELETE' }),
      ]);
      // Update UI for all dispatches
      activeDispatches.forEach(d => { d.status = 'killed'; });
      activeTerminals.forEach(t => { t.status = 'killed'; });
      document.querySelectorAll('.dispatch-panel .status-dot.running, .terminal-header .status-dot.running').forEach(dot => {
        dot.classList.remove('running');
        dot.classList.add('failed');
      });
      document.querySelectorAll('.kill-btn').forEach(btn => { btn.disabled = true; });
      updateDispatchBadge();
    };
    container.appendChild(killAllBtn);
    const main = $('#main');
    main.insertBefore(container, main.firstChild);
  }
  return container;
}

// --- xterm.js dynamic loading ---
let xtermLoaded = false;
let xtermModules = null;

async function loadXterm() {
  if (xtermLoaded) return xtermModules;
  try {
    const [xtermMod, fitMod, webLinksMod] = await Promise.all([
      import('https://cdn.jsdelivr.net/npm/@xterm/xterm@5/+esm'),
      import('https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0/+esm'),
      import('https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0/+esm'),
    ]);
    xtermModules = { Terminal: xtermMod.Terminal, FitAddon: fitMod.FitAddon, WebLinksAddon: webLinksMod.WebLinksAddon };
    xtermLoaded = true;
    return xtermModules;
  } catch (e) {
    console.error('Failed to load xterm.js:', e);
    return null;
  }
}

// --- Terminal state ---
const activeTerminals = [];

function createTerminalPanel(terminalInfo) {
  const panel = document.createElement('div');
  panel.className = 'terminal-panel';
  panel.id = `terminal-${terminalInfo.id}`;
  const isRunning = terminalInfo.status === 'running';
  panel.innerHTML = `
    <div class="terminal-header">
      <span class="status-dot ${isRunning ? 'running' : 'failed'}"></span>
      <span class="terminal-title">${esc(terminalInfo.id)} — ${esc(terminalInfo.title || 'Terminal')}</span>
      <span class="terminal-meta">${new Date(terminalInfo.started_at).toLocaleTimeString()}</span>
      <button class="kill-btn" data-kill-terminal="${esc(terminalInfo.id)}" ${!isRunning ? 'disabled' : ''}>Kill</button>
    </div>
    <div class="terminal-container" id="term-container-${terminalInfo.id}"></div>
  `;
  // Bind kill button
  panel.querySelector(`[data-kill-terminal="${terminalInfo.id}"]`).onclick = async (e) => {
    const btn = e.target;
    btn.disabled = true;
    try {
      await fetch(`/api/terminal/${terminalInfo.id}`, { method: 'DELETE' });
      terminalInfo.status = 'killed';
      const dot = panel.querySelector('.status-dot');
      dot.classList.remove('running');
      dot.classList.add('failed');
      updateDispatchBadge();
    } catch {}
  };
  return panel;
}

async function connectTerminalWs(terminalInfo) {
  const mods = await loadXterm();
  if (!mods) return;

  const containerEl = document.getElementById(`term-container-${terminalInfo.id}`);
  if (!containerEl) return;

  const { Terminal, FitAddon, WebLinksAddon } = mods;

  const term = new Terminal({
    cursorBlink: true,
    fontSize: 13,
    fontFamily: 'Menlo, Monaco, "Courier New", monospace',
    theme: { background: '#1e1e2e', foreground: '#cdd6f4', cursor: '#f5e0dc' },
  });

  const fitAddon = new FitAddon();
  term.loadAddon(fitAddon);
  term.loadAddon(new WebLinksAddon());
  term.open(containerEl);
  fitAddon.fit();

  terminalInfo._term = term;
  terminalInfo._fitAddon = fitAddon;

  // WebSocket connection
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${proto}//${location.host}/api/terminal/${terminalInfo.id}/ws`);
  terminalInfo._ws = ws;

  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'data') {
        term.write(msg.data);
      } else if (msg.type === 'exit') {
        terminalInfo.status = msg.code === 0 ? 'completed' : 'failed';
        const dot = document.querySelector(`#terminal-${terminalInfo.id} .status-dot`);
        if (dot) { dot.classList.remove('running'); dot.classList.add('failed'); }
        const killBtn = document.querySelector(`[data-kill-terminal="${terminalInfo.id}"]`);
        if (killBtn) killBtn.disabled = true;
        updateDispatchBadge();
      }
    } catch {}
  };

  ws.onclose = () => {
    terminalInfo._ws = null;
  };

  // Send keystrokes to server
  term.onData((data) => {
    if (ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'input', data }));
    }
  });

  // Handle resize
  const resizeObserver = new ResizeObserver(() => {
    fitAddon.fit();
    if (ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
    }
  });
  resizeObserver.observe(containerEl);
  terminalInfo._resizeObserver = resizeObserver;
}

// Restore terminals on page load
async function restoreTerminals() {
  try {
    const list = await api('terminal/active');
    for (const t of list) {
      if (activeTerminals.some(a => a.id === t.id)) continue;
      const terminalInfo = { ...t };
      activeTerminals.push(terminalInfo);
      const container = getDispatchContainer();
      const panel = createTerminalPanel(terminalInfo);
      container.appendChild(panel);
      if (t.status === 'running') {
        await connectTerminalWs(terminalInfo);
      }
    }
    updateDispatchBadge();
  } catch {}
}

async function dispatchWorkItem(workItem, projectKey) {
  // Show modal
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal">
        <h3>Dispatch ${esc(workItem.id)}</h3>
        <div style="margin-bottom:14px">
          <span class="badge badge-${workItem.status === 'done' ? 'done' : (workItem.blocked_by ? 'blocked' : 'open')}">${esc(workItem.status)}</span>
          <span class="badge badge-${workItem.priority || 'medium'}">${esc(workItem.priority || 'medium')}</span>
        </div>
        <div class="field">
          <label>Title</label>
          <div style="font-size:14px;font-weight:500">${esc(workItem.title)}</div>
        </div>
        ${workItem.description ? `<div class="field"><label>Description</label><div style="font-size:13px;color:var(--text-light)">${esc(workItem.description)}</div></div>` : ''}
        <div class="field">
          <label>Project</label>
          <div style="font-size:13px"><code>${esc(projectKey)}</code></div>
        </div>
        <div class="field">
          <label>Additional Instructions</label>
          <textarea id="dispatch-instructions" placeholder="Optional: add context, constraints, or specific instructions for the agent..."></textarea>
        </div>
        <div class="interactive-toggle">
          <input type="checkbox" id="dispatch-interactive" />
          <label for="dispatch-interactive">Interactive terminal (xterm.js)</label>
        </div>
        <div class="modal-actions">
          <button class="btn btn-cancel" id="modal-cancel">Cancel</button>
          <button class="btn btn-dispatch" id="modal-dispatch">Dispatch</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    overlay.querySelector('#modal-cancel').onclick = () => {
      overlay.remove();
      resolve(null);
    };
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) { overlay.remove(); resolve(null); }
    });

    overlay.querySelector('#modal-dispatch').onclick = async () => {
      const instructions = overlay.querySelector('#dispatch-instructions').value.trim();
      const interactive = overlay.querySelector('#dispatch-interactive').checked;
      const btn = overlay.querySelector('#modal-dispatch');
      btn.disabled = true;
      btn.textContent = 'Dispatching...';

      try {
        const endpoint = interactive ? '/api/terminal' : '/api/dispatch';
        const resp = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            work_item_id: workItem.id,
            project_key: projectKey,
            title: workItem.title,
            description: workItem.description || '',
            additional_instructions: instructions,
          }),
        });
        const result = await resp.json();
        if (!resp.ok) throw new Error(result.error || 'Dispatch failed');

        // Resolve registry path for terminal guidance
        let projectPath = '';
        try {
          const registry = await api('registry');
          for (const [path, entry] of Object.entries(registry.entries)) {
            if (`${entry.org}/${entry.project}/${entry.component}` === projectKey) {
              projectPath = path;
              break;
            }
          }
        } catch {}

        if (interactive) {
          const terminalInfo = {
            id: result.terminal_id,
            work_item_id: workItem.id,
            project_key: projectKey,
            project_path: projectPath,
            title: workItem.title,
            status: 'running',
            started_at: new Date().toISOString(),
          };
          activeTerminals.push(terminalInfo);
          updateDispatchBadge();
          const container = getDispatchContainer();
          const panel = createTerminalPanel(terminalInfo);
          container.prepend(panel);
          await connectTerminalWs(terminalInfo);
          overlay.remove();
          resolve(terminalInfo);
        } else {
          const dispatch = {
            id: result.dispatch_id,
            work_item_id: workItem.id,
            project_key: projectKey,
            project_path: projectPath,
            title: workItem.title,
            status: 'running',
            started_at: new Date().toISOString(),
          };
          activeDispatches.push(dispatch);
          updateDispatchBadge();
          const container = getDispatchContainer();
          const panel = createDispatchPanel(dispatch);
          container.prepend(panel);
          connectDispatchStream(dispatch);
          overlay.remove();
          resolve(dispatch);
        }
      } catch (e) {
        btn.disabled = false;
        btn.textContent = 'Dispatch';
        alert('Dispatch failed: ' + e.message);
      }
    };
  });
}

// Restore active dispatches on page load
async function restoreDispatches() {
  try {
    const list = await api('dispatch/active');
    for (const d of list) {
      if (activeDispatches.some(a => a.id === d.id)) continue;
      const dispatch = { ...d, title: d.work_item_id, session_id: d.session_id || null };
      activeDispatches.push(dispatch);
      const container = getDispatchContainer();
      const panel = createDispatchPanel(dispatch);
      container.appendChild(panel);
      if (d.status === 'running') {
        connectDispatchStream(dispatch);
      } else {
        const dot = panel.querySelector('.status-dot');
        dot.classList.remove('running');
        dot.classList.add(d.status);
      }
    }
    updateDispatchBadge();
  } catch {}
}

// --- Sidebar ---
function countOpenItems(bl, key) {
  const items = bl?.projects?.[key]?.items;
  if (!items) return 0;
  return items.filter(i => i.status === 'open' || i.status === 'in-progress' || i.status === 'blocked').length;
}

function signalColor(bl, key) {
  const items = bl?.projects?.[key]?.items;
  if (!items) return 'green';
  const open = items.filter(i => i.status === 'open' || i.status === 'in-progress' || i.status === 'blocked');
  if (open.length === 0) return 'green';
  if (open.some(i => i.priority === 'critical' || i.priority === 'high')) return 'red';
  return 'yellow';
}

async function buildTree() {
  const [orgs, bl] = await Promise.all([api('orgs'), getBacklog()]);
  const tree = $('#tree');
  tree.innerHTML = '';
  for (const org of orgs) {
    const projects = await api(`org/${org}/projects`);
    const orgData = await api(`org/${org}`);
    orgCache[org] = orgData;

    const group = document.createElement('div');
    group.className = 'org-group';

    const header = document.createElement('div');
    header.className = 'org-name';
    header.innerHTML = `<span class="arrow open">&#9654;</span> ${esc(orgData.name || org)} <span style="font-size:11px;color:#888">(${projects.length})</span>`;
    header.onclick = () => {
      location.hash = `#org/${org}`;
      const arrow = header.querySelector('.arrow');
      const list = group.querySelector('.project-list');
      const open = arrow.classList.toggle('open');
      list.style.display = open ? '' : 'none';
    };

    const list = document.createElement('div');
    list.className = 'project-list';

    // Collect components, then sort by open work item count
    const componentEntries = [];
    for (const proj of projects) {
      const files = await api(`project/${org}/${proj}`);
      const components = files.filter(f => f.endsWith('.json'));
      for (const file of components) {
        const comp = file.replace(/\.json$/, '');
        const key = `${org}/${proj}/${comp}`;
        componentEntries.push({ org, proj, comp, key });
      }
    }
    componentEntries.sort((a, b) => countOpenItems(bl, b.key) - countOpenItems(bl, a.key));

    for (const { org: o, proj, comp, key } of componentEntries) {
      const color = signalColor(bl, key);
      const item = document.createElement('div');
      item.className = 'project-item';
      item.dataset.key = key;
      item.innerHTML = `<span class="signal-dot ${color}"></span>${esc(proj)} / ${esc(comp)}`;
      item.onclick = (e) => {
        e.stopPropagation();
        location.hash = `#component/${o}/${proj}/${comp}`;
      };
      list.appendChild(item);
    }

    group.appendChild(header);
    group.appendChild(list);
    tree.appendChild(group);
  }
}

    btn.onclick = () => {
      const row = document.querySelector(`[data-wi-detail="${btn.dataset.wi}"]`);
      const showing = row.style.display !== 'none';
      row.style.display = showing ? 'none' : '';
      btn.textContent = showing ? 'details' : 'hide';
    };
  });

  // Add work item button
  const addBtn = document.getElementById('add-work-item');
  if (addBtn) addBtn.onclick = () => showWorkItemModal(null);

  // Edit buttons
  document.querySelectorAll('.edit-btn').forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.wiEdit);
      const wi = currentWorkItems[idx];
      if (wi) showWorkItemModal(wi);
    };
  });

  // Delete buttons
  document.querySelectorAll('.delete-btn').forEach(btn => {
    btn.onclick = async () => {
      const idx = parseInt(btn.dataset.wiDel);
      const wi = currentWorkItems[idx];
      if (!wi) return;
      if (!confirm(`Delete work item ${wi.id}: "${wi.title}"?`)) return;
      try {
        const resp = await fetch(`/api/work-items/${wi.id}`, { method: 'DELETE' });
        const result = await resp.json();
        if (!resp.ok) throw new Error(result.error || 'Delete failed');
        backlog = null;
        await buildTree();
        route();
      } catch (e) {
        alert('Delete failed: ' + e.message);
      }
    };
  });

  // Dispatch buttons
  document.querySelectorAll('.dispatch-btn').forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.wiIdx);
      const wi = currentWorkItems[idx];
      if (wi) dispatchWorkItem(wi, currentProjectKey);
    };
  });

  // Session log submit buttons
  document.querySelectorAll('[data-log-submit]').forEach(btn => {
    btn.onclick = async () => {
      const wid = btn.dataset.logSubmit;
      const input = document.querySelector(`[data-log-wi="${wid}"]`);
      const message = input?.value?.trim();
      if (!message) return;
      btn.disabled = true; btn.textContent = '...';
      try {
        const resp = await fetch(`/api/work-items/${wid}/log`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
        });
        if (!resp.ok) throw new Error('Failed');
        backlog = null;
        route();
      } catch (e) {
        alert('Error: ' + e.message);
        btn.disabled = false; btn.textContent = 'Add Log';
      }
    };
  });

  // Epic badge navigation
  document.querySelectorAll('[data-epic-nav]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      location.hash = `#epic/${el.dataset.epicNav}`;
    };
  });

  // Discuss with Agent button
  const discussBtn = document.getElementById('discuss-agent');
  if (discussBtn) discussBtn.onclick = () => showDiscussModal();

  // Doc links
  document.querySelectorAll('.file-link').forEach(link => {
    link.onclick = async () => {
      document.querySelectorAll('.file-link').forEach(l => l.classList.remove('active'));
      link.classList.add('active');
      const hash = location.hash.slice(1).split('/');
      // #component/org/proj/comp
      const [, org, proj] = hash;
      const render = $('#doc-render');
      try {
        render.innerHTML = '<p style="color:var(--text-light)">Loading...</p>';
        const text = await apiText(`doc/${org}/${proj}/${link.dataset.doc}`);
        render.innerHTML = renderMd(text);
      } catch (e) {
        render.innerHTML = `<p style="color:var(--red)">Failed to load: ${esc(String(e))}</p>`;
      }
    };
  });
}

function setActive(key) {
  document.querySelectorAll('.project-item').forEach(el => {

// --- Work Item Modal ---
function showWorkItemModal(existingItem = null) {
  const isEdit = !!existingItem;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>${isEdit ? `Edit ${esc(existingItem.id)}` : 'New Work Item'}</h3>
      <div class="field">
        <label>Title *</label>
        <input type="text" id="wi-title" value="${isEdit ? esc(existingItem.title) : ''}" />
      </div>
      <div class="field">
        <label>Status</label>
        <select id="wi-status">
          ${['open','in-progress','blocked','done'].map(s => `<option value="${s}"${(isEdit ? existingItem.status : 'open') === s ? ' selected' : ''}>${s}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Priority</label>
        <select id="wi-priority">
          ${['critical','high','medium','low'].map(p => `<option value="${p}"${(isEdit ? existingItem.priority : 'medium') === p ? ' selected' : ''}>${p}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="wi-description">${isEdit && existingItem.description ? esc(existingItem.description) : ''}</textarea>
      </div>
      <div class="field">
        <label>Tags (comma-separated)</label>
        <input type="text" id="wi-tags" value="${isEdit && existingItem.tags ? esc(existingItem.tags.join(', ')) : ''}" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="wi-cancel">Cancel</button>
        <button class="btn btn-dispatch" id="wi-save">${isEdit ? 'Save' : 'Create'}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.querySelector('#wi-cancel').onclick = () => overlay.remove();
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  overlay.querySelector('#wi-save').onclick = async () => {
    const title = overlay.querySelector('#wi-title').value.trim();
    if (!title) { alert('Title is required'); return; }

    const btn = overlay.querySelector('#wi-save');
    btn.disabled = true;
    btn.textContent = isEdit ? 'Saving...' : 'Creating...';

    const payload = {
      title,
      status: overlay.querySelector('#wi-status').value,
      priority: overlay.querySelector('#wi-priority').value,
      description: overlay.querySelector('#wi-description').value.trim(),
      tags: overlay.querySelector('#wi-tags').value.split(',').map(t => t.trim()).filter(Boolean),
    };

    try {
      const url = isEdit ? `/api/work-items/${existingItem.id}` : '/api/work-items';
      const method = isEdit ? 'PATCH' : 'POST';
      if (!isEdit) payload.project_key = currentProjectKey;

      const resp = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const result = await resp.json();
      if (!resp.ok) throw new Error(result.error || 'Failed');

      overlay.remove();
      backlog = null; // bust cache
      await buildTree();
      route();
    } catch (e) {
      btn.disabled = false;
      btn.textContent = isEdit ? 'Save' : 'Create';
      alert('Error: ' + e.message);
    }
  };
}

// --- Discuss Modal ---
function showDiscussModal() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Discuss with Agent</h3>
      <div class="field">
        <label>Project</label>
        <div style="font-size:13px"><code>${esc(currentProjectKey)}</code></div>
      </div>
      <div class="field">
        <label>Prompt / Instructions *</label>
        <textarea id="discuss-instructions" placeholder="What would you like to discuss? e.g., architecture decisions, code exploration, questions about the project..."></textarea>
      </div>
      <div class="interactive-toggle">
        <input type="checkbox" id="discuss-interactive" />
        <label for="discuss-interactive">Interactive terminal (xterm.js)</label>
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="discuss-cancel">Cancel</button>
        <button class="btn btn-dispatch" id="discuss-submit">Dispatch</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.querySelector('#discuss-cancel').onclick = () => overlay.remove();
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  overlay.querySelector('#discuss-submit').onclick = async () => {
    const instructions = overlay.querySelector('#discuss-instructions').value.trim();
    if (!instructions) { alert('Instructions are required'); return; }
    const interactive = overlay.querySelector('#discuss-interactive').checked;

    const btn = overlay.querySelector('#discuss-submit');
    btn.disabled = true;
    btn.textContent = 'Dispatching...';

    try {
      const endpoint = interactive ? '/api/terminal' : '/api/dispatch';
      const resp = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          project_key: currentProjectKey,
          additional_instructions: instructions,
        }),
      });
      const result = await resp.json();
      if (!resp.ok) throw new Error(result.error || 'Dispatch failed');

      let projectPath = '';
      try {
        const registry = await api('registry');
        for (const [path, entry] of Object.entries(registry.entries)) {
          if (`${entry.org}/${entry.project}/${entry.component}` === currentProjectKey) {
            projectPath = path;
            break;
          }
        }
      } catch {}

      if (interactive) {
        const terminalInfo = {
          id: result.terminal_id,
          work_item_id: null,
          project_key: currentProjectKey,
          project_path: projectPath,
          title: instructions.slice(0, 60) + (instructions.length > 60 ? '...' : ''),
          status: 'running',
          started_at: new Date().toISOString(),
        };
        activeTerminals.push(terminalInfo);
        updateDispatchBadge();
        const container = getDispatchContainer();
        const panel = createTerminalPanel(terminalInfo);
        container.prepend(panel);
        await connectTerminalWs(terminalInfo);
      } else {
        const dispatch = {
          id: result.dispatch_id,
          work_item_id: null,
          project_key: currentProjectKey,
          project_path: projectPath,
          title: instructions.slice(0, 60) + (instructions.length > 60 ? '...' : ''),
          status: 'running',
          started_at: new Date().toISOString(),
        };
        activeDispatches.push(dispatch);
        updateDispatchBadge();
        const container = getDispatchContainer();
        const panel = createDispatchPanel(dispatch);
        container.prepend(panel);
        connectDispatchStream(dispatch);
      }

      overlay.remove();
    } catch (e) {
      btn.disabled = false;
      btn.textContent = 'Dispatch';
      alert('Dispatch failed: ' + e.message);
    }
  };
}

    html += `<table><thead><tr><th>ID</th><th>Title</th><th>Status</th><th>Priority</th><th>Progress</th><th>Projects</th><th>Target</th><th></th></tr></thead><tbody>`;
    for (const epic of epics) {
      const p = epic.progress || { done: 0, total: 0 };
      const pct = p.total ? Math.round(p.done / p.total * 100) : 0;
      html += `<tr>`;
      html += `<td><code style="cursor:pointer" data-epic-nav="${esc(epic.id)}">${esc(epic.id)}</code></td>`;

async function renderEpicDetailView(epicId) {
  const epic = await api(`epics/${epicId}`);
  const items = epic.resolved_items || [];
  const p = epic.progress || { done: 0, total: 0 };
  const pct = p.total ? Math.round(p.done / p.total * 100) : 0;

  const tabs = ['Tasks', 'Planning', 'Documentation', 'Details'];
  let html = `<div class="card"><h2>${esc(epic.id)}: ${esc(epic.title)}</h2>`;
  html += `<span class="badge badge-${epic.status === 'active' ? 'open' : epic.status === 'done' ? 'done' : 'medium'}">${esc(epic.status)}</span> `;
  html += `<span class="badge badge-${epic.priority || 'medium'}">${esc(epic.priority || 'medium')}</span>`;
  if (epic.target_date) html += ` <span class="tag">Target: ${esc(epic.target_date)}</span>`;
  html += `<div class="tabs" id="epic-tabs" style="margin-top:16px">`;
  tabs.forEach((t, i) => {
    html += `<div class="tab${i === 0 ? ' active' : ''}" data-tab="${i}">${t}</div>`;
  });
  html += `</div>`;

  // Tab 0: Tasks
  html += `<div class="tab-content active" data-panel="0">`;
  html += `<div style="margin-bottom:12px;font-size:14px">${p.done} of ${p.total} tasks done (${pct}%)</div>`;
  html += `<div class="progress-bar-container"><div class="progress-bar-fill" style="width:${pct}%"></div></div>`;
  html += `<button class="btn-add-wi" id="epic-link-item">+ Link Item</button>`;
  html += `<button class="btn-add-wi" id="epic-create-task" style="margin-left:8px">+ Create Task</button>`;
  if (items.length) {
    html += `<table><thead><tr><th>ID</th><th>Title</th><th>Status</th><th>Priority</th><th>Project</th><th>Tags</th><th></th></tr></thead><tbody>`;
    for (const item of items) {
      const sc = item.status === 'done' ? 'done' : (item.blocked_by ? 'blocked' : 'open');
      const canDispatch = item.status === 'open' || item.status === 'in-progress';
      html += `<tr>`;
      html += `<td><code>${esc(item.id)}</code></td>`;
      html += `<td>${esc(item.title)}</td>`;
      html += `<td><span class="badge badge-${sc}">${esc(item.status)}</span></td>`;
      html += `<td><span class="badge badge-${item.priority || 'medium'}">${esc(item.priority || 'medium')}</span></td>`;
      html += `<td><span class="tag">${esc(item.project_key)}</span></td>`;
      html += `<td>${(item.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</td>`;
      html += `<td>`;
      if (canDispatch) html += `<button class="dispatch-btn" data-epic-task-dispatch="${esc(item.id)}" data-epic-task-pk="${esc(item.project_key)}">dispatch</button>`;
      html += `<button class="unlink-btn" data-unlink-item="${esc(item.id)}">unlink</button>`;
      html += `</td></tr>`;
    }
    html += `</tbody></table>`;
  } else {
    html += `<p class="empty">No linked tasks.</p>`;
  }
  html += `</div>`;

  // Tab 1: Planning
  html += `<div class="tab-content" data-panel="1">`;
  html += `<div id="epic-plan-container"><p class="empty">Loading...</p></div>`;
  html += `</div>`;

  // Tab 2: Documentation
  html += `<div class="tab-content" data-panel="2">`;
  html += `<div id="epic-doc-container"><p class="empty">Loading...</p></div>`;
  html += `</div>`;

  // Tab 3: Details
  html += `<div class="tab-content" data-panel="3">`;
  html += `<button class="edit-btn" id="epic-edit-details" style="margin-bottom:12px">Edit</button>`;
  html += `<button class="dispatch-btn" id="epic-dispatch-btn" style="margin-bottom:12px;margin-left:8px">Dispatch</button>`;
  html += `<button class="delete-btn" id="epic-delete-btn" style="margin-bottom:12px;margin-left:8px">Delete</button>`;
  html += `<dl class="kv">`;
  html += `<dt>Title</dt><dd>${esc(epic.title)}</dd>`;
  html += `<dt>Status</dt><dd><span class="badge badge-${epic.status === 'active' ? 'open' : epic.status === 'done' ? 'done' : 'medium'}">${esc(epic.status)}</span></dd>`;
  html += `<dt>Priority</dt><dd><span class="badge badge-${epic.priority || 'medium'}">${esc(epic.priority || 'medium')}</span></dd>`;
  html += `<dt>Target Date</dt><dd>${epic.target_date || '—'}</dd>`;
  html += `<dt>Tags</dt><dd>${(epic.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('') || '—'}</dd>`;
  html += `<dt>Projects</dt><dd>${(epic.project_keys || []).map(k => `<span class="tag">${esc(k)}</span>`).join('') || '—'}</dd>`;
  html += `<dt>Created</dt><dd>${esc(epic.created || '—')}</dd>`;
  html += `<dt>Updated</dt><dd>${esc(epic.updated || '—')}</dd>`;
  html += `</dl>`;
  if (epic.description) {
    html += `<h3>Description</h3><p style="font-size:13px">${esc(epic.description)}</p>`;
  }
  if (epic.acceptance_criteria) {
    html += `<h3>Acceptance Criteria</h3><div class="md-container">${renderMd(epic.acceptance_criteria)}</div>`;
  }
  if (epic.session_log?.length) {
    html += `<h3>Session Log</h3><div class="session-log">`;
    for (const e of epic.session_log) html += `<div class="entry"><span class="date">${esc(e.date)}</span>${esc(e.summary)}</div>`;
    html += `</div>`;
  }
  html += `</div>`;

  html += `</div>`;
  return { html, epicId, epic };
}

function bindEpicDetailEvents(epicId) {
  // Tabs
  const tabs = document.querySelectorAll('#epic-tabs .tab');
  tabs.forEach(tab => {
    tab.onclick = () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      document.querySelectorAll('.tab-content').forEach(p => p.classList.remove('active'));
      document.querySelector(`.tab-content[data-panel="${tab.dataset.tab}"]`).classList.add('active');
      if (tab.dataset.tab === '1') loadEpicPlan(epicId);
      if (tab.dataset.tab === '2') loadEpicDoc(epicId);
    };
  });

  // Unlink buttons
  document.querySelectorAll('[data-unlink-item]').forEach(btn => {
    btn.onclick = async () => {
      const wid = btn.dataset.unlinkItem;
      if (!confirm(`Unlink ${wid} from ${epicId}?`)) return;
      await fetch(`/api/epics/${epicId}/unlink`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ work_item_id: wid }),
      });
      backlog = null; epicCache = null;
      await buildEpicTree();
      route();
    };
  });

  // Link item button
  const linkBtn = document.getElementById('epic-link-item');
  if (linkBtn) linkBtn.onclick = () => showLinkItemModal(epicId);

  // Create task button
  const createTaskBtn = document.getElementById('epic-create-task');
  if (createTaskBtn) createTaskBtn.onclick = () => showCreateEpicTaskModal(epicId);

  // Delete epic button
  const deleteBtn = document.getElementById('epic-delete-btn');
  if (deleteBtn) deleteBtn.onclick = async () => {
    if (!confirm(`Delete epic ${epicId}? Linked items will be unlinked.`)) return;
    try {
      const resp = await fetch(`/api/epics/${epicId}`, { method: 'DELETE' });
      if (!resp.ok) throw new Error('Delete failed');
      backlog = null; epicCache = null;
      await buildEpicTree();
      location.hash = '#epics';
      route();
    } catch (e) {
      alert('Error: ' + e.message);
    }
  };

  // Edit details
  const editBtn = document.getElementById('epic-edit-details');
  if (editBtn) editBtn.onclick = async () => {
    const epic = await api(`epics/${epicId}`);
    showEpicModal(epic);
  };

  // Dispatch from detail
  const dispatchBtn = document.getElementById('epic-dispatch-btn');
  if (dispatchBtn) dispatchBtn.onclick = () => showEpicDispatchModal(epicId);

  // Task dispatch buttons
  document.querySelectorAll('[data-epic-task-dispatch]').forEach(btn => {
    btn.onclick = async () => {
      const wid = btn.dataset.epicTaskDispatch;
      let pk = btn.dataset.epicTaskPk;
      const bl = await getBacklog();
      let wi = null;
      for (const group of Object.values(bl.projects)) {
        if (!group.items) continue;
        wi = group.items.find(i => i.id === wid);
        if (wi) break;
      }
      // Fallback: if pk is empty, use epic's project_keys[0]
      if (!pk && epic.project_keys && epic.project_keys.length) {
        pk = epic.project_keys[0];
      }
      if (wi && pk) dispatchWorkItem(wi, pk);
      else if (wi) alert('No project key available. Link a project to this epic first.');
    };
  });
}

    btn.disabled = true; btn.textContent = isEdit ? 'Saving...' : 'Creating...';

    const projectsEl = overlay.querySelector('#epic-projects');
    const project_keys = [...projectsEl.selectedOptions].map(o => o.value);

async function showLinkItemModal(epicId) {
  const bl = await api('backlog');
  const allItems = [];
  for (const [key, group] of Object.entries(bl.projects || {})) {
    for (const item of (group.items || [])) {
      if (!item.epic_id && (item.status === 'open' || item.status === 'in-progress')) {
        allItems.push({ ...item, project_key: key });
      }
    }
  }

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Link Items to ${esc(epicId)}</h3>
      <div class="field">
        <label>Search Items</label>
        <input type="text" id="link-search" placeholder="Filter by title or ID..." />
      </div>
      <div id="link-items-list" style="max-height:300px;overflow-y:auto"></div>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="link-cancel">Cancel</button>
        <button class="btn btn-dispatch" id="link-save">Link Selected</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const selected = new Set();
  function renderItems(filter) {
    const listEl = document.getElementById('link-items-list');
    const filtered = filter ? allItems.filter(i => i.id.toLowerCase().includes(filter) || i.title.toLowerCase().includes(filter)) : allItems;
    if (!filtered.length) { listEl.innerHTML = '<p class="empty">No unlinked items found.</p>'; return; }
    listEl.innerHTML = filtered.map(i => `
      <label style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f0f0f0;font-size:13px;cursor:pointer">
        <input type="checkbox" data-link-wid="${esc(i.id)}" ${selected.has(i.id) ? 'checked' : ''} />
        <code>${esc(i.id)}</code>
        <span style="flex:1">${esc(i.title)}</span>
        <span class="tag">${esc(i.project_key)}</span>
      </label>
    `).join('');
    listEl.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.onchange = () => {
        if (cb.checked) selected.add(cb.dataset.linkWid);
        else selected.delete(cb.dataset.linkWid);
      };
    });
  }
  renderItems('');
  overlay.querySelector('#link-search').oninput = (e) => renderItems(e.target.value.toLowerCase());
  overlay.querySelector('#link-cancel').onclick = () => overlay.remove();
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  overlay.querySelector('#link-save').onclick = async () => {
    if (!selected.size) { overlay.remove(); return; }
    const btn = overlay.querySelector('#link-save');
    btn.disabled = true; btn.textContent = 'Linking...';
    try {
      const resp = await fetch(`/api/epics/${epicId}/link`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ work_item_ids: [...selected] }),
      });
      if (!resp.ok) throw new Error('Link failed');
      overlay.remove();
      backlog = null; epicCache = null;
      await buildEpicTree();
      route();
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Link Selected';
      alert('Error: ' + e.message);
    }
  };
}

async function showEpicDispatchModal(epicId) {
  const epic = await api(`epics/${epicId}`);
  const items = epic.resolved_items || [];
  const openItems = items.filter(i => i.status === 'open' || i.status === 'in-progress');
  let projectKeys = epic.project_keys || [];
  const p = epic.progress || { done: 0, total: 0 };

  // If no project keys, fetch registry as fallback
  let registryKeys = [];
  if (!projectKeys.length) {
    try {
      const registry = await api('registry');
      for (const [, entry] of Object.entries(registry.entries)) {
        registryKeys.push(`${entry.org}/${entry.project}/${entry.component}`);
      }
      registryKeys.sort();
    } catch {}
    projectKeys = registryKeys;
  }

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Dispatch from ${esc(epic.id)}</h3>
      <div style="margin-bottom:14px">
        <strong>${esc(epic.title)}</strong>
        <div style="font-size:12px;color:var(--text-light);margin-top:4px">Progress: ${p.done}/${p.total}</div>
      </div>
      <div class="field">
        <label>Mode</label>
        <select id="epic-dispatch-mode">
          <option value="general">Work on epic (general)</option>
          ${openItems.map(i => `<option value="${esc(i.id)}">${esc(i.id)}: ${esc(i.title)}</option>`).join('')}
        </select>
      </div>
      <div class="field" id="epic-dispatch-project-field">
        <label>Target Project</label>
        <select id="epic-dispatch-project">
          ${projectKeys.map(k => `<option value="${esc(k)}">${esc(k)}</option>`).join('')}
        </select>
        ${registryKeys.length ? '<div style="font-size:11px;color:var(--text-light);margin-top:2px">No linked projects — showing all registry projects</div>' : ''}
      </div>
      <div class="field">
        <label>Additional Instructions</label>
        <textarea id="epic-dispatch-instructions" placeholder="Optional context..."></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="epic-dispatch-cancel">Cancel</button>
        <button class="btn btn-dispatch" id="epic-dispatch-go">Dispatch</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const modeSelect = overlay.querySelector('#epic-dispatch-mode');
  const projectField = overlay.querySelector('#epic-dispatch-project-field');
  const projectSelect = overlay.querySelector('#epic-dispatch-project');

  modeSelect.onchange = () => {
    if (modeSelect.value !== 'general') {
      const item = openItems.find(i => i.id === modeSelect.value);
      if (item) {
        projectSelect.value = item.project_key;
      }
    }
  };

  overlay.querySelector('#epic-dispatch-cancel').onclick = () => overlay.remove();
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  overlay.querySelector('#epic-dispatch-go').onclick = async () => {
    const mode = modeSelect.value;
    const instructions = overlay.querySelector('#epic-dispatch-instructions').value.trim();
    const btn = overlay.querySelector('#epic-dispatch-go');
    btn.disabled = true; btn.textContent = 'Dispatching...';

    let pk, wid;
    if (mode === 'general') {
      pk = projectSelect.value || projectKeys[0];
      wid = null;
    } else {
      wid = mode;
      const item = openItems.find(i => i.id === wid);
      pk = item ? item.project_key : (projectSelect.value || projectKeys[0]);
    }

    if (!pk) {
      alert('No project key available for dispatch. Onboard a project first.');
      btn.disabled = false; btn.textContent = 'Dispatch';
      return;
    }

    try {
      const resp = await fetch('/api/dispatch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          work_item_id: wid,
          epic_id: epicId,
          project_key: pk,
          title: wid ? `${wid} (${epic.title})` : epic.title,
          additional_instructions: instructions,
        }),
      });
      const result = await resp.json();
      if (!resp.ok) throw new Error(result.error || 'Dispatch failed');

      let projectPath = '';
      try {
        const registry = await api('registry');
        for (const [path, entry] of Object.entries(registry.entries)) {
          if (`${entry.org}/${entry.project}/${entry.component}` === pk) { projectPath = path; break; }
        }
      } catch {}

      const dispatch = {
        id: result.dispatch_id,
        work_item_id: wid,
        project_key: pk,
        project_path: projectPath,
        title: wid ? `${wid} (${epic.title})` : epic.title,
        status: 'running',
        started_at: new Date().toISOString(),
      };
      activeDispatches.push(dispatch);
      updateDispatchBadge();
      const container = getDispatchContainer();
      const panel = createDispatchPanel(dispatch);
      container.prepend(panel);
      connectDispatchStream(dispatch);
      overlay.remove();
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Dispatch';
      alert('Dispatch failed: ' + e.message);
    }
  };
}

// --- Router ---
async function route() {
  const hash = location.hash.slice(1);
  const main = $('#main');

  // Preserve dispatch panels
  const dispatchContainer = document.getElementById('dispatch-panels');
  const savedPanels = dispatchContainer ? dispatchContainer.outerHTML : '';

  if (!hash) {
    main.innerHTML = `<div class="card"><h2>Portfolio Dashboard</h2><p style="color:var(--text-light);font-size:14px">Select an organization or project from the sidebar.</p></div>`;
    setActive('');
    if (savedPanels) main.insertAdjacentHTML('afterbegin', savedPanels);
    return;
  }

  const parts = hash.split('/');

  if (parts[0] === 'epics') {
    try {
      const epics = await getEpics();
      main.innerHTML = renderEpicListView(epics);
      bindEpicListEvents();
    } catch (e) {
      main.innerHTML = `<div class="card"><p style="color:var(--red)">Error: ${esc(String(e))}</p></div>`;
    }
    setActive('');
    document.querySelectorAll('.epic-item').forEach(el => el.classList.remove('active'));
    if (savedPanels) main.insertAdjacentHTML('afterbegin', savedPanels);
    return;
  }

  if (parts[0] === 'epic' && parts[1]) {
    try {
      const { html, epicId } = await renderEpicDetailView(parts[1]);
      main.innerHTML = html;
      bindEpicDetailEvents(epicId);
      document.querySelectorAll('.epic-item').forEach(el => {
        el.classList.toggle('active', el.dataset.epicId === parts[1]);
      });
    } catch (e) {
      main.innerHTML = `<div class="card"><p style="color:var(--red)">Error: ${esc(String(e))}</p></div>`;
    }
    setActive('');
    if (savedPanels) main.insertAdjacentHTML('afterbegin', savedPanels);
    return;
  }

  if (parts[0] === 'org' && parts[1]) {
    const org = parts[1];
    try {
      const data = orgCache[org] || await api(`org/${org}`);
      orgCache[org] = data;
      main.innerHTML = renderOrgView(org, data);
    } catch (e) {
      main.innerHTML = `<div class="card"><p style="color:var(--red)">Error: ${esc(String(e))}</p></div>`;
    }
    setActive('');
    if (savedPanels) main.insertAdjacentHTML('afterbegin', savedPanels);
    return;
  }

  if (parts[0] === 'component' && parts.length >= 4) {
    const [, org, proj, comp] = parts;
    try {
      const [data, bl, files] = await Promise.all([
        api(`component/${org}/${proj}/${comp}`),
        getBacklog(),
        api(`project/${org}/${proj}`)
      ]);

      // Match work items (case-insensitive)
      const projKey = `${org}/${proj}/${comp}`.toLowerCase();
      const workItems = [];
      if (bl.projects) {
        for (const [key, val] of Object.entries(bl.projects)) {
          if (key.toLowerCase() === projKey && val.items) {
            workItems.push(...val.items);
          }
        }
      }

      main.innerHTML = renderComponentView(org, proj, comp, data, workItems, files);
      bindTabs();
      setActive(`${org}/${proj}/${comp}`);
    } catch (e) {
      main.innerHTML = `<div class="card"><p style="color:var(--red)">Error: ${esc(String(e))}</p></div>`;
    }
    if (savedPanels) main.insertAdjacentHTML('afterbegin', savedPanels);
    return;
  }

  main.innerHTML = `<div class="card"><p class="empty">Unknown route: ${esc(hash)}</p></div>`;
  if (savedPanels) main.insertAdjacentHTML('afterbegin', savedPanels);
}

window.addEventListener('hashchange', route);
Promise.all([buildTree(), buildEpicTree()]).then(() => { route(); restoreDispatches(); restoreTerminals(); });
</script>
