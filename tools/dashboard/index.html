async function loadPreferences() {

    setPrefs(await api('settings/preferences'));
    applyTermThemeToAll();
    // Also update panels held in sessionPanels but not yet placed in the DOM
    const isLight = resolveTermTheme() === 'light';
    for (const panel of sessionPanels.values()) {
      panel.querySelectorAll('.dispatch-log').forEach(el => el.classList.toggle('log-light', isLight));
    }
  } catch {}
}
loadPreferences();

async function loadMarked() {
  if (markedLoaded) return;
  try {
    await Promise.all([
      new Promise((ok, fail) => {
        const s = document.createElement('script');
        s.src = '/vendor/marked.min.js';
        s.onload = ok; s.onerror = fail;
        document.head.appendChild(s);
      }),
      new Promise((ok, fail) => {
        const s = document.createElement('script');
        s.src = '/vendor/dompurify.min.js';
        s.onload = ok; s.onerror = fail;
        document.head.appendChild(s);
      })
    ]);
    setMarkedLoaded(true);
  } catch { setMarkedLoaded(false); }
}
loadMarked();

function renderMd(text) {
  if (markedLoaded && window.marked) {
    const html = window.marked.parse(text);
    return window.DOMPurify ? DOMPurify.sanitize(html) : esc(text);
  }
  return '<pre>' + esc(text) + '</pre>';
}



function permissionModeSelect(id, defaultMode) {
  const mode = defaultMode || window._prefs.default_permission_mode || 'acceptEdits';
  return `<div class="field"><label>Permission Mode</label><select id="${id}">
    <option value="plan"${mode === 'plan' ? ' selected' : ''}>Plan only</option>
    <option value="acceptEdits"${mode === 'acceptEdits' ? ' selected' : ''}>Accept edits</option>
  </select></div>`;
}

function skipPermissionsCheckbox(id) {
  const checked = window._prefs.default_skip_permissions === 'true' || window._prefs.default_skip_permissions === true;
  return `<div class="interactive-toggle">
    <input type="checkbox" id="${id}"${checked ? ' checked' : ''} />
    <label for="${id}">Skip permissions (--dangerously-skip-permissions)</label>

}

function getPermissionMode(overlay, selectId) {
  return overlay.querySelector('#' + selectId).value;
}

/** Wire an agent-type dropdown to show/hide permission fields for non-Claude agents. */
function wireAgentTypeToggle(overlay, agentTypeId, permModeId, skipPermsId) {
  const agentSelect = overlay.querySelector('#' + agentTypeId);
  const permField = overlay.querySelector('#' + permModeId)?.closest('.field');
  const skipField = overlay.querySelector('#' + skipPermsId)?.closest('.interactive-toggle');
  if (!agentSelect) return;
  const toggle = () => {
    const show = agentSelect.value !== 'shell';
    if (permField) permField.style.display = show ? '' : 'none';
    if (skipField) skipField.style.display = show ? '' : 'none';
  };
  agentSelect.addEventListener('change', toggle);
  toggle(); // Set initial state
}

function createDispatchOverlay(opts) {
  const { title, buildFields, onSubmit, submitLabel = 'Dispatch', cancelId, submitId, afterMount } = opts;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>${esc(title)}</h3>
      ${buildFields(overlay)}
      <div class="modal-actions">
        <button class="btn btn-cancel" data-modal-cancel${cancelId ? ` id="${cancelId}"` : ''}>Cancel</button>
        <button class="btn btn-dispatch" data-modal-submit${submitId ? ` id="${submitId}"` : ''}>${esc(submitLabel)}</button>
      </div>
    </div>
  `;

  const close = () => overlay.remove();

  overlay.querySelector('[data-modal-cancel]').onclick = close;
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });

  overlay.querySelector('[data-modal-submit]').onclick = async () => {
    const btn = overlay.querySelector('[data-modal-submit]');
    btn.disabled = true;
    btn.textContent = 'Dispatching...';
    try {
      await onSubmit(overlay);
      close();
    } catch (err) {
      btn.disabled = false;
      btn.textContent = submitLabel;
      const modal = overlay.querySelector('.modal');
      let errEl = modal.querySelector('._modal-error');
      if (!errEl) {
        errEl = document.createElement('p');
        errEl.className = '_modal-error';
        errEl.style.cssText = 'color:var(--danger,red);margin:8px 0 0;font-size:13px';
        modal.querySelector('.modal-actions').before(errEl);
      }
      errEl.textContent = err.message || 'Dispatch failed';
    }
  };

  document.body.appendChild(overlay);
  if (afterMount) afterMount(overlay);
  return { overlay, close };
}

async function buildEpicTree() {
  const epicTree = document.getElementById('epic-tree');
  epicTree.innerHTML = '';
  const globalVisible = window._prefs.board_epics_global_visible !== 'false';

  // EPICS label with global toggle
  const label = document.createElement('div');
  label.className = 'sidebar-section-label';
  label.style.display = 'flex';
  label.style.alignItems = 'center';
  const labelText = document.createElement('span');
  labelText.textContent = 'EPICS';
  labelText.style.cursor = 'pointer';
  labelText.onclick = () => { location.hash = '#epics'; };
  label.appendChild(labelText);
  const globalToggle = document.createElement('span');
  globalToggle.className = 'epic-global-toggle';
  globalToggle.textContent = globalVisible ? '[on]' : '[off]';
  globalToggle.title = 'Toggle epic visibility in Board views and sidebar';
  globalToggle.onclick = (e) => {
    e.stopPropagation();
    const next = !globalVisible;
    window._prefs.board_epics_global_visible = String(next);
    fetch('/api/settings/preferences', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ board_epics_global_visible: String(next) }),
    }).catch(() => {});
    buildEpicTree();
    route();
  };
  label.appendChild(globalToggle);
  epicTree.appendChild(label);

  try {
    const epics = await getEpics();

    if (globalVisible) {
      const showCompleted = sessionStorage.getItem('sidebar-show-completed-epics') === 'true';
      const isInactive = s => s === 'done' || s === 'cancelled' || s === 'archived';
      const hasCompleted = epics.some(e => isInactive(e.status));

      for (const epic of epics) {
        const isCompleted = isInactive(epic.status);
        const item = document.createElement('div');
        item.className = 'epic-item';
        item.dataset.epicId = epic.id;
        if (isCompleted && !showCompleted) item.style.display = 'none';
        item.dataset.epicStatus = epic.status;
        const color = epicSignalColor(epic, epic.progress);
        const p = epic.progress || { done: 0, total: 0 };
        const epicInitial = (epic.id || '?')[0].toUpperCase();
        item.innerHTML = `<span class="nav-avatar" title="${esc(epic.id + ' ' + epic.title)}">${esc(epicInitial)}</span><span class="signal-dot ${color}"></span><span style="flex:1;overflow:hidden;text-overflow:ellipsis">${esc(epic.id)} ${esc(epic.title)}</span><span class="epic-progress">(${p.done}/${p.total})</span>`;
        item.onclick = () => { location.hash = `#epic/${epic.id}`; };
        epicTree.appendChild(item);
      }

      if (hasCompleted) {
        const toggle = document.createElement('div');
        toggle.style.cssText = 'padding:4px 16px;font-size:10px;color:#6c7086;cursor:pointer;user-select:none;';
        toggle.textContent = showCompleted ? '\u25be Hide completed & archived' : '\u25b8 Show completed & archived';
        toggle.onclick = () => {
          const next = sessionStorage.getItem('sidebar-show-completed-epics') !== 'true';
          sessionStorage.setItem('sidebar-show-completed-epics', next ? 'true' : 'false');
          buildEpicTree();
        };
        epicTree.appendChild(toggle);
      }
    }
  } catch {}

  // AGENTS label
  const agentsLabel = document.createElement('div');
  agentsLabel.className = 'sidebar-section-label';
  agentsLabel.innerHTML = 'AGENTS <span id="agents-badge" class="agents-badge empty"></span>';
  agentsLabel.onclick = () => { location.hash = '#agents'; };
  epicTree.appendChild(agentsLabel);

  // AUTONOMOUS label
  const autoLabel = document.createElement('div');
  autoLabel.className = 'sidebar-section-label';
  autoLabel.innerHTML = 'AUTONOMOUS <span id="autonomous-badge" class="agents-badge empty"></span>';
  autoLabel.onclick = () => { location.hash = '#autonomous'; };
  epicTree.appendChild(autoLabel);

  // Onboard button — always visible
  const onboardBtn = document.createElement('div');
  onboardBtn.className = 'sidebar-onboard-btn';
  onboardBtn.textContent = '+ Onboard Project';
  onboardBtn.onclick = () => showOnboardModal();
  epicTree.appendChild(onboardBtn);

  const divider = document.createElement('hr');
  divider.className = 'sidebar-divider';
  epicTree.appendChild(divider);
}

    + activeCliSessions.filter(c => c.status === 'running').length;

    badge.textContent = running;
    badge.classList.remove('empty');

    badge.classList.add('empty');
  }
  const agentsBadge = document.getElementById('agents-badge');

    else { agentsBadge.classList.add('empty'); }

}

function extractStreamText(line) {
  try {
    const evt = JSON.parse(line);
    if (evt.type === 'assistant' && evt.message?.content) {
      const text = evt.message.content.filter(b => b.type === 'text').map(b => b.text).join('');
      return text ? '\n━━━\n' + text : null;
    }
    if (evt.type === 'content_block_delta' && evt.delta?.text) {
      return evt.delta.text;
    }
    if (evt.type === 'content_block_start' && evt.content_block?.type === 'tool_use') {
      return `\n▸ ${evt.content_block.name || 'tool'}\n`;
    }
    if (evt.type === 'content_block_start' && evt.content_block?.text) {
      return evt.content_block.text;
    }
    if (evt.type === 'system' && evt.subtype === 'init') {
      return null;
    }
    if (evt.type === 'result') {
      const cost = evt.total_cost_usd ? ` (cost: $${evt.total_cost_usd.toFixed(4)})` : '';
      return `\n--- Agent finished${cost} ---\n`;
    }
    if (evt.type === 'stderr') {
      return `[stderr] ${evt.content}`;
    }
  } catch {
    return line;
  }
  return null;
}

function createDispatchPanel(dispatch) {

const AUTO_DISMISS_MS = 8000;

function scheduleAutoDismiss(panelType, id, infoObj) {
  if (window._testDisableAutoDismiss) return;
  const panel = document.getElementById(`${panelType}-${id}`);
  if (!panel || infoObj._autoDismissTimer) return;

  const bar = document.createElement('div');
  bar.className = 'auto-dismiss-bar';
  panel.appendChild(bar);

  requestAnimationFrame(() => {
    bar.style.transitionDuration = `${AUTO_DISMISS_MS}ms`;
    bar.style.width = '0%';
  });

  let remaining = AUTO_DISMISS_MS;
  let startedAt = Date.now();

  const dismiss = async () => {
    infoObj._autoDismissTimer = null;
    if (panelType === 'dispatch') {
      await dismissDispatchPanel(id);
    } else {
      await dismissTerminalPanel(id);
    }
    syncSessionState();
  };

  infoObj._autoDismissTimer = setTimeout(dismiss, AUTO_DISMISS_MS);

  panel.addEventListener('mouseenter', () => {
    if (!infoObj._autoDismissTimer) return;
    clearTimeout(infoObj._autoDismissTimer);
    infoObj._autoDismissTimer = null;
    remaining -= (Date.now() - startedAt);
    if (remaining <= 0) { dismiss(); return; }
    const computed = bar.getBoundingClientRect().width;
    const parentWidth = panel.getBoundingClientRect().width;
    bar.style.transitionDuration = '0ms';
    bar.style.width = `${(computed / parentWidth) * 100}%`;
  });

  panel.addEventListener('mouseleave', () => {
    if (infoObj._autoDismissTimer || remaining <= 0) return;
    startedAt = Date.now();
    infoObj._autoDismissTimer = setTimeout(dismiss, remaining);
    requestAnimationFrame(() => {
      bar.style.transitionDuration = `${remaining}ms`;
      bar.style.width = '0%';
    });
  });
}


async function dismissDispatchPanel(id) {
  const d = activeDispatches.find(d => d.id === id);
  if (d?._autoDismissTimer) { clearTimeout(d._autoDismissTimer); d._autoDismissTimer = null; }
  try { await fetch(`/api/dispatch/${id}`, { method: 'DELETE' }); } catch {}
  const idx = activeDispatches.findIndex(d => d.id === id);
  if (idx !== -1) activeDispatches.splice(idx, 1);
  const panelKey = `dispatch:${id}`;
  const panel = sessionPanels.get(panelKey);
  if (panel?.parentElement) panel.remove();
  sessionPanels.delete(panelKey);
}

function finalizeDispatchPanel(dispatch) {
  const panel = document.getElementById(`dispatch-${dispatch.id}`);
  if (panel) {
    // Update status class
    panel.className = panel.className.replace(/status-\w+/, `status-${dispatch.status}`);
    const dot = panel.querySelector('.status-dot');
    if (dot) {
      clearActiveDotClasses(dot);
      dot.classList.add(dispatch.status === 'completed' ? 'completed' : 'failed');
    }
    // Hide action buttons, show dismiss
    const killBtn = panel.querySelector(`[data-kill-dispatch="${dispatch.id}"]`);
    if (killBtn) killBtn.disabled = true;
    const suspendBtn = panel.querySelector(`[data-suspend-dispatch="${dispatch.id}"]`);
    if (suspendBtn) suspendBtn.style.display = 'none';
    const dismissBtn = panel.querySelector(`[data-dismiss-dispatch="${dispatch.id}"]`);
    if (dismissBtn) dismissBtn.style.display = '';
  }
  if (dispatch.dispatch_mode === 'auto_implement') {
    showAutoImplementToast(dispatch);
  }
  if (dispatch.dispatch_mode === 'refinement' && dispatch.status === 'completed') {
    setBacklog(null);
    buildTree().then(() => route()).catch(() => {});
  }
  syncSessionState();
  if (dispatch.status !== 'running' && dispatch.status !== 'suspended') {
    scheduleAutoDismiss('dispatch', dispatch.id, dispatch);
  }
}

function showAutoImplementToast(dispatch) {
  const workItemLabel = dispatch.work_item_id || dispatch.id;
  if (dispatch.status === 'completed') {
    showToast(`${workItemLabel} auto-implemented`, 'success', 'View dispatch', dispatch.id);
  } else {
    showToast(`${workItemLabel} auto-implement failed`, 'error', 'View dispatch', dispatch.id);
  }
}

const SCROLL_BOTTOM_THRESHOLD = 5;

function hasActiveSelection(scrollContainer) {
  const sel = window.getSelection();
  return sel && sel.type === 'Range' && sel.anchorNode != null && scrollContainer.contains(sel.anchorNode);
}

function scrollDispatchLog(logEl, forceBottom = false) {
  if (hasActiveSelection(logEl)) return;
  if (forceBottom) {
    logEl.scrollTop = logEl.scrollHeight;
  } else {
    const nearBottom = (logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight) < SCROLL_BOTTOM_THRESHOLD;
    if (nearBottom) logEl.scrollTop = logEl.scrollHeight;
  }
}

async function loadDispatchContent(dispatch) {
  if (dispatch._contentLoaded) return;
  // Prevent duplicate WebSocket connections
  if (dispatch._ws && dispatch._ws.readyState <= WebSocket.OPEN) return;

  // Wait for the panel to be placed in the DOM (placeSessionPanels uses requestAnimationFrame)
  let logEl = document.getElementById(`log-${dispatch.id}`);
  if (!logEl) {
    await new Promise(r => requestAnimationFrame(r));
    logEl = document.getElementById(`log-${dispatch.id}`);
    if (!logEl) return;
  }

  // Single WebSocket connection — server replays from memory, then broadcasts live
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${proto}//${location.host}/api/dispatch/${dispatch.id}/ws`);
  dispatch._ws = ws;

  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'data') {
        const text = extractStreamText(msg.data);
        if (text) {
          const wasNearBottom = (logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight) < SCROLL_BOTTOM_THRESHOLD;
          logEl.appendChild(document.createTextNode(text));
          if (wasNearBottom) scrollDispatchLog(logEl, true);
        }
      } else if (msg.type === 'replay-end') {
        dispatch._contentLoaded = true;
        scrollDispatchLog(logEl, true);
        logEl.dataset.replayDone = '1';
      } else if (msg.type === 'done') {
        dispatch.status = msg.status || 'completed';
        dispatch._ws = null;
        finalizeDispatchPanel(dispatch);
      }
    } catch (err) { console.warn('[dispatch] ws message:', err); }
  };

  ws.onclose = () => {
    dispatch._ws = null;
    if (dispatch.status === 'running' && !dispatch._contentLoaded) {
      // WS closed before replay-end was received — treat as connection failure
      dispatch.status = 'failed';
      finalizeDispatchPanel(dispatch);
    } else {
      // Either done message was received (status != 'running') or WS dropped after
      // successful connect — sync badge so kills/completions via WS are reflected
      syncSessionState();
    }
  };

  ws.onerror = (e) => console.warn('[dispatch] ws error:', e);

  // For non-running dispatches, server will send replay + done, then close
  // For running dispatches, server sends replay then streams live data
}

async function killAllSessions() {
  if (!confirm('Kill all running dispatches and terminals?')) return;
  await Promise.all([
    fetch('/api/dispatch/all', { method: 'DELETE' }),
    fetch('/api/terminal/all', { method: 'DELETE' }),
  ]);
  activeDispatches.forEach(d => { d.status = 'killed'; });
  activeTerminals.forEach(t => { t.status = 'killed'; });
  document.querySelectorAll('.dispatch-panel .status-dot.running, .dispatch-panel .status-dot.generating, .dispatch-panel .status-dot.tool-running, .dispatch-panel .status-dot.needs-input, .terminal-header .status-dot.running').forEach(dot => {
    clearActiveDotClasses(dot);
    dot.classList.add('failed');
  });
  document.querySelectorAll('.kill-btn').forEach(btn => { btn.disabled = true; });
  document.querySelectorAll('.dismiss-btn').forEach(btn => { btn.style.display = ''; });
  syncSessionState();
}

async function dismissAllCompleted() {
  const staleDispatches = activeDispatches.filter(d => d.status !== 'running');
  const staleTerminals = activeTerminals.filter(t => t.status !== 'running');
  if (!staleDispatches.length && !staleTerminals.length) return;
  for (const d of staleDispatches) { if (d._autoDismissTimer) { clearTimeout(d._autoDismissTimer); d._autoDismissTimer = null; } }
  for (const t of staleTerminals) { if (t._autoDismissTimer) { clearTimeout(t._autoDismissTimer); t._autoDismissTimer = null; } }
  const deletes = [
    ...staleDispatches.map(d => fetch(`/api/dispatch/${d.id}`, { method: 'DELETE' }).catch(() => {})),
    ...staleTerminals.map(t => fetch(`/api/terminal/${t.id}`, { method: 'DELETE' }).catch(() => {})),
  ];
  await Promise.all(deletes);
  for (const d of staleDispatches) {
    const key = `dispatch:${d.id}`;
    const panel = sessionPanels.get(key);
    if (panel?.parentElement) panel.remove();
    sessionPanels.delete(key);
  }
  for (const t of staleTerminals) {
    const key = `terminal:${t.id}`;
    const panel = sessionPanels.get(key);
    if (panel?.parentElement) panel.remove();
    sessionPanels.delete(key);
  }
  activeDispatches.splice(0, activeDispatches.length, ...activeDispatches.filter(d => d.status === 'running'));
  activeTerminals.splice(0, activeTerminals.length, ...activeTerminals.filter(t => t.status === 'running'));
  syncSessionState();
}

let _placeTimer = null;
let _suspendedContainer = null;
function placeSessionPanels() {
  if (_placeTimer) return;
  _placeTimer = requestAnimationFrame(() => { _placeTimer = null; _placeSessionPanelsNow(); });
}
function _placeSessionPanelsNow() {
  // 1. Ensure global fallback container exists
  let globalContainer = document.getElementById('dispatch-panels');
  if (!globalContainer) {
    globalContainer = document.createElement('div');
    globalContainer.id = 'dispatch-panels';
    const killAllBtn = document.createElement('button');
    killAllBtn.className = 'kill-all-btn';
    killAllBtn.textContent = 'Kill All Sessions';
    killAllBtn.onclick = killAllSessions;
    globalContainer.appendChild(killAllBtn);
    const dismissAllBtn = document.createElement('button');
    dismissAllBtn.className = 'dismiss-all-btn';
    dismissAllBtn.textContent = 'Dismiss Completed';
    dismissAllBtn.onclick = dismissAllCompleted;
    globalContainer.appendChild(dismissAllBtn);
  }

  const movedPanels = new Set();
  let globalHasPanels = false;
  const pendingContentLoads = [];

  // 2. Build active session list
  const allSessions = [
    ...activeDispatches.map(d => ({ key: `dispatch:${d.id}`, work_item_id: d.work_item_id, epic_id: d.epic_id, project_key: d.project_key, org_key: d.org_key })),
    ...activeTerminals.map(t => ({ key: `terminal:${t.id}`, work_item_id: t.work_item_id, epic_id: t.epic_id, project_key: t.project_key, org_key: t.org_key })),
    ...activeCliSessions.map(c => ({ key: `cli:${c.id}`, work_item_id: c.work_item_id, epic_id: c.epic_id, project_key: c.project_key, org_key: c.org_key })),
  ];
  const activeKeys = new Set(allSessions.map(s => s.key));

  // 3. Place each session panel — only move if target slot differs from current parent
  for (const session of allSessions) {
    const panel = sessionPanels.get(session.key);
    if (!panel) continue;

    let targetSlot = null;

    // Tier 1: work-item-level slot
    const wiSlot = session.work_item_id ? document.querySelector(`[data-session-slot="${session.work_item_id}"]`) : null;
    if (wiSlot) {
      targetSlot = wiSlot;
      const row = wiSlot.closest('.wi-sessions-row');
      if (row) row.style.display = '';
    }

    // Tier 2: epic-level slot
    if (!targetSlot) {
      const epicSlot = session.epic_id ? document.querySelector(`[data-session-slot-epic="${session.epic_id}"]`) : null;
      if (epicSlot) {
        targetSlot = epicSlot;
        const section = epicSlot.closest('.context-sessions-section');
        if (section) section.classList.remove('hidden');
      }
    }

    // Tier 3: project-level slot
    if (!targetSlot) {
      const projSlot = session.project_key ? document.querySelector(`[data-session-slot-project="${session.project_key}"]`) : null;
      if (projSlot) {
        targetSlot = projSlot;
        const section = projSlot.closest('.context-sessions-section');
        if (section) section.classList.remove('hidden');
      }
    }

    // Tier 3.5: org-level slot
    if (!targetSlot && session.org_key) {
      const orgSlot = document.querySelector(`[data-session-slot-org="${session.org_key}"]`);
      if (orgSlot) targetSlot = orgSlot;
    }

    // Tier 4: global fallback
    if (!targetSlot) {
      targetSlot = globalContainer;
      globalHasPanels = true;
    }

    // Only move if panel is not already in the correct slot
    if (panel.parentElement !== targetSlot) {
      targetSlot.appendChild(panel);
      movedPanels.add(session.key);
    }

    // Collect dispatches needing content load — called after step 4 when all
    // containers are in the document, so getElementById resolves correctly.
    if (session.key.startsWith('dispatch:')) {
      const dispatchId = session.key.slice('dispatch:'.length);
      const dispatch = activeDispatches.find(d => d.id === dispatchId);
      if (dispatch && dispatch._pendingContentLoad) {
        dispatch._pendingContentLoad = false;
        pendingContentLoads.push(dispatch);
      }
    }
  }

  // 4. Insert global container only if it has panels and isn't already in DOM
  const main = $('#main');
  if (globalHasPanels && !globalContainer.parentElement) {
    main.insertBefore(globalContainer, main.firstChild);
  } else if (!globalHasPanels && globalContainer.parentElement) {
    globalContainer.remove();
  }

  // Re-anchor suspended-sessions panel after route changes clear main.innerHTML
  if (_suspendedContainer && _suspendedContainer.parentElement !== main) {
    main.insertBefore(_suspendedContainer, main.firstChild);
  }

  // All containers are now in the document — safe to call loadDispatchContent
  // (getElementById resolves correctly since panels are connected to the DOM)
  for (const dispatch of pendingContentLoads) {
    loadDispatchContent(dispatch);
  }

  // 5. Context-aware expand/collapse: expand relevant panels, collapse others.
  // Guards on previousProjectKey to prevent cross-project navigation from folding
  // sessions that belong to a project the user is navigating away from.
  const hash = location.hash || '';
  let viewProjectKey = '';
  let viewEpicId = '';
  const compMatch = hash.match(/^#component\/(.+)$/);
  if (compMatch) viewProjectKey = compMatch[1];
  const epicMatch = hash.match(/^#epic\/(.+)$/);
  if (epicMatch) viewEpicId = epicMatch[1];

  // Skip auto-fold when navigating to a different project than was previously shown.
  const isCrossProjectNav = viewProjectKey && previousProjectKey && viewProjectKey !== previousProjectKey;

  if (!isCrossProjectNav && (viewProjectKey || viewEpicId)) {
    for (const session of allSessions) {
      let isRelevant = true;
      if (viewProjectKey) {
        isRelevant = session.project_key === viewProjectKey;
      } else if (viewEpicId) {
        isRelevant = session.epic_id === viewEpicId;
      }
      const panel = sessionPanels.get(session.key);
      if (!panel) continue;
      const minBtn = panel.querySelector('[data-minimize-dispatch], [data-minimize-terminal], [data-minimize-cli]');
      if (isRelevant && panel.classList.contains('collapsed')) {
        panel.classList.remove('collapsed');
        if (minBtn) minBtn.textContent = '\u25bc';
      } else if (!isRelevant && !panel.classList.contains('collapsed')) {
        panel.classList.add('collapsed');
        if (minBtn) minBtn.textContent = '\u25b6';
      }
    }
  }

  // 6. Fit only terminals that were actually moved to a new slot (preserve scroll)
  for (const t of activeTerminals) {
    const panelKey = `terminal:${t.id}`;
    if (!movedPanels.has(panelKey)) continue;
    const panel = sessionPanels.get(panelKey);
    const ss = t._sessionState;
    if (panel && !panel.classList.contains('collapsed') && panel.isConnected && ss?._fitAddon && ss._term) {
      requestAnimationFrame(() => fitPreservingScroll(ss._term, ss._fitAddon));
    }
  }

  // 7. Remove orphaned panels no longer in any active session
  for (const [key, panel] of sessionPanels) {
    if (!activeKeys.has(key)) {
      if (panel.parentElement) panel.remove();
      sessionPanels.delete(key);
    }
  }
}

// --- Terminal theme ---
const termThemes = {
  dark: { background: '#1e1e2e', foreground: '#cdd6f4', cursor: '#f5e0dc', selectionBackground: '#45475a' },
  light: { background: '#f8f8f8', foreground: '#1e1e2e', cursor: '#333', selectionBackground: '#d0d0d0',
    black: '#1e1e2e', red: '#d32f2f', green: '#388e3c', yellow: '#f9a825', blue: '#1976d2', magenta: '#7b1fa2', cyan: '#0097a7', white: '#f5f5f5',
    brightBlack: '#616161', brightRed: '#ef5350', brightGreen: '#66bb6a', brightYellow: '#ffee58', brightBlue: '#42a5f5', brightMagenta: '#ab47bc', brightCyan: '#26c6da', brightWhite: '#fafafa' },
};
// --- Theme resolution & OS-aware switching ---
// resolveTermTheme() is the single source of truth for which theme key ('dark' | 'light') is active.
// applyTermThemeToAll() live-updates all open xterm.js terminals, dispatch logs, and settings log boxes.
// To add a new themeable surface: add a querySelectorAll line in applyTermThemeToAll() and toggle 'log-light'.
function resolveTermTheme() {
  const pref = window._prefs?.terminal_theme || 'system';
  if (pref === 'dark' || pref === 'light') return pref;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

function applyTermThemeToAll() {
  const key = resolveTermTheme();
  const theme = termThemes[key];
  const isLight = key === 'light';
  if (window._termSessions) {
    for (const [, ss] of window._termSessions) {
      if (ss._term) ss._term.options.theme = theme;
    }
  }
  document.querySelectorAll('.terminal-container').forEach(el => el.classList.toggle('terminal-light', isLight));
  document.querySelectorAll('.dispatch-log').forEach(el => el.classList.toggle('log-light', isLight));
  document.querySelectorAll('.settings-log-box').forEach(el => el.classList.toggle('log-light', isLight));
}

window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if ((window._prefs?.terminal_theme || 'system') === 'system') applyTermThemeToAll();
});

// --- TerminalWsManager ---
class TerminalWsManager {
  constructor(terminalId) {
    this.terminalId = terminalId;
    this.lastSeq = 0;
    this.state = 'IDLE'; // IDLE | CONNECTING | OPEN | RECONNECTING
    this._ws = null;
    this._backoff = 1000;
    this._backoffTimer = null;
    this._messageHandler = null;
    this._closeHandler = null;
    this._reconnectOnClose = true;
  }

  connect(fromSeq = 0) {
    if (this._ws && (this._ws.readyState === WebSocket.CONNECTING || this._ws.readyState === WebSocket.OPEN)) return;
    this.state = 'CONNECTING';
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    this._ws = new WebSocket(`${proto}//${location.host}/api/terminal/${this.terminalId}/ws?from=${fromSeq}`);
    this._reconnectOnClose = true;

    this._ws.onopen = () => { this.state = 'OPEN'; };

    this._ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.seq && msg.seq > this.lastSeq) this.lastSeq = msg.seq;
        if (this._messageHandler) this._messageHandler(msg);
      } catch {}
    };

    this._ws.onerror = () => {};

    this._ws.onclose = (e) => {
      this._ws = null;
      if (!this._reconnectOnClose || e.code === 1000) {
        this.state = 'IDLE';
        if (this._closeHandler) this._closeHandler(e.code);
        return;
      }
      this.state = 'RECONNECTING';
      if (this._closeHandler) this._closeHandler(e.code);
      this._backoffTimer = setTimeout(() => {
        this._backoff = Math.min(this._backoff * 2, 30000);
        this.connect(this.lastSeq);
      }, this._backoff);
    };
  }

  disconnect() {
    this._reconnectOnClose = false;
    if (this._backoffTimer) { clearTimeout(this._backoffTimer); this._backoffTimer = null; }
    if (this._ws) { this._ws.close(1000); this._ws = null; }
    this.state = 'IDLE';
  }

  send(msg) {
    if (this.state === 'OPEN' && this._ws && this._ws.readyState === WebSocket.OPEN) {
      this._ws.send(JSON.stringify(msg));
    }
  }

  onMessage(handler) { this._messageHandler = handler; }
  onClose(handler) { this._closeHandler = handler; }

  resetBackoff() { this._backoff = 1000; }
}

// --- TerminalEventQueue ---
class TerminalEventQueue {
  constructor(sessionState) {
    this._queue = [];
    this._draining = false;
    this._ready = false;
    this._term = null;
    this._fitAddon = null;
    this._sessionState = sessionState;
    this._containerEl = null;
    this._destroyed = false;
  }

  markReady(term, fitAddon, containerEl) {
    this._term = term;
    this._fitAddon = fitAddon;
    this._containerEl = containerEl;
    this._ready = true;
    if (this._queue.length > 0 && !this._draining) this._drain();
  }

  enqueue(event) {
    if (this._destroyed) return;
    this._queue.push(event);
    if (this._ready && !this._draining) this._drain();
  }

  destroy() {
    this._destroyed = true;
    this._queue = [];
    this._draining = false;
    this._ready = false;
  }

  async _drain() {
    if (this._draining || this._destroyed) return;
    this._draining = true;

    while (this._queue.length > 0 && !this._destroyed) {
      // Batch consecutive data events into a single term.write() call
      let batchData = '';
      let batchMaxSeq = 0;

      while (this._queue.length > 0 && this._queue[0].eventType === 'data') {
        const event = this._queue.shift();
        batchData += event.payload;
        if (event.seq > batchMaxSeq) batchMaxSeq = event.seq;
      }

      // Flush accumulated data batch, preserving scroll position if user scrolled up
      if (batchData && this._term) {
        const buf = this._term.buffer.active;
        const userScrolledUp = buf.viewportY < buf.baseY;
        const savedViewportY = buf.viewportY;

        await new Promise(resolve => this._term.write(batchData, resolve));

        // Restore scroll position if user was scrolled up — prevents auto-scroll-to-bottom
        if (userScrolledUp) {
          const newBuf = this._term.buffer.active;
          const delta = savedViewportY - newBuf.viewportY;
          if (delta !== 0) this._term.scrollLines(delta);
        }

        if (batchMaxSeq && this._sessionState._wsManager) {
          this._sessionState._wsManager.lastSeq = batchMaxSeq;
        }
      }

      // Process next non-data event (if any)
      if (this._queue.length > 0 && this._queue[0].eventType !== 'data') {
        const event = this._queue.shift();
        await this._writeNonDataEvent(event);
      }
    }

    this._draining = false;
  }

  async _writeNonDataEvent(event) {
    if (this._destroyed || !this._term) return;
    const { seq, eventType, payload } = event;

    if (eventType === 'resize') {
      const rect = this._containerEl ? this._containerEl.getBoundingClientRect() : null;
      if (rect && rect.width > 0 && rect.height > 0) {
        fitPreservingScroll(this._term, this._fitAddon);
      } else {
        try { this._term.resize(payload.cols, payload.rows); } catch {}
      }
    } else if (eventType === 'meta') {
      updatePanelMeta(this._sessionState, payload.key, payload.value);
    }

    if (seq && this._sessionState._wsManager) {
      if (this._sessionState._wsManager.lastSeq < seq) this._sessionState._wsManager.lastSeq = seq;
    }
  }
}

// --- xterm.js dynamic loading ---

async function loadXterm() {
  if (xtermLoaded) return xtermModules;
  try {
    const [xtermMod, fitMod, webLinksMod] = await Promise.all([
      import('/vendor/xterm.mjs'),
      import('/vendor/xterm-addon-fit.mjs'),
      import('/vendor/xterm-addon-web-links.mjs'),
    ]);
    setXtermModules({ Terminal: xtermMod.Terminal, FitAddon: fitMod.FitAddon, WebLinksAddon: webLinksMod.WebLinksAddon });
    setXtermLoaded(true);
    return xtermModules;
  } catch (e) {
    console.error('Failed to load xterm.js:', e);
    return null;
  }
}

// Fit terminal preserving proportional scroll position (stable across reflows)
function fitPreservingScroll(term, fitAddon) {
  const buf = term.buffer.active;
  const wasAtBottom = buf.viewportY >= buf.baseY;
  const scrollFraction = buf.baseY > 0 ? buf.viewportY / buf.baseY : 1;

  fitAddon.fit();

  const newBuf = term.buffer.active;
  if (wasAtBottom || newBuf.baseY === 0) {
    const delta = newBuf.baseY - newBuf.viewportY;
    if (delta !== 0) term.scrollLines(delta);
    return;
  }
  const targetY = Math.round(scrollFraction * newBuf.baseY);
  const clampedY = Math.max(0, Math.min(newBuf.baseY, targetY));
  const delta = clampedY - newBuf.viewportY;
  if (delta !== 0) term.scrollLines(delta);
}

function updatePanelMeta(sessionState, key, value) {
  const panel = document.getElementById(`terminal-${sessionState.id}`);
  if (!panel) return;

  if (key === 'claude_session_id') {
    sessionState.claudeSessionId = value;
    let footerEl = panel.querySelector('.session-id-copy');
    if (footerEl) {
      footerEl.textContent = value;
      footerEl.style.display = '';
    }
  } else if (key === 'prompt_injection_status') {
    const indicator = panel.querySelector('.injection-indicator');
    if (indicator) {
      if (value === 'waiting') indicator.textContent = '⟳ waiting...';
      else if (value === 'injecting') indicator.textContent = '⟳ injecting...';
      else if (value === 'done') indicator.textContent = '✓ injected';
      else if (value === 'failed') indicator.textContent = '✗ injection failed';
      indicator.style.display = value ? '' : 'none';
    }
  } else if (key === 'status') {
    sessionState.status = value;
    if (value === 'completed' || value === 'failed' || value === 'killed') {
      finalizeTerminalPanel(sessionState);
    }
  }
}

function createContainerReadyPromise(containerEl) {
  return new Promise((resolve) => {
    const check = () => {
      const rect = containerEl.getBoundingClientRect();
      if (rect.width > 0 && rect.height > 0) { resolve(); return true; }
      return false;
    };
    if (check()) return; // Synchronous check first
    const ro = new ResizeObserver(() => {
      if (check()) { ro.disconnect(); }
    });
    ro.observe(containerEl);
    containerEl._readyObserver = ro;
    // Fallback: resolve after 2s even if container is collapsed (0×0).
    // xterm will initialize with default dimensions and refit when expanded.
    setTimeout(() => resolve(), 2000);
  });
}

async function initSession(terminalInfo) {
  // Prevent duplicate connections
  if (terminalInfo._wsManager && terminalInfo._wsManager.state !== 'IDLE') return;

  // Create session state if not exists
  if (!terminalInfo._sessionState) {
    terminalInfo._sessionState = {
      id: terminalInfo.id,
      state: 'DISCONNECTED',
      firstLiveSeen: false,
      claudeSessionId: terminalInfo.claude_session_id || null,
      _wsManager: null,
      _eventQueue: null,
      _term: null,
      _fitAddon: null,
      _resizeObserver: null,
      _resizeTimer: null,
    };
    // Register in global map for test access
    window._termSessions = window._termSessions || new Map();
    window._termSessions.set(terminalInfo.id, terminalInfo._sessionState);
  }

  const sessionState = terminalInfo._sessionState;
  sessionState.state = 'CONNECTING';

  let panel = document.getElementById(`terminal-${terminalInfo.id}`);
  if (!panel) {
    // Panel not in DOM yet — placeSessionPanels() defers insertion via requestAnimationFrame
    await new Promise(resolve => requestAnimationFrame(resolve));
    panel = document.getElementById(`terminal-${terminalInfo.id}`);
    if (!panel) return;
  }
  const containerEl = panel.querySelector(`#term-container-${terminalInfo.id}`);
  if (!containerEl) return;

  // Create WsManager
  const wsManager = new TerminalWsManager(terminalInfo.id);
  sessionState._wsManager = wsManager;
  terminalInfo._wsManager = wsManager;  // back-compat reference

  // Create event queue
  const eventQueue = new TerminalEventQueue(sessionState);
  sessionState._eventQueue = eventQueue;

  // Load xterm modules (cached globally)
  const xtermPromise = loadXterm();

  // Create container ready promise
  const containerReadyPromise = createContainerReadyPromise(containerEl);

  // Show loading overlay — skip if terminal already has content (avoid flash on reconnect)
  const hasExistingContent = !!sessionState._term;
  let loadingEl = containerEl.querySelector('.terminal-loading');
  if (hasExistingContent && loadingEl) {
    loadingEl.remove();
    loadingEl = null;
  } else if (!loadingEl && !hasExistingContent) {
    loadingEl = document.createElement('div');
    loadingEl.className = 'terminal-loading';
    loadingEl.textContent = 'Connecting...';
    containerEl.appendChild(loadingEl);
  }

  // Handle WS messages
  let xtermInitialized = false;
  let streamStartData = null;

  wsManager.onMessage(async (msg) => {
    if (msg.type === 'stream-start') {
      streamStartData = msg;
      sessionState.state = 'REPLAYING';
      if (loadingEl) loadingEl.textContent = `Loading... 0 / ${Math.round(msg.rawBytes / 1024)} KB`;

      // Wait for both xterm to load AND container to have dimensions
      try {
        const [xtermModules] = await Promise.all([xtermPromise, containerReadyPromise]);

        if (!xtermInitialized) {
          xtermInitialized = true;
          const { Terminal, FitAddon, WebLinksAddon } = xtermModules;

          const fitAddon = new FitAddon();
          const webLinksAddon = new WebLinksAddon();
          const theme = termThemes[resolveTermTheme()];
          const term = new Terminal({
            cursorBlink: true,
            fontSize: 13,
            fontFamily: 'Menlo, Monaco, "Courier New", monospace',
            theme,
            scrollback: 50000,
            scrollOnUserInput: false,
          });

          term.loadAddon(fitAddon);
          term.loadAddon(webLinksAddon);

          // Clear loading overlay, attach terminal
          if (loadingEl) loadingEl.remove();
          loadingEl = null;
          containerEl.classList.toggle('terminal-light', resolveTermTheme() === 'light');
          term.open(containerEl);
          term.reset();
          fitAddon.fit();

          sessionState._term = term;
          sessionState._fitAddon = fitAddon;
          terminalInfo._term = term;  // back-compat
          terminalInfo._fitAddon = fitAddon;  // back-compat

          // Keyboard input — only when LIVE
          term.onData((data) => {
            if (sessionState.state === 'LIVE') {
              wsManager.send({ type: 'input', data });
            }
          });

          // Escape key for focus popup
          term.attachCustomKeyEventHandler((e) => {
            if (e.key === 'Escape' && e.type === 'keydown' && activeFocusPopup) {
              closeFocusPopup();
              return false;
            }
            return true;
          });

          // Resize observer (clean, stored on sessionState)
          const resizeObserver = new ResizeObserver(() => {
            if (!containerEl.isConnected) return;
            const rect = containerEl.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return;
            if (sessionState._resizeTimer) clearTimeout(sessionState._resizeTimer);
            sessionState._resizeTimer = setTimeout(() => {
              sessionState._resizeTimer = null;
              fitPreservingScroll(term, fitAddon);
              if (sessionState.state === 'LIVE') {
                wsManager.send({ type: 'resize', cols: term.cols, rows: term.rows });
              }
            }, 100);
          });
          resizeObserver.observe(containerEl);
          sessionState._resizeObserver = resizeObserver;

          // Scroll containment: intercept wheel events in capture phase so this
          // handler runs before xterm's own listener (attached during term.open()).
          containerEl.addEventListener('wheel', (e) => {
            e.preventDefault(); // Always prevent page scroll
            if (!term) return;

            if (term.buffer.active.type === 'alternate') {
              // Alternate screen (TUI apps like Claude Code): no scrollback in
              // xterm, so scrollLines() would be a no-op. Send SGR-encoded mouse
              // wheel sequences instead — the TUI interprets these for native
              // scroll. Safe: if the app has no mouse tracking, sequences are
              // silently ignored. Button 64 = scroll-up, 65 = scroll-down.
              const button = e.deltaY < 0 ? 64 : 65;
              const count = Math.max(1, Math.min(10, Math.abs(Math.round(e.deltaY / 25)) || 1));
              const seq = `\x1b[<${button};1;1M`;
              if (sessionState.state === 'LIVE') {
                wsManager.send({ type: 'input', data: seq.repeat(count) });
              }
              return;
            }

            // Normal buffer: use custom scroll logic.
            // stopImmediatePropagation prevents xterm's handler from also firing,
            // ensuring scroll only moves the viewport — never the cursor.
            e.stopPropagation();
            e.stopImmediatePropagation();
            const lines = Math.round(e.deltaY / 25) || (e.deltaY > 0 ? 1 : -1);
            term.scrollLines(lines);
          }, { passive: false, capture: true });

          // Click while scrolled up returns the viewport to the input area.
          // This is the intentional gesture for "take me back to where I was typing."
          containerEl.addEventListener('click', (e) => {
            if (term) {
              const sel = window.getSelection();
              const selectionIsOutsideTerminal = sel?.type === 'Range' &&
                !containerEl.contains(sel.anchorNode);
              if (term.hasSelection() || selectionIsOutsideTerminal) return;
              const buf = term.buffer.active;
              if (buf.viewportY < buf.baseY) {
                term.scrollToBottom();
              }
            }
          });

          // "Return to input" badge: visible when scrolled up, hidden at bottom.
          const scrollBtn = document.createElement('button');
          scrollBtn.className = 'scroll-to-bottom-btn';
          scrollBtn.setAttribute('aria-label', 'Return to input');
          scrollBtn.textContent = '↓ input';
          containerEl.appendChild(scrollBtn);
          scrollBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // prevent the click handler above from double-firing
            if (term) term.scrollToBottom();
          });
          term.onScroll(() => {
            const buf = term.buffer.active;
            scrollBtn.classList.toggle('visible', buf.viewportY < buf.baseY);
          });

          // Mark queue ready
          eventQueue.markReady(term, fitAddon, containerEl);
        }
      } catch (err) {
        console.error('Terminal init error:', err);
      }

    } else if (msg.type === 'snapshot') {
      // Write snapshot as a data event
      eventQueue.enqueue({ seq: msg.upToSeq, eventType: 'data', payload: msg.data, ts: Date.now() });

    } else if (msg.type === 'event') {
      // Enqueue all events (replay + live) through the ordered queue
      eventQueue.enqueue({ seq: msg.seq, eventType: msg.eventType, payload: msg.payload, ts: msg.ts });
      // Update loading progress for data events during replay
      if (msg.eventType === 'data' && sessionState.state === 'REPLAYING' && loadingEl && streamStartData) {
        const approx = Math.round((wsManager.lastSeq / Math.max(1, streamStartData.headSeq)) * streamStartData.rawBytes / 1024);
        loadingEl.textContent = `Loading... ${approx} / ${Math.round(streamStartData.rawBytes / 1024)} KB`;
      }

    } else if (msg.type === 'stream-live') {
      sessionState.state = 'LIVE';
      if (loadingEl) { loadingEl.remove(); loadingEl = null; }
      wsManager.resetBackoff();
      // Send resize to notify server of actual client dimensions
      if (sessionState._term) {
        wsManager.send({ type: 'resize', cols: sessionState._term.cols, rows: sessionState._term.rows });
      }
      // Auto-focus on first LIVE transition
      if (!sessionState.firstLiveSeen && sessionState._term) {
        sessionState.firstLiveSeen = true;
        sessionState._term.focus();
      }

    } else if (msg.type === 'exit') {
      terminalInfo.status = msg.code === 0 ? 'completed' : 'failed';
      sessionState.state = 'EXITED';
      finalizeTerminalPanel(terminalInfo);
    }
  });

  // Handle unexpected close → RECONNECTING
  wsManager.onClose((code) => {
    if (sessionState.state === 'EXITED') return;
    if (code !== 1000) {
      sessionState.state = 'RECONNECTING';
      // Write reconnecting message to xterm
      if (sessionState._term) {
        sessionState._term.write('\r\n\x1b[33m[reconnecting...]\x1b[0m\r\n');
      }
    }
  });

  wsManager.connect(0);
}

function destroyTerminal(terminalInfo) {
  const sessionState = terminalInfo._sessionState;
  if (sessionState) {
    if (sessionState._resizeTimer) { clearTimeout(sessionState._resizeTimer); sessionState._resizeTimer = null; }
    if (sessionState._resizeObserver) { sessionState._resizeObserver.disconnect(); sessionState._resizeObserver = null; }
    if (sessionState._wsManager) { sessionState._wsManager.disconnect(); sessionState._wsManager = null; }
    if (sessionState._eventQueue) { sessionState._eventQueue.destroy(); sessionState._eventQueue = null; }
    if (sessionState._term) { try { sessionState._term.dispose(); } catch {} sessionState._term = null; }
    sessionState.state = 'DISCONNECTED';
  }

  if (window._termSessions) window._termSessions.delete(terminalInfo.id);

  const panel = document.getElementById(`terminal-${terminalInfo.id}`);
  if (panel && panel.parentElement) panel.remove();
  sessionPanels.delete('terminal:' + terminalInfo.id);

  const idx = activeTerminals.findIndex(t => t.id === terminalInfo.id);
  if (idx !== -1) activeTerminals.splice(idx, 1);
}


// Load persisted collapse state
try {
  const saved = sessionStorage.getItem('sessionCollapseState');
  if (saved) for (const [k, v] of Object.entries(JSON.parse(saved))) sessionCollapseState.set(k, v);
} catch {}

function saveCollapseState() {
  try { sessionStorage.setItem('sessionCollapseState', JSON.stringify(Object.fromEntries(sessionCollapseState))); } catch {}
}

function togglePanelCollapse(key, panel, btn) {
  const collapsed = !panel.classList.contains('collapsed');
  panel.classList.toggle('collapsed', collapsed);
  sessionCollapseState.set(key, collapsed);
  btn.textContent = collapsed ? '▶' : '▼';
  saveCollapseState();
  // Re-fit xterm if expanding a terminal
  if (!collapsed && key.startsWith('terminal:')) {
    const tid = key.split(':')[1];
    const t = activeTerminals.find(x => x.id === tid);
    const ss = t?._sessionState;
    if (ss?._fitAddon && ss._term) {
      requestAnimationFrame(() => {
        if (ss._fitAddon && ss._term) fitPreservingScroll(ss._term, ss._fitAddon);
      });
    }
  }
}

async function dismissTerminalPanel(id) {
  const t = activeTerminals.find(t => t.id === id);
  if (t?._autoDismissTimer) { clearTimeout(t._autoDismissTimer); t._autoDismissTimer = null; }
  try { await fetch(`/api/terminal/${id}`, { method: 'DELETE' }); } catch {}
  const terminalInfo = activeTerminals.find(t => t.id === id);
  if (terminalInfo) {
    destroyTerminal(terminalInfo);
  } else {
    // Fallback cleanup if terminalInfo not found
    const panelKey = `terminal:${id}`;
    const panel = sessionPanels.get(panelKey);
    if (panel?.parentElement) panel.remove();
    sessionPanels.delete(panelKey);
  }
}

function finalizeTerminalPanel(terminalInfo) {
  const panel = document.getElementById(`terminal-${terminalInfo.id}`);
  if (!panel) return;
  panel.className = panel.className.replace(/status-\w+/, `status-${terminalInfo.status}`);
  const dot = panel.querySelector('.status-dot');
  if (dot) {
    clearActiveDotClasses(dot);
    dot.classList.add(terminalInfo.status === 'completed' ? 'completed' : 'failed');
  }
  const killBtn = panel.querySelector(`[data-kill-terminal="${terminalInfo.id}"]`);
  if (killBtn) killBtn.disabled = true;
  const suspendBtn = panel.querySelector(`[data-suspend-terminal="${terminalInfo.id}"]`);
  if (suspendBtn) suspendBtn.style.display = 'none';
  const dismissBtn = panel.querySelector(`[data-dismiss-terminal="${terminalInfo.id}"]`);
  if (dismissBtn) dismissBtn.style.display = '';
  syncSessionState();
  if (terminalInfo.status !== 'running' && terminalInfo.status !== 'suspended') {
    scheduleAutoDismiss('terminal', terminalInfo.id, terminalInfo);
  }
}

// connectTerminalWs is replaced by initSession

// Restore terminals on page load
async function restoreTerminals() {
  try {
    const list = await api('terminal/active');
    const toConnect = [];
    for (const t of list) {
      const existing = activeTerminals.find(a => a.id === t.id);
      if (existing) {
        // Update status from server (e.g. running → completed transition)
        if (existing.status !== t.status) {
          existing.status = t.status;
          if (t.status !== 'running') finalizeTerminalPanel(existing);
        }
        continue;
      }
      if (t.status === 'suspended') {
        const suspended = { ...t };
        activeTerminals.push(suspended);
        createTerminalPanel(suspended);
        continue; // no WS connection for suspended placeholders
      }
      const terminalInfo = { ...t };
      activeTerminals.push(terminalInfo);
      createTerminalPanel(terminalInfo);
      if (t.status === 'running') {
        toConnect.push(terminalInfo);
      } else {
        // Exited terminal — connect WS to load scrollback into xterm, then finalize
        toConnect.push(terminalInfo);
      }
    }
    // Cleanup stale panels for sessions that no longer exist
    const activeIds = new Set(list.map(t => `terminal:${t.id}`));
    for (const key of sessionPanels.keys()) {
      if (key.startsWith('terminal:') && !activeIds.has(key)) {
        const panel = sessionPanels.get(key);
        if (panel?.parentElement) panel.remove();
        sessionPanels.delete(key);
      }
    }
    placeSessionPanels();
    // Wait for requestAnimationFrame so panels are in the DOM before connecting
    await new Promise(resolve => requestAnimationFrame(resolve));
    for (const t of toConnect) await initSession(t);
    syncSessionState();
  } catch {}
}

function renderPhaseTimeline(history) {
  if (!history || history.length < 2) return '';
  const phaseColors = { generating: '#4A9EFF', tool_running: '#F59E0B', waiting_for_input: '#F59E0B' };
  const dots = history.map(entry => {
    const color = phaseColors[entry.phase] || '#6B7280';
    const time = entry.at ? new Date(entry.at).toLocaleTimeString() : '';
    const label = entry.phase ? entry.phase.replace(/_/g, ' ') : 'idle';
    return `<div class="phase-dot" style="background:${color}" title="${label} at ${time}"></div>`;
  }).join('');
  return `<div class="phase-timeline">${dots}</div>`;
}

function renderDispatchAlerts(dispatch) {
  const log = dispatch.session_log || [];
  const badges = [];
  const costAlert = log.find(e => e.trigger === 'cost-anomaly');
  const scopeAlert = log.find(e => e.trigger === 'scope-violation');
  if (costAlert) {
    badges.push(`<span class="alert-badge alert-cost" title="${esc(costAlert.summary)}">⚠ Cost</span>`);
  }
  if (scopeAlert) {
    badges.push(`<span class="alert-badge alert-scope" title="${esc(scopeAlert.summary)}">⚠ Scope</span>`);
  }
  return badges.join('');
}

function renderTimeoutCountdown(dispatch) {
  if (!dispatch.timeout_at) return '';
  if (dispatch.status === 'running') {
    const remaining = new Date(dispatch.timeout_at).getTime() - Date.now();
    if (remaining <= 0) return '<span class="timeout-badge timeout-expired">Timed out</span>';
    const mins = Math.floor(remaining / 60000);
    const secs = Math.floor((remaining % 60000) / 1000);
    return `<span class="timeout-countdown" title="Auto-timeout in ${mins}m ${secs}s">⏱ ${mins}m${secs < 10 ? '0' : ''}${secs}s</span>`;
  }
  if (dispatch.status === 'failed' && dispatch.completed_at) {
    const diff = Math.abs(new Date(dispatch.completed_at).getTime() - new Date(dispatch.timeout_at).getTime());
    if (diff < 10000) return '<span class="timeout-badge timeout-expired">Timed out</span>';
  }
  return '';
}

      suspendSession(`/api/terminal/${id}/suspend`, e.target, () => {
        terminalInfo.status = 'suspended';
        panel.classList.add('status-suspended');
        const dot = panel.querySelector('.status-dot');
        clearActiveDotClasses(dot);
        dot.classList.add('suspended');
        e.target.style.display = 'none';
        panel.querySelector(`[data-kill-terminal="${id}"]`).disabled = true;
        const resumeBtn = panel.querySelector(`[data-resume-terminal="${id}"]`);
        if (resumeBtn) resumeBtn.style.display = '';
        const dismissBtn = panel.querySelector(`[data-dismiss-terminal="${id}"]`);
        if (dismissBtn) dismissBtn.style.display = '';
        const titleEl = panel.querySelector('.terminal-title');
        if (titleEl && !titleEl.querySelector('.suspended-badge')) {
          titleEl.insertAdjacentHTML('beforeend', '<span class="suspended-badge">[suspended]</span>');
        }
        syncSessionState();
        refreshSuspendedPanel();
      });
    };
    panel.querySelector(`[data-resume-terminal="${id}"]`).onclick = async (e) => {
      const btn = e.target;
      btn.disabled = true;
      try {
        const resp = await fetch(`/api/terminal/${id}/resume`, { method: 'POST' });
        if (resp.ok) {
          await dismissTerminalPanel(id);
          await refreshSuspendedPanel();
          await restoreTerminals();
          syncSessionState();
        }
      } catch {}
    };
    panel.querySelector(`[data-dismiss-terminal="${id}"]`).onclick = async () => {
      await dismissTerminalPanel(id);
      syncSessionState();
    };
    const termContainer = panel.querySelector(`#term-container-${id}`);
    if (termContainer) {
      termContainer.addEventListener('click', () => {
        if (terminalInfo._term?.hasSelection()) return;
        const term = terminalInfo._term;
        if (!term) return;
        const buf = term.buffer.active;
        if (buf.viewportY >= buf.baseY) term.focus();
      });
    }

  } else if (type === 'cli') {
    const session = info;
    panel.className = 'cli-session-panel';
    panel.id = `cli-${id}`;
    const isRunning = session.status === 'running';
    const elapsed = formatElapsed(session.registered_at);
    panel.innerHTML = `
      <div class="cli-session-header">
        <span class="status-dot ${isRunning ? 'running' : 'exited'}"></span>
        <span class="cli-title">${esc(session.title)}<span class="badge-cli">[CLI]</span></span>
        <span class="cli-meta">${elapsed}</span>
        <button class="minimize-btn" data-minimize-cli="${esc(id)}">▼</button>
      </div>
      <div class="cli-session-body"></div>
    `;
    const panelKey = `cli:${id}`;
    sessionPanels.set(panelKey, panel);
    const defaultCollapsed = !window._testDefaultExpanded && (window._prefs?.default_panel_state || 'minimized') !== 'expanded';
    const collapsed = sessionCollapseState.has(panelKey) ? sessionCollapseState.get(panelKey) : defaultCollapsed;
    if (collapsed) {
      panel.classList.add('collapsed');
      panel.querySelector(`[data-minimize-cli="${id}"]`).textContent = '▶';
    }
    panel.querySelector(`[data-minimize-cli="${id}"]`).onclick = () => {
      togglePanelCollapse(panelKey, panel, panel.querySelector(`[data-minimize-cli="${id}"]`));
    };
    panel.querySelector('.cli-session-header').addEventListener('click', (e) => {
      if (e.target.closest('button')) return;
      togglePanelCollapse(panelKey, panel, panel.querySelector(`[data-minimize-cli="${id}"]`));
    });
  }

  return panel;
}

async function restoreCliSessions() {
  try {
    const list = await api('sessions/active');
    activeCliSessions.length = 0;
    for (const c of list) {
      activeCliSessions.push({ ...c });
      if (!sessionPanels.has(`cli:${c.id}`)) {
        createCliSessionPanel(c);
      }
    }
    // Cleanup stale panels
    const activeIds = new Set(list.map(c => `cli:${c.id}`));
    for (const key of sessionPanels.keys()) {
      if (key.startsWith('cli:') && !activeIds.has(key)) {
        const panel = sessionPanels.get(key);
        if (panel?.parentElement) panel.remove();
        sessionPanels.delete(key);
      }
    }
    // Update status dots and elapsed times
    for (const c of list) {
      const panel = document.getElementById(`cli-${c.id}`);
      if (panel) {
        const dot = panel.querySelector('.status-dot');
        if (dot) { dot.className = `status-dot ${c.status === 'running' ? 'running' : 'exited'}`; }
        const meta = panel.querySelector('.cli-meta');
        if (meta) { meta.textContent = formatElapsed(c.registered_at); }
      }
    }
    placeSessionPanels();
    syncSessionState();
  } catch {}
}

async function dispatchWorkItem(workItem, projectKey) {
  return new Promise((resolve) => {
    let resolvedTerminal = null;

    const { overlay, close } = createDispatchOverlay({
      title: `Dispatch ${workItem.id}`,
      cancelId: 'modal-cancel',
      submitId: 'modal-dispatch',
      buildFields: () => `
        <div data-field-group="status-priority" style="display:flex;gap:16px;align-items:flex-start;margin-bottom:14px">
          <div>
            <div style="font-size:11px;color:var(--text-muted,#6c7086);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em">Status</div>
            <span data-field="status" class="badge badge-${workItem.status || 'draft'}">${esc(workItem.status)}</span>
          </div>
          <div>
            <div style="font-size:11px;color:var(--text-muted,#6c7086);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em">Priority</div>
            <span data-field="priority" class="badge badge-${workItem.priority || 'medium'}">${esc(workItem.priority || 'medium')}</span>
          </div>
        </div>
        <div class="field">
          <label>Title</label>
          <div style="font-size:14px;font-weight:500">${esc(workItem.title)}</div>
        </div>
        ${workItem.description?.trim() ? `<div class="field"><label>Description</label><div class="md-inline">${renderMd(workItem.description)}</div></div>` : ''}
        <div class="field">
          <label>Project</label>
          <div style="font-size:13px"><code>${esc(projectKey)}</code></div>
        </div>
        <div class="field">
          <label>Additional Instructions</label>
          <textarea id="dispatch-instructions" placeholder="Optional: add context, constraints, or specific instructions for the agent..."></textarea>
        </div>
        <details id="contract-details" style="margin-bottom:14px">
          <summary style="cursor:pointer;font-size:13px;font-weight:500;color:var(--text-secondary)">Dispatch Contract</summary>
          <div style="margin-top:8px;display:flex;flex-direction:column;gap:8px">
            <div class="field"><label for="contract-goal">Goal</label><textarea id="contract-goal" rows="2" placeholder="What must be true when complete?"></textarea></div>
            <div class="field"><label for="contract-constraints">Constraints</label><textarea id="contract-constraints" rows="2" placeholder="Hard boundaries not to cross"></textarea></div>
            <div class="field"><label for="contract-expected-output">Expected Output</label><textarea id="contract-expected-output" rows="2" placeholder="Specific artifact or structure to produce"></textarea></div>
            <div class="field"><label for="contract-failure-conditions">Failure Conditions</label><textarea id="contract-failure-conditions" rows="2" placeholder="What makes output unacceptable"></textarea></div>
            <div class="field"><label for="contract-scope-boundary">Scope Boundary</label><textarea id="contract-scope-boundary" rows="1" placeholder="Files/dirs the agent must NOT modify"></textarea></div>
            <div class="field"><label for="contract-stop-conditions">Stop Conditions</label><textarea id="contract-stop-conditions" rows="2" placeholder="One per line: conditions to halt and report"></textarea></div>
          </div>
        </details>
        <div class="field">
          <label for="dispatch-agent-type">Agent</label>
          <select id="dispatch-agent-type">
            <option value="claude" selected>Claude</option>
            <option value="shell">Shell</option>
            <option value="codex">Codex</option>
            <option value="gemini">Gemini</option>
          </select>
        </div>
        <div class="interactive-toggle">
          <input type="checkbox" id="dispatch-claude-agent" checked />
          <label for="dispatch-claude-agent">Claude Agent</label>
        </div>
        ${permissionModeSelect('dispatch-perm-mode')}
        ${skipPermissionsCheckbox('dispatch-skip-perms')}
      `,
      afterMount: (o) => {
        wireAgentTypeToggle(o, 'dispatch-agent-type', 'dispatch-perm-mode', 'dispatch-skip-perms');
        // Auto-populate contract fields from structured description
        if (workItem.description) {
          const desc = workItem.description;
          const extract = (header) => { const m = desc.match(new RegExp(`\\*\\*${header}\\*\\*:\\s*(.+)`, 'i')); return m ? m[1].trim() : ''; };
          const goal = extract('Goal');
          const constraints = extract('Constraints');
          const expectedOutput = extract('Expected Output');
          const failureConditions = extract('Failure Conditions');
          const scopeBoundary = extract('Scope Boundary');
          // Stop conditions: multi-line after header
          const scMatch = desc.match(/\*\*Stop Conditions\*\*:\s*\n([\s\S]*?)(?=\n\*\*[A-Z]|\n##|\s*$)/i);
          const stopConditions = scMatch ? scMatch[1].split('\n').map(l => l.replace(/^[-*]\s*/, '').trim()).filter(Boolean).join('\n') : '';
          if (goal) o.querySelector('#contract-goal').value = goal;
          if (constraints) o.querySelector('#contract-constraints').value = constraints;
          if (expectedOutput) o.querySelector('#contract-expected-output').value = expectedOutput;
          if (failureConditions) o.querySelector('#contract-failure-conditions').value = failureConditions;
          if (scopeBoundary) o.querySelector('#contract-scope-boundary').value = scopeBoundary;
          if (stopConditions) o.querySelector('#contract-stop-conditions').value = stopConditions;
          // Auto-expand if any field was populated
          if (goal || constraints || expectedOutput || failureConditions || scopeBoundary || stopConditions) {
            o.querySelector('#contract-details').open = true;
          }
        }
      },
      onSubmit: async (overlay) => {
        const instructions = overlay.querySelector('#dispatch-instructions').value.trim();
        const plainTerminal = !overlay.querySelector('#dispatch-claude-agent').checked;
        const agentType = overlay.querySelector('#dispatch-agent-type')?.value || 'claude';
        const permMode = getPermissionMode(overlay, 'dispatch-perm-mode');
        const skipPerms = overlay.querySelector('#dispatch-skip-perms').checked;

        // Collect contract fields
        const contractGoal = overlay.querySelector('#contract-goal')?.value?.trim() || '';
        const contractConstraints = overlay.querySelector('#contract-constraints')?.value?.trim() || '';
        const contractExpectedOutput = overlay.querySelector('#contract-expected-output')?.value?.trim() || '';
        const contractFailureConditions = overlay.querySelector('#contract-failure-conditions')?.value?.trim() || '';
        const contractScopeBoundary = overlay.querySelector('#contract-scope-boundary')?.value?.trim() || '';
        const contractStopConditionsRaw = overlay.querySelector('#contract-stop-conditions')?.value?.trim() || '';
        const contractStopConditions = contractStopConditionsRaw ? contractStopConditionsRaw.split('\n').map(s => s.trim()).filter(Boolean) : [];

        const contract = {};
        if (contractGoal) contract.goal = contractGoal;
        if (contractConstraints) contract.constraints = contractConstraints;
        if (contractExpectedOutput) contract.expected_output = contractExpectedOutput;
        if (contractFailureConditions) contract.failure_conditions = contractFailureConditions;
        if (contractScopeBoundary) contract.scope_boundary = contractScopeBoundary;
        if (contractStopConditions.length) contract.stop_conditions = contractStopConditions;

        const endpoint = plainTerminal ? '/api/terminal/shell' : '/api/terminal';
        const body = plainTerminal
          ? { work_item_id: workItem.id, project_key: projectKey, title: workItem.title, epic_id: workItem.epic_id || null }
          : {
              work_item_id: workItem.id,
              project_key: projectKey,
              title: workItem.title,
              description: workItem.description || '',
              additional_instructions: instructions,
              permission_mode: permMode,
              skip_permissions: skipPerms,
              agentType,
              ...(Object.keys(contract).length ? { contract } : {}),
            };
        const resp = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const result = await resp.json();
        if (!resp.ok) throw new Error(result.error || 'Dispatch failed');

        let projectPath = '';
        if (projectKey === ARCHITECT_KEY) {
          projectPath = '(architect root)';
        } else {
          try {
            const registry = await api('registry');
            for (const [path, entry] of Object.entries(registry.entries)) {
              if (`${entry.org}/${entry.project}/${entry.component}` === projectKey) {
                projectPath = path;
                break;
              }
            }
          } catch {}
        }

        resolvedTerminal = {
          id: result.terminal_id,
          type: plainTerminal ? 'shell' : 'claude',
          agent_type: plainTerminal ? 'shell' : agentType,
          work_item_id: workItem.id,
          project_key: projectKey,
          project_path: projectPath,
          title: workItem.title,
          permission_mode: plainTerminal ? 'acceptEdits' : permMode,
          skip_permissions: skipPerms,
          status: 'running',
          started_at: new Date().toISOString(),
        };
        activeTerminals.push(resolvedTerminal);
        syncSessionState();
        createTerminalPanel(resolvedTerminal);
        placeSessionPanels();
        await initSession(resolvedTerminal);
      },
    });

    overlay.querySelector('#dispatch-claude-agent').onchange = () => {
      const agent = overlay.querySelector('#dispatch-claude-agent').checked;
      overlay.querySelector('#dispatch-perm-mode').disabled = !agent;
      overlay.querySelector('#dispatch-skip-perms').disabled = !agent;
    };

    const cancelBtn = overlay.querySelector('[data-modal-cancel]');
    const origCancelOnclick = cancelBtn.onclick;
    cancelBtn.onclick = () => { origCancelOnclick(); resolve(null); };

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) { close(); resolve(null); }
    }, { once: true });

    const submitBtn = overlay.querySelector('[data-modal-submit]');
    const origSubmitOnclick = submitBtn.onclick;
    submitBtn.onclick = async () => {
      await origSubmitOnclick();
      if (resolvedTerminal) resolve(resolvedTerminal);
    };
  });
}

function showToast(message, type, linkText, linkDispatchId) {
  let container = document.getElementById('toast-container');
  if (!container) {
    container = document.createElement('div');
    container.id = 'toast-container';
    container.className = 'toast-container';
    document.body.appendChild(container);
  }
  const toast = document.createElement('div');
  toast.className = `toast toast-${type === 'success' ? 'success' : 'error'}`;
  let inner = `<span>${esc(message)}</span>`;
  if (linkText && linkDispatchId) {
    inner += ` <a onclick="openFocusPopup('dispatch','${esc(linkDispatchId)}');this.closest('.toast').remove()">${esc(linkText)}</a>`;
  }
  inner += `<button class="toast-close" title="Dismiss">✕</button>`;
  toast.innerHTML = inner;
  toast.querySelector('.toast-close').onclick = () => toast.remove();
  container.appendChild(toast);
  setTimeout(() => { if (toast.parentElement) toast.remove(); }, 10000);
}

async function suspendSession(endpoint, btn, onSuccess) {
  btn.disabled = true;
  try {
    const resp = await fetch(endpoint, { method: 'POST' });
    if (resp.ok) {
      onSuccess();
    } else {
      btn.disabled = false;
      const body = await resp.json().catch(() => ({}));
      showToast(body.error || 'Suspend failed', 'error');
    }
  } catch {
    btn.disabled = false;
    showToast('Suspend failed — network error', 'error');
  }
}
