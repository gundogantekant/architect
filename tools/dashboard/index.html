async function loadItemArtifact(itemId, type) {
  const container = document.querySelector(`[data-artifact-for="${itemId}"]`);
  if (!container) return;
  container.innerHTML = '<p style="color:var(--muted);font-size:12px">Loading...</p>';
  try {
    const resp = await fetch(`/api/work-items/${itemId}/${type}`);
    const content = await resp.text();
    const label = type === 'plan' ? 'Plan' : 'Documentation';
    if (content.trim()) {
      container.innerHTML = `<div style="border:1px solid var(--border);border-radius:6px;max-height:300px;overflow:auto" class="md-container">${renderMd(content)}</div><button class="btn-add-wi" id="edit-wi-${type}-${itemId}" style="margin-top:4px;padding:4px 10px;font-size:11px">Edit ${label}</button>`;
    } else {
      container.innerHTML = `<p class="empty" style="font-size:12px">No ${label.toLowerCase()} yet.</p><button class="btn-add-wi" id="edit-wi-${type}-${itemId}" style="padding:4px 10px;font-size:11px">Create ${label}</button>`;
    }
    document.getElementById(`edit-wi-${type}-${itemId}`).onclick = () => showMdEditorModal(label, content, async (newContent) => {
      await fetch(`/api/work-items/${itemId}/${type}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: newContent }),
      });
      loadItemArtifact(itemId, type);
    });
  } catch {
    container.innerHTML = `<p class="empty" style="font-size:12px">Failed to load.</p>`;
  }
}

async function loadItemArtifacts(itemId) {
  const container = document.querySelector(`[data-artifact-for="${itemId}"]`);
  if (!container) return;
  container.innerHTML = '<p style="color:var(--muted);font-size:12px">Loading files...</p>';
  try {
    const data = await api(`work-items/${itemId}/artifacts`);
    const customFiles = (data.files || []).filter(f => f !== 'plan.md' && f !== 'docs.md' && f.endsWith('.md'));
    let html = '';
    if (customFiles.length) {
      html += `<div style="border:1px solid var(--border);border-radius:6px;padding:10px;font-size:12px;max-height:300px;overflow:auto">`;
      for (const file of customFiles) {
        html += `<div style="display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid #f0f0f0">`;
        html += `<code style="flex:1">${esc(file)}</code>`;
        html += `<button class="btn-add-wi" data-af-view="${esc(file)}" style="margin:0;padding:2px 8px;font-size:10px">View</button>`;
        html += `<button class="btn-add-wi" data-af-edit="${esc(file)}" style="margin:0;padding:2px 8px;font-size:10px">Edit</button>`;
        html += `<button class="delete-btn" data-af-del="${esc(file)}" style="padding:2px 8px;font-size:10px">Delete</button>`;
        html += `</div>`;
      }
      html += `</div>`;
    } else {
      html += `<p class="empty" style="font-size:12px">No custom artifacts.</p>`;
    }
    html += `<button class="btn-add-wi" data-af-add="1" style="margin-top:4px;padding:4px 10px;font-size:11px">+ Add File</button>`;
    html += `<div class="af-content-area" style="margin-top:8px"></div>`;
    container.innerHTML = html;

    const contentArea = container.querySelector('.af-content-area');

    container.querySelectorAll('[data-af-view]').forEach(btn => {
      btn.onclick = async () => {
        const fname = btn.dataset.afView;
        contentArea.innerHTML = '<p style="font-size:12px;color:var(--text-light)">Loading...</p>';
        try {
          const resp = await fetch(`/api/work-items/${itemId}/artifacts/${fname}`);
          if (!resp.ok) throw new Error('Not found');
          const content = await resp.text();
          contentArea.innerHTML = `<div style="border:1px solid var(--border);border-radius:6px;max-height:300px;overflow:auto" class="md-container">${renderMd(content)}</div>`;
        } catch {
          contentArea.innerHTML = '<p class="empty" style="font-size:12px">Failed to load.</p>';
        }
      };
    });

    container.querySelectorAll('[data-af-edit]').forEach(btn => {
      btn.onclick = async () => {
        const fname = btn.dataset.afEdit;
        let content = '';
        try {
          const resp = await fetch(`/api/work-items/${itemId}/artifacts/${fname}`);
          if (resp.ok) content = await resp.text();
        } catch {}
        showMdEditorModal(fname, content, async (newContent) => {
          await fetch(`/api/work-items/${itemId}/artifacts/${fname}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: newContent }),
          });
          loadItemArtifacts(itemId);
        });
      };
    });

    container.querySelectorAll('[data-af-del]').forEach(btn => {
      btn.onclick = async () => {
        const fname = btn.dataset.afDel;
        if (!confirm(`Delete artifact "${fname}"?`)) return;
        await fetch(`/api/work-items/${itemId}/artifacts/${fname}`, { method: 'DELETE' });
        loadItemArtifacts(itemId);
      };
    });

    container.querySelector('[data-af-add]').onclick = () => {
      const fname = prompt('Filename (must end with .md):', 'notes.md');
      if (!fname) return;
      if (!fname.endsWith('.md') || !/^[a-zA-Z0-9_-]+\.md$/.test(fname)) {
        alert('Filename must match [a-zA-Z0-9_-]+.md');
        return;
      }
      if (fname === 'plan.md' || fname === 'docs.md') {
        alert('Use the Plan/Docs buttons for those files.');
        return;
      }
      showMdEditorModal(fname, '', async (newContent) => {
        await fetch(`/api/work-items/${itemId}/artifacts/${fname}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: newContent }),
        });
        loadItemArtifacts(itemId);
      });
    };
  } catch {
    container.innerHTML = '<p class="empty" style="font-size:12px">Failed to load files.</p>';
  }
}

async function showEpicModal(existingEpic = null) {
  const isEdit = !!existingEpic;

  // Fetch registry for project multi-select
  let registryKeys = [];
  try {
    const registry = await api('registry');
    for (const [, entry] of Object.entries(registry.entries)) {
      registryKeys.push(`${entry.org}/${entry.project}/${entry.component}`);
    }
    registryKeys.sort();
  } catch {}

  const selectedKeys = isEdit && existingEpic.project_keys ? existingEpic.project_keys : [];

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>${isEdit ? `Edit ${esc(existingEpic.id)}` : 'New Epic'}</h3>
      <div class="field">
        <label>Title *</label>
        <input type="text" id="epic-title" value="${isEdit ? esc(existingEpic.title) : ''}" />
      </div>
      ${isEdit ? `<div class="field">
        <label>Status</label>
        <select id="epic-status">
          ${['draft','active','done','cancelled'].map(s => `<option value="${s}"${existingEpic.status === s ? ' selected' : ''}>${s}</option>`).join('')}
        </select>
      </div>` : ''}
      <div class="field">
        <label>Priority</label>
        <select id="epic-priority">
          ${['critical','high','medium','low'].map(p => `<option value="${p}"${(isEdit ? existingEpic.priority : 'medium') === p ? ' selected' : ''}>${p}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Projects</label>
        <select id="epic-projects" multiple style="min-height:80px">
          ${registryKeys.map(k => `<option value="${esc(k)}"${selectedKeys.includes(k) ? ' selected' : ''}>${esc(k)}</option>`).join('')}
        </select>
        <div style="font-size:11px;color:var(--text-light);margin-top:2px">Ctrl/Cmd+click to select multiple</div>
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="epic-description">${isEdit && existingEpic.description ? esc(existingEpic.description) : ''}</textarea>
      </div>
      <div class="field">
        <label>Acceptance Criteria (markdown)</label>
        <textarea id="epic-ac">${isEdit && existingEpic.acceptance_criteria ? esc(existingEpic.acceptance_criteria) : ''}</textarea>
      </div>
      <div class="field">
        <label>Target Date</label>
        <input type="text" id="epic-target" placeholder="YYYY-MM-DD" value="${isEdit && existingEpic.target_date ? esc(existingEpic.target_date) : ''}" />
      </div>
      <div class="field">
        <label>Tags (comma-separated)</label>
        <input type="text" id="epic-tags" value="${isEdit && existingEpic.tags ? esc(existingEpic.tags.join(', ')) : ''}" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="epic-cancel">Cancel</button>
        <button class="btn btn-dispatch" id="epic-save">${isEdit ? 'Save' : 'Create'}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#epic-cancel').onclick = () => overlay.remove();
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  overlay.querySelector('#epic-save').onclick = async () => {
    const title = overlay.querySelector('#epic-title').value.trim();
    if (!title) { alert('Title is required'); return; }
    const btn = overlay.querySelector('#epic-save');
    btn.disabled = true; btn.textContent = isEdit ? 'Saving...' : 'Creating...';

    const projectsEl = overlay.querySelector('#epic-projects');
    const project_keys = [...projectsEl.selectedOptions].map(o => o.value);

    const payload = {
      title,
      priority: overlay.querySelector('#epic-priority').value,
      description: overlay.querySelector('#epic-description').value.trim(),
      acceptance_criteria: overlay.querySelector('#epic-ac').value.trim(),
      target_date: overlay.querySelector('#epic-target').value.trim(),
      tags: overlay.querySelector('#epic-tags').value.split(',').map(t => t.trim()).filter(Boolean),
      project_keys,
    };
    if (isEdit) {
      const statusEl = overlay.querySelector('#epic-status');
      if (statusEl) payload.status = statusEl.value;
    }

    try {
      const url = isEdit ? `/api/epics/${existingEpic.id}` : '/api/epics';
      const method = isEdit ? 'PATCH' : 'POST';
      const resp = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const result = await resp.json();
      if (!resp.ok) throw new Error(result.error || 'Failed');
      overlay.remove();
      backlog = null; epicCache = null;
      await buildEpicTree();
      if (isEdit) location.hash = `#epic/${existingEpic.id}`;
      route();
    } catch (e) {
      btn.disabled = false; btn.textContent = isEdit ? 'Save' : 'Create';
      alert('Error: ' + e.message);
    }
  };
}

async function showLinkItemModal(epicId) {
  const bl = await api('backlog');
  const allItems = [];
  for (const [key, group] of Object.entries(bl.projects || {})) {
    for (const item of (group.items || [])) {
      if (!item.epic_id && (item.status === 'open' || item.status === 'in-progress')) {
        allItems.push({ ...item, project_key: key });
      }
    }
  }

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Link Items to ${esc(epicId)}</h3>
      <div class="field">
        <label>Search Items</label>
        <input type="text" id="link-search" placeholder="Filter by title or ID..." />
      </div>
      <div id="link-items-list" style="max-height:300px;overflow-y:auto"></div>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="link-cancel">Cancel</button>
        <button class="btn btn-dispatch" id="link-save">Link Selected</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const selected = new Set();
  function renderItems(filter) {
    const listEl = document.getElementById('link-items-list');
    const filtered = filter ? allItems.filter(i => i.id.toLowerCase().includes(filter) || i.title.toLowerCase().includes(filter)) : allItems;
    if (!filtered.length) { listEl.innerHTML = '<p class="empty">No unlinked items found.</p>'; return; }
    listEl.innerHTML = filtered.map(i => `
      <label style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f0f0f0;font-size:13px;cursor:pointer">
        <input type="checkbox" data-link-wid="${esc(i.id)}" ${selected.has(i.id) ? 'checked' : ''} />
        <code>${esc(i.id)}</code>
        <span style="flex:1">${esc(i.title)}</span>
        <span class="tag">${esc(i.project_key)}</span>
      </label>
    `).join('');
    listEl.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.onchange = () => {
        if (cb.checked) selected.add(cb.dataset.linkWid);
        else selected.delete(cb.dataset.linkWid);
      };
    });
  }
  renderItems('');
  overlay.querySelector('#link-search').oninput = (e) => renderItems(e.target.value.toLowerCase());
  overlay.querySelector('#link-cancel').onclick = () => overlay.remove();
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  overlay.querySelector('#link-save').onclick = async () => {
    if (!selected.size) { overlay.remove(); return; }
    const btn = overlay.querySelector('#link-save');
    btn.disabled = true; btn.textContent = 'Linking...';
    try {
      const resp = await fetch(`/api/epics/${epicId}/link`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ work_item_ids: [...selected] }),
      });
      if (!resp.ok) throw new Error('Link failed');
      overlay.remove();
      backlog = null; epicCache = null;
      await buildEpicTree();
      route();
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Link Selected';
      alert('Error: ' + e.message);
    }
  };
}

  `;

  overlay.querySelector('#ct-cancel').onclick = () => overlay.remove();

    if (!title) { alert('Title is required'); return; }

    let projectKey = overlay.querySelector('#ct-project').value;
    if (projectKey === '__new__') {
      projectKey = overlay.querySelector('#ct-new-pk').value.trim();
      if (!projectKey) { alert('Project key is required'); return; }
    }

    const btn = overlay.querySelector('#ct-save');
    btn.disabled = true; btn.textContent = 'Creating...';

    try {
      const resp = await fetch('/api/work-items', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          project_key: projectKey,
          title,
          priority: overlay.querySelector('#ct-priority').value,
          description: overlay.querySelector('#ct-description').value.trim(),
          tags: overlay.querySelector('#ct-tags').value.split(',').map(t => t.trim()).filter(Boolean),
        }),
      });
      const item = await resp.json();
      if (!resp.ok) throw new Error(item.error || 'Create failed');

      const linkResp = await fetch(`/api/epics/${epicId}/link`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ work_item_ids: [item.id] }),
      });
      if (!linkResp.ok) throw new Error('Link failed');

      overlay.remove();
      backlog = null; epicCache = null;
      await buildEpicTree();
      route();
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Create & Link';
      alert('Error: ' + e.message);
    }
  };
}

async function showEpicDispatchModal(epicId) {
  const epic = await api(`epics/${epicId}`);
  const items = epic.resolved_items || [];
  const openItems = items.filter(i => i.status === 'open' || i.status === 'in-progress');
  let projectKeys = epic.project_keys || [];
  const p = epic.progress || { done: 0, total: 0 };

  // If no project keys, fetch registry as fallback
  let registryKeys = [];
  if (!projectKeys.length) {
    try {
      const registry = await api('registry');
      for (const [, entry] of Object.entries(registry.entries)) {
        registryKeys.push(`${entry.org}/${entry.project}/${entry.component}`);
      }
      registryKeys.sort();
    } catch {}
    projectKeys = registryKeys;
  }

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Dispatch from ${esc(epic.id)}</h3>
      <div style="margin-bottom:14px">
        <strong>${esc(epic.title)}</strong>
        <div style="font-size:12px;color:var(--text-light);margin-top:4px">Progress: ${p.done}/${p.total}</div>
      </div>
      <div class="field">
        <label>Mode</label>
        <select id="epic-dispatch-mode">
          <option value="general">Work on epic (general)</option>
          ${openItems.map(i => `<option value="${esc(i.id)}">${esc(i.id)}: ${esc(i.title)}</option>`).join('')}
        </select>
      </div>
      <div class="field" id="epic-dispatch-project-field">
        <label>Target Project</label>
        <select id="epic-dispatch-project">
          ${projectKeys.map(k => `<option value="${esc(k)}">${esc(k)}</option>`).join('')}
        </select>
        ${registryKeys.length ? '<div style="font-size:11px;color:var(--text-light);margin-top:2px">No linked projects — showing all registry projects</div>' : ''}
      </div>
      <div class="field">
        <label>Additional Instructions</label>
        <textarea id="epic-dispatch-instructions" placeholder="Optional context..."></textarea>
      </div>
      <div class="interactive-toggle">
        <input type="checkbox" id="epic-dispatch-skip-permissions" />
        <label for="epic-dispatch-skip-permissions">Skip permissions (autonomous)</label>
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="epic-dispatch-cancel">Cancel</button>
        <button class="btn btn-dispatch" id="epic-dispatch-go">Dispatch</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const modeSelect = overlay.querySelector('#epic-dispatch-mode');
  const projectField = overlay.querySelector('#epic-dispatch-project-field');
  const projectSelect = overlay.querySelector('#epic-dispatch-project');

  modeSelect.onchange = () => {
    if (modeSelect.value !== 'general') {
      const item = openItems.find(i => i.id === modeSelect.value);
      if (item) {
        projectSelect.value = item.project_key;
      }
    }
  };

  overlay.querySelector('#epic-dispatch-cancel').onclick = () => overlay.remove();
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  overlay.querySelector('#epic-dispatch-go').onclick = async () => {
    const mode = modeSelect.value;
    const instructions = overlay.querySelector('#epic-dispatch-instructions').value.trim();
    const skipPermissions = overlay.querySelector('#epic-dispatch-skip-permissions').checked;
    const btn = overlay.querySelector('#epic-dispatch-go');
    btn.disabled = true; btn.textContent = 'Dispatching...';

    let pk, wid;
    if (mode === 'general') {
      pk = projectSelect.value || projectKeys[0];
      wid = null;
    } else {
      wid = mode;
      const item = openItems.find(i => i.id === wid);
      pk = item ? item.project_key : (projectSelect.value || projectKeys[0]);
    }

    if (!pk) {
      alert('No project key available for dispatch. Onboard a project first.');
      btn.disabled = false; btn.textContent = 'Dispatch';
      return;
    }

    try {
      const resp = await fetch('/api/dispatch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          work_item_id: wid,
          epic_id: epicId,
          project_key: pk,
          title: wid ? `${wid} (${epic.title})` : epic.title,
          additional_instructions: instructions,
          skip_permissions: skipPermissions,
        }),
      });
      const result = await resp.json();
      if (!resp.ok) throw new Error(result.error || 'Dispatch failed');

      let projectPath = '';
      try {
        const registry = await api('registry');
        for (const [path, entry] of Object.entries(registry.entries)) {
          if (`${entry.org}/${entry.project}/${entry.component}` === pk) { projectPath = path; break; }
        }
      } catch {}

      const dispatch = {
        id: result.dispatch_id,
        work_item_id: wid,
        project_key: pk,
        project_path: projectPath,
        title: wid ? `${wid} (${epic.title})` : epic.title,
        status: 'running',
        started_at: new Date().toISOString(),
      };
      activeDispatches.push(dispatch);
      updateDispatchBadge();
      createDispatchPanel(dispatch);
      placeSessionPanels();
      connectDispatchStream(dispatch);
      overlay.remove();
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Dispatch';
      alert('Dispatch failed: ' + e.message);
    }
  };
}

// --- Sessions Sidebar ---
function buildSessionsSidebar() {
  const container = document.getElementById('sessions-sidebar');
  if (!container) return;
  // Label
  const label = document.createElement('div');
  label.className = 'sidebar-section-label';
  label.textContent = 'SESSIONS';
  container.appendChild(label);
  const list = document.createElement('div');
  list.id = 'sessions-list';
  container.appendChild(list);
  const divider = document.createElement('hr');
  divider.className = 'sidebar-divider';
  container.appendChild(divider);
}

function formatElapsed(startedAt) {
  const ms = Date.now() - new Date(startedAt).getTime();
  const s = Math.floor(ms / 1000);
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m ${s % 60}s`;
  const h = Math.floor(m / 60);
  return `${h}h ${m % 60}m`;
}

function scrollToSessionPanel(session) {
  const panel = sessionPanels.get(`${session.type}:${session.id}`);
  if (panel && panel.isConnected) {
    panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (panel.classList.contains('collapsed')) {
      const btn = panel.querySelector('.minimize-btn');
      if (btn) togglePanelCollapse(`${session.type}:${session.id}`, panel, btn);
    }
  }
}

function navigateToSession(session) {
  if (session.work_item_id && session.project_key) {
    const [org, proj, comp] = session.project_key.split('/');
    if (org && proj && comp) {
      location.hash = `#component/${org}/${proj}/${comp}`;
      setTimeout(() => scrollToSessionPanel(session), 300);
      return;
    }
  }
  if (session.epic_id) {
    location.hash = `#epic/${session.epic_id}`;
    setTimeout(() => scrollToSessionPanel(session), 300);
    return;
  }
  if (session.project_key) {
    const [org, proj, comp] = session.project_key.split('/');
    if (org && proj && comp) {
      location.hash = `#component/${org}/${proj}/${comp}`;
      setTimeout(() => scrollToSessionPanel(session), 300);
      return;
    }
  }
  openFocusPopup(session.type, session.id);
}

function refreshSessionsSidebar() {
  const list = document.getElementById('sessions-list');
  if (!list) return;
  list.innerHTML = '';
  const allSessions = [
    ...activeDispatches.map(d => ({ type: 'dispatch', id: d.id, status: d.status, label: d.work_item_id || d.title || d.id, started_at: d.started_at, epic_id: d.epic_id, work_item_id: d.work_item_id, project_key: d.project_key })),
    ...activeTerminals.map(t => ({ type: 'terminal', id: t.id, status: t.status, label: t.title || t.id, started_at: t.started_at, epic_id: t.epic_id, work_item_id: t.work_item_id, project_key: t.project_key })),
  ];
  if (!allSessions.length) return;

  // Group by project_key, then by epic_id within each project
  const projectGroups = new Map(); // project_key → { epics: Map<epic_id, sessions[]>, noEpic: sessions[] }
  const standalone = [];
  for (const s of allSessions) {
    if (s.project_key) {
      if (!projectGroups.has(s.project_key)) projectGroups.set(s.project_key, { epics: new Map(), noEpic: [] });
      const pg = projectGroups.get(s.project_key);
      if (s.epic_id) {
        if (!pg.epics.has(s.epic_id)) pg.epics.set(s.epic_id, []);
        pg.epics.get(s.epic_id).push(s);
      } else {
        pg.noEpic.push(s);
      }
    } else {
      standalone.push(s);
    }
  }

  function renderEntry(s, indented) {
    const entry = document.createElement('div');
    entry.className = 'session-entry' + (indented ? ' indented' : '');
    const dotClass = s.status === 'running' ? 'running' : (s.status === 'completed' ? 'completed' : (s.status === 'interrupted' ? 'interrupted' : 'failed'));
    const elapsed = formatElapsed(s.started_at);
    entry.innerHTML = `<span class="status-dot ${dotClass}" style="width:8px;height:8px"></span><span class="session-label">${esc(s.label)}</span><span class="session-meta">${elapsed}</span>`;
    entry.onclick = () => navigateToSession(s);
    return entry;
  }

  // Render project > epic > session hierarchy
  for (const [pk, pg] of projectGroups) {
    // Show project label (drop org prefix for brevity)
    const parts = pk.split('/');
    const shortLabel = parts.length >= 3 ? `${parts[1]}/${parts[2]}` : pk;
    const projLabel = document.createElement('div');
    projLabel.className = 'sidebar-project-label';
    projLabel.textContent = shortLabel;
    projLabel.onclick = () => {
      const [org, proj, comp] = pk.split('/');
      if (org && proj && comp) location.hash = `#component/${org}/${proj}/${comp}`;
    };
    list.appendChild(projLabel);

    // Epic sub-groups
    for (const [epicId, sessions] of pg.epics) {
      const epicLabel = document.createElement('div');
      epicLabel.className = 'sidebar-epic-sublabel';
      epicLabel.textContent = epicId;
      epicLabel.onclick = () => { location.hash = `#epic/${epicId}`; };
      list.appendChild(epicLabel);
      for (const s of sessions) list.appendChild(renderEntry(s, true));
    }

    // No-epic sessions
    for (const s of pg.noEpic) list.appendChild(renderEntry(s, false));
  }

  // Render standalone
  if (standalone.length && projectGroups.size > 0) {
    const label = document.createElement('div');
    label.className = 'sidebar-group-label';
    label.textContent = 'STANDALONE';
    list.appendChild(label);
  }
  for (const s of standalone) list.appendChild(renderEntry(s, false));
}

let sessionsSidebarInterval = null;
function startSessionsSidebarRefresh() {
  buildSessionsSidebar();
  refreshSessionsSidebar();
  if (sessionsSidebarInterval) clearInterval(sessionsSidebarInterval);
  sessionsSidebarInterval = setInterval(refreshSessionsSidebar, 3000);
}

// --- Focus Popup ---
let activeFocusPopup = null;

function openFocusPopup(type, id) {
  closeFocusPopup();

  const overlay = document.createElement('div');
  overlay.className = 'focus-overlay';

  const popup = document.createElement('div');
  popup.className = 'focus-popup' + (type === 'terminal' ? ' terminal-focus' : '');

  let sourceEl, parentEl, title, status, startedAt, sessionId, dispatch, terminalInfo;

  if (type === 'dispatch') {
    dispatch = activeDispatches.find(d => d.id === id);
    if (!dispatch) return;
    sourceEl = document.getElementById(`log-${id}`);
    parentEl = sourceEl?.parentElement;
    title = dispatch.work_item_id ? `${dispatch.work_item_id} — ${dispatch.title || ''}` : (dispatch.title || dispatch.id);
    status = dispatch.status;
    startedAt = dispatch.started_at;
    sessionId = dispatch.session_id;
  } else {
    terminalInfo = activeTerminals.find(t => t.id === id);
    if (!terminalInfo) return;
    sourceEl = document.getElementById(`term-container-${id}`);
    parentEl = sourceEl?.parentElement;
    title = terminalInfo.title || terminalInfo.id;
    status = terminalInfo.status;
    startedAt = terminalInfo.started_at;
  }

  if (!sourceEl) return;

  // Header
  const header = document.createElement('div');
  header.className = 'focus-popup-header';
  const dotClass = status === 'running' ? 'running' : (status === 'completed' ? 'completed' : 'failed');
  let metaHtml = formatElapsed(startedAt);
  if (type === 'dispatch' && sessionId) metaHtml += ` | ${sessionId}`;
  header.innerHTML = `<span class="status-dot ${dotClass}"></span><span class="focus-title">${esc(title)}</span><span class="focus-meta">${metaHtml}</span>`;

  // Body — relocate DOM element
  const body = document.createElement('div');
  body.className = 'focus-popup-body';
  sourceEl.remove();
  body.appendChild(sourceEl);

  // For terminals, fit to new size
  if (type === 'terminal' && terminalInfo?._fitAddon) {
    requestAnimationFrame(() => { terminalInfo._fitAddon.fit(); if (terminalInfo._term) terminalInfo._term.scrollToBottom(); });
  }

  // Footer
  const footer = document.createElement('div');
  footer.className = 'focus-popup-footer';

  const closeBtn = document.createElement('button');
  closeBtn.className = 'btn btn-close';
  closeBtn.textContent = 'Close';
  closeBtn.onclick = () => closeFocusPopup();
  footer.appendChild(closeBtn);

  const isRunning = status === 'running';
  const killBtn = document.createElement('button');
  killBtn.className = 'btn btn-kill';
  killBtn.textContent = 'Kill';
  killBtn.disabled = !isRunning;
  killBtn.onclick = async () => {
    killBtn.disabled = true;
    const endpoint = type === 'dispatch' ? `/api/dispatch/${id}` : `/api/terminal/${id}`;
    try {
      await fetch(endpoint, { method: 'DELETE' });
      if (dispatch) dispatch.status = 'killed';
      if (terminalInfo) terminalInfo.status = 'killed';
      const dot = header.querySelector('.status-dot');
      dot.classList.remove('running');
      dot.classList.add('failed');
      // Also update inline panel dot
      const inlineDot = document.querySelector(`#${type === 'dispatch' ? 'dispatch' : 'terminal'}-${id} .status-dot`);
      if (inlineDot) { inlineDot.classList.remove('running'); inlineDot.classList.add('failed'); }
      const inlineKill = document.querySelector(`[data-kill-${type === 'dispatch' ? 'dispatch' : 'terminal'}="${id}"]`);
      if (inlineKill) inlineKill.disabled = true;
      updateDispatchBadge();
      refreshSessionsSidebar();
    } catch {}
  };
  footer.appendChild(killBtn);

  if (type === 'dispatch' && dispatch) {
    const copyBtn = document.createElement('button');
    copyBtn.className = 'btn btn-copy';
    copyBtn.textContent = 'Copy Resume';
    copyBtn.onclick = () => {
      const cmd = dispatch.session_id
        ? `cd ${dispatch.project_path} && claude --resume ${dispatch.session_id}`
        : `cd ${dispatch.project_path} && claude "${dispatch.title || ''}"`;
      navigator.clipboard.writeText(cmd).then(() => {
        copyBtn.textContent = 'Copied!';
        setTimeout(() => { copyBtn.textContent = 'Copy Resume'; }, 1500);
      });
    };
    footer.appendChild(copyBtn);
  }

  popup.appendChild(header);
  popup.appendChild(body);
  popup.appendChild(footer);
  overlay.appendChild(popup);
  document.body.appendChild(overlay);

  activeFocusPopup = { overlay, popup, type, id, sourceEl, parentEl };

  // Close handlers
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeFocusPopup(); });
  const escHandler = (e) => { if (e.key === 'Escape') closeFocusPopup(); };
  document.addEventListener('keydown', escHandler);
  activeFocusPopup.escHandler = escHandler;

  // Update header periodically
  const headerInterval = setInterval(() => {
    if (!activeFocusPopup || activeFocusPopup.id !== id) { clearInterval(headerInterval); return; }
    const metaEl = header.querySelector('.focus-meta');
    if (metaEl) {
      let meta = formatElapsed(startedAt);
      if (type === 'dispatch' && dispatch?.session_id) meta += ` | ${dispatch.session_id}`;
      metaEl.textContent = meta;
    }
    // Update status dot in popup
    const currentStatus = type === 'dispatch' ? dispatch?.status : terminalInfo?.status;
    if (currentStatus && currentStatus !== 'running') {
      const dot = header.querySelector('.status-dot');
      dot.classList.remove('running');
      dot.classList.add(currentStatus === 'completed' ? 'completed' : 'failed');
      killBtn.disabled = true;
    }
  }, 1000);
  activeFocusPopup.headerInterval = headerInterval;
}

function closeFocusPopup() {
  if (!activeFocusPopup) return;
  const { overlay, type, id, sourceEl, parentEl, escHandler, headerInterval } = activeFocusPopup;

  // Move DOM element back to inline panel
  if (sourceEl && parentEl && parentEl.isConnected) {
    sourceEl.remove();
    parentEl.appendChild(sourceEl);
  }

  if (escHandler) document.removeEventListener('keydown', escHandler);
  if (headerInterval) clearInterval(headerInterval);
  overlay.remove();
  activeFocusPopup = null;

  // Re-place panels to ensure correct slot after route changes while popup was open
  placeSessionPanels();
}

// --- Agents View ---
let agentsTileInterval = null;
let agentsFullRefreshInterval = null;

function renderAgentTile(agent) {
  const dotClass = agent.status === 'running' ? 'running' : (agent.status === 'completed' ? 'completed' : 'failed');
  const elapsed = formatElapsed(agent.started_at);
  const title = agent.work_item_id ? `${agent.work_item_id} — ${agent.title || ''}` : (agent.title || agent.id);
  const preview = (agent.last_output || []).slice(-3).join('\n') || '(no output yet)';
  const typeLabel = agent.type === 'terminal' ? 'interactive' : 'non-interactive';
  const typeBadgeClass = agent.type === 'terminal' ? 'badge-agent' : 'badge-open';

  let badges = '';
  if (agent.project_key) badges += `<span class="tag">${esc(agent.project_key)}</span>`;
  if (agent.work_item_id) badges += `<span class="badge badge-open">${esc(agent.work_item_id)}</span>`;
  if (agent.epic_id) badges += `<span class="badge badge-epic">${esc(agent.epic_id)}</span>`;
  badges += `<span class="badge ${typeBadgeClass}">${typeLabel}</span>`;

  return `<div class="agent-tile" data-agent-type="${esc(agent.type)}" data-agent-id="${esc(agent.id)}">
    <div class="agent-tile-header">
      <span class="status-dot ${dotClass}"></span>
      <span class="agent-tile-title">${esc(title)}</span>
      <span class="agent-tile-elapsed" data-started="${agent.started_at}">${elapsed}</span>
    </div>
    <div class="agent-tile-badges">${badges}</div>
    <div class="agent-tile-preview">${esc(preview)}</div>
    <div class="agent-tile-footer">
      <button class="kill-btn" data-tile-kill="${esc(agent.type)}:${esc(agent.id)}" ${agent.status !== 'running' ? 'disabled' : ''}>Kill</button>
      <button class="focus-btn" data-tile-focus="${esc(agent.type)}:${esc(agent.id)}">Focus</button>
    </div>
  </div>`;
}

async function fetchAgentsList() {
  const [dispatches, terminals] = await Promise.all([
    api('dispatch/active').catch(() => []),
    api('terminal/active').catch(() => []),
  ]);
  const agents = [];
  for (const d of dispatches) {
    agents.push({ type: 'dispatch', id: d.id, status: d.status, title: d.work_item_id || d.id, work_item_id: d.work_item_id, project_key: d.project_key, epic_id: d.epic_id, started_at: d.started_at, last_output: d.last_output || [], session_id: d.session_id, cost_usd: d.cost_usd });
  }
  for (const t of terminals) {
    agents.push({ type: 'terminal', id: t.id, status: t.status, title: t.title || t.id, work_item_id: t.work_item_id, project_key: t.project_key, epic_id: t.epic_id, started_at: t.started_at, last_output: t.last_output || [] });
  }
  // Sort: running first, then by started_at desc
  agents.sort((a, b) => {
    if (a.status === 'running' && b.status !== 'running') return -1;
    if (b.status === 'running' && a.status !== 'running') return 1;
    return new Date(b.started_at) - new Date(a.started_at);
  });
  return agents;
}

function renderAgentsView(agents, filters = {}) {
  const statusFilter = filters.status || 'all';
  const epicFilter = filters.epic || '';
  const projectFilter = filters.project || '';

  let filtered = agents;
  if (statusFilter === 'active') filtered = filtered.filter(a => a.status === 'running');
  else if (statusFilter === 'recent') filtered = filtered.filter(a => a.status !== 'running');
  if (epicFilter) filtered = filtered.filter(a => a.epic_id === epicFilter);
  if (projectFilter) filtered = filtered.filter(a => a.project_key === projectFilter);

  // Collect unique epics/projects for dropdowns
  const allEpics = [...new Set(agents.map(a => a.epic_id).filter(Boolean))].sort();
  const allProjects = [...new Set(agents.map(a => a.project_key).filter(Boolean))].sort();

  let html = `<div class="card"><h2>Agents</h2>`;
  html += `<div class="agents-filter-bar">`;
  html += `<span class="filter-tab${statusFilter === 'all' ? ' active' : ''}" data-agents-status="all">All (${agents.length})</span>`;
  html += `<span class="filter-tab${statusFilter === 'active' ? ' active' : ''}" data-agents-status="active">Running (${agents.filter(a => a.status === 'running').length})</span>`;
  html += `<span class="filter-tab${statusFilter === 'recent' ? ' active' : ''}" data-agents-status="recent">Completed</span>`;
  if (allEpics.length) {
    html += `<select id="agents-epic-filter"><option value="">All Epics</option>`;
    for (const e of allEpics) html += `<option value="${esc(e)}"${epicFilter === e ? ' selected' : ''}>${esc(e)}</option>`;
    html += `</select>`;
  }
  if (allProjects.length) {
    html += `<select id="agents-project-filter"><option value="">All Projects</option>`;
    for (const p of allProjects) html += `<option value="${esc(p)}"${projectFilter === p ? ' selected' : ''}>${esc(p)}</option>`;
    html += `</select>`;
  }
  html += `<button class="btn-add-wi" id="agents-quick-dispatch">+ Dispatch</button>`;
  html += `</div>`;

  if (filtered.length) {
    // Build hierarchy: project → epic → task → agents
    const hierarchy = buildAgentHierarchy(filtered);

    // Render project groups
    for (const [pk, projData] of hierarchy.projects) {
      html += `<details class="agent-group" open><summary>${esc(pk)}</summary>`;
      // Epics within project
      for (const [eid, epicTasks] of projData.epics) {
        html += `<details class="agent-subgroup" open><summary>${esc(eid)}</summary><div class="agents-grid">`;
        for (const [, taskAgents] of epicTasks) {
          for (const agent of taskAgents) html += renderAgentTile(agent);
        }
        html += `</div></details>`;
      }
      // No-epic agents within project
      if (projData.noEpic.size) {
        html += `<div class="agents-grid" style="margin-left:16px">`;
        for (const [, taskAgents] of projData.noEpic) {
          for (const agent of taskAgents) html += renderAgentTile(agent);
        }
        html += `</div>`;
      }
      html += `</details>`;
    }

    // Standalone agents (no project_key)
    if (hierarchy.standalone.length) {
      html += `<details class="agent-group" open><summary>Standalone</summary><div class="agents-grid">`;
      for (const agent of hierarchy.standalone) html += renderAgentTile(agent);
      html += `</div></details>`;
    }
  } else {
    html += `<p class="empty">No agents match the current filters.</p>`;
  }
  html += `</div>`;
  return html;
}

function buildAgentHierarchy(agents) {
  const projects = new Map(); // pk → { epics: Map<eid, Map<wi, agents[]>>, noEpic: Map<wi, agents[]> }
  const standalone = [];

  for (const agent of agents) {
    if (!agent.project_key) {
      standalone.push(agent);
      continue;
    }
    if (!projects.has(agent.project_key)) {
      projects.set(agent.project_key, { epics: new Map(), noEpic: new Map() });
    }
    const proj = projects.get(agent.project_key);
    const taskKey = agent.work_item_id || '_none';

    if (agent.epic_id) {
      if (!proj.epics.has(agent.epic_id)) proj.epics.set(agent.epic_id, new Map());
      const epicMap = proj.epics.get(agent.epic_id);
      if (!epicMap.has(taskKey)) epicMap.set(taskKey, []);
      epicMap.get(taskKey).push(agent);
    } else {
      if (!proj.noEpic.has(taskKey)) proj.noEpic.set(taskKey, []);
      proj.noEpic.get(taskKey).push(agent);
    }
  }

  return { projects, standalone };
}

function bindAgentsEvents(agents, filters) {
  // Tile click → focus
  document.querySelectorAll('.agent-tile').forEach(tile => {
    tile.onclick = (e) => {
      if (e.target.closest('button')) return;
      const type = tile.dataset.agentType;
      const id = tile.dataset.agentId;
      openFocusPopup(type, id);
    };
  });

  // Focus buttons
  document.querySelectorAll('[data-tile-focus]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const [type, id] = btn.dataset.tileFocus.split(':');
      openFocusPopup(type, id);
    };
  });

  // Kill buttons
  document.querySelectorAll('[data-tile-kill]').forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      const [type, id] = btn.dataset.tileKill.split(':');
      btn.disabled = true;
      const endpoint = type === 'terminal' ? `/api/terminal/${id}` : `/api/dispatch/${id}`;
      try {
        await fetch(endpoint, { method: 'DELETE' });
        const agent = agents.find(a => a.id === id);
        if (agent) agent.status = 'killed';
        // Update local state
        const d = activeDispatches.find(a => a.id === id);
        if (d) d.status = 'killed';
        const t = activeTerminals.find(a => a.id === id);
        if (t) t.status = 'killed';
        updateDispatchBadge();
        // Update tile visually
        const tile = btn.closest('.agent-tile');
        const dot = tile.querySelector('.status-dot');
        dot.classList.remove('running');
        dot.classList.add('failed');
      } catch {}
    };
  });

  // Status filter tabs
  document.querySelectorAll('[data-agents-status]').forEach(tab => {
    tab.onclick = () => {
      const status = tab.dataset.agentsStatus;
      const hash = buildAgentsHash({ ...filters, status });
      location.hash = hash;
    };
  });

  // Epic filter
  const epicSelect = document.getElementById('agents-epic-filter');
  if (epicSelect) {
    epicSelect.onchange = () => {
      const hash = buildAgentsHash({ ...filters, epic: epicSelect.value });
      location.hash = hash;
    };
  }

  // Project filter
  const projSelect = document.getElementById('agents-project-filter');
  if (projSelect) {
    projSelect.onchange = () => {
      const hash = buildAgentsHash({ ...filters, project: projSelect.value });
      location.hash = hash;
    };
  }

  // Quick dispatch button
  const quickDispatchBtn = document.getElementById('agents-quick-dispatch');
  if (quickDispatchBtn) quickDispatchBtn.onclick = () => showQuickDispatchModal();
}

function buildAgentsHash(filters) {
  let hash = '#agents';
  const params = [];
  if (filters.status && filters.status !== 'all') params.push(`status=${filters.status}`);
  if (filters.epic) params.push(`epic=${filters.epic}`);
  if (filters.project) params.push(`project=${filters.project}`);
  if (params.length) hash += '?' + params.join('&');
  return hash;
}

function parseAgentsFilters(hash) {
  const filters = { status: 'all', epic: '', project: '' };
  const qIdx = hash.indexOf('?');
  if (qIdx === -1) return filters;
  const params = new URLSearchParams(hash.slice(qIdx + 1));
  if (params.get('status')) filters.status = params.get('status');
  if (params.get('epic')) filters.epic = params.get('epic');
  if (params.get('project')) filters.project = params.get('project');
  return filters;
}

function startAgentsTileRefresh(agents, filters) {
  stopAgentsTileRefresh();
  // Update elapsed times every 3s
  agentsTileInterval = setInterval(() => {
    document.querySelectorAll('.agent-tile-elapsed[data-started]').forEach(el => {
      el.textContent = formatElapsed(el.dataset.started);
    });
  }, 3000);
  // Full refresh every 15s
  agentsFullRefreshInterval = setInterval(async () => {
    if (!location.hash.startsWith('#agents')) { stopAgentsTileRefresh(); return; }
    const freshAgents = await fetchAgentsList();
    const main = $('#main');
    main.innerHTML = renderAgentsView(freshAgents, filters);
    bindAgentsEvents(freshAgents, filters);
    placeSessionPanels();
  }, 15000);
}

function stopAgentsTileRefresh() {
  if (agentsTileInterval) { clearInterval(agentsTileInterval); agentsTileInterval = null; }
  if (agentsFullRefreshInterval) { clearInterval(agentsFullRefreshInterval); agentsFullRefreshInterval = null; }
}

async function showQuickDispatchModal() {
  let registryKeys = [];
  try {
    const registry = await api('registry');
    for (const [, entry] of Object.entries(registry.entries)) {
      registryKeys.push(`${entry.org}/${entry.project}/${entry.component}`);
    }
    registryKeys.sort();
  } catch {}

  let epicsList = [];
  try { epicsList = await getEpics(); } catch {}

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Quick Dispatch</h3>
      <div class="field">
        <label>Target Project *</label>
        <select id="qd-project">
          ${registryKeys.map(k => `<option value="${esc(k)}">${esc(k)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Work Item ID (optional)</label>
        <input type="text" id="qd-work-item" placeholder="W-XXX" />
      </div>
      <div class="field">
        <label>Epic (optional)</label>
        <select id="qd-epic">
          <option value="">None</option>
          ${epicsList.map(e => `<option value="${esc(e.id)}">${esc(e.id)}: ${esc(e.title)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Instructions</label>
        <textarea id="qd-instructions" placeholder="What should the agent do?"></textarea>
      </div>
      <div class="interactive-toggle">
        <input type="checkbox" id="qd-claude-agent" checked />
        <label for="qd-claude-agent">Claude Agent</label>
      </div>
      <div class="interactive-toggle">
        <input type="checkbox" id="qd-interactive" checked />
        <label for="qd-interactive">Interactive terminal (xterm.js)</label>
      </div>
      <div class="interactive-toggle">
        <input type="checkbox" id="qd-skip-permissions" checked />
        <label for="qd-skip-permissions">Skip permissions (autonomous)</label>
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="qd-cancel">Cancel</button>
        <button class="btn btn-dispatch" id="qd-go">Dispatch</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.querySelector('#qd-cancel').onclick = () => overlay.remove();
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  overlay.querySelector('#qd-claude-agent').onchange = () => {
    const agent = overlay.querySelector('#qd-claude-agent').checked;
    overlay.querySelector('#qd-interactive').disabled = !agent;
    overlay.querySelector('#qd-skip-permissions').disabled = !agent;
  };

  overlay.querySelector('#qd-go').onclick = async () => {
    const pk = overlay.querySelector('#qd-project').value;
    const wid = overlay.querySelector('#qd-work-item').value.trim() || null;
    const epicId = overlay.querySelector('#qd-epic').value || null;
    const instructions = overlay.querySelector('#qd-instructions').value.trim();
    const plainTerminal = !overlay.querySelector('#qd-claude-agent').checked;
    const interactive = overlay.querySelector('#qd-interactive').checked;
    const skipPermissions = overlay.querySelector('#qd-skip-permissions').checked;
    const btn = overlay.querySelector('#qd-go');

    if (!pk) { alert('Project is required'); return; }
    if (!plainTerminal && !wid && !instructions) { alert('Work item or instructions required'); return; }

    btn.disabled = true; btn.textContent = 'Dispatching...';

    try {
      const endpoint = plainTerminal ? '/api/terminal/shell' : interactive ? '/api/terminal' : '/api/dispatch';
      const titleText = wid || instructions?.slice(0, 60) || 'Quick dispatch';
      const body = plainTerminal
        ? { work_item_id: wid, epic_id: epicId, project_key: pk, title: titleText }
        : {
            work_item_id: wid,
            epic_id: epicId,
            project_key: pk,
            title: titleText,
            additional_instructions: instructions,
            skip_permissions: skipPermissions,
          };
      const resp = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const result = await resp.json();
      if (!resp.ok) throw new Error(result.error || 'Dispatch failed');

      let projectPath = '';
      try {
        const registry = await api('registry');
        for (const [path, entry] of Object.entries(registry.entries)) {
          if (`${entry.org}/${entry.project}/${entry.component}` === pk) { projectPath = path; break; }
        }
      } catch {}

      if (plainTerminal || interactive) {
        const terminalInfo = {
          id: result.terminal_id, type: plainTerminal ? 'shell' : 'claude',
          work_item_id: wid, epic_id: epicId,
          project_key: pk, project_path: projectPath,
          title: titleText,
          skip_permissions: plainTerminal ? false : skipPermissions,
          status: 'running', started_at: new Date().toISOString(),
        };
        activeTerminals.push(terminalInfo);
        updateDispatchBadge();
        createTerminalPanel(terminalInfo);
        placeSessionPanels();
        await connectTerminalWs(terminalInfo);
      } else {
        const dispatch = {
          id: result.dispatch_id, work_item_id: wid, epic_id: epicId,
          project_key: pk, project_path: projectPath,
          title: wid || instructions?.slice(0, 60) || 'Quick dispatch',
          skip_permissions: skipPermissions,
          status: 'running', started_at: new Date().toISOString(),
        };
        activeDispatches.push(dispatch);
        updateDispatchBadge();
        createDispatchPanel(dispatch);
        placeSessionPanels();
        connectDispatchStream(dispatch);
      }
      overlay.remove();
      // Refresh agents view if on that page
      if (location.hash.startsWith('#agents')) route();
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Dispatch';
      alert('Dispatch failed: ' + e.message);
    }
  };
}

// --- Router ---
async function route() {
  const hash = location.hash.slice(1);
  const main = $('#main');

  // Close any focus popup before navigation
  closeFocusPopup();
  stopAgentsTileRefresh();

  if (!hash) {
    main.innerHTML = `<div class="card"><h2>Portfolio Dashboard</h2><p style="color:var(--text-light);font-size:14px">Select an organization or project from the sidebar.</p></div>`;
    setActive('');
    placeSessionPanels();
    return;
  }

  const parts = hash.split('/');

  if (parts[0] === 'epics') {
    try {
      const epics = await getEpics();
      main.innerHTML = renderEpicListView(epics);
      bindEpicListEvents();
    } catch (e) {
      main.innerHTML = `<div class="card"><p style="color:var(--red)">Error: ${esc(String(e))}</p></div>`;
    }
    setActive('');
    document.querySelectorAll('.epic-item').forEach(el => el.classList.remove('active'));
    placeSessionPanels();
    return;
  }

  if (parts[0] === 'agents' || hash.startsWith('agents?')) {
    try {
      const filters = parseAgentsFilters(hash);
      const agents = await fetchAgentsList();
      main.innerHTML = renderAgentsView(agents, filters);
      bindAgentsEvents(agents, filters);
      startAgentsTileRefresh(agents, filters);
    } catch (e) {
      main.innerHTML = `<div class="card"><p style="color:var(--red)">Error: ${esc(String(e))}</p></div>`;
    }
    setActive('');
    placeSessionPanels();
    return;
  }

  if (parts[0] === 'epic' && parts[1]) {
    try {
      const { html, epicId } = await renderEpicDetailView(parts[1]);
      main.innerHTML = html;
      bindEpicDetailEvents(epicId);
      document.querySelectorAll('.epic-item').forEach(el => {
        el.classList.toggle('active', el.dataset.epicId === parts[1]);
      });
    } catch (e) {
      main.innerHTML = `<div class="card"><p style="color:var(--red)">Error: ${esc(String(e))}</p></div>`;
    }
    setActive('');
    placeSessionPanels();
    return;
  }

  if (parts[0] === 'org' && parts[1]) {
    const org = parts[1];
    try {
      const data = orgCache[org] || await api(`org/${org}`);
      orgCache[org] = data;
      // Compute org sessions from active dispatches + terminals
      const orgSessions = [
        ...activeDispatches.filter(d => d.project_key && d.project_key.startsWith(org + '/')).map(d => ({ type: 'dispatch', id: d.id, status: d.status, title: d.work_item_id || d.title || d.id, work_item_id: d.work_item_id, project_key: d.project_key, started_at: d.started_at })),
        ...activeTerminals.filter(t => t.project_key && t.project_key.startsWith(org + '/')).map(t => ({ type: 'terminal', id: t.id, status: t.status, title: t.title || t.id, work_item_id: t.work_item_id, project_key: t.project_key, started_at: t.started_at })),
      ];
      main.innerHTML = renderOrgView(org, data, orgSessions);
      // Bind focus buttons in org agents table
      document.querySelectorAll('[data-org-focus]').forEach(btn => {
        btn.onclick = () => {
          const [type, id] = btn.dataset.orgFocus.split(':');
          openFocusPopup(type, id);
        };
      });
    } catch (e) {
      main.innerHTML = `<div class="card"><p style="color:var(--red)">Error: ${esc(String(e))}</p></div>`;
    }
    setActive('');
    placeSessionPanels();
    return;
  }

  if (parts[0] === 'component' && parts.length >= 4) {
    const [, org, proj, comp] = parts;
    try {
      const [data, bl, files] = await Promise.all([
        api(`component/${org}/${proj}/${comp}`),
        getBacklog(),
        api(`project/${org}/${proj}`)
      ]);

      // Match work items (case-insensitive)
      const projKey = `${org}/${proj}/${comp}`.toLowerCase();
      const workItems = [];
      if (bl.projects) {
        for (const [key, val] of Object.entries(bl.projects)) {
          if (key.toLowerCase() === projKey && val.items) {
            workItems.push(...val.items);
          }
        }
      }

      main.innerHTML = renderComponentView(org, proj, comp, data, workItems, files);
      bindTabs();
      setActive(`${org}/${proj}/${comp}`);
    } catch (e) {
      main.innerHTML = `<div class="card"><p style="color:var(--red)">Error: ${esc(String(e))}</p></div>`;
    }
    placeSessionPanels();
    return;
  }

  main.innerHTML = `<div class="card"><p class="empty">Unknown route: ${esc(hash)}</p></div>`;
  placeSessionPanels();
}

window.addEventListener('hashchange', route);
Promise.all([buildTree(), buildEpicTree()]).then(async () => {
  startSessionsSidebarRefresh();
  route();
  await restoreDispatches();
  await restoreTerminals();
  refreshSessionsSidebar();
});
</script>
