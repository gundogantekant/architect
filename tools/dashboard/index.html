async function refreshSuspendedPanel() {
  try {
    const [suspDispatches, suspTerminals] = await Promise.all([
      api('dispatch/suspended'),
      api('terminal/suspended'),
    ]);
    const all = [
      ...suspDispatches.map(d => ({ ...d, _stype: 'dispatch', _suspendedAt: d.completed_at || d.started_at })),
      ...suspTerminals.map(t => ({ ...t, _stype: 'terminal', _suspendedAt: t.exited_at || t.started_at })),
    ];

    let container = _suspendedContainer || document.getElementById('suspended-sessions');
    if (all.length === 0) {
      if (container) container.remove();
      _suspendedContainer = null;
      return;
    }

    if (!container) {
      container = document.createElement('div');
      container.id = 'suspended-sessions';
      container.className = 'card';
      container.style.marginBottom = '20px';
    }
    _suspendedContainer = container;

    let html = `<h3 style="margin:0 0 12px 0;font-size:15px;font-weight:600">Suspended Sessions <span style="font-size:12px;font-weight:400;background:#fef3c7;color:#b45309;padding:2px 8px;border-radius:3px;margin-left:6px">${all.length}</span></h3>`;
    html += '<div style="display:flex;flex-direction:column;gap:8px">';
    for (const s of all) {
      const keyParts = (s.project_key || '').split('/').filter(p => p && p !== '*');
      const projectLabel = keyParts.length >= 2 ? `${esc(keyParts[0])} / ${esc(keyParts[1])}` : (keyParts[0] ? esc(keyParts[0]) : '');
      const wiBadge = s.work_item_id ? `<span class="suspended-badge" style="margin-left:0">${esc(s.work_item_id)}</span>` : '';
      const suspendedAgo = s._suspendedAt ? `suspended ${formatElapsed(s._suspendedAt)} ago` : 'suspended';
      html += `<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-left:3px solid #f59e0b;border-radius:6px;flex-wrap:wrap">
        <span class="status-dot suspended" style="flex-shrink:0"></span>
        ${wiBadge}
        <span style="font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${projectLabel || esc(s.title || s.id)}</span>
        <span style="font-size:11px;color:var(--text-light);white-space:nowrap">${esc(suspendedAgo)}</span>
        <span class="suspended-badge">[suspended]</span>
        <button class="resume-btn" data-susp-resume-${s._stype}="${esc(s.id)}">Resume</button>
        <button class="dismiss-btn" data-susp-dismiss-${s._stype}="${esc(s.id)}">✕</button>
      </div>`;
    }
    html += '</div>';
    container.innerHTML = html;

    for (const s of all) {
      const resumeBtn = container.querySelector(`[data-susp-resume-${s._stype}="${CSS.escape(s.id)}"]`);
      const dismissBtn = container.querySelector(`[data-susp-dismiss-${s._stype}="${CSS.escape(s.id)}"]`);

      if (s._stype === 'dispatch') {
        resumeBtn.onclick = async (e) => {
          e.target.disabled = true;
          try {
            const resp = await fetch(`/api/dispatch/${s.id}/resume`, { method: 'POST' });
            if (resp.ok) {
              const result = await resp.json();
              const existing = activeDispatches.find(d => d.id === s.id);
              if (existing) {
                const idx = activeDispatches.indexOf(existing);
                if (idx !== -1) activeDispatches.splice(idx, 1);
                const panel = sessionPanels.get(`dispatch:${s.id}`);
                if (panel?.parentElement) panel.remove();
                sessionPanels.delete(`dispatch:${s.id}`);
              }
              const newDispatch = {
                id: result.dispatch_id,
                work_item_id: s.work_item_id,
                work_item_title: s.work_item_title,
                epic_id: s.epic_id,
                project_key: s.project_key,
                permission_mode: s.permission_mode,
                skip_permissions: s.skip_permissions,
                agent_phase: 'generating',
                status: 'running',
                started_at: new Date().toISOString(),
              };
              activeDispatches.push(newDispatch);
              createDispatchPanel(newDispatch);
              placeSessionPanels();
              loadDispatchContent(newDispatch);
              syncSessionState();
              await refreshSuspendedPanel();
            } else {
              e.target.disabled = false;
            }
          } catch { e.target.disabled = false; }
        };
        dismissBtn.onclick = async () => {
          try {
            await fetch(`/api/dispatch/${s.id}`, { method: 'DELETE' });
            const idx = activeDispatches.findIndex(d => d.id === s.id);
            if (idx !== -1) activeDispatches.splice(idx, 1);
            const panel = sessionPanels.get(`dispatch:${s.id}`);
            if (panel?.parentElement) panel.remove();
            sessionPanels.delete(`dispatch:${s.id}`);
          } catch {}
          await refreshSuspendedPanel();
          syncSessionState();
        };
      } else {
        resumeBtn.onclick = async (e) => {
          e.target.disabled = true;
          try {
            const resp = await fetch(`/api/terminal/${s.id}/resume`, { method: 'POST' });
            if (resp.ok) {
              const existing = activeTerminals.find(t => t.id === s.id);
              if (existing) {
                const idx = activeTerminals.indexOf(existing);
                if (idx !== -1) activeTerminals.splice(idx, 1);
                const panel = sessionPanels.get(`terminal:${s.id}`);
                if (panel?.parentElement) panel.remove();
                sessionPanels.delete(`terminal:${s.id}`);
              }
              await refreshSuspendedPanel();
              await restoreTerminals();
              syncSessionState();
            } else {
              e.target.disabled = false;
            }
          } catch { e.target.disabled = false; }
        };
        dismissBtn.onclick = async () => {
          try {
            await fetch(`/api/terminal/${s.id}`, { method: 'DELETE' });
            const idx = activeTerminals.findIndex(t => t.id === s.id);
            if (idx !== -1) activeTerminals.splice(idx, 1);
            const panel = sessionPanels.get(`terminal:${s.id}`);
            if (panel?.parentElement) panel.remove();
            sessionPanels.delete(`terminal:${s.id}`);
          } catch {}
          await refreshSuspendedPanel();
          syncSessionState();
        };
      }
    }

    const main = $('#main');
    if (!container.parentElement || container.parentElement !== main) {
      main.insertBefore(container, main.firstChild);
    }
  } catch {}
}

// Restore active dispatches on page load
async function restoreDispatches() {
  try {
    const list = await api('dispatch/active');
    const newDispatches = [];
    for (const d of list) {
      const existing = activeDispatches.find(a => a.id === d.id);
      if (existing) {
        const prevPhase = existing.agent_phase;
        existing.agent_phase = d.agent_phase || null;
        existing.agent_phase_history = d.agent_phase_history || existing.agent_phase_history || [];
        existing.status = d.status;
        existing.timeout_at = d.timeout_at || existing.timeout_at || null;
        existing.work_item_input_needed = d.work_item_input_needed || false;
        const panelEl = document.getElementById(`dispatch-${existing.id}`);
        if (panelEl) {
          const prev = panelEl.querySelector('.phase-timeline');
          const next = renderPhaseTimeline(existing.agent_phase_history);
          if (next) {
            const tmp = document.createElement('div');
            tmp.innerHTML = next;
            if (prev) prev.replaceWith(tmp.firstChild);
            else {
              const logEl = panelEl.querySelector(`#log-${existing.id}`);
              if (logEl) logEl.before(tmp.firstChild);
            }
          } else if (prev) {
            prev.remove();
          }
          if (!existing.work_item_input_needed) {
            panelEl.querySelector('.input-needed-banner')?.remove();
          }
        }
        if (prevPhase !== 'waiting_for_input' && existing.agent_phase === 'waiting_for_input' && existing.project_key) {
          scheduleAwaitingActionRefresh(existing.project_key);
        }
        continue;
      }
      if (d.status === 'suspended') {
        const suspended = { ...d, title: d.work_item_id, agent_phase: null };
        activeDispatches.push(suspended);
        createDispatchPanel(suspended);
        continue; // no content loading for suspended placeholders
      }
      const dispatch = { ...d, title: d.work_item_id, agent_phase: d.agent_phase || null };
      activeDispatches.push(dispatch);
      createDispatchPanel(dispatch);
      newDispatches.push(dispatch);
    }
    // Cleanup stale panels and entries for sessions that no longer exist
    const activeIds = new Set(list.map(d => d.id));
    const staleIndexes = [];
    for (let i = 0; i < activeDispatches.length; i++) {
      if (!activeIds.has(activeDispatches[i].id)) staleIndexes.push(i);
    }
    for (let i = staleIndexes.length - 1; i >= 0; i--) {
      activeDispatches.splice(staleIndexes[i], 1);
    }
    for (const key of sessionPanels.keys()) {
      if (key.startsWith('dispatch:') && !activeIds.has(key.slice('dispatch:'.length))) {
        const panel = sessionPanels.get(key);
        if (panel?.parentElement) panel.remove();
        sessionPanels.delete(key);
      }
    }
    // Mark new dispatches so _placeSessionPanelsNow triggers loadDispatchContent
    // immediately after placing them in the DOM — avoids the race between route()
    // clearing main.innerHTML and a rAF-wait in loadDispatchContent.
    for (const dispatch of newDispatches) {
      if (dispatch.status !== 'suspended') {
        dispatch._pendingContentLoad = true;
      }
    }
    placeSessionPanels();
    syncSessionState();
  } catch {}
}

// --- Sidebar ---
function countOpenItems(bl, key) {
  const items = bl?.projects?.[key]?.items;
  if (!items) return 0;
  return items.filter(i => !['done','cancelled','archived'].includes(i.status)).length;
}

function buildSessionsByProjectMap() {
  const map = new Map();
  for (const d of activeDispatches) {
    if (!d.project_key) continue;
    if (!map.has(d.project_key)) map.set(d.project_key, []);
    map.get(d.project_key).push(d);
  }
  for (const t of activeTerminals) {
    if (!t.project_key) continue;
    if (!map.has(t.project_key)) map.set(t.project_key, []);
    map.get(t.project_key).push(t);
  }
  for (const c of activeCliSessions) {
    if (!c.project_key) continue;
    if (!map.has(c.project_key)) map.set(c.project_key, []);
    map.get(c.project_key).push({ ...c, status: c.status === 'running' ? 'running' : 'completed' });
  }
  return map;
}

function signalColor(bl, key, sessionsByProject) {
  const sessions = sessionsByProject?.get(key) || [];
  // Priority: waiting_for_input > tool_running > generating
  if (sessions.some(s => s.agent_phase === 'waiting_for_input' && s.status === 'running'))
    return { color: 'green', title: 'Agent needs input' };
  if (sessions.some(s => s.agent_phase === 'tool_running' && s.status === 'running'))
    return { color: 'blue', title: 'Agent running tool' };
  if (sessions.some(s => s.status === 'running'))
    return { color: 'orange', title: 'Agent thinking' };
  if (sessions.some(s => s.status === 'suspended'))
    return { color: 'orange', title: 'Has suspended sessions' };
  const items = bl?.projects?.[key]?.items;
  if (items && items.length > 0) return { color: 'blue', title: 'Has work items' };
  return { color: 'grey', title: '' };
}

function updateProjectSignalDots() {
  const sessionsByProject = buildSessionsByProjectMap();
  document.querySelectorAll('.project-item[data-key]').forEach(item => {
    const key = item.dataset.key;
    const dot = item.querySelector('.signal-dot');
    if (!dot) return;
    const sig = signalColor(window._backlogCache, key, sessionsByProject);
    dot.className = `signal-dot ${sig.color}`;
    dot.title = sig.title || '';
  });
}

async function buildTree() {
  const [orgs, bl] = await Promise.all([api('orgs'), getBacklog()]);
  window._backlogCache = bl;
  const sessionsByProject = buildSessionsByProjectMap();
  const tree = $('#tree');
  tree.innerHTML = '';
  for (const org of orgs) {
    try {
      const projects = await api(`org/${org}/projects`);
      const orgData = await api(`org/${org}`);
      setOrgCache(org, orgData);

      const group = document.createElement('div');
      group.className = 'org-group';

      const orgPrefKey = `org_visible_${org}`;
      const orgVisible = window._prefs[orgPrefKey] !== 'false';

      const header = document.createElement('div');
      header.className = 'org-name';
      header.style.display = 'flex';
      header.style.alignItems = 'center';
      const orgInitial = (orgData.name || org || '?')[0].toUpperCase();
      const orgAvatar = document.createElement('span');
      orgAvatar.className = 'nav-avatar';
      orgAvatar.title = orgData.name || org;
      orgAvatar.textContent = orgInitial;
      orgAvatar.onclick = (e) => { e.stopPropagation(); location.hash = `#org/${org}`; };
      header.appendChild(orgAvatar);
      const headerLabel = document.createElement('span');
      headerLabel.style.flex = '1';
      headerLabel.style.cursor = 'pointer';
      headerLabel.innerHTML = `<span class="arrow${orgVisible ? ' open' : ''}">&#9654;</span> ${esc(orgData.name || org)} <span style="font-size:11px;color:#888">(${projects.length})</span>`;
      headerLabel.onclick = () => {
        location.hash = `#org/${org}`;
        const arrow = headerLabel.querySelector('.arrow');
        const list = group.querySelector('.project-list');
        const open = arrow.classList.toggle('open');
        list.style.display = open ? '' : 'none';
      };
      header.appendChild(headerLabel);
      const orgToggle = document.createElement('span');
      orgToggle.className = 'epic-global-toggle';
      orgToggle.textContent = orgVisible ? '[on]' : '[off]';
      orgToggle.title = 'Toggle org visibility in sidebar';
      orgToggle.onclick = (e) => {
        e.stopPropagation();
        const next = !orgVisible;
        window._prefs[orgPrefKey] = String(next);
        fetch('/api/settings/preferences', {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ [orgPrefKey]: String(next) }),
        }).catch(() => {});
        buildTree();
      };
      header.appendChild(orgToggle);

      const list = document.createElement('div');
      list.className = 'project-list';
      if (!orgVisible) list.style.display = 'none';

      // Collect components, then sort by open work item count
      const componentEntries = [];
      for (const proj of projects) {
        try {
          const files = await api(`project/${org}/${proj}`);
          const components = files.filter(f => f.endsWith('.json'));
          for (const file of components) {
            const comp = file.replace(/\.json$/, '');
            const key = `${org}/${proj}/${comp}`;
            componentEntries.push({ org, proj, comp, key });
          }
        } catch { /* skip projects whose files cannot be listed */ }
      }
      componentEntries.sort((a, b) => countOpenItems(bl, b.key) - countOpenItems(bl, a.key));

      for (const { org: o, proj, comp, key } of componentEntries) {
        const sig = signalColor(bl, key, sessionsByProject);
        const item = document.createElement('div');
        item.className = 'project-item';
        item.dataset.key = key;
        const projInitial = (proj || '?')[0].toUpperCase();
        item.innerHTML = `<span class="nav-avatar" title="${esc(proj + '/' + comp)}">${esc(projInitial)}</span><span class="signal-dot ${sig.color}" title="${esc(sig.title || '')}"></span>${comp === 'main' ? esc(proj) : `${esc(proj)} / ${esc(comp)}`}`;
        item.onclick = (e) => {
          e.stopPropagation();
          location.hash = `#component/${o}/${proj}/${comp}`;
        };
        list.appendChild(item);
      }

      group.appendChild(header);
      group.appendChild(list);
      tree.appendChild(group);
    } catch (err) {
      console.error('[buildTree] org render failed', { org, err });
      const group = document.createElement('div');
      group.className = 'org-group org-degraded';
      const header = document.createElement('div');
      header.className = 'org-name';
      header.setAttribute('role', 'alert');
      header.textContent = `⚠ ${org} — failed to load`;
      const detail = document.createElement('span');
      detail.className = 'org-error-detail';
      detail.textContent = `(${err?.message || 'error'})`;
      header.appendChild(detail);
      group.appendChild(header);
      tree.appendChild(group);
    }
  }
}

      if (env.profile) html += `<div class="mono">Profile: ${esc(env.profile)}</div>`;
      html += `</div>`;
    }
    html += `</div>`;
  }

  if (data.design_systems) {
    html += `<h3>Design Systems</h3><div class="env-grid">`;
    for (const [name, ds] of Object.entries(data.design_systems)) {
      html += `<div class="env-card"><strong>${esc(name)}</strong>`;

      if (ds.description) html += `<div style="margin-top:4px;font-size:12px">${esc(ds.description)}</div>`;

      html += `</div>`;
    }
    html += `</div>`;
  }

  if (data.projects?.length) {
    html += `<h3>Projects (${data.projects.length})</h3><div>`;
    for (const p of data.projects) html += `<span class="tag" style="font-size:12px;padding:3px 10px">${esc(p)}</span>`;
    html += `</div>`;
  }

  // Active agents for this organization
  if (orgSessions && orgSessions.length) {
    // Group by project_key
    const byProject = new Map();
    for (const s of orgSessions) {
      const pk = s.project_key || 'unknown';
      if (!byProject.has(pk)) byProject.set(pk, []);
      byProject.get(pk).push(s);
    }
    html += `<h3>Active Agents (${orgSessions.length})</h3>`;
    for (const [pk, sessions] of byProject) {
      html += `<h4 style="font-size:13px;color:var(--text-light);margin:8px 0 4px">${esc(pk)}</h4>`;
      html += `<table class="org-agents-table"><thead><tr><th></th><th>Title</th><th>Work Item</th><th>Status</th><th>Elapsed</th><th></th></tr></thead><tbody>`;
      for (const s of sessions) {
        const dotClass = s.status === 'running' ? 'running' : (s.status === 'suspended' ? 'suspended' : (s.status === 'completed' ? 'completed' : (s.status === 'interrupted' ? 'interrupted' : 'failed')));
        const elapsed = formatElapsed(s.started_at);
        html += `<tr>`;
        html += `<td><span class="status-dot ${dotClass}" style="display:inline-block"></span></td>`;
        html += `<td>${esc(s.title || s.id)}</td>`;
        html += `<td>${s.work_item_id ? `<code>${esc(s.work_item_id)}</code>` : '—'}</td>`;
        html += `<td><span class="badge badge-${s.status === 'running' ? 'open' : (s.status === 'completed' ? 'done' : 'medium')}">${esc(s.status)}</span></td>`;
        html += `<td>${elapsed}</td>`;
        html += `<td><button class="focus-btn" data-org-focus="${esc(s.type)}:${esc(s.id)}">Focus</button></td>`;

  html += `</div>`;

  // Org-level session slot for terminal panels
  html += `<div data-session-slot-org="${esc(org)}" style="margin-top:16px"></div>`;

  html += `</div>`;
  return html;
}

function showDetachModal(org, project, component) {
  const portfolioKey = `${org}/${project}/${component}`;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Detach Repository</h3>
      <p style="font-size:13px;margin:0 0 12px">Detach <code>${esc(portfolioKey)}</code> from the portfolio.</p>
      <div style="font-size:13px;margin-bottom:12px">
        <div style="font-weight:600;margin-bottom:6px">Cleanup options:</div>
        <label style="display:block;margin-bottom:4px"><input type="checkbox" name="cancel_open" checked style="margin-right:6px">Cancel open work items</label>
        <label style="display:block;margin-bottom:4px"><input type="checkbox" name="archive_done" checked style="margin-right:6px">Archive done work items</label>
        <label style="display:block;margin-bottom:4px"><input type="checkbox" name="remove_claude_md" checked style="margin-right:6px">Remove CLAUDE.md <span style="font-size:11px;color:var(--text-light)">(recoverable from git)</span></label>
        <label style="display:block;margin-bottom:4px"><input type="checkbox" name="unlink_repo_sync" checked style="margin-right:6px">Unlink repo sync</label>
        <label style="display:block;margin-bottom:4px"><input type="checkbox" name="kill_dispatches" checked style="margin-right:6px">Kill active dispatches</label>
        <label style="display:block;margin-bottom:4px"><input type="checkbox" name="remove_worktrees" style="margin-right:6px">Remove worktrees <span style="font-size:11px;color:var(--text-light)">&#9888; Destructive \u2014 unmerged work will be lost</span></label>
      </div>
      <div id="detach-report-${esc(portfolioKey.replace(/\//g, '-'))}" style="margin-bottom:8px"></div>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="detach-cancel">Cancel</button>
        <button class="btn btn-dispatch" id="detach-confirm" style="background:var(--danger,#e74c3c)">Detach</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#detach-cancel').onclick = () => overlay.remove();
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  const reportEl = overlay.querySelector(`#detach-report-${portfolioKey.replace(/\//g, '-')}`);

  overlay.querySelector('#detach-confirm').onclick = async () => {
    const confirmBtn = overlay.querySelector('#detach-confirm');
    confirmBtn.disabled = true;
    confirmBtn.textContent = 'Detaching\u2026';

    const opts = {};
    overlay.querySelectorAll('input[type=checkbox]').forEach(cb => {
      opts[cb.name] = cb.checked;
    });

    try {
      const resp = await fetch(`/api/portfolio/${encodeURIComponent(org)}/${encodeURIComponent(project)}/${encodeURIComponent(component)}`, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(opts),
      });
      const result = await resp.json();
      if (!resp.ok) {
        const errors = result.errors || [result.error || 'Detach failed'];
        reportEl.innerHTML = `<ul style="color:var(--danger,#e74c3c);font-size:12px;margin:0;padding-left:16px">${errors.map(e => `<li>${esc(String(e))}</li>`).join('')}</ul>`;
        confirmBtn.disabled = false;
        confirmBtn.textContent = 'Detach';
        return;
      }
      // Show DetachReport steps
      const steps = result.steps || [];
      if (steps.length) {
        reportEl.innerHTML = `<ul style="font-size:12px;color:var(--text-light);margin:0;padding-left:16px">${steps.map(s => `<li>${esc(String(s))}</li>`).join('')}</ul>`;
      } else {
        reportEl.innerHTML = `<p style="font-size:12px;color:var(--text-light)">Detached successfully.</p>`;
      }
      overlay.querySelector('#detach-cancel').textContent = 'Close';
      overlay.querySelector('#detach-cancel').style.display = '';
      confirmBtn.style.display = 'none';
      setTimeout(() => {
        overlay.remove();
        location.hash = `#org/${org}`;
      }, 2000);
    } catch (e) {
      reportEl.innerHTML = `<p style="color:var(--danger,#e74c3c);font-size:12px">${esc(e.message || 'Detach failed')}</p>`;
      confirmBtn.disabled = false;
      confirmBtn.textContent = 'Detach';
    }
  };
}

function showOnboardFromRepoModal(org, repoName) {
  const defaultPath = `/Users/tekantgundogan/Documents/${repoName}`;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Onboard Repository</h3>
      <div class="field">
        <label>Repository</label>
        <div style="font-size:13px"><code>${esc(repoName)}</code></div>
      </div>
      <div class="field">
        <label>Local Path *</label>
        <input type="text" id="onboard-repo-path" value="${esc(defaultPath)}" placeholder="/absolute/path/to/repo" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="onboard-repo-cancel">Cancel</button>
        <button class="btn btn-dispatch" id="onboard-repo-go">Open terminal to onboard</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#onboard-repo-cancel').onclick = () => overlay.remove();
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  overlay.querySelector('#onboard-repo-go').onclick = async () => {
    const localPath = overlay.querySelector('#onboard-repo-path').value.trim();
    if (!localPath) { alert('Local path is required'); return; }

    const btn = overlay.querySelector('#onboard-repo-go');
    btn.disabled = true;
    btn.textContent = 'Opening terminal\u2026';

    try {
      const resp = await fetch('/api/terminal', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ command: `/onboard ${localPath}`, title: `Onboard ${repoName}` }),
      });
      const result = await resp.json();
      if (!resp.ok) throw new Error(result.error || 'Failed to open terminal');

      const terminalInfo = {
        id: result.terminal_id,
        agent_type: 'claude',
        work_item_id: null,
        project_key: null,
        org_key: org,
        title: `Onboard ${repoName}`,
        status: 'running',
        started_at: new Date().toISOString(),
      };
      activeTerminals.push(terminalInfo);
      syncSessionState();
      createTerminalPanel(terminalInfo);
      placeSessionPanels();
      await initSession(terminalInfo);
      overlay.remove();
      location.hash = `#terminal/${result.terminal_id}`;
    } catch (e) {
      btn.disabled = false;
      btn.textContent = 'Open terminal to onboard';
      alert('Failed: ' + e.message);
    }
  };
}

// Store current work items context for dispatch
let currentWorkItems = [];
let currentProjectKey = '';
// Tracks the project key visible to the user before the current navigation began.
// Used by placeSessionPanels to distinguish same-project panel updates from cross-project navigations.
let previousProjectKey = '';
const ARCHITECT_KEY = '\u2013/architect/\u2013';

// Render a work items table — reusable for both flat and epic-grouped modes.
// `items` = sorted array of work items for this table section.
// `allWorkItems` = full work items list (for dep resolution and indexing).
// `tableId` = optional id attribute for the table element.
function renderWorkItemsTable(items, allWorkItems, tableId) {
  if (!items.length) return '';
  let html = `<table${tableId ? ` id="${tableId}"` : ''} class="wi-table"><thead><tr><th data-wi-sort="id" style="cursor:pointer">ID &#8645;</th><th>Title</th><th data-wi-sort="status" style="cursor:pointer">Status &#8645;</th><th data-wi-sort="priority" style="cursor:pointer">Priority &#8645;</th><th>Depends On</th><th>Epic</th><th>Tags</th><th data-wi-sort="createdat" style="cursor:pointer">Created &#8645;</th><th data-wi-sort="doneat" style="cursor:pointer">Done &#8645;</th><th></th></tr></thead><tbody>`;
  for (const w of items) {
    const idx = allWorkItems.indexOf(w);
    const sc = w.status || 'draft';
    const canDispatch = ['planned','in-progress','in-review','testing','preview'].includes(w.status);
    const depState = isBlockedByDeps(w, allWorkItems);
    const rowClass = depState.blocked ? ' class="blocked-by-deps"' : '';
    const depHtml = (w.depends_on || []).length ? w.depends_on.map(d => {
      const dep = allWorkItems.find(i => i.id === d);
      const cls = dep && dep.status === 'done' ? 'dep-done' : 'dep-pending';
      return `<span class="dep-badge ${cls}">${esc(d)}</span>`;
    }).join('') : '';
    const depTooltip = depState.blocked ? ` title="Dependencies not yet complete: ${depState.pending.join(', ')}"` : '';
    const flagHtml = (w.input_needed ? `<span class="flag-badge flag-input">input needed</span>` : '') +
                     (w.approval_active ? `<span class="flag-badge flag-approval">approval needed</span>` : '');
    html += `<tr${rowClass}${depTooltip} data-wi-row="${idx}" data-wi-status-val="${esc(w.status)}" data-wi-priority-val="${esc(w.priority || 'medium')}" data-wi-epic-val="${esc(w.epic_id || '')}" data-wi-tags-val="${esc((w.tags||[]).join(','))}" data-wi-createdat-val="${w.created_at ? new Date(w.created_at).getTime() : 0}" data-wi-doneat-val="${w.done_at ? new Date(w.done_at).getTime() : 0}"><td><code>${esc(w.id)}</code></td><td>${esc(w.title)}</td>`;
    html += `<td><span class="badge badge-${sc}" data-status-click="${esc(w.id)}" data-current-status="${esc(w.status)}" style="cursor:pointer">${esc(w.status)}</span>${flagHtml}</td>`;
    html += `<td><span class="badge badge-${w.priority || 'medium'}">${esc(w.priority || '\u2014')}</span></td>`;
    html += `<td>${depHtml}</td>`;
    html += `<td>${w.epic_id ? `<span class="badge badge-epic" data-epic-nav="${esc(w.epic_id)}">${esc(w.epic_id)}</span>` : ''}</td>`;
    html += `<td>${(w.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</td>`;
    html += `<td>${w.created_at ? new Date(w.created_at).toLocaleDateString() : '—'}</td>`;
    html += `<td>${w.done_at ? new Date(w.done_at).toLocaleDateString() : '—'}</td>`;
    html += `<td><button class="expand-btn" data-wi="${idx}">details</button>`;
    html += `<button class="edit-btn" data-wi-edit="${idx}">edit</button>`;
    if (w.status === 'draft') {
      html += `<button class="btn-refine" onclick="refineWorkItem('${esc(w.id)}')" title="Ask coordinator to generate an implementation contract">Refine</button>`;
    }
    if (canDispatch) {
      const hasActiveDispatch = (window._activeDispatches || []).some(d => d.work_item_id === w.id && d.status === 'running');
      // Keep in sync with constants.mjs AUTO_IMPLEMENTABLE_STATUSES (frontend has no module loader).
      const isAutoEligible = !hasActiveDispatch && ['planned','in-progress'].includes(w.status);
      html += `<span class="split-btn-group" data-split-wi="${idx}">`;
      html += `<button class="dispatch-btn" data-wi-idx="${idx}">dispatch</button>`;
      html += `<button class="dispatch-chevron" data-chevron-wi="${idx}" title="More dispatch options">▾</button>`;
      html += `<div class="dispatch-dropdown hidden" data-dropdown-wi="${idx}">`;
      html += `<button ${isAutoEligible ? '' : 'disabled'} data-auto-wi="${idx}" title="${hasActiveDispatch ? 'A dispatch is already running for this item' : (!isAutoEligible ? 'Item status not eligible' : '')}">Auto-implement</button>`;
      html += `</div></span>`;
    }
    html += `<button class="delete-btn" data-wi-del="${idx}">delete</button>`;
    html += `</td></tr>`;
    html += `<tr class="wi-detail" data-wi-detail="${idx}" style="display:none"><td colspan="10">`;
    html += `<div style="font-size:11px;color:var(--text-light);margin-bottom:8px;display:flex;flex-wrap:wrap;gap:4px 12px">`;
    html += `<span>Created: ${fmtDate(w.created_at)}</span>`;
    html += `<span>Updated: ${fmtDate(w.updated_at)}</span>`;
    if (w.total_time_seconds) {
      const hrs = (w.total_time_seconds / 3600).toFixed(1);
      html += `<span>Agent time: ${hrs}h (${w.session_count || 0} sessions)</span>`;
    }
    if (w.total_cost_usd) html += `<span>Cost: $${w.total_cost_usd.toFixed(2)}</span>`;
    html += `</div>`;
    if (w.description?.trim()) html += `<div class="md-inline" style="max-height:300px;overflow-y:auto;margin-bottom:8px">${renderMd(w.description)}</div>`;
    if (w.session_log?.length) {
      html += `<div class="session-log">`;
      for (const e of w.session_log) html += `<div class="entry"><span class="date">${fmtDate(e.date)}</span>${esc(e.summary)}</div>`;
      html += `</div>`;
    }
    html += `<div style="margin-top:8px;display:flex;gap:6px;align-items:center">`;
    html += `<input type="text" class="log-input" data-log-wi="${esc(w.id)}" placeholder="Add log entry..." style="flex:1;padding:4px 8px;border:1px solid var(--border);border-radius:4px;font-size:12px" />`;
    html += `<button class="btn-add-wi" data-log-submit="${esc(w.id)}" style="margin:0;padding:4px 10px;font-size:11px">Add Log</button>`;
    html += `</div>`;
    html += `<div style="margin-top:8px;display:flex;gap:6px">`;
    html += `<button class="btn-add-wi" data-wi-plan="${esc(w.id)}" style="margin:0;padding:4px 10px;font-size:11px">Plan</button>`;
    html += `<button class="btn-add-wi" data-wi-doc="${esc(w.id)}" style="margin:0;padding:4px 10px;font-size:11px">Docs</button>`;
    html += `<button class="btn-add-wi" data-wi-files="${esc(w.id)}" style="margin:0;padding:4px 10px;font-size:11px">Files</button>`;
    html += `</div>`;
    html += `<div class="wi-artifact-container" data-artifact-for="${esc(w.id)}" style="margin-top:8px"></div>`;
    html += `</td></tr>`;
    html += `<tr class="wi-sessions-row" data-wi-sessions="${esc(w.id)}" style="display:none"><td colspan="10"><div class="wi-sessions-container" data-session-slot="${esc(w.id)}"></div></td></tr>`;
  }
  html += `</tbody></table>`;
  return html;
}

// Render Board tab content with epic grouping.
// `workItems` = all work items for this project.
// `epics` = epics associated with this project (from backlog).
// `projectKey` = current project key for preference scoping.
function renderEpicGroupedBoard(workItems, epics, projectKey) {
  const collapsePrefs = JSON.parse(window._prefs.board_epic_collapse || '{}');
  const epicIds = new Set(epics.map(e => e.id));
  const byEpic = {};
  const orphans = [];
  for (const w of workItems) {
    if (w.epic_id && epicIds.has(w.epic_id)) {
      (byEpic[w.epic_id] = byEpic[w.epic_id] || []).push(w);
    } else {
      orphans.push(w);
    }
  }

  let html = '';
  for (const epic of epics) {
    const items = byEpic[epic.id];
    if (!items || !items.length) continue;
    const sorted = topoSort(items);
    const done = items.filter(i => i.status === 'done').length;
    const collapseKey = `${projectKey}:${epic.id}`;
    const collapsed = collapsePrefs[collapseKey] === true;
    const color = epicSignalColor(epic, { done, total: items.length });

    html += `<div class="epic-group${collapsed ? ' collapsed' : ''}" data-epic-group="${esc(epic.id)}">`;
    html += `<div class="epic-group-header" data-epic-collapse="${esc(epic.id)}">`;
    html += `<span class="epic-group-toggle${collapsed ? '' : ' open'}">&#9654;</span>`;
    html += `<span class="signal-dot ${color}"></span>`;
    html += `<span class="badge badge-epic" data-epic-nav="${esc(epic.id)}" style="pointer-events:auto">${esc(epic.id)}</span>`;
    html += `<strong>${esc(epic.title)}</strong>`;
    html += `<span class="badge badge-${epic.status === 'active' ? 'open' : epic.status}">${esc(epic.status)}</span>`;
    html += `<span class="epic-group-progress">${done}/${items.length} done</span>`;
    html += `</div>`;
    html += `<div class="epic-group-body">`;
    html += renderWorkItemsTable(sorted, workItems);
    html += `</div></div>`;
  }

  if (orphans.length) {
    if (epics.some(e => (byEpic[e.id] || []).length > 0)) {
      html += `<div class="orphan-section-label">Other Tasks (${orphans.length})</div>`;
    }
    html += renderWorkItemsTable(topoSort(orphans), workItems);
  }

  return html;
}

function renderComponentView(org, proj, comp, data, workItems, files, projectEpics) {
  currentWorkItems = workItems;
  previousProjectKey = currentProjectKey;
  currentProjectKey = `${org}/${proj}/${comp}`;

  const tabs = ['Board', 'Overview', 'Docs'];
  let html = `<div class="card"><h2>${esc(data.name || (comp === 'main' ? proj : `${proj}/${comp}`))}</h2>`;
  html += `<span class="badge badge-role">${esc(data.role || 'unknown')}</span>`;
  const _projKey = `${org}/${proj}/${comp}`;
  const _refinementDispatch = (window._activeDispatches || []).find(d => d.dispatch_mode === 'project_refinement' && d.project_key === _projKey && d.status === 'running');
  if (_refinementDispatch) {
    html += `<span class="badge" style="background:var(--orange);cursor:pointer;margin-left:8px" onclick="focusRefinementDispatch('${esc(_refinementDispatch.id)}')">&#8635; Refinement in progress</span>`;
  }
  html += `<div id="sync-freshness-${esc(`${org}/${proj}/${comp}`)}" style="font-size:12px;color:var(--text-light);margin:6px 0 2px"></div>`;
  html += `<div class="tabs" id="comp-tabs">`;
  tabs.forEach((t, i) => {
    html += `<div class="tab${i === 0 ? ' active' : ''}" data-tab="${i}">${t}</div>`;
  });
  html += `</div>`;

  // Tab 0: Board
  const epics = projectEpics || [];
  const globalEpicsVisible = window._prefs.board_epics_global_visible !== 'false';
  const groupPrefs = JSON.parse(window._prefs.board_epics_grouped || '{}');
  const isGrouped = groupPrefs[currentProjectKey] !== false;
  const showEpicGrouping = globalEpicsVisible && isGrouped && epics.length > 0;

  html += `<div class="tab-content active" data-panel="0">`;
  html += `<button class="btn-add-wi" id="add-work-item">+ Add Task</button>`;
  html += `<button class="btn-add-wi" id="discuss-agent" style="background:var(--teal);margin-left:8px">Discuss with Agent</button>`;
  html += `<button class="btn-add-wi" id="review-prs" style="background:var(--blue);margin-left:8px">Review PRs</button>`;
  html += `<button class="btn-add-wi" id="refine-project" style="background:var(--purple);margin-left:8px">Refine Project</button>`;
  html += `<a href="#agents?project=${esc(currentProjectKey)}" style="margin-left:8px;font-size:12px;color:var(--accent)">View agents</a>`;

  // Board toggle bar (only if project has epic-linked items or epics exist)
  if (epics.length > 0 && globalEpicsVisible) {
    html += `<div class="board-toggle-bar">`;
    html += `<label><input type="checkbox" id="board-epic-toggle" ${isGrouped ? 'checked' : ''} /> Group by Epic</label>`;
    html += `<button class="btn-add-wi" id="create-project-epic" style="margin-left:auto;padding:4px 10px;font-size:11px;background:#7c3aed">+ Create Epic</button>`;
    html += `</div>`;
  }

  // Awaiting Action widget — populated async after render
  html += `<div id="awaiting-action-widget"></div>`;

  if (workItems.length) {
    // Collect filter values
    const allStatuses = [...new Set(workItems.map(w => w.status))].sort();
    const allPriorities = [...new Set(workItems.map(w => w.priority || 'medium'))];
    const allEpics = [...new Set(workItems.map(w => w.epic_id).filter(Boolean))].sort();
    const allTags = [...new Set(workItems.flatMap(w => w.tags || []))].sort();

    // Status phase grouping for filter bar
    const statusPhases = [
      { label: 'Refinement', states: ['draft'] },
      { label: 'Planning', states: ['planned'] },
      { label: 'Implementation', states: ['in-progress', 'blocked'] },
      { label: 'Validation', states: ['in-review', 'testing'] },
      { label: 'Acceptance', states: ['preview'] },
      { label: 'Terminal', states: ['done', 'cancelled', 'archived'] },
    ];

    // Filter bar
    html += `<div class="wi-filter-bar" id="wi-filter-bar">`;
    html += `<span style="font-size:12px;font-weight:600;color:var(--text-light)">Status:</span>`;
    let lastPhaseLabel = null;
    const statusToPhase = {};
    for (const phase of statusPhases) for (const s of phase.states) statusToPhase[s] = phase.label;
    for (const s of allStatuses) {
      const phase = statusToPhase[s] || null;
      if (phase && phase !== lastPhaseLabel) {
        html += `<span style="font-size:10px;color:#94a3b8;padding:0 2px;border-left:1px solid var(--border);margin-left:4px;padding-left:6px">${esc(phase)}</span>`;
        lastPhaseLabel = phase;
      }
      const checked = (s !== 'done' && s !== 'cancelled' && s !== 'archived') ? 'checked' : '';
      html += `<label class="filter-checkbox"><input type="checkbox" data-wi-status="${esc(s)}" ${checked} />${esc(s)}</label>`;
    }
    if (allPriorities.length > 1) {
      html += `<span style="font-size:12px;font-weight:600;color:var(--text-light);margin-left:8px">Priority:</span>`;
      for (const p of ['critical','high','medium','low']) {
        if (allPriorities.includes(p)) html += `<label class="filter-checkbox"><input type="checkbox" data-wi-priority="${esc(p)}" checked />${esc(p)}</label>`;
      }
    }
    if (allEpics.length) {
      html += `<select id="wi-filter-epic" style="margin-left:8px"><option value="">All epics</option>`;
      for (const e of allEpics) html += `<option value="${esc(e)}">${esc(e)}</option>`;
      html += `</select>`;
    }
    if (allTags.length) {
      html += `<input type="text" id="wi-filter-tags" placeholder="Filter by tag..." style="width:120px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;margin-left:8px" />`;
    }
    html += `<span class="filter-count" id="wi-filter-count">${workItems.length} tasks</span>`;
    html += `<button class="filter-clear" id="wi-filter-clear" style="display:none">Clear filters</button>`;
    html += `</div>`;

    if (showEpicGrouping) {
      html += renderEpicGroupedBoard(workItems, epics, currentProjectKey);
    } else {
      html += renderWorkItemsTable(topoSort(workItems), workItems, 'wi-table');
    }
  } else {
    html += `<p class="empty">No tasks for this project.</p>`;
  }
  // Project-level session slot (sessions with project_key but no matching work item slot)
  html += `<div class="context-sessions-section hidden" style="margin-top:16px"><h3>Project Agents</h3><div data-session-slot-project="${esc(currentProjectKey)}"></div></div>`;
  html += `</div>`;

  // Tab 1: Overview (Profile + Guidance + Agents)
  html += `<div class="tab-content" data-panel="1">`;
  // Profile
  html += `<h3>Profile</h3>`;
  html += `<dl class="kv">`;
  html += `<dt>Path</dt><dd><code>${esc(data.path || '—')}</code></dd>`;
  html += `<dt>Onboarded</dt><dd>${esc(data.onboarded_at || '—')}</dd>`;
  html += `<dt>Last Scanned</dt><dd>${esc(data.last_scanned || '—')}</dd>`;
  html += `</dl>`;
  if (data.scout_report) {
    html += `<h3>Scout Report</h3><dl class="kv">`;
    for (const [k, v] of Object.entries(data.scout_report)) {
      const val = Array.isArray(v) ? v.map(x => `<span class="tag">${esc(x)}</span>`).join(' ') : esc(String(v));
      html += `<dt>${esc(k)}</dt><dd>${val}</dd>`;
    }
    html += `</dl>`;
  }
  if (data.brief) {
    html += `<h3>Brief</h3><dl class="kv">`;
    for (const [k, v] of Object.entries(data.brief)) {
      const val = Array.isArray(v) ? v.map(x => typeof x === 'object' ? esc(JSON.stringify(x)) : `<span class="tag">${esc(x)}</span>`).join(' ') : esc(String(v));
      html += `<dt>${esc(k)}</dt><dd>${val}</dd>`;
    }
    html += `</dl>`;
  }
  html += `<div style="margin-top:12px"><a href="#settings" onclick="navigateToRefinementTemplate('${esc(org)}','${esc(proj)}','${esc(comp)}')" style="color:var(--teal);font-size:13px">&#9998; Edit refinement template</a></div>`;
  // Guidance
  html += `<hr style="margin:16px 0">`;
  html += `<h3>Guidance</h3>`;
  if (data.guidance) {
    const g = data.guidance;
    if (g.stack_summary) html += `<p style="margin-bottom:12px">${esc(g.stack_summary)}</p>`;
    for (const section of ['structure', 'conventions', 'ci_cd', 'testing', 'hardware_configs', 'external_dependencies']) {
      if (g[section]?.length) {
        html += `<h3>${esc(section.replace(/_/g, ' '))}</h3><ul class="item-list">`;
        for (const item of g[section]) {
          html += `<li>${typeof item === 'object' ? esc(JSON.stringify(item)) : esc(item)}</li>`;
        }
        html += `</ul>`;
      }
    }
  } else {
    html += `<p class="empty">No guidance available.</p>`;
  }
  if (data.custom_rules?.length) {
    html += `<h3>Custom Rules</h3><ul class="item-list">`;
    for (const r of data.custom_rules) html += `<li>${esc(r)}</li>`;
    html += `</ul>`;
  }
  // Agents
  html += `<hr style="margin:16px 0">`;
  html += `<h3>Agents</h3>`;
  if (data.agents) {
    if (data.agents.recommended?.length) {
      html += `<h3>Recommended</h3><div>`;
      for (const a of data.agents.recommended) html += `<span class="badge badge-agent">${esc(a)}</span>`;
      html += `</div>`;
    }
    if (data.agents.dispatch_notes && Object.keys(data.agents.dispatch_notes).length) {
      html += `<h3>Dispatch Notes</h3><dl class="kv">`;
      for (const [a, note] of Object.entries(data.agents.dispatch_notes)) {
        html += `<dt><span class="badge badge-agent">${esc(a)}</span></dt><dd>${esc(note)}</dd>`;
      }
      html += `</dl>`;
    }
  } else {
    html += `<p class="empty">No agent recommendations.</p>`;
  }
  html += `</div>`;

  // Tab 2: Docs
  const mdFiles = files.filter(f => f.endsWith('.md'));
  html += `<div class="tab-content" data-panel="2">`;
  if (mdFiles.length) {
    html += `<div id="doc-files">`;
    for (const f of mdFiles) html += `<span class="file-link" data-doc="${esc(f)}">${esc(f)}</span>`;
    html += `</div><div id="doc-render" class="md-container" style="margin-top:12px"></div>`;
  } else {
    html += `<p class="empty">No documentation files.</p>`;
  }
  html += `</div>`;

  html += `</div>`;
  return html;
}

function bindTabs() {
  const tabs = document.querySelectorAll('#comp-tabs .tab');
  tabs.forEach(tab => {
    tab.onclick = () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      document.querySelectorAll('.tab-content').forEach(p => p.classList.remove('active'));
      document.querySelector(`.tab-content[data-panel="${tab.dataset.tab}"]`).classList.add('active');
    };
  });

  // Work item expand
  document.querySelectorAll('.expand-btn').forEach(btn => {
    btn.onclick = () => {
      const row = document.querySelector(`[data-wi-detail="${btn.dataset.wi}"]`);
      const showing = row.style.display !== 'none';
      row.style.display = showing ? 'none' : '';
      btn.textContent = showing ? 'details' : 'hide';
    };
  });

  // Work item row click to toggle details
  document.querySelectorAll('[data-wi-row]').forEach(row => {
    row.style.cursor = 'pointer';
    row.addEventListener('click', (e) => {
      if (e.target.closest('button, a, input, select, .badge, .tag')) return;
      const idx = row.dataset.wiRow;
      const detailRow = document.querySelector(`[data-wi-detail="${idx}"]`);
      if (!detailRow) return;
      const showing = detailRow.style.display !== 'none';
      detailRow.style.display = showing ? 'none' : '';
      const btn = document.querySelector(`.expand-btn[data-wi="${idx}"]`);
      if (btn) btn.textContent = showing ? 'details' : 'hide';
    });
  });

  // Add work item button — agent-gated by default (Shift+N for direct form)
  const addBtn = document.getElementById('add-work-item');
  if (addBtn) addBtn.onclick = () => startAgentTaskCreation(currentProjectKey);

  // Edit buttons
  document.querySelectorAll('.edit-btn').forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.wiEdit);
      const wi = currentWorkItems[idx];
      if (wi) showWorkItemModal(wi);
    };
  });

  // Delete buttons
  document.querySelectorAll('.delete-btn').forEach(btn => {
    btn.onclick = async () => {
      const idx = parseInt(btn.dataset.wiDel);

      if (!wi) return;

      try {
        const resp = await fetch(`/api/work-items/${wi.id}`, { method: 'DELETE' });
        const result = await resp.json();
        if (!resp.ok) throw new Error(result.error || 'Delete failed');
        setBacklog(null);
        await buildTree();
        route();
      } catch (e) {
        alert('Delete failed: ' + e.message);
      }

  document.querySelectorAll('.dispatch-btn[data-wi-idx]').forEach(btn => {

    };

      if (dropdown) {
        const isHidden = dropdown.classList.contains('hidden');

        if (isHidden) dropdown.classList.remove('hidden');
      }

  // Auto-implement option in dropdown

    btn.onclick = (e) => {

      const idx = parseInt(btn.dataset.autoWi);

      if (dropdown) dropdown.classList.add('hidden');

        body: JSON.stringify({ board_epic_collapse: window._prefs.board_epic_collapse }),
      }).catch(() => {});

        render.innerHTML = renderMd(text);
      } catch (e) {

// --- Inline Status Dropdown ---
function showStatusDropdown(badge, itemId, currentStatus) {
  // Remove any existing dropdown
  document.querySelectorAll('.status-dropdown').forEach(d => d.remove());
  const statuses = ['draft', 'planned', 'in-progress', 'blocked', 'in-review', 'testing', 'preview', 'done', 'cancelled', 'archived'];
  const dropdown = document.createElement('div');
  dropdown.className = 'status-dropdown';
  for (const s of statuses) {
    const btn = document.createElement('button');
    btn.className = 'status-option' + (s === currentStatus ? ' current' : '');
    btn.textContent = s;
    btn.onclick = async (e) => {
      e.stopPropagation();
      dropdown.remove();
      if (s === currentStatus) return;
      try {
        const resp = await fetch(`/api/work-items/${itemId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: s }),
        });
        if (!resp.ok) { const r = await resp.json(); throw new Error(r.error || 'Failed'); }
        setBacklog(null); setEpicCache(null);
        await Promise.all([buildTree(), buildEpicTree()]);
        route();
      } catch (err) {
        alert('Status update failed: ' + err.message);
      }
    };
    dropdown.appendChild(btn);
  }
  const rect = badge.getBoundingClientRect();
  dropdown.style.position = 'fixed';
  dropdown.style.top = (rect.bottom + 4) + 'px';
  dropdown.style.left = rect.left + 'px';
  document.body.appendChild(dropdown);
  const close = (e) => { if (!dropdown.contains(e.target) && e.target !== badge) { dropdown.remove(); document.removeEventListener('click', close); } };
  setTimeout(() => document.addEventListener('click', close), 0);
}

let _awaitingActionDebounceTimer = null;
function scheduleAwaitingActionRefresh(projectKey) {
  clearTimeout(_awaitingActionDebounceTimer);
  _awaitingActionDebounceTimer = setTimeout(() => loadAwaitingAction(projectKey), 300);
}

async function loadAwaitingAction(projectKey) {
  const widget = document.getElementById('awaiting-action-widget');
  if (!widget) return;
  try {
    const params = projectKey ? `?project=${encodeURIComponent(projectKey)}&awaiting_action=true` : '?awaiting_action=true';
    const data = await api('backlog' + params).catch(() => null);
    // Collect items from current project that need attention
    const items = [];
    const allProjects = data?.projects || {};
    for (const [key, group] of Object.entries(allProjects)) {
      if (projectKey && key !== projectKey) continue;
      for (const item of (group.items || [])) {
        if (item.input_needed || item.approval_active || item.status === 'blocked') {
          items.push({ ...item, project_key: key });
        }
      }
    }
    if (!items.length) { widget.innerHTML = ''; return; }
    let html = `<div class="awaiting-action-box">`;
    html += `<h4>&#9888; Awaiting Action <span style="font-weight:400;font-size:11px;color:#92400e">(${items.length})</span></h4>`;
    for (const item of items) {
      const reasons = [];
      if (item.status === 'blocked') reasons.push(`<span class="badge badge-blocked" style="font-size:10px;padding:1px 6px">blocked</span>`);
      if (item.input_needed) reasons.push(`<span class="flag-badge flag-input">input needed</span>`);
      if (item.approval_active) reasons.push(`<span class="flag-badge flag-approval">approval needed</span>`);
      html += `<div class="aa-item"><span class="aa-id">${esc(item.id)}</span><span style="flex:1">${esc(item.title)}</span>${reasons.join('')}</div>`;
    }
    html += `</div>`;
    widget.innerHTML = html;
  } catch { widget.innerHTML = ''; }
}

// --- Filter bar logic ---
function bindFilterBar() {
  const bar = document.getElementById('wi-filter-bar');
  if (!bar) return;

  // Exclusion model: unchecked = hidden. Default: done + cancelled + archived excluded.
  const excludedStatus = new Set(['done', 'cancelled', 'archived']);
  const excludedPriority = new Set();
  const activeFilters = { epic: '', tags: '' };
  const prefsKey = 'wi_filters';

  // Restore from server preferences (async, applies on load)
  (async () => {
    try {
      const res = await fetch('/api/settings/preferences');
      const prefs = await res.json();
      if (prefs[prefsKey]) {
        const saved = JSON.parse(prefs[prefsKey]);
        excludedStatus.clear();
        if (saved.excludedStatus) saved.excludedStatus.forEach(s => excludedStatus.add(s));
        excludedPriority.clear();
        if (saved.excludedPriority) saved.excludedPriority.forEach(p => excludedPriority.add(p));
        activeFilters.epic = saved.epic || '';
        activeFilters.tags = saved.tags || '';
        // Sync checkbox UI
        bar.querySelectorAll('input[data-wi-status]').forEach(cb => {
          cb.checked = !excludedStatus.has(cb.dataset.wiStatus);
        });
        bar.querySelectorAll('input[data-wi-priority]').forEach(cb => {
          cb.checked = !excludedPriority.has(cb.dataset.wiPriority);
        });
        const epicSel = document.getElementById('wi-filter-epic');
        if (epicSel && activeFilters.epic) epicSel.value = activeFilters.epic;
        const tagsInput = document.getElementById('wi-filter-tags');
        if (tagsInput && activeFilters.tags) tagsInput.value = activeFilters.tags;
        applyFilters();
      } else {
        applyFilters(); // apply defaults
      }
    } catch { applyFilters(); }
  })();

  function saveFilters() {
    const payload = JSON.stringify({
      excludedStatus: [...excludedStatus],
      excludedPriority: [...excludedPriority],
      epic: activeFilters.epic,
      tags: activeFilters.tags,
    });
    fetch('/api/settings/preferences', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ [prefsKey]: payload }),
    }).catch(() => {});
  }

  function applyFilters() {
    const rows = document.querySelectorAll('[data-wi-row]');
    let visible = 0;
    const total = rows.length;
    const hasFilters = excludedStatus.size || excludedPriority.size || activeFilters.epic || activeFilters.tags;

    // Build set of work item IDs that have active sessions
    const wiIdsWithActiveSessions = new Set();
    for (const d of activeDispatches) { if (d.status === 'running' && d.work_item_id) wiIdsWithActiveSessions.add(d.work_item_id); }
    for (const t of activeTerminals) { if (t.status === 'running' && t.work_item_id) wiIdsWithActiveSessions.add(t.work_item_id); }

    rows.forEach(row => {
      let show = true;
      if (excludedStatus.has(row.dataset.wiStatusVal)) show = false;
      if (excludedPriority.has(row.dataset.wiPriorityVal)) show = false;
      if (activeFilters.epic && row.dataset.wiEpicVal !== activeFilters.epic) show = false;
      if (activeFilters.tags) {
        const rowTags = (row.dataset.wiTagsVal || '').toLowerCase();
        if (!rowTags.includes(activeFilters.tags.toLowerCase())) show = false;
      }
      // Force-show rows with active sessions even if filtered out
      const wiId = row.querySelector('code')?.textContent;
      const hasActiveSessions = wiId && wiIdsWithActiveSessions.has(wiId);
      if (!show && hasActiveSessions) {
        show = true;
        row.style.opacity = '0.7';
        row.style.borderLeft = '3px solid var(--orange)';
        row.title = 'Hidden by filters but has active sessions';
      } else {
        row.style.opacity = '';
        row.style.borderLeft = '';
        row.title = '';
      }
      row.style.display = show ? '' : 'none';
      const idx = row.dataset.wiRow;
      const detail = document.querySelector(`[data-wi-detail="${idx}"]`);
      const sessions = document.querySelector(`[data-wi-sessions="${wiId}"]`);
      if (detail && !show) detail.style.display = 'none';
      if (sessions) sessions.style.display = show ? '' : 'none';
      if (show) visible++;
    });

    const countEl = document.getElementById('wi-filter-count');
    if (countEl) countEl.textContent = hasFilters ? `${visible} of ${total} tasks` : `${total} tasks`;
    const clearBtn = document.getElementById('wi-filter-clear');
    if (clearBtn) clearBtn.style.display = hasFilters ? '' : 'none';
    saveFilters();
  }

  // Status checkboxes
  bar.querySelectorAll('input[data-wi-status]').forEach(cb => {
    cb.onchange = () => {
      const val = cb.dataset.wiStatus;
      if (cb.checked) excludedStatus.delete(val);
      else excludedStatus.add(val);
      applyFilters();
    };
  });

  // Priority checkboxes
  bar.querySelectorAll('input[data-wi-priority]').forEach(cb => {
    cb.onchange = () => {
      const val = cb.dataset.wiPriority;
      if (cb.checked) excludedPriority.delete(val);
      else excludedPriority.add(val);
      applyFilters();
    };
  });

  // Epic dropdown
  const epicSel = document.getElementById('wi-filter-epic');
  if (epicSel) epicSel.onchange = () => { activeFilters.epic = epicSel.value; applyFilters(); };

  // Tags input
  const tagsInput = document.getElementById('wi-filter-tags');
  if (tagsInput) tagsInput.oninput = () => { activeFilters.tags = tagsInput.value; applyFilters(); };

  // Clear button — resets to show all
  const clearBtn = document.getElementById('wi-filter-clear');
  if (clearBtn) clearBtn.onclick = () => {
    excludedStatus.clear();
    excludedPriority.clear();
    activeFilters.epic = '';
    activeFilters.tags = '';
    bar.querySelectorAll('input[data-wi-status], input[data-wi-priority]').forEach(cb => { cb.checked = true; });
    if (epicSel) epicSel.value = '';
    if (tagsInput) tagsInput.value = '';
    applyFilters();
  };

  // Column sorting
  const wiTable = document.getElementById('wi-table');
  if (wiTable) {
    const priorityOrder = { critical: 0, high: 1, medium: 2, low: 3 };
    const statusOrder = { 'draft': 0, 'planned': 1, 'in-progress': 2, 'blocked': 3, 'in-review': 4, 'testing': 5, 'preview': 6, 'done': 7, 'cancelled': 8, 'archived': 9 };
    let sortCol = null, sortAsc = true;

    wiTable.querySelectorAll('th[data-wi-sort]').forEach(th => {
      th.onclick = () => {
        const col = th.dataset.wiSort;
        if (sortCol === col) sortAsc = !sortAsc;
        else { sortCol = col; sortAsc = true; }
        // Update header indicators
        wiTable.querySelectorAll('th[data-wi-sort]').forEach(h => {
          h.textContent = h.textContent.replace(/ [↑↓⇅]$/, '') + (h.dataset.wiSort === sortCol ? (sortAsc ? ' ↑' : ' ↓') : ' ⇅');
        });
        // Sort visible rows
        const tbody = wiTable.querySelector('tbody');
        const rows = [...tbody.querySelectorAll('[data-wi-row]')];
        rows.sort((a, b) => {
          let va, vb;
          if (col === 'id') {
            va = parseInt((a.querySelector('code')?.textContent || '').replace(/\D/g, '')) || 0;
            vb = parseInt((b.querySelector('code')?.textContent || '').replace(/\D/g, '')) || 0;
          } else if (col === 'status') {
            va = statusOrder[a.dataset.wiStatusVal] ?? 99;
            vb = statusOrder[b.dataset.wiStatusVal] ?? 99;
          } else if (col === 'priority') {
            va = priorityOrder[a.dataset.wiPriorityVal] ?? 99;
            vb = priorityOrder[b.dataset.wiPriorityVal] ?? 99;
          } else if (col === 'createdat') {
            va = parseInt(a.dataset.wiCreatedatVal || '0', 10);
            vb = parseInt(b.dataset.wiCreatedatVal || '0', 10);
          } else if (col === 'doneat') {
            va = parseInt(a.dataset.wiDoneatVal || '0', 10);
            vb = parseInt(b.dataset.wiDoneatVal || '0', 10);
            if (va === 0 && vb === 0) return 0;
            if (va === 0) return 1;
            if (vb === 0) return -1;
          }
          return sortAsc ? va - vb : vb - va;
        });
        // Re-append rows in sorted order (detail + session rows follow their parent)
        rows.forEach(row => {
          const idx = row.dataset.wiRow;
          tbody.appendChild(row);
          const detail = tbody.querySelector(`[data-wi-detail="${idx}"]`);
          if (detail) tbody.appendChild(detail);
          const wiId = row.querySelector('code')?.textContent;
          const sessions = tbody.querySelector(`[data-wi-sessions="${wiId}"]`);
          if (sessions) tbody.appendChild(sessions);
        });
      };
    });
  }
}

// --- Agent-Gated Task Creation ---
async function startAgentTaskCreation(projectKey) {
  const input = prompt('Describe the task you want to create (the coordinator will turn this into a work item):');
  if (!input || !input.trim()) return;

  try {
    const res = await fetch('/api/dispatch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        work_item_id: null,
        project_key: projectKey,
        dispatch_mode: 'task_creation',
        additional_instructions: input.trim(),
        permission_mode: 'acceptEdits'
      })
    });
    if (!res.ok) {
      const e = await res.json();
      alert(e.error || 'Failed to start task creation');
      return;
    }
    refreshSessionsSidebar();
  } catch (e) {
    alert('Task creation request failed');
  }
}

      </div>
      <div class="field">
        <label>Depends On (comma-separated W-XXX IDs)</label>
        <input type="text" id="wi-depends" value="${isEdit && existingItem.depends_on ? esc(existingItem.depends_on.join(', ')) : ''}" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="wi-cancel">Cancel</button>
        <button class="btn btn-dispatch" id="wi-save">${isEdit ? 'Save' : 'Create'}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.querySelector('#wi-cancel').onclick = () => overlay.remove();
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  overlay.querySelector('#wi-save').onclick = async () => {
    const title = overlay.querySelector('#wi-title').value.trim();
    if (!title) { alert('Title is required'); return; }

    const btn = overlay.querySelector('#wi-save');
    btn.disabled = true;
    btn.textContent = isEdit ? 'Saving...' : 'Creating...';

    const payload = {
      title,
      status: overlay.querySelector('#wi-status').value,
      priority: overlay.querySelector('#wi-priority').value,
      description: overlay.querySelector('#wi-description').value.trim(),
      tags: overlay.querySelector('#wi-tags').value.split(',').map(t => t.trim()).filter(Boolean),
      depends_on: overlay.querySelector('#wi-depends').value.split(',').map(t => t.trim()).filter(Boolean),
    };

    try {
      const url = isEdit ? `/api/work-items/${existingItem.id}` : '/api/work-items';
      const method = isEdit ? 'PATCH' : 'POST';
      if (!isEdit) payload.project_key = currentProjectKey;

      const resp = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const result = await resp.json();
      if (!resp.ok) throw new Error(result.error || 'Failed');

      overlay.remove();
      setBacklog(null); setEpicCache(null); // bust cache
      await Promise.all([buildTree(), buildEpicTree()]);
      route();
    } catch (e) {
      btn.disabled = false;
      btn.textContent = isEdit ? 'Save' : 'Create';
      alert('Error: ' + e.message);
    }
  };
}

async function showRefineProjectModal(org, proj, comp) {
  const projectKey = `${org}/${proj}/${comp}`;
  let inScopeItems = [];
  try {
    const res = await fetch(`/api/backlog?org=${encodeURIComponent(org)}`);
    const data = await res.json();
    const group = (data.projects || {})[projectKey] || { items: [] };
    const nonTerminal = new Set(['draft', 'planned', 'blocked']);
    inScopeItems = (group.items || []).filter(it => nonTerminal.has(it.status));
  } catch {}

  const byStatus = {};
  for (const item of inScopeItems) {
    if (!byStatus[item.status]) byStatus[item.status] = [];
    byStatus[item.status].push(item);
  }

  let itemListHtml = '';
  for (const [status, items] of Object.entries(byStatus)) {
    itemListHtml += `<div style="margin-top:8px"><strong style="font-size:12px;text-transform:uppercase;color:var(--text-light)">${esc(status)}</strong><ul style="margin:4px 0 0 16px;padding:0;font-size:13px">`;
    for (const item of items) itemListHtml += `<li>${esc(item.id)}: ${esc(item.title)}</li>`;
    itemListHtml += `</ul></div>`;
  }
  if (!itemListHtml) itemListHtml = '<p style="font-size:13px;color:var(--text-light)">No non-terminal items in scope.</p>';

  const { overlay } = createDispatchOverlay({
    title: `Refine Project: ${org}/${proj}/${comp}`,
    submitLabel: 'Confirm',
    cancelId: 'refine-project-cancel',
    submitId: 'refine-project-submit',
    buildFields: () => `
      <div class="field">
        <label>In-scope items (${inScopeItems.length})</label>
        <div style="max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:4px;padding:8px">${itemListHtml}</div>
      </div>
      <div class="field">
        <label for="refine-project-instructions">Additional instructions (optional)</label>
        <textarea id="refine-project-instructions" placeholder="e.g. Focus on API contracts; skip infrastructure items..." style="height:80px"></textarea>
      </div>
      <div style="margin-bottom:12px;">
        <label style="font-weight:600;display:block;margin-bottom:6px;">Mode</label>
        <label style="display:inline-flex;align-items:center;gap:6px;margin-right:16px;">
          <input type="radio" name="refine-mode" value="background" checked> Background
        </label>
        <label style="display:inline-flex;align-items:center;gap:6px;">
          <input type="radio" name="refine-mode" value="terminal"> Interactive terminal
        </label>
      </div>
      <div class="field" style="flex-direction:row;align-items:center;gap:8px">
        <input type="checkbox" id="refine-project-dry-run" />
        <label for="refine-project-dry-run" style="font-size:13px">Dry run (no changes — preview only)</label>
      </div>
    `,
    onSubmit: async (ov) => {
      const instructions = ov.querySelector('#refine-project-instructions')?.value || '';
      const dryRun = ov.querySelector('#refine-project-dry-run')?.checked || false;
      const mode = ov.querySelector('input[name="refine-mode"]:checked')?.value ?? 'background';
      const endpoint = mode === 'terminal'
        ? `/api/projects/${encodeURIComponent(org)}/${encodeURIComponent(proj)}/${encodeURIComponent(comp)}/refine-terminal`
        : `/api/projects/${encodeURIComponent(org)}/${encodeURIComponent(proj)}/${encodeURIComponent(comp)}/refine`;
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ instructions: instructions || undefined, dry_run: dryRun || undefined }),
      });
      const result = await res.json();
      if (!res.ok) throw new Error(result.error || 'Dispatch failed');
      if (result.terminal_id) {
        // Terminal mode: modal closes (handled by createDispatchOverlay after onSubmit),
        // terminal panel will appear separately via SSE/polling.
        return;
      }
      setTimeout(() => {
        const panel = document.getElementById(`dispatch-${result.dispatch_id}`);
        if (panel) panel.scrollIntoView({ behavior: 'smooth' });
      }, 300);
    },
  });
}

      createDispatchPanel(dispatch);
      placeSessionPanels();
      loadDispatchContent(dispatch);
    },
  });

  overlay.querySelector('.modal').style.maxWidth = '560px';

  const [org, proj, comp] = projectKey.split('/');
  try {
    prs = await api(`project/${org}/${proj}/${comp}/prs`);

    if (!prs.length) {

      listEl.innerHTML = prs.map((pr, i) => `

          <span style="font-size:11px;color:var(--text-light);flex-shrink:0">${esc(pr.headRefName)}</span>
        </label>
      `).join('');
    }
  } catch (e) {
    const listEl = overlay.querySelector('#review-pr-list');
    if (listEl) listEl.innerHTML = `<span style="color:var(--red);font-size:13px">Failed to fetch PRs</span>`;
  }
}

function renderEpicListView(epics) {
  const isInactive = s => s === 'done' || s === 'cancelled' || s === 'archived';
  const hasCompleted = epics.some(e => isInactive(e.status));
  let html = `<div class="card"><h2>Epics</h2>`;
  html += `<button class="btn-add-wi" id="create-epic">+ New Epic</button>`;
  if (hasCompleted) {
    html += `<label class="filter-checkbox" style="margin-left:12px"><input type="checkbox" id="epic-show-done" />Show completed &amp; archived</label>`;
  }
  if (epics.length) {
    html += `<table><thead><tr><th>ID</th><th>Title</th><th>Status</th><th>Priority</th><th>Progress</th><th>Projects</th><th>Target</th><th></th></tr></thead><tbody>`;
    for (const epic of epics) {
      const p = epic.progress || { done: 0, total: 0 };
      const pct = p.total ? Math.round(p.done / p.total * 100) : 0;
      const hideCompleted = isInactive(epic.status) ? ' style="display:none"' : '';
      const statusBadge = epic.status === 'active' ? 'open' : epic.status === 'done' ? 'done' : epic.status === 'archived' ? 'archived' : 'medium';
      const canArchive = epic.status === 'done' || epic.status === 'cancelled';
      html += `<tr data-epic-list-status="${esc(epic.status)}"${hideCompleted}>`;
      html += `<td><code style="cursor:pointer" data-epic-nav="${esc(epic.id)}">${esc(epic.id)}</code></td>`;
      html += `<td>${esc(epic.title)}</td>`;
      html += `<td><span class="badge badge-${statusBadge}">${esc(epic.status)}</span></td>`;
      html += `<td><span class="badge badge-${epic.priority || 'medium'}">${esc(epic.priority || 'medium')}</span></td>`;
      html += `<td>${p.done}/${p.total} (${pct}%)</td>`;
      html += `<td>${(epic.project_keys || []).map(k => `<span class="tag">${esc(k)}</span>`).join('')}</td>`;
      html += `<td>${epic.target_date || '—'}</td>`;
      html += `<td><button class="dispatch-btn" data-epic-edit="${esc(epic.id)}" style="background:var(--accent)">edit</button><button class="dispatch-btn" data-epic-delete="${esc(epic.id)}" style="background:var(--red);margin-left:4px">delete</button><button class="dispatch-btn" data-epic-dispatch="${esc(epic.id)}" style="margin-left:4px">dispatch</button><button class="dispatch-btn" data-epic-discuss="${esc(epic.id)}" style="background:var(--teal);margin-left:4px">discuss</button>${canArchive ? `<button class="dispatch-btn" data-epic-archive="${esc(epic.id)}" style="background:#94a3b8;margin-left:4px">archive</button>` : ''}</td>`;
      html += `</tr>`;
    }
    html += `</tbody></table>`;
  } else {
    html += `<p class="empty">No epics yet.</p>`;
  }
  html += `</div>`;
  return html;
}
