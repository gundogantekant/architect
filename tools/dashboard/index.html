}

async function showQuickDispatchModal() {
  let registryKeys = [];
  try {
    const registry = await api('registry');
    for (const [, entry] of Object.entries(registry.entries)) {
      registryKeys.push(`${entry.org}/${entry.project}/${entry.component}`);
    }
    registryKeys.sort();
  } catch {}
  if (!registryKeys.includes(ARCHITECT_KEY)) registryKeys.unshift(ARCHITECT_KEY);

  let epicsList = [];
  try { epicsList = await getEpics(); } catch {}

  const { overlay } = createDispatchOverlay({
    title: 'Quick Dispatch',
    cancelId: 'qd-cancel',
    submitId: 'qd-go',
    buildFields: () => `
      <div class="field">
        <label>Target Project *</label>
        <select id="qd-project">
          ${registryKeys.map(k => `<option value="${esc(k)}">${esc(k)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Work Item ID (optional)</label>
        <input type="text" id="qd-work-item" placeholder="W-XXX" />
      </div>
      <div class="field">
        <label>Epic (optional)</label>
        <select id="qd-epic">
          <option value="">None</option>
          ${epicsList.map(e => `<option value="${esc(e.id)}">${esc(e.id)}: ${esc(e.title)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Instructions</label>
        <textarea id="qd-instructions" placeholder="What should the agent do?"></textarea>
      </div>
      <div class="field">
        <label for="qd-agent-type">Agent</label>
        <select id="qd-agent-type">
          <option value="claude" selected>Claude</option>
          <option value="shell">Shell</option>
          <option value="codex">Codex</option>
          <option value="gemini">Gemini</option>
        </select>
      </div>
      <div class="interactive-toggle">
        <input type="checkbox" id="qd-claude-agent" checked />
        <label for="qd-claude-agent">Claude Agent</label>
      </div>
      ${permissionModeSelect('qd-perm-mode')}
      ${skipPermissionsCheckbox('qd-skip-perms')}
    `,
    afterMount: (o) => wireAgentTypeToggle(o, 'qd-agent-type', 'qd-perm-mode', 'qd-skip-perms'),
    onSubmit: async (overlay) => {
      const pk = overlay.querySelector('#qd-project').value;
      const wid = overlay.querySelector('#qd-work-item').value.trim() || null;
      const epicId = overlay.querySelector('#qd-epic').value || null;
      const instructions = overlay.querySelector('#qd-instructions').value.trim();
      const plainTerminal = !overlay.querySelector('#qd-claude-agent').checked;
      const agentType = overlay.querySelector('#qd-agent-type')?.value || 'claude';
      const permMode = getPermissionMode(overlay, 'qd-perm-mode');
      const skipPerms = overlay.querySelector('#qd-skip-perms').checked;

      if (!pk) { throw new Error('Project is required'); }
      if (!plainTerminal && !wid && !instructions) { throw new Error('Work item or instructions required'); }

      const endpoint = plainTerminal ? '/api/terminal/shell' : '/api/terminal';
      const titleText = wid || instructions?.slice(0, 60) || 'Quick dispatch';
      const body = plainTerminal
        ? { work_item_id: wid, epic_id: epicId, project_key: pk, title: titleText }
        : {
            work_item_id: wid,
            epic_id: epicId,
            project_key: pk,
            title: titleText,
            additional_instructions: instructions,
            permission_mode: permMode,
            skip_permissions: skipPerms,
            agentType,
          };
      const resp = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const result = await resp.json();
      if (!resp.ok) throw new Error(result.error || 'Dispatch failed');

      let projectPath = '';
      if (pk === ARCHITECT_KEY) {
        projectPath = '(architect root)';
      } else {
        try {
          const registry = await api('registry');
          for (const [path, entry] of Object.entries(registry.entries)) {
            if (`${entry.org}/${entry.project}/${entry.component}` === pk) { projectPath = path; break; }
          }
        } catch {}
      }

      const terminalInfo = {
        id: result.terminal_id, type: plainTerminal ? 'shell' : 'claude',
        agent_type: plainTerminal ? 'shell' : agentType,
        work_item_id: wid, epic_id: epicId,
        project_key: pk, project_path: projectPath,
        title: titleText,
        permission_mode: plainTerminal ? 'acceptEdits' : permMode,
        skip_permissions: skipPerms,
        status: 'running', started_at: new Date().toISOString(),
      };
      activeTerminals.push(terminalInfo);
      syncSessionState();
      createTerminalPanel(terminalInfo);
      placeSessionPanels();
      await initSession(terminalInfo);
      // Refresh agents view if on that page
      if (location.hash.startsWith('#agents')) route();
    },
  });

  overlay.querySelector('#qd-claude-agent').onchange = () => {
    const agent = overlay.querySelector('#qd-claude-agent').checked;
    overlay.querySelector('#qd-perm-mode').disabled = !agent;
    overlay.querySelector('#qd-skip-perms').disabled = !agent;
  };
}

function formatDuration(seconds) {
  if (!seconds || seconds < 0) return '0m';
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}

function formatCost(usd) {
  if (!usd) return '-';
  return `$${usd.toFixed(2)}`;
}

const CHART_COLORS = ['#7c3aed','#3b82f6','#22c55e','#f59e0b','#ec4899','#14b8a6','#f97316','#8b5cf6'];

function assignProjectColors(rows) {
  const seen = new Map();
  let idx = 0;
  for (const r of rows) {
    if (!seen.has(r.project_key)) {
      seen.set(r.project_key, { label: r.component ? `${r.project}/${r.component}` : r.project_key, color: CHART_COLORS[idx % CHART_COLORS.length] });
      idx++;
    }
  }
  return seen;
}

function renderBarChart(data) {
  if (!data.length) return '<p style="color:var(--text-light);font-size:13px">No data.</p>';
  const maxVal = Math.max(...data.map(d => d.value));
  const barH = 26, gap = 4, labelW = 140, valW = 60, chartW = 500, barArea = chartW - labelW - valW;
  const svgH = data.length * (barH + gap);
  let svg = `<svg viewBox="0 0 ${chartW} ${svgH}" style="width:100%;max-width:${chartW}px;display:block">`;
  data.forEach((d, i) => {
    const y = i * (barH + gap);
    const w = maxVal > 0 ? (d.value / maxVal) * barArea : 0;
    const label = d.label.length > 20 ? d.label.slice(0, 18) + '..' : d.label;
    svg += `<text x="0" y="${y + barH / 2 + 4}" font-size="12" fill="currentColor" style="font-family:inherit">${esc(label)}</text>`;
    svg += `<rect x="${labelW}" y="${y + 2}" width="${Math.max(w, 1)}" height="${barH - 4}" rx="3" fill="${d.color}" opacity="0.85"/>`;
    svg += `<text x="${labelW + w + 6}" y="${y + barH / 2 + 4}" font-size="11" fill="currentColor" style="font-family:inherit">${d.valLabel}</text>`;
  });
  svg += '</svg>';
  return svg;
}

function renderDonutChart(data, totalLabel) {
  if (!data.length) return '<p style="color:var(--text-light);font-size:13px">No data.</p>';
  const size = 180, cx = size / 2, cy = size / 2, r = 70, inner = 45;
  const total = data.reduce((s, d) => s + d.value, 0);
  if (total <= 0) return '<p style="color:var(--text-light);font-size:13px">No data.</p>';
  let svg = `<div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap">`;
  svg += `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;flex-shrink:0">`;
  let angle = -Math.PI / 2;
  for (const d of data) {
    const sweep = (d.value / total) * Math.PI * 2;
    if (sweep < 0.01) continue;
    const x1 = cx + r * Math.cos(angle), y1 = cy + r * Math.sin(angle);
    const x2 = cx + r * Math.cos(angle + sweep), y2 = cy + r * Math.sin(angle + sweep);
    const ix1 = cx + inner * Math.cos(angle + sweep), iy1 = cy + inner * Math.sin(angle + sweep);
    const ix2 = cx + inner * Math.cos(angle), iy2 = cy + inner * Math.sin(angle);
    const large = sweep > Math.PI ? 1 : 0;
    svg += `<path d="M${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} L${ix1},${iy1} A${inner},${inner} 0 ${large} 0 ${ix2},${iy2} Z" fill="${d.color}" opacity="0.85"/>`;
    angle += sweep;
  }
  svg += `<text x="${cx}" y="${cy - 4}" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor" style="font-family:inherit">${totalLabel}</text>`;
  svg += `<text x="${cx}" y="${cy + 12}" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.6" style="font-family:inherit">total</text>`;
  svg += '</svg>';
  svg += '<div style="font-size:12px;line-height:1.8">';
  for (const d of data) {
    const pct = ((d.value / total) * 100).toFixed(1);
    svg += `<div><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${d.color};margin-right:6px"></span>${esc(d.label)} <span style="color:var(--text-light)">${pct}%</span></div>`;
  }
  svg += '</div></div>';
  return svg;
}

function renderStackedBarChart(columns, projects, matrix) {
  if (!columns.length || !projects.length) return '<p style="color:var(--text-light);font-size:13px">No data.</p>';
  const colTotals = columns.map((_, ci) => projects.reduce((s, _, pi) => s + (matrix[pi]?.[ci] || 0), 0));
  const maxVal = Math.max(...colTotals, 0.001);
  const pad = { l: 36, r: 10, t: 10, b: 50 }, chartH = 200;
  const svgW = pad.l + columns.length * 44 + pad.r, svgH = chartH + pad.t + pad.b;
  const barW = 30, barArea = chartH;
  let svg = `<svg viewBox="0 0 ${svgW} ${svgH}" style="width:100%;max-width:${svgW}px;display:block">`;
  // Y-axis labels
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + barArea - (i / 4) * barArea;
    const val = ((maxVal / 3600) * (i / 4)).toFixed(1);
    svg += `<text x="${pad.l - 4}" y="${y + 3}" text-anchor="end" font-size="9" fill="currentColor" opacity="0.5" style="font-family:inherit">${val}h</text>`;
    svg += `<line x1="${pad.l}" y1="${y}" x2="${svgW - pad.r}" y2="${y}" stroke="currentColor" opacity="0.08"/>`;
  }
  columns.forEach((col, ci) => {
    const x = pad.l + ci * 44 + 7;
    let yBottom = pad.t + barArea;
    projects.forEach((p, pi) => {
      const val = matrix[pi]?.[ci] || 0;
      if (val <= 0) return;
      const h = (val / maxVal) * barArea;
      yBottom -= h;
      svg += `<rect x="${x}" y="${yBottom}" width="${barW}" height="${h}" rx="2" fill="${p.color}" opacity="0.85"/>`;
    });
    svg += `<text x="${x + barW / 2}" y="${pad.t + barArea + 14}" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.6" transform="rotate(45,${x + barW / 2},${pad.t + barArea + 14})" style="font-family:inherit">${esc(col)}</text>`;
  });
  svg += '</svg>';
  // Legend
  svg += '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:11px">';
  for (const p of projects) {
    svg += `<div><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${p.color};margin-right:4px"></span>${esc(p.label)}</div>`;
  }
  svg += '</div>';
  return svg;
}

function renderPivotTable(data, periodKey, labelFn) {
  if (!data.length) return '<p style="color:var(--text-light);font-size:13px">No sessions in this period.</p>';
  const periods = [...new Set(data.map(d => d[periodKey]))].sort();
  const projectMap = new Map();
  for (const d of data) {
    if (!projectMap.has(d.project_key)) projectMap.set(d.project_key, { label: d.component ? `${d.project}/${d.component}` : d.project_key, org: d.org, totals: 0 });
    projectMap.get(d.project_key).totals += d.time_seconds;
  }
  const projectKeys = [...projectMap.keys()].sort((a, b) => projectMap.get(b).totals - projectMap.get(a).totals);
  const lookup = new Map();
  for (const d of data) lookup.set(`${d.project_key}|${d[periodKey]}`, d.time_seconds);
  const colTotals = periods.map(p => projectKeys.reduce((s, pk) => s + (lookup.get(`${pk}|${p}`) || 0), 0));
  const maxCell = Math.max(...[...lookup.values()], 0.001);
  const compact = periods.length > 7;
  const cellPad = compact ? '4px 5px' : '6px 10px';
  const fontSize = compact ? '11px' : '12px';
  let html = `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:${fontSize}">`;
  html += `<thead><tr style="border-bottom:2px solid var(--border)"><th style="padding:${cellPad};text-align:left">Project</th>`;
  for (const p of periods) html += `<th style="padding:${cellPad};text-align:right;white-space:nowrap">${esc(labelFn(p))}</th>`;
  html += `<th style="padding:${cellPad};text-align:right;font-weight:700">Total</th></tr></thead><tbody>`;
  for (const pk of projectKeys) {
    const info = projectMap.get(pk);
    html += `<tr style="border-bottom:1px solid var(--border)">`;
    html += `<td style="padding:${cellPad};white-space:nowrap"><span style="color:var(--text-light);font-size:10px">${esc(info.org || '')}</span> ${esc(info.label)}</td>`;
    for (const p of periods) {
      const val = lookup.get(`${pk}|${p}`) || 0;
      const opacity = val > 0 ? (0.06 + 0.2 * (val / maxCell)).toFixed(2) : 0;
      const bg = val > 0 ? `background:rgba(124,58,237,${opacity})` : '';
      html += `<td style="padding:${cellPad};text-align:right;${bg}">${val > 0 ? formatDuration(val) : '<span style="color:var(--text-light)">–</span>'}</td>`;
    }
    html += `<td style="padding:${cellPad};text-align:right;font-weight:600">${formatDuration(info.totals)}</td></tr>`;
  }
  html += `<tr style="border-top:2px solid var(--border);font-weight:700"><td style="padding:${cellPad}">Total</td>`;
  for (const t of colTotals) html += `<td style="padding:${cellPad};text-align:right">${formatDuration(t)}</td>`;
  const grandTotal = colTotals.reduce((s, t) => s + t, 0);
  html += `<td style="padding:${cellPad};text-align:right">${formatDuration(grandTotal)}</td></tr>`;
  html += '</tbody></table></div>';
  return html;
}

function renderTimeReport(report, groupBy) {
  groupBy = groupBy || 'project';
  const isOrg = groupBy === 'org';
  const todayStr = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  const entityLabel = isOrg ? 'Organization' : 'Project';

  function renderTable(rows, totals) {
    if (!rows.length) return '<p style="color:var(--text-light);font-size:13px">No sessions recorded yet.</p>';
    let html = `<table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead><tr style="border-bottom:2px solid var(--border);text-align:left">
        <th style="padding:8px 12px">${entityLabel}</th>
        <th style="padding:8px 12px;text-align:right">Sessions</th>
        <th style="padding:8px 12px;text-align:right">Time</th>
        <th style="padding:8px 12px;text-align:right">Cost</th>
      </tr></thead><tbody>`;
    for (const r of rows) {
      const label = isOrg ? (r.org || r.project_key) : (r.component ? `${r.project} / ${r.component}` : r.project_key);
      const orgPrefix = isOrg ? '' : `<span style="color:var(--text-light);font-size:11px">${esc(r.org || '')}</span> `;
      html += `<tr style="border-bottom:1px solid var(--border)">
        <td style="padding:8px 12px">${orgPrefix}${esc(label)}</td>
        <td style="padding:8px 12px;text-align:right">${r.sessions}</td>
        <td style="padding:8px 12px;text-align:right;font-weight:600">${formatDuration(r.time_seconds)}</td>
        <td style="padding:8px 12px;text-align:right">${formatCost(r.cost_usd)}</td>
      </tr>`;
    }
    html += `<tr style="border-top:2px solid var(--border);font-weight:700">
      <td style="padding:8px 12px">Total</td>
      <td style="padding:8px 12px;text-align:right">${totals.sessions}</td>
      <td style="padding:8px 12px;text-align:right">${formatDuration(totals.time_seconds)}</td>
      <td style="padding:8px 12px;text-align:right">${formatCost(totals.cost_usd)}</td>
    </tr></tbody></table>`;
    return html;
  }

  // Color assignments from overall data (most time first)
  const colorMap = assignProjectColors(report.overall);

  // Today bar chart
  const todayBarData = report.today.map(r => {
    const info = colorMap.get(r.project_key) || { label: r.project_key, color: CHART_COLORS[0] };
    return { label: info.label, value: r.time_seconds, valLabel: formatDuration(r.time_seconds), color: info.color };
  });

  // All Time donut + bar
  const allTimeDonut = report.overall.map(r => {
    const info = colorMap.get(r.project_key) || { label: r.project_key, color: CHART_COLORS[0] };
    return { label: info.label, value: r.time_seconds, color: info.color };
  });
  const allTimeBar = report.overall.map(r => {
    const info = colorMap.get(r.project_key) || { label: r.project_key, color: CHART_COLORS[0] };
    return { label: info.label, value: r.time_seconds, valLabel: formatDuration(r.time_seconds), color: info.color };
  });

  // Daily stacked chart
  const dailyCols = [...new Set((report.daily || []).map(d => d.day))].sort();
  const dailyProjects = [];
  const dailyPkSet = new Set();
  for (const d of (report.daily || [])) {
    if (!dailyPkSet.has(d.project_key)) {
      dailyPkSet.add(d.project_key);
      const info = colorMap.get(d.project_key) || { label: d.project_key, color: CHART_COLORS[dailyProjects.length % CHART_COLORS.length] };
      dailyProjects.push({ key: d.project_key, label: info.label, color: info.color });
    }
  }
  const dailyLookup = new Map();
  for (const d of (report.daily || [])) dailyLookup.set(`${d.project_key}|${d.day}`, d.time_seconds);
  const dailyMatrix = dailyProjects.map(p => dailyCols.map(c => dailyLookup.get(`${p.key}|${c}`) || 0));
  const dailyColLabels = dailyCols.map(d => { const dt = new Date(d + 'T00:00:00'); return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); });

  // Monthly stacked chart
  const monthlyCols = [...new Set((report.monthly || []).map(d => d.month))].sort();
  const monthlyProjects = [];
  const monthlyPkSet = new Set();
  for (const d of (report.monthly || [])) {
    if (!monthlyPkSet.has(d.project_key)) {
      monthlyPkSet.add(d.project_key);
      const info = colorMap.get(d.project_key) || { label: d.project_key, color: CHART_COLORS[monthlyProjects.length % CHART_COLORS.length] };
      monthlyProjects.push({ key: d.project_key, label: info.label, color: info.color });
    }
  }
  const monthlyLookup = new Map();
  for (const d of (report.monthly || [])) monthlyLookup.set(`${d.project_key}|${d.month}`, d.time_seconds);
  const monthlyMatrix = monthlyProjects.map(p => monthlyCols.map(c => monthlyLookup.get(`${p.key}|${c}`) || 0));
  const monthlyColLabels = monthlyCols.map(m => { const [y, mo] = m.split('-'); return new Date(+y, +mo - 1).toLocaleDateString('en-US', { month: 'short', year: '2-digit' }); });

  const groupToggle = `<div style="display:inline-flex;gap:0;border:1px solid var(--border);border-radius:6px;overflow:hidden;font-size:12px;margin-left:12px;vertical-align:middle">
    <span data-tr-group="project" style="padding:4px 10px;cursor:pointer;${!isOrg ? 'background:var(--accent);color:#fff' : 'color:var(--text-light)'}">By Project</span>
    <span data-tr-group="org" style="padding:4px 10px;cursor:pointer;border-left:1px solid var(--border);${isOrg ? 'background:var(--accent);color:#fff' : 'color:var(--text-light)'}">By Organization</span>
  </div>`;

  return `<div class="card">
    <h2 style="margin-bottom:4px">Time Report ${groupToggle}</h2>
    <p style="color:var(--text-light);font-size:13px;margin-bottom:16px">${todayStr}</p>
    <div class="tabs" id="tr-tabs">
      <div class="tab active" data-tab="0">Today</div>
      <div class="tab" data-tab="1">All Time</div>
      <div class="tab" data-tab="2">Daily (14d)</div>
      <div class="tab" data-tab="3">Monthly (6mo)</div>
    </div>
    <div class="tab-content active" data-panel="0">
      <div style="margin-bottom:20px">${renderBarChart(todayBarData)}</div>
      ${renderTable(report.today, report.today_total)}
    </div>
    <div class="tab-content" data-panel="1">
      <div style="margin-bottom:20px">${renderDonutChart(allTimeDonut, formatDuration(report.overall_total.time_seconds))}</div>
      <h3 style="font-size:14px;margin:20px 0 10px;color:var(--accent)">By ${entityLabel}</h3>
      <div style="margin-bottom:20px">${renderBarChart(allTimeBar)}</div>
      ${renderTable(report.overall, report.overall_total)}
    </div>
    <div class="tab-content" data-panel="2">
      <div style="margin-bottom:20px">${renderStackedBarChart(dailyColLabels, dailyProjects, dailyMatrix)}</div>
      <h3 style="font-size:14px;margin:20px 0 10px;color:var(--accent)">Daily Breakdown</h3>
      ${renderPivotTable(report.daily || [], 'day', d => { const dt = new Date(d + 'T00:00:00'); return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', weekday: 'short' }); })}
    </div>
    <div class="tab-content" data-panel="3">
      <div style="margin-bottom:20px">${renderStackedBarChart(monthlyColLabels, monthlyProjects, monthlyMatrix)}</div>
      <h3 style="font-size:14px;margin:20px 0 10px;color:var(--accent)">Monthly Breakdown</h3>
      ${renderPivotTable(report.monthly || [], 'month', m => { const [y, mo] = m.split('-'); return new Date(+y, +mo - 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' }); })}
    </div>
  </div>`;
}

function bindTimeReportTabs() {
  const tabs = document.querySelectorAll('#tr-tabs .tab');
  tabs.forEach(tab => {
    tab.onclick = () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const card = document.querySelector('#tr-tabs').closest('.card');
      card.querySelectorAll('.tab-content').forEach(p => p.classList.remove('active'));
      card.querySelector(`.tab-content[data-panel="${tab.dataset.tab}"]`).classList.add('active');
    };
  });
}

function bindTimeReportGroupToggle() {
  document.querySelectorAll('[data-tr-group]').forEach(el => {
    el.onclick = () => {
      sessionStorage.setItem('time-report-group', el.dataset.trGroup);
      route();
    };
  });
}

// --- Settings view ---

function formatUptime(seconds) {
  if (seconds < 60) return seconds + 's';
  const m = Math.floor(seconds / 60);
  if (m < 60) return m + 'm ' + (seconds % 60) + 's';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ' + (m % 60) + 'm';
  const d = Math.floor(h / 24);
  return d + 'd ' + (h % 24) + 'h ' + (m % 60) + 'm';
}

function renderSettingsView(status, config) {

async function loadRefinementTemplates() {
  const container = document.getElementById('refinement-templates-list');
  if (!container) return;
  try {
    const res = await fetch('/api/projects');
    if (!res.ok) { container.textContent = '(could not load projects)'; return; }
    const projects = await res.json();
    if (projects.length === 0) { container.innerHTML = '<p style="font-size:13px;color:var(--text-light)">No projects onboarded.</p>'; return; }

    let html = '';
    for (const p of projects) {
      const { org, project, component } = p;
      const id = `refine-tmpl-${org}-${project}-${component}`;
      html += `<div id="${id}" style="margin-bottom:20px;border-top:1px solid var(--border);padding-top:12px">`;
      html += `<div style="font-size:13px;font-weight:600;margin-bottom:8px">${esc(org)}/${esc(project)}/${esc(component)}</div>`;
      html += `<textarea id="${id}-body" style="width:100%;height:200px;font-family:monospace;font-size:12px;border:1px solid var(--border);border-radius:4px;padding:8px;box-sizing:border-box" placeholder="Loading...">(loading...)</textarea>`;
      html += `<div style="margin-top:6px;display:flex;gap:8px">`;
      html += `<button class="settings-btn primary" onclick="saveRefinementTemplate('${esc(org)}','${esc(project)}','${esc(component)}')">Save</button>`;
      html += `<button class="settings-btn danger" onclick="resetRefinementTemplate('${esc(org)}','${esc(project)}','${esc(component)}')">Reset to default</button>`;
      html += `</div></div>`;
    }
    container.innerHTML = html;

    // Load each template
    for (const p of projects) {
      const { org, project, component } = p;
      const id = `refine-tmpl-${org}-${project}-${component}`;
      const textarea = document.getElementById(`${id}-body`);
      if (!textarea) continue;
      try {
        const r = await fetch(`/api/projects/${encodeURIComponent(org)}/${encodeURIComponent(project)}/${encodeURIComponent(component)}/artifacts/refinement-template`);
        if (r.ok) {
          const t = await r.json();
          textarea.value = t.body;
        } else {
          textarea.value = '(failed to load)';
        }
      } catch {
        textarea.value = '(error loading template)';
      }
    }
  } catch {
    container.textContent = '(could not load refinement templates)';
  }
}

async function saveRefinementTemplate(org, proj, comp) {
  const id = `refine-tmpl-${org}-${proj}-${comp}`;
  const textarea = document.getElementById(`${id}-body`);
  if (!textarea) return;
  try {
    const res = await fetch(`/api/projects/${encodeURIComponent(org)}/${encodeURIComponent(proj)}/${encodeURIComponent(comp)}/artifacts/refinement-template`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ body: textarea.value }),
    });
    if (!res.ok) throw new Error('Save failed');
  } catch (e) {
    alert('Failed to save: ' + e.message);
  }
}

async function resetRefinementTemplate(org, proj, comp) {
  if (!confirm(`Reset the refinement template for ${org}/${proj}/${comp} to the default? This cannot be undone.`)) return;
  const id = `refine-tmpl-${org}-${proj}-${comp}`;
  const textarea = document.getElementById(`${id}-body`);
  try {
    await fetch(`/api/projects/${encodeURIComponent(org)}/${encodeURIComponent(proj)}/${encodeURIComponent(comp)}/artifacts/refinement-template`, { method: 'DELETE' });
    const res = await fetch(`/api/projects/${encodeURIComponent(org)}/${encodeURIComponent(proj)}/${encodeURIComponent(comp)}/artifacts/refinement-template`);
    if (res.ok) {
      const t = await res.json();
      if (textarea) textarea.value = t.body;
    }
  } catch (e) {
    alert('Failed to reset: ' + e.message);
  }
}

function showReconnectingOverlay() {
  const overlay = document.createElement('div');
  overlay.className = 'reconnecting-overlay';
  overlay.innerHTML = '<div class="reconnecting-box"><h3>Reconnecting...</h3><p>Waiting for the server to come back</p></div>';
  document.body.appendChild(overlay);

  const poll = setInterval(async () => {
    try {
      const r = await fetch('/api/server/status');
      if (r.ok) {
        clearInterval(poll);
        overlay.remove();
        route();
      }
    } catch {}
  }, 1500);

  setTimeout(() => {
    clearInterval(poll);
    if (overlay.isConnected) {
      overlay.querySelector('.reconnecting-box').innerHTML = `<h3>Server not responding</h3><p>The server may be stopped. Use dashctl.sh to restart it.</p><button class="settings-btn" onclick="this.closest('.reconnecting-overlay').remove()" style="margin-top:12px">Dismiss</button>`;
    }
  }, 30000);
}

// --- timeAgo helper ---
function timeAgo(isoString) {
  if (!isoString) return '—';
  const ms = Date.now() - new Date(isoString).getTime();
  const s = Math.floor(ms / 1000);
  if (s < 60) return s + 's ago';
  const m = Math.floor(s / 60);
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  const d = Math.floor(h / 24);
  return d + 'd ago';
}

function renderAllSessionsView(dispatches, terminals, cliSessions, history) {

    const costStr = cost != null ? `$${Number(cost).toFixed(2)}` : '—';

    return `<thead><tr><th>Type</th><th>ID</th><th>Title</th><th>Project</th><th>Status</th><th>Started</th><th>Cost</th></tr></thead>`;

  let active = '';

// --- Router ---
async function route() {
  const hash = location.hash.slice(1);
  const main = $('#main');

  updateTitle(getRouteTitle());
  stopAgentsTileRefresh();
  if (settingsRefreshTimer) { clearInterval(settingsRefreshTimer); setSettingsRefreshTimer(null); }

  if (!hash) {
    main.innerHTML = `<div class="card"><h2>Portfolio Dashboard</h2><p style="color:var(--text-light);font-size:14px">Select an organization or project from the sidebar.</p></div>`;
    setActive('');
    placeSessionPanels();
    return;
  }

  const parts = hash.split('/');

  if (parts[0] === 'epics') {
    try {
      const epics = await getEpics();
      main.innerHTML = renderEpicListView(epics);
      bindEpicListEvents();
    } catch (e) {
      main.innerHTML = `<div class="card"><p style="color:var(--red)">Error: ${esc(String(e))}</p></div>`;
    }
    setActive('');
    placeSessionPanels();
    return;
  }

  if (parts[0] === 'agents' || hash.startsWith('agents?')) {
    try {
      const filters = parseAgentsFilters(hash);
      const agents = await fetchAgentsList();
      main.innerHTML = renderAgentsView(agents, filters);
      bindAgentsEvents(agents, filters);
      startAgentsTileRefresh(agents, filters);
    } catch (e) {
      main.innerHTML = `<div class="card"><p style="color:var(--red)">Error: ${esc(String(e))}</p></div>`;
    }
    setActive('');
    placeSessionPanels();
    return;
  }

  if (parts[0] === 'autonomous') {
    try {
      const dispatches = await api('dispatch/autonomous');
      main.innerHTML = renderAutonomousView(dispatches);
      bindAutonomousEvents();
    } catch (e) {
      main.innerHTML = `<div class="card"><p style="color:var(--red)">Error: ${esc(String(e))}</p></div>`;
    }
    setActive('');
    placeSessionPanels();
    return;
  }

  if (parts[0] === 'time-report') {
    try {
      const groupBy = sessionStorage.getItem('time-report-group') || 'project';
      const report = await api(`time-report${groupBy === 'org' ? '?group=org' : ''}`);
      main.innerHTML = renderTimeReport(report, groupBy);
      bindTimeReportTabs();
      bindTimeReportGroupToggle();
    } catch (e) {
      main.innerHTML = `<div class="card"><p style="color:var(--red)">Error loading time report: ${esc(String(e))}</p></div>`;
    }
    setActive('');
    return;
  }

  if (parts[0] === 'settings') {
    try {
      const [status, config] = await Promise.all([
        api('server/status'),
        api('server/config'),
      ]);
      main.innerHTML = renderSettingsView(status, config);
      bindSettingsEvents(status, config);
    } catch (e) {
      main.innerHTML = `<div class="card"><p style="color:var(--red)">Error loading settings: ${esc(String(e))}</p></div>`;
    }
    setActive('');
    placeSessionPanels();
    return;
  }

  if (parts[0] === 'epic' && parts[1]) {
    try {
      const { html, epicId } = await renderEpicDetailView(parts[1]);
      main.innerHTML = html;
      bindEpicDetailEvents(epicId);
    } catch (e) {
      main.innerHTML = `<div class="card"><p style="color:var(--red)">Error: ${esc(String(e))}</p></div>`;
    }
    setActive('');
    document.querySelectorAll('.epic-item').forEach(el => {
      el.classList.toggle('active', el.dataset.epicId === parts[1]);
    });
    placeSessionPanels();
    return;
  }

  if (parts[0] === 'org' && parts[1]) {
    const org = parts[1];
    try {
      const data = orgCache[org] || await api(`org/${org}`);
      setOrgCache(org, data);
      // Compute org sessions from active dispatches + terminals (project-scoped + org-scoped)
      const orgSessions = [
        ...activeDispatches.filter(d => (d.project_key && d.project_key.startsWith(org + '/')) || d.org_key === org).map(d => ({ type: 'dispatch', id: d.id, status: d.status, title: d.work_item_id || d.title || d.id, work_item_id: d.work_item_id, project_key: d.project_key, org_key: d.org_key, started_at: d.started_at })),
        ...activeTerminals.filter(t => (t.project_key && t.project_key.startsWith(org + '/')) || t.org_key === org).map(t => ({ type: 'terminal', id: t.id, status: t.status, title: t.title || t.id, work_item_id: t.work_item_id, project_key: t.project_key, org_key: t.org_key, started_at: t.started_at })),
      ];
      main.innerHTML = renderOrgView(org, data, orgSessions);
      // Bind focus buttons in org agents table
      document.querySelectorAll('[data-org-focus]').forEach(btn => {
        btn.onclick = () => {
          const [type, id] = btn.dataset.orgFocus.split(':');
          openFocusPopup(type, id);
        };
      });
      // Bind org discuss button
      const orgDiscussBtn = document.getElementById('discuss-org-agent');
      if (orgDiscussBtn) orgDiscussBtn.onclick = () => showOrgDiscussModal(org);
      // Async repos section fetch
      fetch(`/api/org/${encodeURIComponent(org)}/repos`)
        .then(r => r.ok ? r.json() : null)
        .then(repoData => {
          const el = document.getElementById(`org-repos-${org}`);
          if (!el) return;
          if (!repoData) {
            el.querySelector(`#org-repos-loading-${org}`)?.remove();
            return;
          }
          el.innerHTML = `<h3 style="font-size:14px;margin:0 0 8px">Repositories</h3>` + renderOrgReposSection(org, repoData);
          bindOrgReposEvents(org, repoData);
        })
        .catch(() => {
          const el = document.getElementById(`org-repos-${org}`);
          if (el) el.innerHTML = `<h3 style="font-size:14px;margin:0 0 8px">Repositories</h3><p style="color:var(--danger,#e74c3c);font-size:12px">Failed to load repositories</p>`;
        });
    } catch (e) {
      main.innerHTML = `<div class="card"><p style="color:var(--red)">Error: ${esc(String(e))}</p></div>`;
    }
    setActive('');
    placeSessionPanels();
    return;
  }

  if (parts[0] === 'component' && parts.length >= 4) {
    const [, org, proj, comp] = parts;
    try {
      const projectKey = `${org}/${proj}/${comp}`;
      const [data, bl, files] = await Promise.all([
        api(`component/${org}/${proj}/${comp}`),
        getBacklog(),
        api(`project/${org}/${proj}`)
      ]);

      // Match work items (case-insensitive)
      const projKey = projectKey.toLowerCase();
      const workItems = [];
      if (bl.projects) {
        for (const [key, val] of Object.entries(bl.projects)) {
          if (key.toLowerCase() === projKey && val.items) {
            workItems.push(...val.items);
          }
        }
      }

      // Filter epics relevant to this project
      const projectEpics = (bl.epics || []).filter(e =>
        (e.project_keys || []).some(k => k.toLowerCase() === projKey)
      );

      main.innerHTML = renderComponentView(org, proj, comp, data, workItems, files, projectEpics);
      bindTabs();
      setActive(projectKey);

      // Inject sync freshness indicator — parallel fetch, non-blocking
      (async () => {
        try {
          const [syncResult] = await Promise.allSettled([
            fetch('/api/sync/status?project_key=' + encodeURIComponent(projectKey)).then(r => r.json()),
          ]);
          if (syncResult.status === 'fulfilled') {
            const syncData = syncResult.value;
            const lastSyncedAt = syncData.last_synced_at;
            const status = syncData.status || 'unknown';
            let color = 'blue';
            if (status === 'fresh') color = 'green';
            else if (status === 'aging') color = 'medium';
            else if (status === 'stale') color = 'blocked';
            const freshnessHtml = lastSyncedAt
              ? `Last synced: ${timeAgo(lastSyncedAt)} <span class="badge badge-${color}">${esc(status)}</span>`
              : `<span class="badge badge-${color}">${esc(status)}</span>`;
            const freshEl = document.getElementById(`sync-freshness-${projectKey}`);
            if (freshEl) freshEl.innerHTML = freshnessHtml;
          }
        } catch { /* sync status is optional — ignore failures */ }
      })();
    } catch (e) {
      main.innerHTML = `<div class="card"><p style="color:var(--red)">Error: ${esc(String(e))}</p></div>`;
    }
    placeSessionPanels();
    return;
  }

  if (parts[0] === 'all-sessions') {
    try {
      const [dispatches, terminals, cliSessions, history] = await Promise.all([
        api('dispatch/active'),
        api('terminal/active'),
        api('sessions/active'),
        api('sessions/all'),
      ]);
      main.innerHTML = renderAllSessionsView(dispatches, terminals, cliSessions, history);
    } catch (e) {
      main.innerHTML = `<div class="card"><p style="color:var(--red)">Error loading sessions: ${esc(String(e))}</p></div>`;
    }
    setActive('');
    placeSessionPanels();
    return;
  }

  if (parts[0] === 'repos') {
    try {
      const repos = await fetch('/api/repos').then(r => r.json());
      renderReposView(repos);
      bindReposEvents();
    } catch (e) {
      main.innerHTML = `<div class="card"><p style="color:var(--red)">Error loading repos: ${esc(String(e))}</p></div>`;
    }
    setActive('');
    placeSessionPanels();
    return;
  }

  if (parts[0] === 'adrs') {
    try {
      const adrs = await fetch('/api/adrs?org=neuronic&limit=50').then(r => r.json());
      renderAdrsView(adrs);
    } catch (e) {
      main.innerHTML = `<div class="card"><p style="color:var(--red)">Error loading ADRs: ${esc(String(e))}</p></div>`;
    }
    setActive('');
    placeSessionPanels();
    return;
  }

  if (parts[0] === 'adr' && parts[1]) {
    try {
      const adr = await fetch(`/api/adrs/${encodeURIComponent(parts[1])}`).then(r => r.json());
      renderAdrDetailView(adr);
    } catch (e) {
      main.innerHTML = `<div class="card"><p style="color:var(--red)">Error loading ADR: ${esc(String(e))}</p></div>`;
    }
    setActive('');
    placeSessionPanels();
    return;
  }

  main.innerHTML = `<div class="card"><p class="empty">Unknown route: ${esc(hash)}</p></div>`;
  placeSessionPanels();
}

window.addEventListener('hashchange', () => { closeFocusPopup(); route(); });
// Eagerly preload xterm.js modules so they're cached before first terminal opens
loadXterm();
// Test hook: expose dispatch sequence for Playwright tests (module-scoped functions are inaccessible)
window.__testDispatchTerminal = async (info) => {
  activeTerminals.push(info);
  syncSessionState();
  createTerminalPanel(info);
  placeSessionPanels();
  await initSession(info);
};
// Start restoring sessions immediately in parallel with tree building so panels
// appear within the test's 5 s window regardless of how long the sidebar takes.
// Sidebar fold — toggle + localStorage persistence
(function initSidebarFold() {
  const STORAGE_KEY = 'sidebar-collapsed';

  if (localStorage.getItem(STORAGE_KEY) === 'true') {
    document.body.classList.add('sidebar-collapsed');
    document.documentElement.style.setProperty('--sidebar-w', '48px');
  }

  document.addEventListener('click', (e) => {
    if (!e.target.closest('[data-sidebar-toggle]')) return;
    const collapsed = document.body.classList.toggle('sidebar-collapsed');
    localStorage.setItem(STORAGE_KEY, collapsed);
    document.documentElement.style.setProperty('--sidebar-w', collapsed ? '48px' : '260px');
  });

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    if (!e.target.closest('[data-sidebar-toggle]')) return;
    e.preventDefault();
    const collapsed = document.body.classList.toggle('sidebar-collapsed');
    localStorage.setItem(STORAGE_KEY, collapsed);
    document.documentElement.style.setProperty('--sidebar-w', collapsed ? '48px' : '260px');
  });
})();

// Notes panel — toggle + localStorage persistence
(function initNotes() {
  const NOTES_CONTENT_KEY = 'dashboard-notes';
  const NOTES_OPEN_KEY = 'notes-panel-open';
  const panel = document.getElementById('notes-panel');
  const textarea = document.getElementById('notes-textarea');
  if (!panel || !textarea) return;

  // Restore content
  textarea.value = localStorage.getItem(NOTES_CONTENT_KEY) || '';

  // Restore open state
  if (localStorage.getItem(NOTES_OPEN_KEY) === 'true') {
    document.body.classList.add('notes-open');
  }

  // Auto-save on input
  textarea.addEventListener('input', () => {
    localStorage.setItem(NOTES_CONTENT_KEY, textarea.value);
  });

  // Toggle open/close
  document.addEventListener('click', (e) => {
    if (e.target.closest('[data-notes-toggle]')) {
      e.preventDefault();
      const open = document.body.classList.toggle('notes-open');
      localStorage.setItem(NOTES_OPEN_KEY, open);
    }
    if (e.target.closest('[data-notes-close]')) {
      document.body.classList.remove('notes-open');
      localStorage.setItem(NOTES_OPEN_KEY, 'false');
    }
  });
})();

const _restorePromise = Promise.all([
  restoreDispatches(),
  restoreTerminals(),
  restoreCliSessions(),
  refreshSuspendedPanel(),
]);
Promise.all([buildTree(), buildEpicTree()]).catch(err => { console.error('[startup] tree build failed:', err); }).then(async () => {
  startSessionsSidebarRefresh();
  // Wait for session restore before routing so panels exist when route() places them.
  // All restore functions have try/catch — they always resolve, never hang.
  await _restorePromise;
  await route();
  // Synchronous placement after route completes — bypasses rAF debounce entirely
  // to guarantee context-aware expand/collapse fires with all panels + correct hash.
  _placeSessionPanelsNow();
  refreshSessionsSidebar();
  // Periodic session refresh (every 10s) — sync with server-side auto-cleanup
  setInterval(restoreDispatches, 10000);
  setInterval(restoreTerminals, 10000);
  setInterval(restoreCliSessions, 10000);
  setInterval(refreshSuspendedPanel, 10000);
  // Live countdown ticker: update timeout countdowns once per second for running dispatches
  setInterval(() => {
    for (const d of activeDispatches) {
      if (!d.timeout_at) continue;
      const panelEl = document.getElementById(`dispatch-${d.id}`);
      if (!panelEl) continue;
      const titleEl = panelEl.querySelector('.dispatch-title');
      if (!titleEl) continue;
      const oldCountdown = titleEl.querySelector('.timeout-countdown, .timeout-badge.timeout-expired');
      const newHtml = renderTimeoutCountdown(d);
      if (newHtml) {
        const tmp = document.createElement('span');
        tmp.innerHTML = newHtml;
        if (oldCountdown) oldCountdown.replaceWith(tmp.firstChild);
        else titleEl.insertAdjacentHTML('beforeend', newHtml);
      } else if (oldCountdown) {
        oldCountdown.remove();
      }
    }
  }, 1000);
});
</script>

<div id="notes-panel" class="notes-panel" aria-label="Notes panel" role="complementary">
  <div class="notes-panel-header">
    <span class="notes-panel-title">Notes</span>
    <button class="notes-panel-close" data-notes-close aria-label="Close notes panel">✕</button>
  </div>
  <textarea id="notes-textarea" class="notes-textarea" placeholder="Write notes here..."></textarea>
</div>
</body>
