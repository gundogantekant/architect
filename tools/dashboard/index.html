  if (createBtn) createBtn.onclick = () => showEpicModal(null);
  const showDone = document.getElementById('epic-show-done');
  if (showDone) showDone.onchange = () => {
    document.querySelectorAll('[data-epic-list-status="done"], [data-epic-list-status="cancelled"], [data-epic-list-status="archived"]').forEach(row => {
      row.style.display = showDone.checked ? '' : 'none';
    });
  };
  document.querySelectorAll('[data-epic-edit]').forEach(btn => {
    btn.onclick = async () => {
      const epic = await api(`epics/${btn.dataset.epicEdit}`);
      showEpicModal(epic);
    };
  });
  document.querySelectorAll('[data-epic-delete]').forEach(btn => {
    btn.onclick = async () => {
      const eid = btn.dataset.epicDelete;
      if (!confirm(`Delete epic ${eid}? This will unlink all work items and mark it as cancelled.`)) return;
      try {
        await fetch(`/api/epics/${eid}`, { method: 'DELETE' });
        setBacklog(null); setEpicCache(null);
        await buildEpicTree();
        route();
      } catch (e) {
        alert('Error: ' + e.message);
      }
    };
  });
  document.querySelectorAll('[data-epic-dispatch]').forEach(btn => {
    btn.onclick = () => showEpicDispatchModal(btn.dataset.epicDispatch);
  });
  document.querySelectorAll('[data-epic-discuss]').forEach(btn => {
    btn.onclick = () => showEpicDiscussModal(btn.dataset.epicDiscuss);
  });
  document.querySelectorAll('[data-epic-archive]').forEach(btn => {
    btn.onclick = async () => {
      const eid = btn.dataset.epicArchive;
      if (!confirm(`Archive epic ${eid}? It will be hidden from the main view.`)) return;
      try {
        const resp = await fetch(`/api/epics/${eid}/archive`, { method: 'POST' });
        if (!resp.ok) throw new Error('Archive failed');
        setBacklog(null); setEpicCache(null);
        await buildEpicTree();
        route();
      } catch (e) {
        alert('Error: ' + e.message);
      }
    };
  });
}

async function renderEpicDetailView(epicId) {
  const epic = await api(`epics/${epicId}`);
  const items = epic.resolved_items || [];
  const p = epic.progress || { done: 0, total: 0 };
  const pct = p.total ? Math.round(p.done / p.total * 100) : 0;

  const tabs = ['Tasks', 'Planning', 'Documentation', 'Details'];
  let html = `<div class="card"><h2>${esc(epic.id)}: ${esc(epic.title)}</h2>`;
  const detailStatusBadge = epic.status === 'active' ? 'open' : epic.status === 'done' ? 'done' : epic.status === 'archived' ? 'archived' : 'medium';
  html += `<span class="badge badge-${detailStatusBadge}">${esc(epic.status)}</span> `;
  html += `<span class="badge badge-${epic.priority || 'medium'}">${esc(epic.priority || 'medium')}</span>`;
  if (epic.status === 'done' || epic.status === 'cancelled') html += ` <button class="dispatch-btn" id="epic-archive-btn" style="background:#94a3b8;margin-left:8px">Archive</button>`;
  if (epic.target_date) html += ` <span class="tag">Target: ${esc(epic.target_date)}</span>`;
  html += `<div class="tabs" id="epic-tabs" style="margin-top:16px">`;
  tabs.forEach((t, i) => {
    html += `<div class="tab${i === 0 ? ' active' : ''}" data-tab="${i}">${t}</div>`;
  });
  html += `</div>`;

  // Tab 0: Tasks
  html += `<div class="tab-content active" data-panel="0">`;
  html += `<div style="margin-bottom:12px;font-size:14px">${p.done} of ${p.total} tasks done (${pct}%)</div>`;
  html += `<div class="progress-bar-container"><div class="progress-bar-fill" style="width:${pct}%"></div></div>`;
  html += `<button class="btn-add-wi" id="epic-link-item">+ Link Item</button>`;
  html += `<button class="btn-add-wi" id="epic-create-task" style="margin-left:8px">+ Create Task</button>`;
  html += `<a href="#agents?epic=${esc(epic.id)}" style="margin-left:8px;font-size:12px;color:var(--accent)">View agents</a>`;
  html += `<button class="dispatch-btn" id="epic-discuss-btn-tasks" style="background:var(--teal);margin-left:8px">Discuss with Agent</button>`;
  if (items.length) {
    const sortedEpicItems = topoSort(items);
    // Filter bar for epic tasks
    const epicStatuses = [...new Set(items.map(w => w.status))].sort();
    html += `<div class="wi-filter-bar" id="epic-filter-bar">`;
    html += `<span style="font-size:12px;font-weight:600;color:var(--text-light)">Status:</span>`;
    for (const s of epicStatuses) {
      const checked = (s !== 'done' && s !== 'cancelled' && s !== 'archived') ? 'checked' : '';
      html += `<label class="filter-checkbox"><input type="checkbox" data-ef-status="${esc(s)}" ${checked} />${esc(s)}</label>`;
    }
    html += `<span class="filter-count" id="epic-filter-count">${items.length} tasks</span>`;
    html += `<button class="filter-clear" id="epic-filter-clear" style="display:none">Clear filters</button>`;
    html += `</div>`;
    html += `<table><thead><tr><th>ID</th><th>Title</th><th>Status</th><th>Priority</th><th>Depends On</th><th>Project</th><th>Tags</th><th></th></tr></thead><tbody>`;
    for (const item of sortedEpicItems) {
      const sc = item.status || 'draft';
      const canDispatch = ['planned','in-progress','in-review','testing','preview'].includes(item.status);
      const depState = isBlockedByDeps(item, items);
      const rowClass = depState.blocked ? ' blocked-by-deps' : '';
      const depHtml = (item.depends_on || []).length ? item.depends_on.map(d => {
        const dep = items.find(i => i.id === d);
        const cls = dep && dep.status === 'done' ? 'dep-done' : 'dep-pending';
        return `<span class="dep-badge ${cls}">${esc(d)}</span>`;
      }).join('') : '';
      const depTooltip = depState.blocked ? ` title="Dependencies not yet complete: ${depState.pending.join(', ')}"` : '';
      const itemFlagHtml = (item.input_needed ? `<span class="flag-badge flag-input">input needed</span>` : '') +
                           (item.approval_active ? `<span class="flag-badge flag-approval">approval needed</span>` : '');
      html += `<tr class="epic-task-row${rowClass}" data-ef-row data-ef-status-val="${esc(item.status)}"${depTooltip}>`;
      html += `<td><code>${esc(item.id)}</code></td>`;
      html += `<td>${esc(item.title)}</td>`;
      html += `<td><span class="badge badge-${sc}" data-status-click="${esc(item.id)}" data-current-status="${esc(item.status)}" style="cursor:pointer">${esc(item.status)}</span>${itemFlagHtml}</td>`;
      html += `<td><span class="badge badge-${item.priority || 'medium'}">${esc(item.priority || 'medium')}</span></td>`;
      html += `<td>${depHtml}</td>`;
      html += `<td><span class="tag">${esc(item.project_key)}</span></td>`;
      html += `<td>${(item.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</td>`;
      html += `<td>`;
      html += `<button class="expand-btn" data-epic-wi-expand="${esc(item.id)}">details</button>`;
      html += `<button class="edit-btn" data-epic-wi-edit="${esc(item.id)}">edit</button>`;
      if (canDispatch) html += `<button class="dispatch-btn" data-epic-task-dispatch="${esc(item.id)}" data-epic-task-pk="${esc(item.project_key)}">dispatch</button>`;
      html += `<button class="delete-btn" data-epic-wi-del="${esc(item.id)}">delete</button>`;
      html += `<button class="unlink-btn" data-unlink-item="${esc(item.id)}">unlink</button>`;
      html += `</td></tr>`;
      // Detail row for this work item in epic view
      html += `<tr class="wi-detail" data-epic-wi-detail="${esc(item.id)}" style="display:none"><td colspan="8">`;
      html += `<div style="font-size:11px;color:var(--text-light);margin-bottom:8px;display:flex;flex-wrap:wrap;gap:4px 12px">`;
      html += `<span>Created: ${fmtDate(item.created_at)}</span>`;
      html += `<span>Updated: ${fmtDate(item.updated_at)}</span>`;
      if (item.total_time_seconds) {
        const hrs = (item.total_time_seconds / 3600).toFixed(1);
        html += `<span>Agent time: ${hrs}h (${item.session_count || 0} sessions)</span>`;
      }
      if (item.total_cost_usd) html += `<span>Cost: $${item.total_cost_usd.toFixed(2)}</span>`;
      html += `</div>`;
      if (item.description?.trim()) html += `<div class="md-inline" style="max-height:300px;overflow-y:auto;margin-bottom:8px">${renderMd(item.description)}</div>`;
      if (item.session_log?.length) {
        html += `<div class="session-log">`;
        for (const e of item.session_log) html += `<div class="entry"><span class="date">${fmtDate(e.date)}</span>${esc(e.summary)}</div>`;
        html += `</div>`;
      }
      html += `<div style="margin-top:8px;display:flex;gap:6px">`;
      html += `<button class="btn-add-wi" data-wi-plan="${esc(item.id)}" style="margin:0;padding:4px 10px;font-size:11px">Plan</button>`;
      html += `<button class="btn-add-wi" data-wi-doc="${esc(item.id)}" style="margin:0;padding:4px 10px;font-size:11px">Docs</button>`;
      html += `<button class="btn-add-wi" data-wi-files="${esc(item.id)}" style="margin:0;padding:4px 10px;font-size:11px">Files</button>`;
      html += `</div>`;
      html += `<div class="wi-artifact-container" data-artifact-for="${esc(item.id)}" style="margin-top:8px"></div>`;
      html += `</td></tr>`;
      // Session slot row for this work item
      html += `<tr class="wi-sessions-row" data-wi-sessions="${esc(item.id)}" style="display:none"><td colspan="8"><div class="wi-sessions-container" data-session-slot="${esc(item.id)}"></div></td></tr>`;
    }
    html += `</tbody></table>`;
  } else {
    html += `<p class="empty">No linked tasks.</p>`;
  }
  // Epic-level session slot (sessions with epic_id but no matching linked task slot)
  html += `<div class="context-sessions-section hidden" style="margin-top:16px"><h3>Epic Agents</h3><div data-session-slot-epic="${esc(epicId)}"></div></div>`;
  html += `</div>`;

  // Tab 1: Planning
  html += `<div class="tab-content" data-panel="1">`;
  html += `<div id="epic-plan-container"><p class="empty">Loading...</p></div>`;
  html += `</div>`;

  // Tab 2: Documentation
  html += `<div class="tab-content" data-panel="2">`;
  html += `<div id="epic-doc-container"><p class="empty">Loading...</p></div>`;
  html += `</div>`;

  // Tab 3: Details
  html += `<div class="tab-content" data-panel="3">`;
  html += `<button class="edit-btn" id="epic-edit-details" style="margin-bottom:12px">Edit</button>`;
  html += `<button class="dispatch-btn" id="epic-dispatch-btn" style="margin-bottom:12px;margin-left:8px">Dispatch</button>`;
  html += `<button class="dispatch-btn" id="epic-discuss-btn" style="background:var(--teal);margin-bottom:12px;margin-left:8px">Discuss</button>`;
  html += `<button class="delete-btn" id="epic-delete-btn" style="margin-bottom:12px;margin-left:8px">Delete</button>`;
  html += `<dl class="kv">`;
  html += `<dt>Title</dt><dd>${esc(epic.title)}</dd>`;
  html += `<dt>Status</dt><dd><span class="badge badge-${detailStatusBadge}">${esc(epic.status)}</span></dd>`;
  html += `<dt>Priority</dt><dd><span class="badge badge-${epic.priority || 'medium'}">${esc(epic.priority || 'medium')}</span></dd>`;
  html += `<dt>Target Date</dt><dd>${epic.target_date || '—'}</dd>`;
  html += `<dt>Tags</dt><dd>${(epic.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('') || '—'}</dd>`;
  html += `<dt>Projects</dt><dd>${(epic.project_keys || []).map(k => `<span class="tag">${esc(k)}</span>`).join('') || '—'}</dd>`;
  html += `<dt>Created</dt><dd>${epic.created_at ? new Date(epic.created_at).toLocaleDateString() : (epic.created || '—')}</dd>`;
  html += `<dt>Updated</dt><dd>${epic.updated_at ? new Date(epic.updated_at).toLocaleDateString() : (epic.updated || '—')}</dd>`;
  html += `</dl>`;
  if (epic.description?.trim()) {
    html += `<h3>Description</h3><div class="md-inline">${renderMd(epic.description)}</div>`;
  }
  if (epic.acceptance_criteria) {
    html += `<h3>Acceptance Criteria</h3><div class="md-container">${renderMd(epic.acceptance_criteria)}</div>`;
  }
  if (epic.session_log?.length) {
    html += `<h3>Session Log</h3><div class="session-log">`;
    for (const e of epic.session_log) html += `<div class="entry"><span class="date">${fmtDate(e.date)}</span>${esc(e.summary)}</div>`;
    html += `</div>`;
  }
  html += `</div>`;

  html += `</div>`;
  return { html, epicId, epic };
}

function bindEpicDetailEvents(epicId) {
  // Tabs
  const tabs = document.querySelectorAll('#epic-tabs .tab');
  tabs.forEach(tab => {
    tab.onclick = () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      document.querySelectorAll('.tab-content').forEach(p => p.classList.remove('active'));
      document.querySelector(`.tab-content[data-panel="${tab.dataset.tab}"]`).classList.add('active');
      if (tab.dataset.tab === '1') loadEpicPlan(epicId);
      if (tab.dataset.tab === '2') loadEpicDoc(epicId);
    };
  });

  // Epic task filter bar
  const efBar = document.getElementById('epic-filter-bar');
  if (efBar) {
    const excludedStatus = new Set(['done', 'cancelled']);
    function applyEpicFilters() {
      const rows = document.querySelectorAll('[data-ef-row]');
      let visible = 0;
      rows.forEach(row => {
        const show = !excludedStatus.has(row.dataset.efStatusVal);
        row.style.display = show ? '' : 'none';
        // Hide associated detail and session rows
        const id = row.querySelector('code')?.textContent;
        if (id) {
          const detail = document.querySelector(`[data-epic-wi-detail="${id}"]`);
          const sessions = document.querySelector(`[data-wi-sessions="${id}"]`);
          if (detail && !show) detail.style.display = 'none';
          if (sessions && !show) sessions.style.display = 'none';
        }
        if (show) visible++;
      });
      const total = rows.length;
      const countEl = document.getElementById('epic-filter-count');
      if (countEl) countEl.textContent = excludedStatus.size ? `${visible} of ${total} tasks` : `${total} tasks`;
      const clearBtn = document.getElementById('epic-filter-clear');
      if (clearBtn) clearBtn.style.display = excludedStatus.size ? '' : 'none';
    }
    efBar.querySelectorAll('input[data-ef-status]').forEach(cb => {
      cb.onchange = () => {
        if (cb.checked) excludedStatus.delete(cb.dataset.efStatus);
        else excludedStatus.add(cb.dataset.efStatus);
        applyEpicFilters();
      };
    });
    const efClear = document.getElementById('epic-filter-clear');
    if (efClear) efClear.onclick = () => {
      excludedStatus.clear();
      efBar.querySelectorAll('input[data-ef-status]').forEach(cb => { cb.checked = true; });
      applyEpicFilters();
    };
    applyEpicFilters(); // apply defaults (hide done+cancelled)
  }

  // Unlink buttons
  document.querySelectorAll('[data-unlink-item]').forEach(btn => {
    btn.onclick = async () => {
      const wid = btn.dataset.unlinkItem;
      if (!confirm(`Unlink ${wid} from ${epicId}?`)) return;
      await fetch(`/api/epics/${epicId}/unlink`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ work_item_id: wid }),
      });
      setBacklog(null); setEpicCache(null);
      await buildEpicTree();
      route();
    };
  });

  // Link item button
  const linkBtn = document.getElementById('epic-link-item');
  if (linkBtn) linkBtn.onclick = () => showLinkItemModal(epicId);

  // Create task button
  const createTaskBtn = document.getElementById('epic-create-task');
  if (createTaskBtn) createTaskBtn.onclick = () => showCreateEpicTaskModal(epicId);

  // Archive epic button (header)
  const archiveBtn = document.getElementById('epic-archive-btn');
  if (archiveBtn) archiveBtn.onclick = async () => {
    if (!confirm(`Archive epic ${epicId}? It will be hidden from the main view.`)) return;
    try {
      const resp = await fetch(`/api/epics/${epicId}/archive`, { method: 'POST' });
      if (!resp.ok) throw new Error('Archive failed');
      setBacklog(null); setEpicCache(null);
      await buildEpicTree();
      location.hash = '#epics';
      route();
    } catch (e) {
      alert('Error: ' + e.message);
    }
  };

  // Delete epic button
  const deleteBtn = document.getElementById('epic-delete-btn');
  if (deleteBtn) deleteBtn.onclick = async () => {
    if (!confirm(`Delete epic ${epicId}? It will be marked as cancelled and all linked items will be unlinked.`)) return;
    try {
      const resp = await fetch(`/api/epics/${epicId}`, { method: 'DELETE' });
      if (!resp.ok) throw new Error('Delete failed');
      setBacklog(null); setEpicCache(null);
      await buildEpicTree();
      location.hash = '#epics';
      route();
    } catch (e) {
      alert('Error: ' + e.message);
    }
  };

  // Edit details
  const editBtn = document.getElementById('epic-edit-details');
  if (editBtn) editBtn.onclick = async () => {
    const epic = await api(`epics/${epicId}`);
    showEpicModal(epic);
  };

  // Dispatch from detail
  const dispatchBtn = document.getElementById('epic-dispatch-btn');
  if (dispatchBtn) dispatchBtn.onclick = () => showEpicDispatchModal(epicId);

  // Discuss from detail
  const discussBtn = document.getElementById('epic-discuss-btn');
  if (discussBtn) discussBtn.onclick = () => showEpicDiscussModal(epicId);
  const discussBtnTasks = document.getElementById('epic-discuss-btn-tasks');
  if (discussBtnTasks) discussBtnTasks.onclick = () => showEpicDiscussModal(epicId);

  // Task dispatch buttons
  document.querySelectorAll('[data-epic-task-dispatch]').forEach(btn => {
    btn.onclick = async () => {
      const wid = btn.dataset.epicTaskDispatch;
      let pk = btn.dataset.epicTaskPk;
      const bl = await getBacklog();
      let wi = null;
      for (const group of Object.values(bl.projects)) {
        if (!group.items) continue;
        wi = group.items.find(i => i.id === wid);
        if (wi) break;
      }
      // Fallback: if pk is empty, use epic's project_keys[0]
      if (!pk && epic.project_keys && epic.project_keys.length) {
        pk = epic.project_keys[0];
      }
      if (wi && pk) dispatchWorkItem(wi, pk);
      else if (wi) alert('No project key available. Link a project to this epic first.');
    };
  });

  // Epic view: expand detail rows
  document.querySelectorAll('[data-epic-wi-expand]').forEach(btn => {
    btn.onclick = () => {
      const wid = btn.dataset.epicWiExpand;
      const row = document.querySelector(`[data-epic-wi-detail="${wid}"]`);
      if (row) row.style.display = row.style.display === 'none' ? '' : 'none';
    };
  });

  // Epic view: edit buttons
  document.querySelectorAll('[data-epic-wi-edit]').forEach(btn => {
    btn.onclick = async () => {
      const wid = btn.dataset.epicWiEdit;
      const bl = await getBacklog();
      let wi = null;
      for (const group of Object.values(bl.projects)) {
        if (!group.items) continue;
        wi = group.items.find(i => i.id === wid);
        if (wi) break;
      }
      if (wi) showWorkItemModal(wi);
    };
  });

  // Epic view: delete buttons
  document.querySelectorAll('[data-epic-wi-del]').forEach(btn => {
    btn.onclick = async () => {
      const wid = btn.dataset.epicWiDel;
      const bl = await getBacklog();
      let wi = null;
      for (const group of Object.values(bl.projects)) {
        if (!group.items) continue;
        wi = group.items.find(i => i.id === wid);
        if (wi) break;
      }
      if (!wi) return;
      if (!confirm(`Delete task ${wi.id}: "${wi.title}"?`)) return;
      try {
        const resp = await fetch(`/api/work-items/${wi.id}`, { method: 'DELETE' });
        const result = await resp.json();
        if (!resp.ok) throw new Error(result.error || 'Delete failed');
        setBacklog(null); setEpicCache(null);
        await Promise.all([buildTree(), buildEpicTree()]);
        route();
      } catch (e) {
        alert('Delete failed: ' + e.message);
      }
    };
  });

  // Epic view: status badge click
  document.querySelectorAll('[data-status-click]').forEach(badge => {
    if (!badge._statusBound) {
      badge._statusBound = true;
      badge.onclick = (e) => {
        e.stopPropagation();
        showStatusDropdown(badge, badge.dataset.statusClick, badge.dataset.currentStatus);
      };
    }
  });

  // Epic view: plan/docs/files buttons (reuse same handlers)
  document.querySelectorAll('[data-epic-wi-detail] [data-wi-plan]').forEach(btn => {
    btn.onclick = () => loadItemArtifact(btn.dataset.wiPlan, 'plan');
  });
  document.querySelectorAll('[data-epic-wi-detail] [data-wi-doc]').forEach(btn => {
    btn.onclick = () => loadItemArtifact(btn.dataset.wiDoc, 'doc');
  });
  document.querySelectorAll('[data-epic-wi-detail] [data-wi-files]').forEach(btn => {
    btn.onclick = () => loadItemArtifacts(btn.dataset.wiFiles);
  });
}

async function loadEpicPlan(epicId) {
  const container = document.getElementById('epic-plan-container');
  if (!container) return;
  try {
    const content = await apiText(`epics/${epicId}/plan`);
    if (content) {
      container.innerHTML = `<button class="edit-btn" id="edit-plan-btn" style="margin-bottom:12px">Edit</button><div class="md-container">${renderMd(content)}</div>`;
    } else {
      container.innerHTML = `<p class="empty">No plan yet.</p><button class="btn-add-wi" id="edit-plan-btn">Create Plan</button>`;
    }
    document.getElementById('edit-plan-btn').onclick = () => showMdEditorModal('Plan', content, async (newContent) => {
      await fetch(`/api/epics/${epicId}/plan`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: newContent }),
      });
      loadEpicPlan(epicId);
    });
  } catch {
    container.innerHTML = `<p class="empty">Failed to load plan.</p>`;
  }
}

async function loadEpicDoc(epicId) {
  const container = document.getElementById('epic-doc-container');
  if (!container) return;
  try {
    const content = await apiText(`epics/${epicId}/doc`);
    if (content) {
      container.innerHTML = `<button class="edit-btn" id="edit-doc-btn" style="margin-bottom:12px">Edit</button><div class="md-container">${renderMd(content)}</div>`;
    } else {
      container.innerHTML = `<p class="empty">No documentation yet.</p><button class="btn-add-wi" id="edit-doc-btn">Create Documentation</button>`;
    }
    document.getElementById('edit-doc-btn').onclick = () => showMdEditorModal('Documentation', content, async (newContent) => {
      await fetch(`/api/epics/${epicId}/doc`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: newContent }),
      });
      loadEpicDoc(epicId);
    });
  } catch {
    container.innerHTML = `<p class="empty">Failed to load documentation.</p>`;
  }
}

function showMdEditorModal(title, content, onSave) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal modal-wide">
      <h3>Edit ${esc(title)}</h3>

async function loadItemArtifact(itemId, type) {
  const container = document.querySelector(`[data-artifact-for="${itemId}"]`);
  if (!container) return;
  container.innerHTML = '<p style="color:var(--muted);font-size:12px">Loading...</p>';
  try {
    const resp = await fetch(`/api/work-items/${itemId}/${type}`);
    const content = await resp.text();
    const label = type === 'plan' ? 'Plan' : 'Documentation';
    if (content.trim()) {
      container.innerHTML = `<div style="border:1px solid var(--border);border-radius:6px;max-height:300px;overflow:auto" class="md-container">${renderMd(content)}</div><button class="btn-add-wi" id="edit-wi-${type}-${itemId}" style="margin-top:4px;padding:4px 10px;font-size:11px">Edit ${label}</button>`;
    } else {
      container.innerHTML = `<p class="empty" style="font-size:12px">No ${label.toLowerCase()} yet.</p><button class="btn-add-wi" id="edit-wi-${type}-${itemId}" style="padding:4px 10px;font-size:11px">Create ${label}</button>`;
    }
    document.getElementById(`edit-wi-${type}-${itemId}`).onclick = () => showMdEditorModal(label, content, async (newContent) => {
      await fetch(`/api/work-items/${itemId}/${type}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: newContent }),
      });
      loadItemArtifact(itemId, type);
    });
  } catch {
    container.innerHTML = `<p class="empty" style="font-size:12px">Failed to load.</p>`;
  }
}

async function loadItemArtifacts(itemId) {
  const container = document.querySelector(`[data-artifact-for="${itemId}"]`);
  if (!container) return;
  container.innerHTML = '<p style="color:var(--muted);font-size:12px">Loading files...</p>';
  try {
    const data = await api(`work-items/${itemId}/artifacts`);
    const customFiles = (data.files || []).filter(f => f !== 'plan.md' && f !== 'docs.md' && f.endsWith('.md'));
    let html = '';
    if (customFiles.length) {
      html += `<div style="border:1px solid var(--border);border-radius:6px;padding:10px;font-size:12px;max-height:300px;overflow:auto">`;
      for (const file of customFiles) {
        html += `<div style="display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid #f0f0f0">`;
        html += `<code style="flex:1">${esc(file)}</code>`;
        html += `<button class="btn-add-wi" data-af-view="${esc(file)}" style="margin:0;padding:2px 8px;font-size:10px">View</button>`;
        html += `<button class="btn-add-wi" data-af-edit="${esc(file)}" style="margin:0;padding:2px 8px;font-size:10px">Edit</button>`;
        html += `<button class="delete-btn" data-af-del="${esc(file)}" style="padding:2px 8px;font-size:10px">Delete</button>`;
        html += `</div>`;
      }
      html += `</div>`;
    } else {
      html += `<p class="empty" style="font-size:12px">No custom artifacts.</p>`;
    }
    html += `<button class="btn-add-wi" data-af-add="1" style="margin-top:4px;padding:4px 10px;font-size:11px">+ Add File</button>`;
    html += `<div class="af-content-area" style="margin-top:8px"></div>`;
    container.innerHTML = html;

    const contentArea = container.querySelector('.af-content-area');

    container.querySelectorAll('[data-af-view]').forEach(btn => {
      btn.onclick = async () => {
        const fname = btn.dataset.afView;
        contentArea.innerHTML = '<p style="font-size:12px;color:var(--text-light)">Loading...</p>';
        try {
          const resp = await fetch(`/api/work-items/${itemId}/artifacts/${fname}`);
          if (!resp.ok) throw new Error('Not found');
          const content = await resp.text();
          contentArea.innerHTML = `<div style="border:1px solid var(--border);border-radius:6px;max-height:300px;overflow:auto" class="md-container">${renderMd(content)}</div>`;
        } catch {
          contentArea.innerHTML = '<p class="empty" style="font-size:12px">Failed to load.</p>';
        }
      };
    });

    container.querySelectorAll('[data-af-edit]').forEach(btn => {
      btn.onclick = async () => {
        const fname = btn.dataset.afEdit;
        let content = '';
        try {
          const resp = await fetch(`/api/work-items/${itemId}/artifacts/${fname}`);
          if (resp.ok) content = await resp.text();
        } catch {}
        showMdEditorModal(fname, content, async (newContent) => {
          await fetch(`/api/work-items/${itemId}/artifacts/${fname}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: newContent }),
          });
          loadItemArtifacts(itemId);
        });
      };
    });

    container.querySelectorAll('[data-af-del]').forEach(btn => {
      btn.onclick = async () => {
        const fname = btn.dataset.afDel;
        if (!confirm(`Delete artifact "${fname}"?`)) return;
        await fetch(`/api/work-items/${itemId}/artifacts/${fname}`, { method: 'DELETE' });
        loadItemArtifacts(itemId);
      };
    });

    container.querySelector('[data-af-add]').onclick = () => {
      const fname = prompt('Filename (must end with .md):', 'notes.md');
      if (!fname) return;
      if (!fname.endsWith('.md') || !/^[a-zA-Z0-9_-]+\.md$/.test(fname)) {
        alert('Filename must match [a-zA-Z0-9_-]+.md');
        return;
      }
      if (fname === 'plan.md' || fname === 'docs.md') {
        alert('Use the Plan/Docs buttons for those files.');
        return;
      }
      showMdEditorModal(fname, '', async (newContent) => {
        await fetch(`/api/work-items/${itemId}/artifacts/${fname}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: newContent }),
        });
        loadItemArtifacts(itemId);
      });
    };
  } catch {
    container.innerHTML = '<p class="empty" style="font-size:12px">Failed to load files.</p>';
  }
}

        <div style="font-size:11px;color:var(--text-light);margin-top:2px">Ctrl/Cmd+click to select multiple</div>
      </div>

        <label>Description</label>
        <textarea id="epic-description">${isEdit && existingEpic.description ? esc(existingEpic.description) : ''}</textarea>
      </div>
      <div class="field">
        <label>Acceptance Criteria (markdown)</label>
        <textarea id="epic-ac">${isEdit && existingEpic.acceptance_criteria ? esc(existingEpic.acceptance_criteria) : ''}</textarea>
      </div>
      <div class="field">
        <label>Target Date</label>
        <input type="text" id="epic-target" placeholder="YYYY-MM-DD" value="${isEdit && existingEpic.target_date ? esc(existingEpic.target_date) : ''}" />
      </div>
      <div class="field">
        <label>Tags (comma-separated)</label>
        <input type="text" id="epic-tags" value="${isEdit && existingEpic.tags ? esc(existingEpic.tags.join(', ')) : ''}" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="epic-cancel">Cancel</button>
        <button class="btn btn-dispatch" id="epic-save">${isEdit ? 'Save' : 'Create'}</button>
      </div>
    </div>
  `;

  overlay.querySelector('#epic-cancel').onclick = () => overlay.remove();

  overlay.querySelector('#epic-save').onclick = async () => {
    const title = overlay.querySelector('#epic-title').value.trim();
    if (!title) { alert('Title is required'); return; }
    const btn = overlay.querySelector('#epic-save');
    btn.disabled = true; btn.textContent = isEdit ? 'Saving...' : 'Creating...';

    const projectsEl = overlay.querySelector('#epic-projects');
    const project_keys = [...projectsEl.selectedOptions].map(o => o.value);

    const payload = {
      title,
      priority: overlay.querySelector('#epic-priority').value,
      description: overlay.querySelector('#epic-description').value.trim(),
      acceptance_criteria: overlay.querySelector('#epic-ac').value.trim(),

  };
}

async function showLinkItemModal(epicId) {
  const bl = await api('backlog');
  const allItems = [];
  for (const [key, group] of Object.entries(bl.projects || {})) {
    for (const item of (group.items || [])) {
      if (!item.epic_id && !['done','cancelled','archived'].includes(item.status)) {
        allItems.push({ ...item, project_key: key });
      }
    }
  }

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Link Items to ${esc(epicId)}</h3>
      <div class="field">
        <label>Search Items</label>
        <input type="text" id="link-search" placeholder="Filter by title or ID..." />
      </div>
      <div id="link-items-list" style="max-height:300px;overflow-y:auto"></div>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="link-cancel">Cancel</button>
        <button class="btn btn-dispatch" id="link-save">Link Selected</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const selected = new Set();
  function renderItems(filter) {
    const listEl = document.getElementById('link-items-list');
    const filtered = filter ? allItems.filter(i => i.id.toLowerCase().includes(filter) || i.title.toLowerCase().includes(filter)) : allItems;
    if (!filtered.length) { listEl.innerHTML = '<p class="empty">No unlinked items found.</p>'; return; }
    listEl.innerHTML = filtered.map(i => `
      <label style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f0f0f0;font-size:13px;cursor:pointer">
        <input type="checkbox" data-link-wid="${esc(i.id)}" ${selected.has(i.id) ? 'checked' : ''} />
        <code>${esc(i.id)}</code>
        <span style="flex:1">${esc(i.title)}</span>
        <span class="tag">${esc(i.project_key)}</span>
      </label>
    `).join('');
    listEl.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.onchange = () => {
        if (cb.checked) selected.add(cb.dataset.linkWid);
        else selected.delete(cb.dataset.linkWid);
      };
    });
  }
  renderItems('');
  overlay.querySelector('#link-search').oninput = (e) => renderItems(e.target.value.toLowerCase());
  overlay.querySelector('#link-cancel').onclick = () => overlay.remove();
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  overlay.querySelector('#link-save').onclick = async () => {
    if (!selected.size) { overlay.remove(); return; }
    const btn = overlay.querySelector('#link-save');
    btn.disabled = true; btn.textContent = 'Linking...';
    try {
      const resp = await fetch(`/api/epics/${epicId}/link`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ work_item_ids: [...selected] }),
      });
      if (!resp.ok) throw new Error('Link failed');
      overlay.remove();
      setBacklog(null); setEpicCache(null);
      await buildEpicTree();
      route();
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Link Selected';
      alert('Error: ' + e.message);
    }
  };
}

async function showEpicDispatchModal(epicId) {
  const epic = await api(`epics/${epicId}`);
  const items = epic.resolved_items || [];
  const openItems = items.filter(i => ['planned','in-progress','in-review','testing','preview'].includes(i.status));
  let projectKeys = epic.project_keys || [];
  const p = epic.progress || { done: 0, total: 0 };

  // If no project keys, fetch registry as fallback
  let registryKeys = [];
  if (!projectKeys.length) {
    try {
      const registry = await api('registry');
      for (const [, entry] of Object.entries(registry.entries)) {
        registryKeys.push(`${entry.org}/${entry.project}/${entry.component}`);
      }
      registryKeys.sort();
    } catch {}
    projectKeys = registryKeys;
  }
  if (!projectKeys.includes(ARCHITECT_KEY)) projectKeys.unshift(ARCHITECT_KEY);

  const { overlay } = createDispatchOverlay({
    title: `Dispatch from ${epic.id}`,
    cancelId: 'epic-dispatch-cancel',
    submitId: 'epic-dispatch-go',
    buildFields: () => `
      <div style="margin-bottom:14px">
        <strong>${esc(epic.title)}</strong>
        <div style="font-size:12px;color:var(--text-light);margin-top:4px">Progress: ${p.done}/${p.total}</div>
      </div>
      <div class="field">
        <label>Mode</label>
        <select id="epic-dispatch-mode">
          <option value="general">Work on epic (general)</option>
          ${openItems.map(i => `<option value="${esc(i.id)}">${esc(i.id)}: ${esc(i.title)}</option>`).join('')}
        </select>
      </div>
      <div class="field" id="epic-dispatch-project-field">
        <label>Target Project</label>
        <select id="epic-dispatch-project">
          ${projectKeys.map(k => `<option value="${esc(k)}">${esc(k)}</option>`).join('')}
        </select>
        ${registryKeys.length ? '<div style="font-size:11px;color:var(--text-light);margin-top:2px">No linked projects — showing all registry projects</div>' : ''}
      </div>
      <div class="field">
        <label>Additional Instructions</label>
        <textarea id="epic-dispatch-instructions" placeholder="Optional context..."></textarea>
      </div>
      ${permissionModeSelect('epic-dispatch-perm-mode')}
      ${skipPermissionsCheckbox('epic-dispatch-skip-perms')}
    `,
    onSubmit: async (overlay) => {
      const modeSelect = overlay.querySelector('#epic-dispatch-mode');
      const projectSelect = overlay.querySelector('#epic-dispatch-project');
      const mode = modeSelect.value;
      const instructions = overlay.querySelector('#epic-dispatch-instructions').value.trim();
      const permMode = getPermissionMode(overlay, 'epic-dispatch-perm-mode');
      const skipPerms = overlay.querySelector('#epic-dispatch-skip-perms').checked;

      let pk, wid;
      if (mode === 'general') {
        pk = projectSelect.value || projectKeys[0];
        wid = null;
      } else {
        wid = mode;
        const item = openItems.find(i => i.id === wid);
        pk = item ? item.project_key : (projectSelect.value || projectKeys[0]);
      }

      if (!pk) { throw new Error('No project key available for dispatch. Onboard a project first.'); }

      const dispatchBody = {
        work_item_id: wid,
        epic_id: epicId,
        project_key: pk,
        title: wid ? `${wid} (${epic.title})` : epic.title,
        additional_instructions: instructions,
        permission_mode: permMode,
        skip_permissions: skipPerms,
      };
      const resp = await fetch('/api/dispatch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dispatchBody),
      });
      let result = await resp.json();
      if (!resp.ok) throw new Error(result.error || 'Dispatch failed');

      if (result.require_confirm) {
        const confirmed = await showConfirmWarning(result.warning);
        if (!confirmed) return;
        const confirmResp = await fetch('/api/dispatch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...dispatchBody, confirm_worktree_warning: true }),
        });
        result = await confirmResp.json();
        if (!confirmResp.ok) throw new Error(result.error || 'Dispatch failed');
      }

      let projectPath = '';
      if (pk === ARCHITECT_KEY) {
        projectPath = '(architect root)';
      } else {
        try {
          const registry = await api('registry');
          for (const [path, entry] of Object.entries(registry.entries)) {
            if (`${entry.org}/${entry.project}/${entry.component}` === pk) { projectPath = path; break; }
          }
        } catch {}
      }

      const dispatch = {
        id: result.dispatch_id,
        work_item_id: wid,
        project_key: pk,
        project_path: projectPath,
        title: wid ? `${wid} (${epic.title})` : epic.title,
        permission_mode: permMode,
        skip_permissions: skipPerms,
        status: 'running',
        started_at: new Date().toISOString(),
      };
      activeDispatches.push(dispatch);
      syncSessionState();
      createDispatchPanel(dispatch);
      placeSessionPanels();
      loadDispatchContent(dispatch);
    },
  });

  const modeSelect = overlay.querySelector('#epic-dispatch-mode');
  const projectSelect = overlay.querySelector('#epic-dispatch-project');
  modeSelect.onchange = () => {
    if (modeSelect.value !== 'general') {
      const item = openItems.find(i => i.id === modeSelect.value);
      if (item) { projectSelect.value = item.project_key; }
    }
  };
}

        <label>Organization (optional)</label>
        <input type="text" id="onboard-org" placeholder="Auto-detect if empty" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="onboard-cancel">Cancel</button>
        <button class="btn btn-dispatch" id="onboard-go">Onboard</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.querySelector('#onboard-cancel').onclick = () => overlay.remove();
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  overlay.querySelector('#onboard-go').onclick = async () => {
    const path = overlay.querySelector('#onboard-path').value.trim();
    if (!path) { alert('Path is required'); return; }

    const org = overlay.querySelector('#onboard-org').value.trim();
    const btn = overlay.querySelector('#onboard-go');
    btn.disabled = true; btn.textContent = 'Dispatching...';

    try {
      const resp = await fetch('/api/onboard', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path, organization: org || undefined }),
      });
      const result = await resp.json();
      if (!resp.ok) throw new Error(result.error || 'Onboard failed');

      const dispatch = {
        id: result.dispatch_id,
        work_item_id: null,
        project_key: 'onboard',
        project_path: path,
        title: `Onboard: ${path.split('/').pop()}`,
        status: 'running',
        started_at: new Date().toISOString(),
      };
      activeDispatches.push(dispatch);
      syncSessionState();
      createDispatchPanel(dispatch);
      placeSessionPanels();
      loadDispatchContent(dispatch);
      overlay.remove();
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Onboard';
      alert('Onboard failed: ' + e.message);
    }
  };
}

// --- Sessions Sidebar ---
function buildSessionsSidebar() {
  const container = document.getElementById('sessions-sidebar');
  if (!container) return;
  const collapsed = sessionStorage.getItem('sessions-sidebar-collapsed') === 'true';
  // Label with toggle arrow
  const label = document.createElement('div');
  label.className = 'sidebar-section-label';
  label.style.cursor = 'pointer';
  label.innerHTML = `<span class="arrow ${collapsed ? '' : 'open'}">&#9654;</span> SESSIONS`;
  container.appendChild(label);
  const list = document.createElement('div');
  list.id = 'sessions-list';
  list.style.display = collapsed ? 'none' : '';
  container.appendChild(list);
  label.onclick = () => {
    const arrow = label.querySelector('.arrow');
    const open = arrow.classList.toggle('open');
    list.style.display = open ? '' : 'none';
    sessionStorage.setItem('sessions-sidebar-collapsed', !open);
  };
  const divider = document.createElement('hr');
  divider.className = 'sidebar-divider';
  container.appendChild(divider);
}

function copySessionId(sessionId, el) {
  navigator.clipboard.writeText(sessionId).then(() => {
    const orig = el.textContent;
    el.textContent = 'Copied!';
    setTimeout(() => { el.textContent = orig; }, 1200);
  }).catch(() => {});
}

function sessionIdTag(sessionId) {
  if (!sessionId) return '';
  return `<span class="tag session-id-copy" style="font-family:monospace;font-size:10px;cursor:pointer;opacity:0.8" title="Click to copy session ID">${esc(sessionId)}</span>`;
}

function bindSessionIdCopy(container) {
  for (const el of container.querySelectorAll('.session-id-copy')) {
    el.onclick = (e) => { e.stopPropagation(); copySessionId(el.textContent, el); };
  }
}

function formatElapsed(startedAt) {
  const ms = Date.now() - new Date(startedAt).getTime();
  const s = Math.floor(ms / 1000);
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m ${s % 60}s`;
  const h = Math.floor(m / 60);
  return `${h}h ${m % 60}m`;
}

function scrollToSessionPanel(session) {
  const panel = sessionPanels.get(`${session.type}:${session.id}`);
  if (panel && panel.isConnected) {
    panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (panel.classList.contains('collapsed')) {
      const btn = panel.querySelector('.minimize-btn');
      if (btn) togglePanelCollapse(`${session.type}:${session.id}`, panel, btn);
    }
  }
}

function navigateToSession(session) {
  if (session.work_item_id && session.project_key) {
    const [org, proj, comp] = session.project_key.split('/');
    if (org && proj && comp) {
      location.hash = `#component/${org}/${proj}/${comp}`;
      setTimeout(() => scrollToSessionPanel(session), 300);
      return;
    }
  }
  if (session.epic_id) {
    location.hash = `#epic/${session.epic_id}`;
    setTimeout(() => scrollToSessionPanel(session), 300);
    return;
  }
  if (session.project_key) {
    const [org, proj, comp] = session.project_key.split('/');
    if (org && proj && comp) {
      location.hash = `#component/${org}/${proj}/${comp}`;
      setTimeout(() => scrollToSessionPanel(session), 300);
      return;
    }
  }
  openFocusPopup(session.type, session.id);
}

function refreshSessionsSidebar() {
  const list = document.getElementById('sessions-list');
  if (!list) return;
  list.innerHTML = '';
  const allSessions = [
    ...activeDispatches.map(d => ({ type: 'dispatch', id: d.id, status: d.status, label: d.work_item_id || d.title || d.id, started_at: d.started_at, epic_id: d.epic_id, work_item_id: d.work_item_id, project_key: d.project_key })),
    ...activeTerminals.map(t => ({ type: 'terminal', id: t.id, status: t.status, label: t.title || t.id, started_at: t.started_at, epic_id: t.epic_id, work_item_id: t.work_item_id, project_key: t.project_key })),
    ...activeCliSessions.map(c => ({ type: 'cli', id: c.id, status: c.status, label: `[CLI] ${c.title}`, started_at: c.registered_at, epic_id: c.epic_id, work_item_id: c.work_item_id, project_key: c.project_key })),
  ];
  if (!allSessions.length) return;

  // Group by project_key, then by epic_id within each project
  const projectGroups = new Map(); // project_key → { epics: Map<epic_id, sessions[]>, noEpic: sessions[] }
  const standalone = [];
  for (const s of allSessions) {
    if (s.project_key) {
      if (!projectGroups.has(s.project_key)) projectGroups.set(s.project_key, { epics: new Map(), noEpic: [] });
      const pg = projectGroups.get(s.project_key);
      if (s.epic_id) {
        if (!pg.epics.has(s.epic_id)) pg.epics.set(s.epic_id, []);
        pg.epics.get(s.epic_id).push(s);
      } else {
        pg.noEpic.push(s);
      }
    } else {
      standalone.push(s);
    }
  }

  function renderEntry(s, indented) {
    const entry = document.createElement('div');
    entry.className = 'session-entry' + (indented ? ' indented' : '');
    const dotClass = s.status === 'running' ? 'running' : (s.status === 'suspended' ? 'suspended' : (s.status === 'completed' ? 'completed' : (s.status === 'interrupted' ? 'interrupted' : 'failed')));
    const elapsed = formatElapsed(s.started_at);
    entry.innerHTML = `<span class="status-dot ${dotClass}" style="width:8px;height:8px"></span><span class="session-label">${esc(s.label)}</span><span class="session-meta">${elapsed}</span>`;
    entry.onclick = () => navigateToSession(s);
    return entry;
  }

  const totalSuspended = activeDispatches.filter(d => d.status === 'suspended').length;
  const sidebarLabel = document.querySelector('#sessions-sidebar .sidebar-section-label');
  if (sidebarLabel) {
    let globalSuspBadge = sidebarLabel.querySelector('.susp-total-badge');
    if (totalSuspended > 0) {
      if (!globalSuspBadge) {
        globalSuspBadge = document.createElement('span');
        globalSuspBadge.className = 'susp-total-badge';
        globalSuspBadge.style.cssText = 'background:#6B7280;color:#fff;font-size:10px;padding:1px 5px;border-radius:9px;margin-left:6px;cursor:default';
        sidebarLabel.appendChild(globalSuspBadge);
      }
      globalSuspBadge.textContent = totalSuspended;
      globalSuspBadge.title = `${totalSuspended} session${totalSuspended !== 1 ? 's' : ''} suspended`;
    } else if (globalSuspBadge) {
      globalSuspBadge.remove();
    }
  }

  // Render project > epic > session hierarchy
  for (const [pk, pg] of projectGroups) {
    // Show project label (drop org prefix for brevity)
    const parts = pk.split('/');
    const shortLabel = parts.length >= 3 ? (parts[2] === 'main' ? parts[1] : `${parts[1]}/${parts[2]}`) : pk;
    const projLabel = document.createElement('div');
    projLabel.className = 'sidebar-project-label';
    projLabel.style.display = 'flex';
    projLabel.style.alignItems = 'center';
    projLabel.style.justifyContent = 'space-between';
    const projNameSpan = document.createElement('span');
    projNameSpan.textContent = shortLabel;
    projLabel.appendChild(projNameSpan);
    const projSessions = [...(pg.noEpic || []), ...[...pg.epics.values()].flat()];
    const projSuspCount = projSessions.filter(s => s.status === 'suspended').length;
    const projInputNeeded = activeDispatches.some(d => d.project_key === pk && d.work_item_input_needed);
    const badgeGroup = document.createElement('span');
    badgeGroup.style.cssText = 'display:flex;align-items:center;gap:4px';
    if (projInputNeeded) {
      const dot = document.createElement('span');
      dot.style.cssText = 'width:7px;height:7px;border-radius:50%;background:#F59E0B;display:inline-block;flex-shrink:0';
      dot.title = 'Agent waiting for input';
      badgeGroup.appendChild(dot);
    }
    if (projSuspCount > 0) {
      const badge = document.createElement('span');
      badge.style.cssText = 'background:#6B7280;color:#fff;font-size:10px;padding:1px 5px;border-radius:9px;cursor:default';
      badge.textContent = projSuspCount;
      badge.title = `${projSuspCount} session${projSuspCount !== 1 ? 's' : ''} suspended`;
      badgeGroup.appendChild(badge);
    }
    if (badgeGroup.children.length) projLabel.appendChild(badgeGroup);
    projLabel.onclick = () => {
      const [org, proj, comp] = pk.split('/');
      if (org && proj && comp) location.hash = `#component/${org}/${proj}/${comp}`;
    };
    list.appendChild(projLabel);

    // Epic sub-groups
    for (const [epicId, sessions] of pg.epics) {
      const epicLabel = document.createElement('div');
      epicLabel.className = 'sidebar-epic-sublabel';
      epicLabel.textContent = epicId;
      epicLabel.onclick = () => { location.hash = `#epic/${epicId}`; };
      list.appendChild(epicLabel);
      for (const s of sessions) list.appendChild(renderEntry(s, true));
    }

    // No-epic sessions
    for (const s of pg.noEpic) list.appendChild(renderEntry(s, false));
  }

  // Render standalone
  if (standalone.length && projectGroups.size > 0) {
    const label = document.createElement('div');
    label.className = 'sidebar-group-label';
    label.textContent = 'STANDALONE';
    list.appendChild(label);
  }
  for (const s of standalone) list.appendChild(renderEntry(s, false));
  // Update sidebar project signal dots based on current session state
  updateProjectSignalDots();
}

function startSessionsSidebarRefresh() {
  buildSessionsSidebar();
  refreshSessionsSidebar();
  if (sessionsSidebarInterval) clearInterval(sessionsSidebarInterval);
  setSessionsSidebarInterval(setInterval(refreshSessionsSidebar, 3000));
}

// --- Focus Popup ---

function openFocusPopup(type, id) {
  closeFocusPopup();

  const overlay = document.createElement('div');
  overlay.className = 'focus-overlay';

  const popup = document.createElement('div');
  popup.className = 'focus-popup' + (type === 'terminal' ? ' terminal-focus' : '');

  let sourceEl, parentEl, title, status, startedAt, dispatch, terminalInfo;

  if (type === 'dispatch') {
    dispatch = activeDispatches.find(d => d.id === id);
    if (!dispatch) return;
    sourceEl = document.getElementById(`log-${id}`);
    parentEl = sourceEl?.parentElement;
    title = dispatch.work_item_id ? `${dispatch.work_item_id} — ${dispatch.title || ''}` : (dispatch.title || dispatch.id);
    status = dispatch.status;
    startedAt = dispatch.started_at;
  } else {
    terminalInfo = activeTerminals.find(t => t.id === id);
    if (!terminalInfo) return;
    sourceEl = document.getElementById(`term-container-${id}`);
    parentEl = sourceEl?.parentElement;
    title = terminalInfo.title || terminalInfo.id;
    status = terminalInfo.status;
    startedAt = terminalInfo.started_at;
  }

  if (!sourceEl) return;

  updateTitle(title);

  // Header
  const header = document.createElement('div');
  header.className = 'focus-popup-header';
  const dotClass = status === 'running' ? 'running' : (status === 'suspended' ? 'suspended' : (status === 'completed' ? 'completed' : 'failed'));
  let metaHtml = formatElapsed(startedAt);
  const focusBadge = type === 'terminal' ? '<span class="focus-lock-badge">FOCUSED</span>' : '';
  header.innerHTML = `<span class="status-dot ${dotClass}"></span><span class="focus-title">${esc(title)}${focusBadge}</span><span class="focus-meta">${metaHtml}</span>`;

  // Body — relocate DOM element
  const body = document.createElement('div');
  body.className = 'focus-popup-body';
  sourceEl.remove();
  body.appendChild(sourceEl);

  // For terminals, fit to new size (ResizeObserver handles this with scroll preservation)
  if (type === 'terminal' && terminalInfo?._sessionState?._fitAddon && terminalInfo?._sessionState?._term) {
    requestAnimationFrame(() => fitPreservingScroll(terminalInfo._sessionState._term, terminalInfo._sessionState._fitAddon));
  }
  // For dispatch logs, scroll to bottom on focus
  if (type === 'dispatch' && sourceEl) {
    requestAnimationFrame(() => scrollDispatchLog(sourceEl, true));
  }

  // Footer
  const footer = document.createElement('div');
  footer.className = 'focus-popup-footer';

  const closeBtn = document.createElement('button');
  closeBtn.className = 'btn btn-close';
  closeBtn.textContent = 'Close';
  closeBtn.onclick = () => closeFocusPopup();
  footer.appendChild(closeBtn);

  // Session ID copy button
  const sessionId = type === 'dispatch' ? dispatch?.claude_session_id : terminalInfo?.claude_session_id;
  if (sessionId) {
    const sidSpan = document.createElement('span');
    sidSpan.className = 'tag session-id-copy';
    sidSpan.style.cssText = 'font-family:monospace;font-size:10px;cursor:pointer;opacity:0.8';
    sidSpan.title = 'Click to copy session ID';
    sidSpan.textContent = sessionId;
    sidSpan.onclick = () => copySessionId(sessionId, sidSpan);
    footer.appendChild(sidSpan);
  }

  const isRunning = status === 'running';
  const killBtn = document.createElement('button');
  killBtn.className = 'btn btn-kill';
  killBtn.textContent = 'Kill';
  killBtn.disabled = !isRunning;
  killBtn.onclick = async () => {
    killBtn.disabled = true;
    const endpoint = type === 'dispatch' ? `/api/dispatch/${id}` : `/api/terminal/${id}`;
    try {
      await fetch(endpoint, { method: 'DELETE' });
      if (dispatch) dispatch.status = 'killed';
      if (terminalInfo) terminalInfo.status = 'killed';
      const dot = header.querySelector('.status-dot');
      clearActiveDotClasses(dot);
      dot.classList.add('failed');
      // Also update inline panel status class, dot, and buttons
      const panelPrefix = type === 'dispatch' ? 'dispatch' : 'terminal';
      const inlinePanel = document.querySelector(`#${panelPrefix}-${id}`);
      if (inlinePanel) {
        inlinePanel.className = inlinePanel.className.replace(/status-\w+/, 'status-killed');
        const dismissBtn = inlinePanel.querySelector(`[data-dismiss-${panelPrefix}="${id}"]`);
        if (dismissBtn) dismissBtn.style.display = '';
      }
      const inlineDot = document.querySelector(`#${panelPrefix}-${id} .status-dot`);
      if (inlineDot) { clearActiveDotClasses(inlineDot); inlineDot.classList.add('killed', 'failed'); }
      const inlineKill = document.querySelector(`[data-kill-${panelPrefix}="${id}"]`);
      if (inlineKill) inlineKill.disabled = true;
      syncSessionState();
    } catch {}
  };
  footer.appendChild(killBtn);

  // Suspend button
  if (isRunning) {
    const suspendBtn = document.createElement('button');
    suspendBtn.className = 'suspend-btn';
    suspendBtn.textContent = 'Suspend';
    suspendBtn.onclick = async () => {
      suspendBtn.disabled = true;
      const endpoint = type === 'dispatch' ? `/api/dispatch/${id}/suspend` : `/api/terminal/${id}/suspend`;
      try {
        const resp = await fetch(endpoint, { method: 'POST' });
        if (resp.ok) {
          if (dispatch) dispatch.status = 'suspended';
          if (terminalInfo) terminalInfo.status = 'suspended';
          const dot = header.querySelector('.status-dot');
          clearActiveDotClasses(dot);
          dot.classList.add('suspended');
          killBtn.disabled = true;
          syncSessionState();
          closeFocusPopup();
        }
      } catch {}
    };
    footer.appendChild(suspendBtn);
  }

  // Resume button (for suspended sessions opened in focus)
  if (status === 'suspended') {
    const resumeBtn = document.createElement('button');
    resumeBtn.className = 'resume-btn';
    resumeBtn.textContent = 'Resume';
    resumeBtn.onclick = async () => {
      resumeBtn.disabled = true;
      const endpoint = type === 'dispatch' ? `/api/dispatch/${id}/resume` : `/api/terminal/${id}/resume`;
      try {
        const resp = await fetch(endpoint, { method: 'POST' });
        if (resp.ok) {
          syncSessionState();
          closeFocusPopup();
        }
      } catch {}
    };
    footer.appendChild(resumeBtn);
  }

  // /exit button for terminal sessions
  if (type === 'terminal' && terminalInfo && isRunning) {
    const exitBtn = document.createElement('button');
    exitBtn.className = 'btn';
    exitBtn.style.cssText = 'background:var(--orange);color:#fff;';
    exitBtn.textContent = '/exit';
    exitBtn.onclick = () => {
      const t = activeTerminals.find(x => x.id === id);
      if (t?._wsManager) {
        t._wsManager.send({ type: 'input', data: '/exit\n' });
        exitBtn.disabled = true;
        exitBtn.textContent = 'Sent /exit';
      }
    };
    footer.appendChild(exitBtn);
  }

  popup.appendChild(header);
  popup.appendChild(body);
  popup.appendChild(footer);
  overlay.appendChild(popup);
  document.body.appendChild(overlay);

  setActiveFocusPopup({ overlay, popup, type, id, sourceEl, parentEl });

  // Close handlers
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeFocusPopup(); });
  const escHandler = (e) => { if (e.key === 'Escape') closeFocusPopup(); };
  document.addEventListener('keydown', escHandler);
  activeFocusPopup.escHandler = escHandler;

  // Update header periodically
  const headerInterval = setInterval(() => {
    if (!activeFocusPopup || activeFocusPopup.id !== id) { clearInterval(headerInterval); return; }
    const metaEl = header.querySelector('.focus-meta');
    if (metaEl) {
      let meta = formatElapsed(startedAt);
      metaEl.textContent = meta;
    }
    // Update status dot in popup
    const currentStatus = type === 'dispatch' ? dispatch?.status : terminalInfo?.status;
    if (currentStatus && currentStatus !== 'running') {
      const dot = header.querySelector('.status-dot');
      clearActiveDotClasses(dot);
      dot.classList.add(currentStatus === 'completed' ? 'completed' : 'failed');
      killBtn.disabled = true;
    }
  }, 1000);
  activeFocusPopup.headerInterval = headerInterval;
}

function closeFocusPopup() {
  if (!activeFocusPopup) return;
  const { overlay, type, id, sourceEl, parentEl, escHandler, headerInterval } = activeFocusPopup;

  // Move DOM element back to inline panel (restore original position)
  if (sourceEl && parentEl && parentEl.isConnected) {
    sourceEl.remove();
    const refEl = parentEl.children[1];
    if (refEl) parentEl.insertBefore(sourceEl, refEl);
    else parentEl.appendChild(sourceEl);
  }

  // Re-fit terminal after moving back to inline panel (delay to let DOM settle)
  if (type === 'terminal') {
    const terminalInfo = activeTerminals.find(t => t.id === id);
    const ss = terminalInfo?._sessionState;
    if (ss?._fitAddon && ss._term) {
      setTimeout(() => {
        if (ss._fitAddon && ss._term) fitPreservingScroll(ss._term, ss._fitAddon);
      }, 50);
    }
  }

  // Scroll dispatch log to bottom after returning to inline panel
  if (type === 'dispatch' && sourceEl) {
    requestAnimationFrame(() => scrollDispatchLog(sourceEl, true));
  }

  if (escHandler) document.removeEventListener('keydown', escHandler);
  if (headerInterval) clearInterval(headerInterval);
  overlay.remove();
  setActiveFocusPopup(null);

  // Restore route-based title
  updateTitle(getRouteTitle());

  // Re-place panels to ensure correct slot after route changes while popup was open
  placeSessionPanels();
}

// --- Agents View ---

function renderAgentTile(agent) {
  const isCli = agent.type === 'cli';
  let dotClass;
  if (agent.status !== 'running') {
    dotClass = agent.status === 'completed' ? 'completed' : (agent.status === 'suspended' ? 'suspended' : 'failed');
  } else if (agent.agent_phase === 'waiting_for_input') {
    dotClass = 'needs-input';
  } else if (agent.agent_phase === 'tool_running') {
    dotClass = 'tool-running';
  } else {
    dotClass = 'generating';
  }
  const elapsed = formatElapsed(agent.started_at);
  const aKeyParts = (agent.project_key || '').split('/').filter(p => p && p !== '*');
  const aBreadcrumb = [];
  if (aKeyParts.length >= 2) aBreadcrumb.push(`${aKeyParts[0]} / ${aKeyParts[1]}`);
  else if (aKeyParts.length === 1) aBreadcrumb.push(aKeyParts[0]);
  if (agent.work_item_id) {
    aBreadcrumb.push(agent.work_item_title
      ? `${agent.work_item_id}: ${agent.work_item_title}`
      : agent.work_item_id);
  }
  if (agent.epic_id) {
    aBreadcrumb.push(agent.epic_title
      ? `${agent.epic_id}: ${agent.epic_title}`
      : agent.epic_id);
  }
  const title = aBreadcrumb.join(' · ') || (agent.title || agent.id);
  const preview = isCli ? '(read-only — no output)' : ((agent.last_output || []).slice(-3).join('\n') || '(no output yet)');
  const typeLabel = isCli ? 'CLI (read-only)' : (agent.type === 'terminal' ? 'interactive' : 'non-interactive');
  const typeBadgeClass = isCli ? 'badge-cli' : (agent.type === 'terminal' ? 'badge-agent' : 'badge-open');

  let badges = '';
  if (agent.project_key) badges += `<span class="tag">${esc(agent.project_key)}</span>`;
  if (agent.work_item_id) badges += `<span class="badge badge-open">${esc(agent.work_item_id)}</span>`;
  if (agent.epic_id) badges += `<span class="badge badge-epic">${esc(agent.epic_id)}</span>`;
  badges += `<span class="badge ${typeBadgeClass}">${typeLabel}</span>`;
  if (agent.status === 'running' && agent.agent_phase) {
    const phaseLabels = { generating: 'thinking', tool_running: 'running tool', waiting_for_input: 'needs input' };
    badges += `<span class="badge badge-phase">${phaseLabels[agent.agent_phase] || agent.agent_phase}</span>`;
  }
  if (agent.claude_session_id) badges += sessionIdTag(agent.claude_session_id);
  if (agent.dispatch_mode === 'auto_implement') badges += `<span class="badge badge-open badge-auto">[auto]</span>`;

  return `<div class="agent-tile" data-agent-type="${esc(agent.type)}" data-agent-id="${esc(agent.id)}">
    <div class="agent-tile-header">
      <span class="status-dot ${dotClass}"></span>
      <span class="agent-tile-title">${esc(title)}</span>
      <span class="agent-tile-elapsed" data-started="${agent.started_at}">${elapsed}</span>
    </div>
    <div class="agent-tile-badges">${badges}</div>
    <div class="agent-tile-preview">${esc(preview)}</div>
    <div class="agent-tile-footer">
      <button class="suspend-btn" data-tile-suspend="${esc(agent.type)}:${esc(agent.id)}" ${(agent.status !== 'running' || isCli || (agent.type === 'terminal' && agent.agent_type !== 'claude')) ? 'style="display:none"' : ''}>Suspend</button>
      <button class="resume-btn" data-tile-resume="${esc(agent.type)}:${esc(agent.id)}" ${agent.status !== 'suspended' ? 'style="display:none"' : ''}>Resume</button>
      <button class="kill-btn" data-tile-kill="${esc(agent.type)}:${esc(agent.id)}" ${(agent.status !== 'running' || isCli) ? 'disabled' : ''}>Kill</button>
      ${isCli ? '' : `<button class="focus-btn" data-tile-focus="${esc(agent.type)}:${esc(agent.id)}">Focus</button>`}
    </div>
  </div>`;
}

async function fetchAgentsList() {
  const [dispatches, terminals, cliSessions] = await Promise.all([
    api('dispatch/active').catch(() => []),
    api('terminal/active').catch(() => []),
    api('sessions/active').catch(() => []),
  ]);
  const agents = [];
  for (const d of dispatches) {
    agents.push({ type: 'dispatch', id: d.id, status: d.status, title: d.work_item_id || d.id, work_item_id: d.work_item_id, work_item_title: d.work_item_title || null, project_key: d.project_key, epic_id: d.epic_id, epic_title: d.epic_title || null, started_at: d.started_at, last_output: d.last_output || [], cost_usd: d.cost_usd, claude_session_id: d.claude_session_id, agent_phase: d.agent_phase || null, dispatch_mode: d.dispatch_mode || 'standard' });
  }
  for (const t of terminals) {
    agents.push({ type: 'terminal', id: t.id, status: t.status, title: t.title || t.id, work_item_id: t.work_item_id, project_key: t.project_key, epic_id: t.epic_id, started_at: t.started_at, last_output: t.last_output || [], claude_session_id: t.claude_session_id, agent_type: t.agent_type || t.type || 'claude' });
  }
  for (const c of cliSessions) {
    agents.push({ type: 'cli', id: c.id, status: c.status === 'running' ? 'running' : 'completed', title: c.title, work_item_id: c.work_item_id, project_key: c.project_key, epic_id: c.epic_id, started_at: c.registered_at, last_output: [] });
  }
  // Sort: running first, then by started_at desc
  agents.sort((a, b) => {
    if (a.status === 'running' && b.status !== 'running') return -1;
    if (b.status === 'running' && a.status !== 'running') return 1;
    return new Date(b.started_at) - new Date(a.started_at);
  });
  return agents;
}

const PIPELINE_STAGE_ORDER = [
  'worktree_setup', 'investigating', 'planning', 'plan_review',
  'implementing', 'testing', 'code_review', 'committing',
  'merge_pending', 'done',
];

function renderPipelineStageBar(currentStage) {
  const dots = PIPELINE_STAGE_ORDER.map(s => {
    const isCurrent = s === currentStage;
    const isPast = currentStage && PIPELINE_STAGE_ORDER.indexOf(s) < PIPELINE_STAGE_ORDER.indexOf(currentStage);
    const label = s.replace(/_/g, ' ');
    const color = isCurrent ? 'var(--accent)' : isPast ? 'var(--green)' : 'var(--muted)';
    return `<span title="${label}" style="width:10px;height:10px;border-radius:50%;display:inline-block;background:${color};margin:0 2px;"></span>`;
  }).join('');
  const label = currentStage ? currentStage.replace(/_/g, ' ') : 'pending';
  return `<div style="display:flex;align-items:center;gap:6px;margin-top:4px;">${dots}<span style="font-size:11px;color:var(--muted)">${esc(label)}</span></div>`;
}

function renderAutonomousView(dispatches) {
  if (!dispatches.length) {

  }

  const byProject = {};
  for (const d of dispatches) {

  }

  let html = '<div style="padding:16px;">';
  html += '<h2 style="margin:0 0 16px;font-size:18px;">Autonomous Workflows</h2>';

  for (const [projectKey, items] of Object.entries(byProject)) {
    const running = items.filter(d => d.status === 'running').length;
    html += `<div style="margin-bottom:20px;">`;
    html += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">`;
    html += `<span style="font-size:13px;font-weight:600;color:var(--fg)">${esc(projectKey)}</span>`;
    if (running > 0) html += `<span style="font-size:11px;background:var(--accent);color:#fff;padding:1px 6px;border-radius:10px;">${running} running</span>`;
    html += `</div>`;

    for (const d of items) {

      const elapsed = d.started_at ? Math.round((Date.now() - new Date(d.started_at)) / 60000) + 'm' : '';
      html += `<div class="card" style="margin-bottom:8px;padding:12px;" data-dispatch-id="${esc(d.id)}">`;
      html += `<div style="display:flex;justify-content:space-between;align-items:flex-start;">`;
      html += `<div>`;
      html += `<span style="font-size:13px;font-weight:500;">${esc(d.work_item_id || d.id)}${d.work_item_title ? ': ' + esc(d.work_item_title) : ''}</span>`;
      html += `</div>`;
      html += `<div style="display:flex;gap:8px;align-items:center;font-size:12px;">`;
      html += `<span style="color:${statusColor}">${esc(d.status)}</span>`;
      if (elapsed) html += `<span style="color:var(--muted)">${elapsed}</span>`;
      if (d.cost_usd) html += `<span style="color:var(--muted)">$${d.cost_usd.toFixed(3)}</span>`;
      if (d.status === 'merge_pending') html += `<button class="btn btn-sm auto-merge-btn" data-id="${esc(d.id)}" style="padding:2px 8px;font-size:11px;">Merge Now</button>`;
      html += `</div></div>`;

function renderAgentsView(agents, filters = {}) {
  const statusFilter = filters.status || 'all';
  const epicFilter = filters.epic || '';
  const projectFilter = filters.project || '';
  const autoOnly = filters.autoOnly || false;

  let filtered = agents;
  if (statusFilter === 'active') filtered = filtered.filter(a => a.status === 'running');
  else if (statusFilter === 'suspended') filtered = filtered.filter(a => a.status === 'suspended');
  else if (statusFilter === 'recent') filtered = filtered.filter(a => a.status !== 'running' && a.status !== 'suspended');
  if (epicFilter) filtered = filtered.filter(a => a.epic_id === epicFilter);
  if (projectFilter) filtered = filtered.filter(a => a.project_key === projectFilter);
  if (autoOnly) filtered = filtered.filter(a => a.dispatch_mode === 'auto_implement');

  // Collect unique epics/projects for dropdowns
  const allEpics = [...new Set(agents.map(a => a.epic_id).filter(Boolean))].sort();
  const allProjects = [...new Set(agents.map(a => a.project_key).filter(Boolean))].sort();

  let html = `<div class="card"><h2>Agents</h2>`;
  html += `<div class="agents-filter-bar">`;
  html += `<span class="filter-tab${statusFilter === 'all' ? ' active' : ''}" data-agents-status="all">All (${agents.length})</span>`;
  html += `<span class="filter-tab${statusFilter === 'active' ? ' active' : ''}" data-agents-status="active">Running (${agents.filter(a => a.status === 'running').length})</span>`;
  const suspendedCount = agents.filter(a => a.status === 'suspended').length;
  html += `<span class="filter-tab${statusFilter === 'suspended' ? ' active' : ''}" data-agents-status="suspended">Suspended (${suspendedCount})</span>`;
  html += `<span class="filter-tab${statusFilter === 'recent' ? ' active' : ''}" data-agents-status="recent">Completed</span>`;
  if (allEpics.length) {
    html += `<select id="agents-epic-filter"><option value="">All Epics</option>`;
    for (const e of allEpics) html += `<option value="${esc(e)}"${epicFilter === e ? ' selected' : ''}>${esc(e)}</option>`;
    html += `</select>`;
  }
  if (allProjects.length) {
    html += `<select id="agents-project-filter"><option value="">All Projects</option>`;
    for (const p of allProjects) html += `<option value="${esc(p)}"${projectFilter === p ? ' selected' : ''}>${esc(p)}</option>`;
    html += `</select>`;
  }
  html += `<button class="btn-add-wi" id="agents-quick-dispatch">+ Dispatch</button>`;
  html += `<label style="font-size:12px;display:inline-flex;align-items:center;gap:4px;margin-left:8px;cursor:pointer"><input type="checkbox" id="agents-auto-only"${filters.autoOnly ? ' checked' : ''}> Auto-implement only</label>`;
  html += `</div>`;

  if (filtered.length) {
    // Build hierarchy: project → epic → task → agents
    const hierarchy = buildAgentHierarchy(filtered);

    // Render project groups
    for (const [pk, projData] of hierarchy.projects) {
      html += `<details class="agent-group" open><summary>${esc(pk)}</summary>`;
      // Epics within project
      for (const [eid, epicTasks] of projData.epics) {
        html += `<details class="agent-subgroup" open><summary>${esc(eid)}</summary><div class="agents-grid">`;
        for (const [, taskAgents] of epicTasks) {
          for (const agent of taskAgents) html += renderAgentTile(agent);
        }
        html += `</div></details>`;
      }
      // No-epic agents within project
      if (projData.noEpic.size) {
        html += `<div class="agents-grid" style="margin-left:16px">`;
        for (const [, taskAgents] of projData.noEpic) {
          for (const agent of taskAgents) html += renderAgentTile(agent);
        }
        html += `</div>`;
      }
      html += `</details>`;
    }

    // Standalone agents (no project_key)
    if (hierarchy.standalone.length) {
      html += `<details class="agent-group" open><summary>Standalone</summary><div class="agents-grid">`;
      for (const agent of hierarchy.standalone) html += renderAgentTile(agent);
      html += `</div></details>`;
    }
  } else {
    html += `<p class="empty">No agents match the current filters.</p>`;
  }
  html += `</div>`;
  return html;
}

function buildAgentHierarchy(agents) {
  const projects = new Map(); // pk → { epics: Map<eid, Map<wi, agents[]>>, noEpic: Map<wi, agents[]> }
  const standalone = [];

  for (const agent of agents) {
    if (!agent.project_key) {
      standalone.push(agent);
      continue;
    }
    if (!projects.has(agent.project_key)) {
      projects.set(agent.project_key, { epics: new Map(), noEpic: new Map() });
    }
    const proj = projects.get(agent.project_key);
    const taskKey = agent.work_item_id || '_none';

    if (agent.epic_id) {
      if (!proj.epics.has(agent.epic_id)) proj.epics.set(agent.epic_id, new Map());
      const epicMap = proj.epics.get(agent.epic_id);
      if (!epicMap.has(taskKey)) epicMap.set(taskKey, []);
      epicMap.get(taskKey).push(agent);
    } else {
      if (!proj.noEpic.has(taskKey)) proj.noEpic.set(taskKey, []);
      proj.noEpic.get(taskKey).push(agent);
    }
  }

  return { projects, standalone };
}

      try {
        const resp = await fetch(endpoint, { method: 'POST' });
        if (resp.ok) {
          syncSessionState();
          if (location.hash.startsWith('#agents')) route();
        }
      } catch {}
    };
  });

  // Session ID copy (agent tiles)
  document.querySelectorAll('.agent-tile .session-id-copy').forEach(el => {

  });

  // Status filter tabs
  document.querySelectorAll('[data-agents-status]').forEach(tab => {

      location.hash = hash;
    };
  }

  // Project filter
  const projSelect = document.getElementById('agents-project-filter');
  if (projSelect) {
    projSelect.onchange = () => {
      const hash = buildAgentsHash({ ...filters, project: projSelect.value });
      location.hash = hash;
    };
  }

  // Auto-implement only checkbox
  const autoOnlyCheck = document.getElementById('agents-auto-only');
  if (autoOnlyCheck) {
    autoOnlyCheck.onchange = () => {
      const hash = buildAgentsHash({ ...filters, autoOnly: autoOnlyCheck.checked });
      location.hash = hash;
    };
  }

  // Quick dispatch button
  const quickDispatchBtn = document.getElementById('agents-quick-dispatch');
  if (quickDispatchBtn) quickDispatchBtn.onclick = () => showQuickDispatchModal();
}

function buildAgentsHash(filters) {
  let hash = '#agents';
  const params = [];
  if (filters.status && filters.status !== 'all') params.push(`status=${filters.status}`);
  if (filters.epic) params.push(`epic=${filters.epic}`);
  if (filters.project) params.push(`project=${filters.project}`);
  if (filters.autoOnly) params.push(`autoOnly=1`);
  if (params.length) hash += '?' + params.join('&');
  return hash;
}

function parseAgentsFilters(hash) {
  const filters = { status: 'all', epic: '', project: '', autoOnly: false };
  const qIdx = hash.indexOf('?');
  if (qIdx === -1) return filters;
  const params = new URLSearchParams(hash.slice(qIdx + 1));
  if (params.get('status')) filters.status = params.get('status');
  if (params.get('epic')) filters.epic = params.get('epic');
  if (params.get('project')) filters.project = params.get('project');
  if (params.get('autoOnly') === '1') filters.autoOnly = true;
  return filters;
}
