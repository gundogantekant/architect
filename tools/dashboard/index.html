// --- Sessions Sidebar ---
function buildSessionsSidebar() {
  const container = document.getElementById('sessions-sidebar');
  if (!container) return;
  const collapsed = sessionStorage.getItem('sessions-sidebar-collapsed') === 'true';
  // Label with toggle arrow
  const label = document.createElement('div');
  label.className = 'sidebar-section-label';
  label.style.cursor = 'pointer';
  label.innerHTML = `<span class="arrow ${collapsed ? '' : 'open'}">&#9654;</span> SESSIONS`;
  container.appendChild(label);
  const list = document.createElement('div');
  list.id = 'sessions-list';
  list.style.display = collapsed ? 'none' : '';
  container.appendChild(list);
  label.onclick = () => {
    const arrow = label.querySelector('.arrow');
    const open = arrow.classList.toggle('open');
    list.style.display = open ? '' : 'none';
    sessionStorage.setItem('sessions-sidebar-collapsed', !open);
  };
  const divider = document.createElement('hr');
  divider.className = 'sidebar-divider';
  container.appendChild(divider);
}

function copySessionId(sessionId, el) {
  navigator.clipboard.writeText(sessionId).then(() => {
    const orig = el.textContent;
    el.textContent = 'Copied!';
    setTimeout(() => { el.textContent = orig; }, 1200);
  }).catch(() => {});
}

function sessionIdTag(sessionId) {
  if (!sessionId) return '';
  return `<span class="tag session-id-copy" style="font-family:monospace;font-size:10px;cursor:pointer;opacity:0.8" title="Click to copy session ID">${esc(sessionId)}</span>`;
}

function bindSessionIdCopy(container) {
  for (const el of container.querySelectorAll('.session-id-copy')) {
    el.onclick = (e) => { e.stopPropagation(); copySessionId(el.textContent, el); };
  }
}

function formatElapsed(startedAt) {
  const ms = Date.now() - new Date(startedAt).getTime();
  const s = Math.floor(ms / 1000);
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m ${s % 60}s`;
  const h = Math.floor(m / 60);
  return `${h}h ${m % 60}m`;
}

function scrollToSessionPanel(session) {
  const panel = sessionPanels.get(`${session.type}:${session.id}`);
  if (panel && panel.isConnected) {
    panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (panel.classList.contains('collapsed')) {
      const btn = panel.querySelector('.minimize-btn');
      if (btn) togglePanelCollapse(`${session.type}:${session.id}`, panel, btn);
    }
  }
}

function navigateToSession(session) {
  if (session.work_item_id && session.project_key) {
    const [org, proj, comp] = session.project_key.split('/');
    if (org && proj && comp) {
      location.hash = `#component/${org}/${proj}/${comp}`;
      setTimeout(() => scrollToSessionPanel(session), 300);
      return;
    }
  }
  if (session.epic_id) {
    location.hash = `#epic/${session.epic_id}`;
    setTimeout(() => scrollToSessionPanel(session), 300);
    return;
  }
  if (session.project_key) {
    const [org, proj, comp] = session.project_key.split('/');
    if (org && proj && comp) {
      location.hash = `#component/${org}/${proj}/${comp}`;
      setTimeout(() => scrollToSessionPanel(session), 300);
      return;
    }
  }
  openFocusPopup(session.type, session.id);
}

function refreshSessionsSidebar() {
  const list = document.getElementById('sessions-list');
  if (!list) return;
  list.innerHTML = '';
  const allSessions = [
    ...activeDispatches.map(d => ({ type: 'dispatch', id: d.id, status: d.status, label: d.work_item_id || d.title || d.id, started_at: d.started_at, epic_id: d.epic_id, work_item_id: d.work_item_id, project_key: d.project_key })),
    ...activeTerminals.map(t => ({ type: 'terminal', id: t.id, status: t.status, label: t.title || t.id, started_at: t.started_at, epic_id: t.epic_id, work_item_id: t.work_item_id, project_key: t.project_key })),
    ...activeCliSessions.map(c => ({ type: 'cli', id: c.id, status: c.status, label: `[CLI] ${c.title}`, started_at: c.registered_at, epic_id: c.epic_id, work_item_id: c.work_item_id, project_key: c.project_key })),
  ];
  if (!allSessions.length) return;

  // Group by project_key, then by epic_id within each project
  const projectGroups = new Map(); // project_key → { epics: Map<epic_id, sessions[]>, noEpic: sessions[] }
  const standalone = [];
  for (const s of allSessions) {
    if (s.project_key) {
      if (!projectGroups.has(s.project_key)) projectGroups.set(s.project_key, { epics: new Map(), noEpic: [] });
      const pg = projectGroups.get(s.project_key);
      if (s.epic_id) {
        if (!pg.epics.has(s.epic_id)) pg.epics.set(s.epic_id, []);
        pg.epics.get(s.epic_id).push(s);
      } else {
        pg.noEpic.push(s);
      }
    } else {
      standalone.push(s);
    }
  }

  function renderEntry(s, indented) {
    const entry = document.createElement('div');
    entry.className = 'session-entry' + (indented ? ' indented' : '');
    const dotClass = s.status === 'running' ? 'running' : (s.status === 'suspended' ? 'suspended' : (s.status === 'completed' ? 'completed' : (s.status === 'interrupted' ? 'interrupted' : 'failed')));
    const elapsed = formatElapsed(s.started_at);
    entry.innerHTML = `<span class="status-dot ${dotClass}" style="width:8px;height:8px"></span><span class="session-label">${esc(s.label)}</span><span class="session-meta">${elapsed}</span>`;
    entry.onclick = () => navigateToSession(s);
    return entry;
  }

  // Render project > epic > session hierarchy
  for (const [pk, pg] of projectGroups) {
    // Show project label (drop org prefix for brevity)
    const parts = pk.split('/');
    const shortLabel = parts.length >= 3 ? `${parts[1]}/${parts[2]}` : pk;
    const projLabel = document.createElement('div');
    projLabel.className = 'sidebar-project-label';
    projLabel.textContent = shortLabel;
    projLabel.onclick = () => {
      const [org, proj, comp] = pk.split('/');
      if (org && proj && comp) location.hash = `#component/${org}/${proj}/${comp}`;
    };
    list.appendChild(projLabel);

    // Epic sub-groups
    for (const [epicId, sessions] of pg.epics) {
      const epicLabel = document.createElement('div');
      epicLabel.className = 'sidebar-epic-sublabel';
      epicLabel.textContent = epicId;
      epicLabel.onclick = () => { location.hash = `#epic/${epicId}`; };
      list.appendChild(epicLabel);
      for (const s of sessions) list.appendChild(renderEntry(s, true));
    }

    // No-epic sessions
    for (const s of pg.noEpic) list.appendChild(renderEntry(s, false));
  }

  // Render standalone
  if (standalone.length && projectGroups.size > 0) {
    const label = document.createElement('div');
    label.className = 'sidebar-group-label';
    label.textContent = 'STANDALONE';
    list.appendChild(label);
  }
  for (const s of standalone) list.appendChild(renderEntry(s, false));
  // Update sidebar project signal dots based on current session state
  updateProjectSignalDots();
}

let sessionsSidebarInterval = null;
function startSessionsSidebarRefresh() {
  buildSessionsSidebar();
  refreshSessionsSidebar();
  if (sessionsSidebarInterval) clearInterval(sessionsSidebarInterval);
  sessionsSidebarInterval = setInterval(refreshSessionsSidebar, 3000);
}

// --- Focus Popup ---
let activeFocusPopup = null;

function openFocusPopup(type, id) {
  closeFocusPopup();

  const overlay = document.createElement('div');
  overlay.className = 'focus-overlay';

  const popup = document.createElement('div');
  popup.className = 'focus-popup' + (type === 'terminal' ? ' terminal-focus' : '');

  let sourceEl, parentEl, title, status, startedAt, dispatch, terminalInfo;

  if (type === 'dispatch') {
    dispatch = activeDispatches.find(d => d.id === id);
    if (!dispatch) return;
    sourceEl = document.getElementById(`log-${id}`);
    parentEl = sourceEl?.parentElement;
    title = dispatch.work_item_id ? `${dispatch.work_item_id} — ${dispatch.title || ''}` : (dispatch.title || dispatch.id);
    status = dispatch.status;
    startedAt = dispatch.started_at;
  } else {
    terminalInfo = activeTerminals.find(t => t.id === id);
    if (!terminalInfo) return;
    sourceEl = document.getElementById(`term-container-${id}`);
    parentEl = sourceEl?.parentElement;
    title = terminalInfo.title || terminalInfo.id;
    status = terminalInfo.status;
    startedAt = terminalInfo.started_at;
  }

  if (!sourceEl) return;

  updateTitle(title);

  // Header
  const header = document.createElement('div');
  header.className = 'focus-popup-header';
  const dotClass = status === 'running' ? 'running' : (status === 'suspended' ? 'suspended' : (status === 'completed' ? 'completed' : 'failed'));
  let metaHtml = formatElapsed(startedAt);
  const focusBadge = type === 'terminal' ? '<span class="focus-lock-badge">FOCUSED</span>' : '';
  header.innerHTML = `<span class="status-dot ${dotClass}"></span><span class="focus-title">${esc(title)}${focusBadge}</span><span class="focus-meta">${metaHtml}</span>`;

  // Body — relocate DOM element
  const body = document.createElement('div');
  body.className = 'focus-popup-body';
  sourceEl.remove();
  body.appendChild(sourceEl);

  // For terminals, fit to new size (ResizeObserver handles this with scroll preservation)
  if (type === 'terminal' && terminalInfo?._sessionState?._fitAddon && terminalInfo?._sessionState?._term) {
    requestAnimationFrame(() => fitPreservingScroll(terminalInfo._sessionState._term, terminalInfo._sessionState._fitAddon));
  }
  // For dispatch logs, scroll to bottom on focus
  if (type === 'dispatch' && sourceEl) {
    requestAnimationFrame(() => { sourceEl.scrollTop = sourceEl.scrollHeight; });
  }

  // Footer
  const footer = document.createElement('div');
  footer.className = 'focus-popup-footer';

  const closeBtn = document.createElement('button');
  closeBtn.className = 'btn btn-close';
  closeBtn.textContent = 'Close';
  closeBtn.onclick = () => closeFocusPopup();
  footer.appendChild(closeBtn);

  // Session ID copy button
  const sessionId = type === 'dispatch' ? dispatch?.claude_session_id : terminalInfo?.claude_session_id;
  if (sessionId) {
    const sidSpan = document.createElement('span');
    sidSpan.className = 'tag session-id-copy';
    sidSpan.style.cssText = 'font-family:monospace;font-size:10px;cursor:pointer;opacity:0.8';
    sidSpan.title = 'Click to copy session ID';
    sidSpan.textContent = sessionId;
    sidSpan.onclick = () => copySessionId(sessionId, sidSpan);
    footer.appendChild(sidSpan);
  }

  const isRunning = status === 'running';
  const killBtn = document.createElement('button');
  killBtn.className = 'btn btn-kill';
  killBtn.textContent = 'Kill';
  killBtn.disabled = !isRunning;
  killBtn.onclick = async () => {
    killBtn.disabled = true;
    const endpoint = type === 'dispatch' ? `/api/dispatch/${id}` : `/api/terminal/${id}`;
    try {
      await fetch(endpoint, { method: 'DELETE' });
      if (dispatch) dispatch.status = 'killed';
      if (terminalInfo) terminalInfo.status = 'killed';
      const dot = header.querySelector('.status-dot');
      dot.classList.remove('running');
      dot.classList.add('failed');
      // Also update inline panel status class, dot, and buttons
      const panelPrefix = type === 'dispatch' ? 'dispatch' : 'terminal';
      const inlinePanel = document.querySelector(`#${panelPrefix}-${id}`);
      if (inlinePanel) {
        inlinePanel.className = inlinePanel.className.replace(/status-\w+/, 'status-killed');
        const dismissBtn = inlinePanel.querySelector(`[data-dismiss-${panelPrefix}="${id}"]`);
        if (dismissBtn) dismissBtn.style.display = '';
      }
      const inlineDot = document.querySelector(`#${panelPrefix}-${id} .status-dot`);
      if (inlineDot) { inlineDot.classList.remove('running'); inlineDot.classList.add('killed', 'failed'); }
      const inlineKill = document.querySelector(`[data-kill-${panelPrefix}="${id}"]`);
      if (inlineKill) inlineKill.disabled = true;
      syncSessionState();
    } catch {}
  };
  footer.appendChild(killBtn);

  // Suspend button
  if (isRunning) {
    const suspendBtn = document.createElement('button');
    suspendBtn.className = 'suspend-btn';
    suspendBtn.textContent = 'Suspend';
    suspendBtn.onclick = async () => {
      suspendBtn.disabled = true;
      const endpoint = type === 'dispatch' ? `/api/dispatch/${id}/suspend` : `/api/terminal/${id}/suspend`;
      try {
        const resp = await fetch(endpoint, { method: 'POST' });
        if (resp.ok) {
          if (dispatch) dispatch.status = 'suspended';
          if (terminalInfo) terminalInfo.status = 'suspended';
          const dot = header.querySelector('.status-dot');
          dot.classList.remove('running');
          dot.classList.add('suspended');
          killBtn.disabled = true;
          syncSessionState();
          closeFocusPopup();
        }
      } catch {}
    };
    footer.appendChild(suspendBtn);
  }

  // Resume button (for suspended sessions opened in focus)
  if (status === 'suspended') {
    const resumeBtn = document.createElement('button');
    resumeBtn.className = 'resume-btn';
    resumeBtn.textContent = 'Resume';
    resumeBtn.onclick = async () => {
      resumeBtn.disabled = true;
      const endpoint = type === 'dispatch' ? `/api/dispatch/${id}/resume` : `/api/terminal/${id}/resume`;
      try {
        const resp = await fetch(endpoint, { method: 'POST' });
        if (resp.ok) {
          syncSessionState();
          closeFocusPopup();
        }
      } catch {}
    };
    footer.appendChild(resumeBtn);
  }

  // /exit button for terminal sessions
  if (type === 'terminal' && terminalInfo && isRunning) {
    const exitBtn = document.createElement('button');
    exitBtn.className = 'btn';
    exitBtn.style.cssText = 'background:var(--orange);color:#fff;';
    exitBtn.textContent = '/exit';
    exitBtn.onclick = () => {
      const t = activeTerminals.find(x => x.id === id);
      if (t?._wsManager) {
        t._wsManager.send({ type: 'input', data: '/exit\n' });
        exitBtn.disabled = true;
        exitBtn.textContent = 'Sent /exit';
      }
    };
    footer.appendChild(exitBtn);
  }

  popup.appendChild(header);
  popup.appendChild(body);
  popup.appendChild(footer);
  overlay.appendChild(popup);
  document.body.appendChild(overlay);

  activeFocusPopup = { overlay, popup, type, id, sourceEl, parentEl };

  // Close handlers
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeFocusPopup(); });
  const escHandler = (e) => { if (e.key === 'Escape') closeFocusPopup(); };
  document.addEventListener('keydown', escHandler);
  activeFocusPopup.escHandler = escHandler;

  // Update header periodically
  const headerInterval = setInterval(() => {
    if (!activeFocusPopup || activeFocusPopup.id !== id) { clearInterval(headerInterval); return; }
    const metaEl = header.querySelector('.focus-meta');
    if (metaEl) {
      let meta = formatElapsed(startedAt);
      metaEl.textContent = meta;
    }
    // Update status dot in popup
    const currentStatus = type === 'dispatch' ? dispatch?.status : terminalInfo?.status;
    if (currentStatus && currentStatus !== 'running') {
      const dot = header.querySelector('.status-dot');
      dot.classList.remove('running');
      dot.classList.add(currentStatus === 'completed' ? 'completed' : 'failed');
      killBtn.disabled = true;
    }
  }, 1000);
  activeFocusPopup.headerInterval = headerInterval;
}

function closeFocusPopup() {
  if (!activeFocusPopup) return;
  const { overlay, type, id, sourceEl, parentEl, escHandler, headerInterval } = activeFocusPopup;

  // Move DOM element back to inline panel (restore original position)
  if (sourceEl && parentEl && parentEl.isConnected) {
    sourceEl.remove();
    const refEl = parentEl.children[1];
    if (refEl) parentEl.insertBefore(sourceEl, refEl);
    else parentEl.appendChild(sourceEl);
  }

  // Re-fit terminal after moving back to inline panel (delay to let DOM settle)
  if (type === 'terminal') {
    const terminalInfo = activeTerminals.find(t => t.id === id);
    const ss = terminalInfo?._sessionState;
    if (ss?._fitAddon && ss._term) {
      setTimeout(() => {
        if (ss._fitAddon && ss._term) fitPreservingScroll(ss._term, ss._fitAddon);
      }, 50);
    }
  }

  // Scroll dispatch log to bottom after returning to inline panel
  if (type === 'dispatch' && sourceEl) {
    requestAnimationFrame(() => { sourceEl.scrollTop = sourceEl.scrollHeight; });
  }

  if (escHandler) document.removeEventListener('keydown', escHandler);
  if (headerInterval) clearInterval(headerInterval);
  overlay.remove();
  activeFocusPopup = null;

  // Restore route-based title
  updateTitle(getRouteTitle());

  // Re-place panels to ensure correct slot after route changes while popup was open
  placeSessionPanels();
}

let agentsTileInterval = null;
let agentsFullRefreshInterval = null;

function renderAgentTile(agent) {
  const isCli = agent.type === 'cli';
  const dotClass = agent.status === 'running' ? 'running' : (agent.status === 'completed' ? 'completed' : 'failed');
  const elapsed = formatElapsed(agent.started_at);
  const title = agent.work_item_id ? `${agent.work_item_id} — ${agent.title || ''}` : (agent.title || agent.id);
  const preview = isCli ? '(read-only — no output)' : ((agent.last_output || []).slice(-3).join('\n') || '(no output yet)');
  const typeLabel = isCli ? 'CLI (read-only)' : (agent.type === 'terminal' ? 'interactive' : 'non-interactive');
  const typeBadgeClass = isCli ? 'badge-cli' : (agent.type === 'terminal' ? 'badge-agent' : 'badge-open');

  let badges = '';
  if (agent.project_key) badges += `<span class="tag">${esc(agent.project_key)}</span>`;
  if (agent.work_item_id) badges += `<span class="badge badge-open">${esc(agent.work_item_id)}</span>`;
  if (agent.epic_id) badges += `<span class="badge badge-epic">${esc(agent.epic_id)}</span>`;
  badges += `<span class="badge ${typeBadgeClass}">${typeLabel}</span>`;
  if (agent.claude_session_id) badges += sessionIdTag(agent.claude_session_id);

  return `<div class="agent-tile" data-agent-type="${esc(agent.type)}" data-agent-id="${esc(agent.id)}">
    <div class="agent-tile-header">
      <span class="status-dot ${dotClass}"></span>
      <span class="agent-tile-title">${esc(title)}</span>
      <span class="agent-tile-elapsed" data-started="${agent.started_at}">${elapsed}</span>
    </div>
    <div class="agent-tile-badges">${badges}</div>
    <div class="agent-tile-preview">${esc(preview)}</div>
    <div class="agent-tile-footer">
      <button class="suspend-btn" data-tile-suspend="${esc(agent.type)}:${esc(agent.id)}" ${(agent.status !== 'running' || isCli) ? 'style="display:none"' : ''}>Suspend</button>
      <button class="resume-btn" data-tile-resume="${esc(agent.type)}:${esc(agent.id)}" ${agent.status !== 'suspended' ? 'style="display:none"' : ''}>Resume</button>
      <button class="kill-btn" data-tile-kill="${esc(agent.type)}:${esc(agent.id)}" ${(agent.status !== 'running' || isCli) ? 'disabled' : ''}>Kill</button>
      ${isCli ? '' : `<button class="focus-btn" data-tile-focus="${esc(agent.type)}:${esc(agent.id)}">Focus</button>`}
    </div>
  </div>`;
}

async function fetchAgentsList() {
  const [dispatches, terminals, cliSessions] = await Promise.all([
    api('dispatch/active').catch(() => []),
    api('terminal/active').catch(() => []),
    api('sessions/active').catch(() => []),
  ]);
  const agents = [];
  for (const d of dispatches) {
    agents.push({ type: 'dispatch', id: d.id, status: d.status, title: d.work_item_id || d.id, work_item_id: d.work_item_id, project_key: d.project_key, epic_id: d.epic_id, started_at: d.started_at, last_output: d.last_output || [], cost_usd: d.cost_usd, claude_session_id: d.claude_session_id });
  }
  for (const t of terminals) {
    agents.push({ type: 'terminal', id: t.id, status: t.status, title: t.title || t.id, work_item_id: t.work_item_id, project_key: t.project_key, epic_id: t.epic_id, started_at: t.started_at, last_output: t.last_output || [], claude_session_id: t.claude_session_id });
  }
  for (const c of cliSessions) {
    agents.push({ type: 'cli', id: c.id, status: c.status === 'running' ? 'running' : 'completed', title: c.title, work_item_id: c.work_item_id, project_key: c.project_key, epic_id: c.epic_id, started_at: c.registered_at, last_output: [] });
  }
  // Sort: running first, then by started_at desc
  agents.sort((a, b) => {
    if (a.status === 'running' && b.status !== 'running') return -1;
    if (b.status === 'running' && a.status !== 'running') return 1;
    return new Date(b.started_at) - new Date(a.started_at);
  });
  return agents;
}

function renderAgentsView(agents, filters = {}) {
  const statusFilter = filters.status || 'all';
  const epicFilter = filters.epic || '';
  const projectFilter = filters.project || '';

  let filtered = agents;
  if (statusFilter === 'active') filtered = filtered.filter(a => a.status === 'running');
  else if (statusFilter === 'recent') filtered = filtered.filter(a => a.status !== 'running');
  if (epicFilter) filtered = filtered.filter(a => a.epic_id === epicFilter);
  if (projectFilter) filtered = filtered.filter(a => a.project_key === projectFilter);

  // Collect unique epics/projects for dropdowns
  const allEpics = [...new Set(agents.map(a => a.epic_id).filter(Boolean))].sort();
  const allProjects = [...new Set(agents.map(a => a.project_key).filter(Boolean))].sort();

  let html = `<div class="card"><h2>Agents</h2>`;
  html += `<div class="agents-filter-bar">`;
  html += `<span class="filter-tab${statusFilter === 'all' ? ' active' : ''}" data-agents-status="all">All (${agents.length})</span>`;
  html += `<span class="filter-tab${statusFilter === 'active' ? ' active' : ''}" data-agents-status="active">Running (${agents.filter(a => a.status === 'running').length})</span>`;
  html += `<span class="filter-tab${statusFilter === 'recent' ? ' active' : ''}" data-agents-status="recent">Completed</span>`;
  if (allEpics.length) {
    html += `<select id="agents-epic-filter"><option value="">All Epics</option>`;
    for (const e of allEpics) html += `<option value="${esc(e)}"${epicFilter === e ? ' selected' : ''}>${esc(e)}</option>`;
    html += `</select>`;
  }
  if (allProjects.length) {
    html += `<select id="agents-project-filter"><option value="">All Projects</option>`;
    for (const p of allProjects) html += `<option value="${esc(p)}"${projectFilter === p ? ' selected' : ''}>${esc(p)}</option>`;
    html += `</select>`;
  }
  html += `<button class="btn-add-wi" id="agents-quick-dispatch">+ Dispatch</button>`;
  html += `</div>`;

  if (filtered.length) {
    // Build hierarchy: project → epic → task → agents
    const hierarchy = buildAgentHierarchy(filtered);

    // Render project groups
    for (const [pk, projData] of hierarchy.projects) {
      html += `<details class="agent-group" open><summary>${esc(pk)}</summary>`;
      // Epics within project
      for (const [eid, epicTasks] of projData.epics) {
        html += `<details class="agent-subgroup" open><summary>${esc(eid)}</summary><div class="agents-grid">`;
        for (const [, taskAgents] of epicTasks) {
          for (const agent of taskAgents) html += renderAgentTile(agent);
        }
        html += `</div></details>`;
      }
      // No-epic agents within project
      if (projData.noEpic.size) {
        html += `<div class="agents-grid" style="margin-left:16px">`;
        for (const [, taskAgents] of projData.noEpic) {
          for (const agent of taskAgents) html += renderAgentTile(agent);
        }
        html += `</div>`;
      }
      html += `</details>`;
    }

    // Standalone agents (no project_key)
    if (hierarchy.standalone.length) {
      html += `<details class="agent-group" open><summary>Standalone</summary><div class="agents-grid">`;
      for (const agent of hierarchy.standalone) html += renderAgentTile(agent);
      html += `</div></details>`;
    }
  } else {
    html += `<p class="empty">No agents match the current filters.</p>`;
  }
  html += `</div>`;
  return html;
}

function buildAgentHierarchy(agents) {
  const projects = new Map(); // pk → { epics: Map<eid, Map<wi, agents[]>>, noEpic: Map<wi, agents[]> }
  const standalone = [];

  for (const agent of agents) {
    if (!agent.project_key) {
      standalone.push(agent);
      continue;
    }
    if (!projects.has(agent.project_key)) {
      projects.set(agent.project_key, { epics: new Map(), noEpic: new Map() });
    }
    const proj = projects.get(agent.project_key);
    const taskKey = agent.work_item_id || '_none';

    if (agent.epic_id) {
      if (!proj.epics.has(agent.epic_id)) proj.epics.set(agent.epic_id, new Map());
      const epicMap = proj.epics.get(agent.epic_id);
      if (!epicMap.has(taskKey)) epicMap.set(taskKey, []);
      epicMap.get(taskKey).push(agent);
    } else {
      if (!proj.noEpic.has(taskKey)) proj.noEpic.set(taskKey, []);
      proj.noEpic.get(taskKey).push(agent);
    }
  }

  return { projects, standalone };
}

function bindAgentsEvents(agents, filters) {
  // Tile click → focus
  document.querySelectorAll('.agent-tile').forEach(tile => {
    tile.onclick = (e) => {
      if (e.target.closest('button')) return;
      const type = tile.dataset.agentType;
      const id = tile.dataset.agentId;
      openFocusPopup(type, id);
    };
  });

  // Focus buttons
  document.querySelectorAll('[data-tile-focus]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const [type, id] = btn.dataset.tileFocus.split(':');
      openFocusPopup(type, id);
    };
  });

  // Kill buttons
  document.querySelectorAll('[data-tile-kill]').forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      const [type, id] = btn.dataset.tileKill.split(':');
      btn.disabled = true;
      const endpoint = type === 'terminal' ? `/api/terminal/${id}` : `/api/dispatch/${id}`;
      try {
        await fetch(endpoint, { method: 'DELETE' });
        const agent = agents.find(a => a.id === id);
        if (agent) agent.status = 'killed';
        // Update local state
        const d = activeDispatches.find(a => a.id === id);
        if (d) d.status = 'killed';
        const t = activeTerminals.find(a => a.id === id);
        if (t) t.status = 'killed';
        syncSessionState();
        // Update tile visually
        const tile = btn.closest('.agent-tile');
        const dot = tile.querySelector('.status-dot');
        dot.classList.remove('running');
        dot.classList.add('failed');
      } catch {}
    };
  });

  // Suspend buttons (agents tile view)
  document.querySelectorAll('[data-tile-suspend]').forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      const [type, id] = btn.dataset.tileSuspend.split(':');
      btn.disabled = true;
      const endpoint = type === 'terminal' ? `/api/terminal/${id}/suspend` : `/api/dispatch/${id}/suspend`;
      try {
        const resp = await fetch(endpoint, { method: 'POST' });
        if (resp.ok) {
          const agent = agents.find(a => a.id === id);
          if (agent) agent.status = 'suspended';
          const d = activeDispatches.find(a => a.id === id);
          if (d) d.status = 'suspended';
          const t = activeTerminals.find(a => a.id === id);
          if (t) t.status = 'suspended';
          syncSessionState();
          if (location.hash.startsWith('#agents')) route();
        }
      } catch {}
    };
  });

  // Resume buttons (agents tile view)
  document.querySelectorAll('[data-tile-resume]').forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      const [type, id] = btn.dataset.tileResume.split(':');
      btn.disabled = true;
      const endpoint = type === 'terminal' ? `/api/terminal/${id}/resume` : `/api/dispatch/${id}/resume`;
      try {
        const resp = await fetch(endpoint, { method: 'POST' });
        if (resp.ok) {
          syncSessionState();
          if (location.hash.startsWith('#agents')) route();
        }
      } catch {}
    };
  });

  // Session ID copy (agent tiles)
  document.querySelectorAll('.agent-tile .session-id-copy').forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); copySessionId(el.textContent, el); };
  });

  // Status filter tabs
  document.querySelectorAll('[data-agents-status]').forEach(tab => {
    tab.onclick = () => {
      const status = tab.dataset.agentsStatus;
      const hash = buildAgentsHash({ ...filters, status });
      location.hash = hash;
    };
  });

  // Epic filter
  const epicSelect = document.getElementById('agents-epic-filter');
  if (epicSelect) {
    epicSelect.onchange = () => {
      const hash = buildAgentsHash({ ...filters, epic: epicSelect.value });
      location.hash = hash;
    };
  }

  // Project filter
  const projSelect = document.getElementById('agents-project-filter');
  if (projSelect) {
    projSelect.onchange = () => {
      const hash = buildAgentsHash({ ...filters, project: projSelect.value });
      location.hash = hash;
    };
  }

  // Quick dispatch button
  const quickDispatchBtn = document.getElementById('agents-quick-dispatch');
  if (quickDispatchBtn) quickDispatchBtn.onclick = () => showQuickDispatchModal();
}

function buildAgentsHash(filters) {
  let hash = '#agents';
  const params = [];
  if (filters.status && filters.status !== 'all') params.push(`status=${filters.status}`);
  if (filters.epic) params.push(`epic=${filters.epic}`);
  if (filters.project) params.push(`project=${filters.project}`);
  if (params.length) hash += '?' + params.join('&');
  return hash;
}

function parseAgentsFilters(hash) {
  const filters = { status: 'all', epic: '', project: '' };
  const qIdx = hash.indexOf('?');
  if (qIdx === -1) return filters;
  const params = new URLSearchParams(hash.slice(qIdx + 1));
  if (params.get('status')) filters.status = params.get('status');
  if (params.get('epic')) filters.epic = params.get('epic');
  if (params.get('project')) filters.project = params.get('project');
  return filters;
}

function startAgentsTileRefresh(agents, filters) {
  stopAgentsTileRefresh();
  // Update elapsed times every 3s
  agentsTileInterval = setInterval(() => {
    document.querySelectorAll('.agent-tile-elapsed[data-started]').forEach(el => {
      el.textContent = formatElapsed(el.dataset.started);
    });
  }, 3000);
  // Full refresh every 15s
  agentsFullRefreshInterval = setInterval(async () => {
    if (!location.hash.startsWith('#agents')) { stopAgentsTileRefresh(); return; }
    const freshAgents = await fetchAgentsList();
    const main = $('#main');
    main.innerHTML = renderAgentsView(freshAgents, filters);
    bindAgentsEvents(freshAgents, filters);
    placeSessionPanels();
  }, 15000);
}

function stopAgentsTileRefresh() {
  if (agentsTileInterval) { clearInterval(agentsTileInterval); agentsTileInterval = null; }
  if (agentsFullRefreshInterval) { clearInterval(agentsFullRefreshInterval); agentsFullRefreshInterval = null; }
}

async function showQuickDispatchModal() {
  let registryKeys = [];
  try {
    const registry = await api('registry');
    for (const [, entry] of Object.entries(registry.entries)) {
      registryKeys.push(`${entry.org}/${entry.project}/${entry.component}`);
    }
    registryKeys.sort();
  } catch {}
  if (!registryKeys.includes(ARCHITECT_KEY)) registryKeys.unshift(ARCHITECT_KEY);

  let epicsList = [];
  try { epicsList = await getEpics(); } catch {}

  const { overlay } = createDispatchOverlay({
    title: 'Quick Dispatch',
    cancelId: 'qd-cancel',
    submitId: 'qd-go',
    buildFields: () => `
      <div class="field">
        <label>Target Project *</label>
        <select id="qd-project">
          ${registryKeys.map(k => `<option value="${esc(k)}">${esc(k)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Work Item ID (optional)</label>
        <input type="text" id="qd-work-item" placeholder="W-XXX" />
      </div>
      <div class="field">
        <label>Epic (optional)</label>
        <select id="qd-epic">
          <option value="">None</option>
          ${epicsList.map(e => `<option value="${esc(e.id)}">${esc(e.id)}: ${esc(e.title)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Instructions</label>
        <textarea id="qd-instructions" placeholder="What should the agent do?"></textarea>
      </div>
      <div class="field">
        <label for="qd-agent-type">Agent</label>
        <select id="qd-agent-type">
          <option value="claude" selected>Claude</option>
          <option value="shell">Shell</option>
          <option value="codex">Codex</option>
          <option value="gemini">Gemini</option>
        </select>
      </div>
      <div class="interactive-toggle">
        <input type="checkbox" id="qd-claude-agent" checked />
        <label for="qd-claude-agent">Claude Agent</label>
      </div>
      ${permissionModeSelect('qd-perm-mode')}
      ${skipPermissionsCheckbox('qd-skip-perms')}
    `,
    onSubmit: async (overlay) => {
      const pk = overlay.querySelector('#qd-project').value;
      const wid = overlay.querySelector('#qd-work-item').value.trim() || null;
      const epicId = overlay.querySelector('#qd-epic').value || null;
      const instructions = overlay.querySelector('#qd-instructions').value.trim();
      const plainTerminal = !overlay.querySelector('#qd-claude-agent').checked;
      const agentType = overlay.querySelector('#qd-agent-type')?.value || 'claude';
      const permMode = getPermissionMode(overlay, 'qd-perm-mode');
      const skipPerms = overlay.querySelector('#qd-skip-perms').checked;

      if (!pk) { throw new Error('Project is required'); }
      if (!plainTerminal && !wid && !instructions) { throw new Error('Work item or instructions required'); }

      const endpoint = plainTerminal ? '/api/terminal/shell' : '/api/terminal';
      const titleText = wid || instructions?.slice(0, 60) || 'Quick dispatch';
      const body = plainTerminal
        ? { work_item_id: wid, epic_id: epicId, project_key: pk, title: titleText }
        : {
            work_item_id: wid,
            epic_id: epicId,
            project_key: pk,
            title: titleText,
            additional_instructions: instructions,
            permission_mode: permMode,
            skip_permissions: skipPerms,
            agentType,
          };
      const resp = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const result = await resp.json();
      if (!resp.ok) throw new Error(result.error || 'Dispatch failed');

      let projectPath = '';
      if (pk === ARCHITECT_KEY) {
        projectPath = '(architect root)';
      } else {
        try {
          const registry = await api('registry');
          for (const [path, entry] of Object.entries(registry.entries)) {
            if (`${entry.org}/${entry.project}/${entry.component}` === pk) { projectPath = path; break; }
          }
        } catch {}
      }

      const terminalInfo = {
        id: result.terminal_id, type: plainTerminal ? 'shell' : 'claude',
        agent_type: plainTerminal ? 'shell' : agentType,
        work_item_id: wid, epic_id: epicId,
        project_key: pk, project_path: projectPath,
        title: titleText,
        permission_mode: plainTerminal ? 'acceptEdits' : permMode,
        skip_permissions: skipPerms,
        status: 'running', started_at: new Date().toISOString(),
      };
      activeTerminals.push(terminalInfo);
      syncSessionState();
      createTerminalPanel(terminalInfo);
      placeSessionPanels();
      await initSession(terminalInfo);
      // Refresh agents view if on that page
      if (location.hash.startsWith('#agents')) route();
    },
  });

  overlay.querySelector('#qd-claude-agent').onchange = () => {
    const agent = overlay.querySelector('#qd-claude-agent').checked;
    overlay.querySelector('#qd-perm-mode').disabled = !agent;
    overlay.querySelector('#qd-skip-perms').disabled = !agent;
  };
}

function formatDuration(seconds) {
  if (!seconds || seconds < 0) return '0m';
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}

function formatCost(usd) {
  if (!usd) return '-';
  return `$${usd.toFixed(2)}`;
}

const CHART_COLORS = ['#7c3aed','#3b82f6','#22c55e','#f59e0b','#ec4899','#14b8a6','#f97316','#8b5cf6'];

function assignProjectColors(rows) {
  const seen = new Map();
  let idx = 0;
  for (const r of rows) {
    if (!seen.has(r.project_key)) {
      seen.set(r.project_key, { label: r.component ? `${r.project}/${r.component}` : r.project_key, color: CHART_COLORS[idx % CHART_COLORS.length] });
      idx++;
    }
  }
  return seen;
}

function renderBarChart(data) {
  if (!data.length) return '<p style="color:var(--text-light);font-size:13px">No data.</p>';
  const maxVal = Math.max(...data.map(d => d.value));
  const barH = 26, gap = 4, labelW = 140, valW = 60, chartW = 500, barArea = chartW - labelW - valW;
  const svgH = data.length * (barH + gap);
  let svg = `<svg viewBox="0 0 ${chartW} ${svgH}" style="width:100%;max-width:${chartW}px;display:block">`;
  data.forEach((d, i) => {
    const y = i * (barH + gap);
    const w = maxVal > 0 ? (d.value / maxVal) * barArea : 0;
    const label = d.label.length > 20 ? d.label.slice(0, 18) + '..' : d.label;
    svg += `<text x="0" y="${y + barH / 2 + 4}" font-size="12" fill="currentColor" style="font-family:inherit">${esc(label)}</text>`;
    svg += `<rect x="${labelW}" y="${y + 2}" width="${Math.max(w, 1)}" height="${barH - 4}" rx="3" fill="${d.color}" opacity="0.85"/>`;
    svg += `<text x="${labelW + w + 6}" y="${y + barH / 2 + 4}" font-size="11" fill="currentColor" style="font-family:inherit">${d.valLabel}</text>`;
  });
  svg += '</svg>';
  return svg;
}

function renderDonutChart(data, totalLabel) {
  if (!data.length) return '<p style="color:var(--text-light);font-size:13px">No data.</p>';
  const size = 180, cx = size / 2, cy = size / 2, r = 70, inner = 45;
  const total = data.reduce((s, d) => s + d.value, 0);
  if (total <= 0) return '<p style="color:var(--text-light);font-size:13px">No data.</p>';
  let svg = `<div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap">`;
  svg += `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;flex-shrink:0">`;
  let angle = -Math.PI / 2;
  for (const d of data) {
    const sweep = (d.value / total) * Math.PI * 2;
    if (sweep < 0.01) continue;
    const x1 = cx + r * Math.cos(angle), y1 = cy + r * Math.sin(angle);
    const x2 = cx + r * Math.cos(angle + sweep), y2 = cy + r * Math.sin(angle + sweep);
    const ix1 = cx + inner * Math.cos(angle + sweep), iy1 = cy + inner * Math.sin(angle + sweep);
    const ix2 = cx + inner * Math.cos(angle), iy2 = cy + inner * Math.sin(angle);
    const large = sweep > Math.PI ? 1 : 0;
    svg += `<path d="M${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} L${ix1},${iy1} A${inner},${inner} 0 ${large} 0 ${ix2},${iy2} Z" fill="${d.color}" opacity="0.85"/>`;
    angle += sweep;
  }
  svg += `<text x="${cx}" y="${cy - 4}" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor" style="font-family:inherit">${totalLabel}</text>`;
  svg += `<text x="${cx}" y="${cy + 12}" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.6" style="font-family:inherit">total</text>`;
  svg += '</svg>';
  svg += '<div style="font-size:12px;line-height:1.8">';
  for (const d of data) {
    const pct = ((d.value / total) * 100).toFixed(1);
    svg += `<div><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${d.color};margin-right:6px"></span>${esc(d.label)} <span style="color:var(--text-light)">${pct}%</span></div>`;
  }
  svg += '</div></div>';
  return svg;
}

function renderStackedBarChart(columns, projects, matrix) {
  if (!columns.length || !projects.length) return '<p style="color:var(--text-light);font-size:13px">No data.</p>';
  const colTotals = columns.map((_, ci) => projects.reduce((s, _, pi) => s + (matrix[pi]?.[ci] || 0), 0));
  const maxVal = Math.max(...colTotals, 0.001);
  const pad = { l: 36, r: 10, t: 10, b: 50 }, chartH = 200;
  const svgW = pad.l + columns.length * 44 + pad.r, svgH = chartH + pad.t + pad.b;
  const barW = 30, barArea = chartH;
  let svg = `<svg viewBox="0 0 ${svgW} ${svgH}" style="width:100%;max-width:${svgW}px;display:block">`;
  // Y-axis labels
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + barArea - (i / 4) * barArea;
    const val = ((maxVal / 3600) * (i / 4)).toFixed(1);
    svg += `<text x="${pad.l - 4}" y="${y + 3}" text-anchor="end" font-size="9" fill="currentColor" opacity="0.5" style="font-family:inherit">${val}h</text>`;
    svg += `<line x1="${pad.l}" y1="${y}" x2="${svgW - pad.r}" y2="${y}" stroke="currentColor" opacity="0.08"/>`;
  }
  columns.forEach((col, ci) => {
    const x = pad.l + ci * 44 + 7;
    let yBottom = pad.t + barArea;
    projects.forEach((p, pi) => {
      const val = matrix[pi]?.[ci] || 0;
      if (val <= 0) return;
      const h = (val / maxVal) * barArea;
      yBottom -= h;
      svg += `<rect x="${x}" y="${yBottom}" width="${barW}" height="${h}" rx="2" fill="${p.color}" opacity="0.85"/>`;
    });
    svg += `<text x="${x + barW / 2}" y="${pad.t + barArea + 14}" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.6" transform="rotate(45,${x + barW / 2},${pad.t + barArea + 14})" style="font-family:inherit">${esc(col)}</text>`;
  });
  svg += '</svg>';
  // Legend
  svg += '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:11px">';
  for (const p of projects) {
    svg += `<div><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${p.color};margin-right:4px"></span>${esc(p.label)}</div>`;
  }
  svg += '</div>';
  return svg;
}

function renderPivotTable(data, periodKey, labelFn) {
  if (!data.length) return '<p style="color:var(--text-light);font-size:13px">No sessions in this period.</p>';
  const periods = [...new Set(data.map(d => d[periodKey]))].sort();
  const projectMap = new Map();
  for (const d of data) {
    if (!projectMap.has(d.project_key)) projectMap.set(d.project_key, { label: d.component ? `${d.project}/${d.component}` : d.project_key, org: d.org, totals: 0 });
    projectMap.get(d.project_key).totals += d.time_seconds;
  }
  const projectKeys = [...projectMap.keys()].sort((a, b) => projectMap.get(b).totals - projectMap.get(a).totals);
  const lookup = new Map();
  for (const d of data) lookup.set(`${d.project_key}|${d[periodKey]}`, d.time_seconds);
  const colTotals = periods.map(p => projectKeys.reduce((s, pk) => s + (lookup.get(`${pk}|${p}`) || 0), 0));
  const maxCell = Math.max(...[...lookup.values()], 0.001);
  const compact = periods.length > 7;
  const cellPad = compact ? '4px 5px' : '6px 10px';
  const fontSize = compact ? '11px' : '12px';
  let html = `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:${fontSize}">`;
  html += `<thead><tr style="border-bottom:2px solid var(--border)"><th style="padding:${cellPad};text-align:left">Project</th>`;
  for (const p of periods) html += `<th style="padding:${cellPad};text-align:right;white-space:nowrap">${esc(labelFn(p))}</th>`;
  html += `<th style="padding:${cellPad};text-align:right;font-weight:700">Total</th></tr></thead><tbody>`;
  for (const pk of projectKeys) {
    const info = projectMap.get(pk);
    html += `<tr style="border-bottom:1px solid var(--border)">`;
    html += `<td style="padding:${cellPad};white-space:nowrap"><span style="color:var(--text-light);font-size:10px">${esc(info.org || '')}</span> ${esc(info.label)}</td>`;
    for (const p of periods) {
      const val = lookup.get(`${pk}|${p}`) || 0;
      const opacity = val > 0 ? (0.06 + 0.2 * (val / maxCell)).toFixed(2) : 0;
      const bg = val > 0 ? `background:rgba(124,58,237,${opacity})` : '';
      html += `<td style="padding:${cellPad};text-align:right;${bg}">${val > 0 ? formatDuration(val) : '<span style="color:var(--text-light)">–</span>'}</td>`;
    }
    html += `<td style="padding:${cellPad};text-align:right;font-weight:600">${formatDuration(info.totals)}</td></tr>`;
  }
  html += `<tr style="border-top:2px solid var(--border);font-weight:700"><td style="padding:${cellPad}">Total</td>`;
  for (const t of colTotals) html += `<td style="padding:${cellPad};text-align:right">${formatDuration(t)}</td>`;
  const grandTotal = colTotals.reduce((s, t) => s + t, 0);
  html += `<td style="padding:${cellPad};text-align:right">${formatDuration(grandTotal)}</td></tr>`;
  html += '</tbody></table></div>';
  return html;
}

function renderTimeReport(report) {
  const todayStr = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

  function renderTable(rows, totals) {
    if (!rows.length) return '<p style="color:var(--text-light);font-size:13px">No sessions recorded yet.</p>';
    let html = `<table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead><tr style="border-bottom:2px solid var(--border);text-align:left">
        <th style="padding:8px 12px">Project</th>
        <th style="padding:8px 12px;text-align:right">Sessions</th>
        <th style="padding:8px 12px;text-align:right">Time</th>
        <th style="padding:8px 12px;text-align:right">Cost</th>
      </tr></thead><tbody>`;
    for (const r of rows) {
      const label = r.component ? `${r.project} / ${r.component}` : r.project_key;
      html += `<tr style="border-bottom:1px solid var(--border)">
        <td style="padding:8px 12px"><span style="color:var(--text-light);font-size:11px">${esc(r.org || '')}</span> ${esc(label)}</td>
        <td style="padding:8px 12px;text-align:right">${r.sessions}</td>
        <td style="padding:8px 12px;text-align:right;font-weight:600">${formatDuration(r.time_seconds)}</td>
        <td style="padding:8px 12px;text-align:right">${formatCost(r.cost_usd)}</td>
      </tr>`;
    }
    html += `<tr style="border-top:2px solid var(--border);font-weight:700">
      <td style="padding:8px 12px">Total</td>
      <td style="padding:8px 12px;text-align:right">${totals.sessions}</td>
      <td style="padding:8px 12px;text-align:right">${formatDuration(totals.time_seconds)}</td>
      <td style="padding:8px 12px;text-align:right">${formatCost(totals.cost_usd)}</td>
    </tr></tbody></table>`;
    return html;
  }

  // Color assignments from overall data (most time first)
  const colorMap = assignProjectColors(report.overall);

  // Today bar chart
  const todayBarData = report.today.map(r => {
    const info = colorMap.get(r.project_key) || { label: r.project_key, color: CHART_COLORS[0] };
    return { label: info.label, value: r.time_seconds, valLabel: formatDuration(r.time_seconds), color: info.color };
  });

  // All Time donut + bar
  const allTimeDonut = report.overall.map(r => {
    const info = colorMap.get(r.project_key) || { label: r.project_key, color: CHART_COLORS[0] };
    return { label: info.label, value: r.time_seconds, color: info.color };
  });
  const allTimeBar = report.overall.map(r => {
    const info = colorMap.get(r.project_key) || { label: r.project_key, color: CHART_COLORS[0] };
    return { label: info.label, value: r.time_seconds, valLabel: formatDuration(r.time_seconds), color: info.color };
  });

  // Daily stacked chart
  const dailyCols = [...new Set((report.daily || []).map(d => d.day))].sort();
  const dailyProjects = [];
  const dailyPkSet = new Set();
  for (const d of (report.daily || [])) {
    if (!dailyPkSet.has(d.project_key)) {
      dailyPkSet.add(d.project_key);
      const info = colorMap.get(d.project_key) || { label: d.project_key, color: CHART_COLORS[dailyProjects.length % CHART_COLORS.length] };
      dailyProjects.push({ key: d.project_key, label: info.label, color: info.color });
    }
  }
  const dailyLookup = new Map();
  for (const d of (report.daily || [])) dailyLookup.set(`${d.project_key}|${d.day}`, d.time_seconds);
  const dailyMatrix = dailyProjects.map(p => dailyCols.map(c => dailyLookup.get(`${p.key}|${c}`) || 0));
  const dailyColLabels = dailyCols.map(d => { const dt = new Date(d + 'T00:00:00'); return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); });

  // Monthly stacked chart
  const monthlyCols = [...new Set((report.monthly || []).map(d => d.month))].sort();
  const monthlyProjects = [];
  const monthlyPkSet = new Set();
  for (const d of (report.monthly || [])) {
    if (!monthlyPkSet.has(d.project_key)) {
      monthlyPkSet.add(d.project_key);
      const info = colorMap.get(d.project_key) || { label: d.project_key, color: CHART_COLORS[monthlyProjects.length % CHART_COLORS.length] };
      monthlyProjects.push({ key: d.project_key, label: info.label, color: info.color });
    }
  }
  const monthlyLookup = new Map();
  for (const d of (report.monthly || [])) monthlyLookup.set(`${d.project_key}|${d.month}`, d.time_seconds);
  const monthlyMatrix = monthlyProjects.map(p => monthlyCols.map(c => monthlyLookup.get(`${p.key}|${c}`) || 0));
  const monthlyColLabels = monthlyCols.map(m => { const [y, mo] = m.split('-'); return new Date(+y, +mo - 1).toLocaleDateString('en-US', { month: 'short', year: '2-digit' }); });

  return `<div class="card">
    <h2 style="margin-bottom:4px">Time Report</h2>
    <p style="color:var(--text-light);font-size:13px;margin-bottom:16px">${todayStr}</p>
    <div class="tabs" id="tr-tabs">
      <div class="tab active" data-tab="0">Today</div>
      <div class="tab" data-tab="1">All Time</div>
      <div class="tab" data-tab="2">Daily (14d)</div>
      <div class="tab" data-tab="3">Monthly (6mo)</div>
    </div>
    <div class="tab-content active" data-panel="0">
      <div style="margin-bottom:20px">${renderBarChart(todayBarData)}</div>
      ${renderTable(report.today, report.today_total)}
    </div>
    <div class="tab-content" data-panel="1">
      <div style="margin-bottom:20px">${renderDonutChart(allTimeDonut, formatDuration(report.overall_total.time_seconds))}</div>
      <h3 style="font-size:14px;margin:20px 0 10px;color:var(--accent)">By Project</h3>
      <div style="margin-bottom:20px">${renderBarChart(allTimeBar)}</div>
      ${renderTable(report.overall, report.overall_total)}
    </div>
    <div class="tab-content" data-panel="2">
      <div style="margin-bottom:20px">${renderStackedBarChart(dailyColLabels, dailyProjects, dailyMatrix)}</div>
      <h3 style="font-size:14px;margin:20px 0 10px;color:var(--accent)">Daily Breakdown</h3>
      ${renderPivotTable(report.daily || [], 'day', d => { const dt = new Date(d + 'T00:00:00'); return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', weekday: 'short' }); })}
    </div>
    <div class="tab-content" data-panel="3">
      <div style="margin-bottom:20px">${renderStackedBarChart(monthlyColLabels, monthlyProjects, monthlyMatrix)}</div>
      <h3 style="font-size:14px;margin:20px 0 10px;color:var(--accent)">Monthly Breakdown</h3>
      ${renderPivotTable(report.monthly || [], 'month', m => { const [y, mo] = m.split('-'); return new Date(+y, +mo - 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' }); })}
    </div>
  </div>`;
}

function bindTimeReportTabs() {
  const tabs = document.querySelectorAll('#tr-tabs .tab');
  tabs.forEach(tab => {
    tab.onclick = () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const card = document.querySelector('#tr-tabs').closest('.card');
      card.querySelectorAll('.tab-content').forEach(p => p.classList.remove('active'));
      card.querySelector(`.tab-content[data-panel="${tab.dataset.tab}"]`).classList.add('active');
    };
  });
}

// --- Settings view ---

function formatUptime(seconds) {
  if (seconds < 60) return seconds + 's';
  const m = Math.floor(seconds / 60);
  if (m < 60) return m + 'm ' + (seconds % 60) + 's';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ' + (m % 60) + 'm';
  const d = Math.floor(h / 24);
  return d + 'd ' + (h % 24) + 'h ' + (m % 60) + 'm';
}

function renderSettingsView(status, config) {
  const running = status && status.pid;
  const dot = running ? 'green' : 'red';
  const label = running ? 'Running' : 'Stopped';
  const uptime = running ? formatUptime(status.uptime_seconds) : '—';
  const sessions = status.sessions || {};
  const autoStart = config.auto_start || {};
  const autoLabel = autoStart.installed ? 'Installed (' + autoStart.type + ')' : 'Not installed';
  const platform = status.platform === 'darwin' ? 'macOS' : (status.platform === 'linux' ? 'Linux' : status.platform);
  const serviceDesc = status.platform === 'darwin'
    ? 'Installs a launchd agent that starts the dashboard automatically on login. Uses KeepAlive to restart on crashes.'
    : 'Installs a systemd user service that starts the dashboard automatically on login. Restarts on failure.';

  let html = '<h2 style="margin-bottom:20px">Settings</h2>';
  html += '<div class="settings-grid">';

  // Card 1: Server Status
  html += '<div class="settings-card">';
  html += '<h3>Server Status</h3>';
  html += '<div class="status-indicator"><span class="dot ' + dot + '"></span><span class="label">' + label + '</span></div>';
  html += '<div class="settings-kv">';
  html += '<div><span class="key">PID</span> ' + (status.pid || '—') + '</div>';
  html += '<div><span class="key">Port</span> ' + config.port + '</div>';
  html += '<div><span class="key">Uptime</span> <span id="settings-uptime">' + uptime + '</span></div>';
  html += '<div><span class="key">Node</span> ' + (status.node_version || '—') + '</div>';
  html += '<div><span class="key">Platform</span> ' + platform + '</div>';
  html += '<div><span class="key">Dispatches</span> ' + (sessions.dispatches_active || 0) + ' active / ' + (sessions.dispatches_total || 0) + ' total</div>';
  html += '<div><span class="key">Terminals</span> ' + (sessions.terminals_active || 0) + ' active / ' + (sessions.terminals_total || 0) + ' total</div>';
  html += '</div></div>';

  // Card 2: Actions
  html += '<div class="settings-card">';
  html += '<h3>Actions</h3>';
  html += '<div class="settings-actions">';
  html += '<button class="settings-btn primary" id="settings-restart">Restart Server</button>';
  html += '<button class="settings-btn danger" id="settings-stop">Stop Server</button>';
  html += '<button class="settings-btn" id="settings-fresh">Fresh Start</button>';
  html += '<button class="settings-btn" id="settings-killall">Kill All Sessions</button>';
  html += '</div>';
  html += '<div class="settings-output" id="settings-action-output"></div>';
  html += '</div>';

  // Card 3: Auto-Start Service
  html += '<div class="settings-card">';
  html += '<h3>Auto-Start Service</h3>';
  html += '<div class="status-indicator"><span class="dot ' + (autoStart.installed ? 'green' : 'red') + '"></span><span class="label" id="settings-auto-label">' + autoLabel + '</span></div>';
  html += '<p style="font-size:13px;color:var(--text-light);margin-bottom:12px">' + serviceDesc + '</p>';
  html += '<div class="settings-actions">';
  if (autoStart.installed) {
    html += '<button class="settings-btn danger" id="settings-uninstall">Uninstall Service</button>';
  } else {
    html += '<button class="settings-btn primary" id="settings-install">Install Service</button>';
  }
  html += '</div>';
  html += '<div class="settings-output" id="settings-service-output"></div>';
  html += '</div>';

  // Card 4: Preferences
  html += '<div class="settings-card">';
  html += '<h3>Preferences</h3>';
  const curPerm = window._prefs.default_permission_mode || 'acceptEdits';
  const curSkip = window._prefs.default_skip_permissions === 'true' || window._prefs.default_skip_permissions === true;
  html += '<div class="settings-kv">';
  html += '<div><span class="key">Default Permission Mode</span>';
  html += '<select id="settings-perm-mode" style="padding:4px 8px;border:1px solid var(--border);border-radius:4px;font-size:13px">';
  html += '<option value="plan"' + (curPerm === 'plan' ? ' selected' : '') + '>Plan only</option>';
  html += '<option value="acceptEdits"' + (curPerm === 'acceptEdits' ? ' selected' : '') + '>Accept edits</option>';
  html += '</select></div>';
  html += '<div style="margin-top:8px"><label style="display:flex;align-items:center;gap:8px;cursor:pointer">';
  html += '<input type="checkbox" id="settings-skip-perms"' + (curSkip ? ' checked' : '') + ' />';

  html += '<option value="light"' + (curTheme === 'light' ? ' selected' : '') + '>Light</option>';

  html += '</select></div>';
  html += '</div></div>';

  // Card 5: Recent Logs
  html += '<div class="settings-card">';
  html += '<h3>Recent Logs <button class="settings-btn" id="settings-refresh-logs" style="float:right;padding:4px 12px;font-size:12px">Refresh</button></h3>';
  html += '<div class="settings-log-box" id="settings-log-box">(loading...)</div>';
  html += '</div>';

  html += '</div>';
  return html;
}

let settingsRefreshTimer = null;

function bindSettingsEvents(status, config) {
  loadSettingsLogs();

  if (settingsRefreshTimer) clearInterval(settingsRefreshTimer);
  settingsRefreshTimer = setInterval(async () => {
    try {
      const s = await api('server/status');
      const el = document.getElementById('settings-uptime');
      if (el) el.textContent = formatUptime(s.uptime_seconds);
    } catch {}
  }, 5000);

  document.getElementById('settings-restart')?.addEventListener('click', async () => {
    if (!confirm('Restart the dashboard server?')) return;
    try {
      await fetch('/api/server/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'restart' }) });
      showReconnectingOverlay();
    } catch {}
  });

  document.getElementById('settings-stop')?.addEventListener('click', async () => {
    if (!confirm('Stop the dashboard server? You will lose connection.')) return;
    try {
      await fetch('/api/server/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'stop' }) });
      const out = document.getElementById('settings-action-output');
      if (out) { out.style.display = 'block'; out.textContent = 'Server is stopping... Connection will be lost.'; }
    } catch {}
  });

  document.getElementById('settings-fresh')?.addEventListener('click', async () => {
    const clearSessions = confirm('Clear all session data as well?\n\nOK = clear sessions + restart\nCancel = restart only (keep sessions)');
    try {
      await fetch('/api/server/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'fresh', clear_sessions: clearSessions }) });
      showReconnectingOverlay();
    } catch {}
  });

  document.getElementById('settings-killall')?.addEventListener('click', async () => {
    if (!confirm('Kill all active dispatches and terminals?')) return;
    try {
      await Promise.all([
        fetch('/api/dispatch/all', { method: 'DELETE' }),
        fetch('/api/terminal/all', { method: 'DELETE' }),
      ]);
      const out = document.getElementById('settings-action-output');
      if (out) { out.style.display = 'block'; out.textContent = 'All sessions killed.'; }
      setTimeout(() => { if (out) out.style.display = 'none'; }, 3000);
    } catch (e) {
      alert('Failed: ' + e.message);
    }
  });

  document.getElementById('settings-install')?.addEventListener('click', async () => {
    try {
      const r = await fetch('/api/server/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'install' }) });
      const data = await r.json();
      const out = document.getElementById('settings-service-output');
      if (out) { out.style.display = 'block'; out.textContent = data.output || 'Done'; }
      setTimeout(() => { location.hash = '#settings'; route(); }, 1500);
    } catch (e) {
      alert('Install failed: ' + e.message);
    }
  });

  document.getElementById('settings-uninstall')?.addEventListener('click', async () => {
    if (!confirm('Remove auto-start service?')) return;
    try {
      const r = await fetch('/api/server/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'uninstall' }) });
      const data = await r.json();
      const out = document.getElementById('settings-service-output');
      if (out) { out.style.display = 'block'; out.textContent = data.output || 'Done'; }
      setTimeout(() => { location.hash = '#settings'; route(); }, 1500);
    } catch (e) {
      alert('Uninstall failed: ' + e.message);
    }
  });

  document.getElementById('settings-refresh-logs')?.addEventListener('click', loadSettingsLogs);

  // Preferences
  document.getElementById('settings-perm-mode')?.addEventListener('change', async (e) => {
    try {
      await fetch('/api/settings/preferences', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ default_permission_mode: e.target.value }),
      });
      window._prefs.default_permission_mode = e.target.value;
    } catch (err) {
      alert('Failed to save preference: ' + err.message);
    }
  });

  document.getElementById('settings-skip-perms')?.addEventListener('change', async (e) => {
    try {
      await fetch('/api/settings/preferences', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ default_skip_permissions: String(e.target.checked) }),
      });
      window._prefs.default_skip_permissions = String(e.target.checked);
    } catch (err) {
      alert('Failed to save preference: ' + err.message);
    }
  });

  document.getElementById('settings-terminal-theme')?.addEventListener('change', async (e) => {
    try {
      await fetch('/api/settings/preferences', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ terminal_theme: e.target.value }),
      });
      window._prefs.terminal_theme = e.target.value;
    } catch (err) {
      alert('Failed to save preference: ' + err.message);
    }
  });

  document.getElementById('settings-panel-state')?.addEventListener('change', async (e) => {
    try {
      await fetch('/api/settings/preferences', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ default_panel_state: e.target.value }),
      });
      window._prefs.default_panel_state = e.target.value;
    } catch (err) {
      alert('Failed to save preference: ' + err.message);
    }
  });
}

async function loadSettingsLogs() {
  try {
    const r = await fetch('/api/server/logs?lines=50');
    const t = await r.text();
    const box = document.getElementById('settings-log-box');
    if (box) {
      box.textContent = t || '(empty)';
      box.scrollTop = box.scrollHeight;
    }
  } catch {
    const box = document.getElementById('settings-log-box');
    if (box) box.textContent = '(could not load logs)';
  }
}

function showReconnectingOverlay() {
  const overlay = document.createElement('div');
  overlay.className = 'reconnecting-overlay';
  overlay.innerHTML = '<div class="reconnecting-box"><h3>Reconnecting...</h3><p>Waiting for the server to come back</p></div>';
  document.body.appendChild(overlay);

  const poll = setInterval(async () => {
    try {
      const r = await fetch('/api/server/status');
      if (r.ok) {
        clearInterval(poll);
        overlay.remove();
        route();
      }
    } catch {}
  }, 1500);

  setTimeout(() => {
    clearInterval(poll);
    if (overlay.isConnected) {
      overlay.querySelector('.reconnecting-box').innerHTML = `<h3>Server not responding</h3><p>The server may be stopped. Use dashctl.sh to restart it.</p><button class="settings-btn" onclick="this.closest('.reconnecting-overlay').remove()" style="margin-top:12px">Dismiss</button>`;
    }
  }, 30000);
}



// --- Router ---
async function route() {
  const hash = location.hash.slice(1);
  const main = $('#main');

  updateTitle(getRouteTitle());
  stopAgentsTileRefresh();
  if (settingsRefreshTimer) { clearInterval(settingsRefreshTimer); settingsRefreshTimer = null; }

  if (!hash) {
    main.innerHTML = `<div class="card"><h2>Portfolio Dashboard</h2><p style="color:var(--text-light);font-size:14px">Select an organization or project from the sidebar.</p></div>`;
    setActive('');
    placeSessionPanels();
    return;
  }

  const parts = hash.split('/');

  if (parts[0] === 'epics') {
    try {
      const epics = await getEpics();
      main.innerHTML = renderEpicListView(epics);
      bindEpicListEvents();
    } catch (e) {
      main.innerHTML = `<div class="card"><p style="color:var(--red)">Error: ${esc(String(e))}</p></div>`;
    }
    setActive('');
    placeSessionPanels();
    return;
  }

  if (parts[0] === 'agents' || hash.startsWith('agents?')) {
    try {
      const filters = parseAgentsFilters(hash);
      const agents = await fetchAgentsList();
      main.innerHTML = renderAgentsView(agents, filters);
      bindAgentsEvents(agents, filters);
      startAgentsTileRefresh(agents, filters);
    } catch (e) {
      main.innerHTML = `<div class="card"><p style="color:var(--red)">Error: ${esc(String(e))}</p></div>`;
    }
    setActive('');
    placeSessionPanels();
    return;
  }

  if (parts[0] === 'time-report') {
    try {
      const report = await api('time-report');
      main.innerHTML = renderTimeReport(report);
      bindTimeReportTabs();
    } catch (e) {
      main.innerHTML = `<div class="card"><p style="color:var(--red)">Error loading time report: ${esc(String(e))}</p></div>`;
    }
    setActive('');
    return;
  }

  if (parts[0] === 'settings') {
    try {
      const [status, config] = await Promise.all([
        api('server/status'),
        api('server/config'),
      ]);
      main.innerHTML = renderSettingsView(status, config);
      bindSettingsEvents(status, config);
    } catch (e) {
      main.innerHTML = `<div class="card"><p style="color:var(--red)">Error loading settings: ${esc(String(e))}</p></div>`;
    }
    setActive('');
    placeSessionPanels();
    return;
  }

  if (parts[0] === 'epic' && parts[1]) {
    try {
      const { html, epicId } = await renderEpicDetailView(parts[1]);
      main.innerHTML = html;
      bindEpicDetailEvents(epicId);
    } catch (e) {
      main.innerHTML = `<div class="card"><p style="color:var(--red)">Error: ${esc(String(e))}</p></div>`;
    }
    setActive('');
    document.querySelectorAll('.epic-item').forEach(el => {
      el.classList.toggle('active', el.dataset.epicId === parts[1]);
    });
    placeSessionPanels();
    return;
  }

  if (parts[0] === 'org' && parts[1]) {
    const org = parts[1];
    try {
      const data = orgCache[org] || await api(`org/${org}`);
      orgCache[org] = data;
      // Compute org sessions from active dispatches + terminals
      const orgSessions = [
        ...activeDispatches.filter(d => d.project_key && d.project_key.startsWith(org + '/')).map(d => ({ type: 'dispatch', id: d.id, status: d.status, title: d.work_item_id || d.title || d.id, work_item_id: d.work_item_id, project_key: d.project_key, started_at: d.started_at })),
        ...activeTerminals.filter(t => t.project_key && t.project_key.startsWith(org + '/')).map(t => ({ type: 'terminal', id: t.id, status: t.status, title: t.title || t.id, work_item_id: t.work_item_id, project_key: t.project_key, started_at: t.started_at })),
      ];
      main.innerHTML = renderOrgView(org, data, orgSessions);
      // Bind focus buttons in org agents table
      document.querySelectorAll('[data-org-focus]').forEach(btn => {
        btn.onclick = () => {
          const [type, id] = btn.dataset.orgFocus.split(':');
          openFocusPopup(type, id);
        };
      });
    } catch (e) {
      main.innerHTML = `<div class="card"><p style="color:var(--red)">Error: ${esc(String(e))}</p></div>`;
    }
    setActive('');
    placeSessionPanels();
    return;
  }

  if (parts[0] === 'component' && parts.length >= 4) {
    const [, org, proj, comp] = parts;
    try {
      const [data, bl, files] = await Promise.all([
        api(`component/${org}/${proj}/${comp}`),
        getBacklog(),
        api(`project/${org}/${proj}`)
      ]);

      // Match work items (case-insensitive)
      const projKey = `${org}/${proj}/${comp}`.toLowerCase();
      const workItems = [];
      if (bl.projects) {
        for (const [key, val] of Object.entries(bl.projects)) {
          if (key.toLowerCase() === projKey && val.items) {
            workItems.push(...val.items);
          }
        }
      }

      main.innerHTML = renderComponentView(org, proj, comp, data, workItems, files);
      bindTabs();
      setActive(`${org}/${proj}/${comp}`);
    } catch (e) {
      main.innerHTML = `<div class="card"><p style="color:var(--red)">Error: ${esc(String(e))}</p></div>`;
    }
    placeSessionPanels();
    return;
  }

  main.innerHTML = `<div class="card"><p class="empty">Unknown route: ${esc(hash)}</p></div>`;
  placeSessionPanels();
}

window.addEventListener('hashchange', () => { closeFocusPopup(); route(); });
// Start restoring sessions immediately in parallel with tree building so panels
// appear within the test's 5 s window regardless of how long the sidebar takes.
const _restorePromise = Promise.all([
  restoreDispatches(),
  restoreTerminals(),
  restoreCliSessions(),
]);
Promise.all([buildTree(), buildEpicTree()]).then(async () => {
  startSessionsSidebarRefresh();
  route();
  await _restorePromise;
  refreshSessionsSidebar();
  // Periodic session refresh (every 10s) — sync with server-side auto-cleanup
  setInterval(restoreDispatches, 10000);
  setInterval(restoreTerminals, 10000);
  setInterval(restoreCliSessions, 10000);
});
</script>
