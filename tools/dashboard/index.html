  if (data.custom_rules?.length) {
    html += `<h3>Custom Rules</h3><ul class="item-list">`;
    for (const r of data.custom_rules) html += `<li>${esc(r)}</li>`;
    html += `</ul>`;
  }
  // Agents
  html += `<hr style="margin:16px 0">`;
  html += `<h3>Agents</h3>`;
  if (data.agents) {
    if (data.agents.recommended?.length) {
      html += `<h3>Recommended</h3><div>`;
      for (const a of data.agents.recommended) html += `<span class="badge badge-agent">${esc(a)}</span>`;
      html += `</div>`;
    }
    if (data.agents.dispatch_notes && Object.keys(data.agents.dispatch_notes).length) {
      html += `<h3>Dispatch Notes</h3><dl class="kv">`;
      for (const [a, note] of Object.entries(data.agents.dispatch_notes)) {
        html += `<dt><span class="badge badge-agent">${esc(a)}</span></dt><dd>${esc(note)}</dd>`;
      }
      html += `</dl>`;
    }
  } else {
    html += `<p class="empty">No agent recommendations.</p>`;
  }
  html += `</div>`;

  // Tab 2: Docs
  const mdFiles = files.filter(f => f.endsWith('.md'));
  html += `<div class="tab-content" data-panel="2">`;
  if (mdFiles.length) {
    html += `<div id="doc-files">`;
    for (const f of mdFiles) html += `<span class="file-link" data-doc="${esc(f)}">${esc(f)}</span>`;
    html += `</div><div id="doc-render" class="md-container" style="margin-top:12px"></div>`;
  } else {
    html += `<p class="empty">No documentation files.</p>`;
  }
  html += `</div>`;

  html += `</div>`;
  return html;
}

function bindTabs() {
  const tabs = document.querySelectorAll('#comp-tabs .tab');
  tabs.forEach(tab => {
    tab.onclick = () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      document.querySelectorAll('.tab-content').forEach(p => p.classList.remove('active'));
      document.querySelector(`.tab-content[data-panel="${tab.dataset.tab}"]`).classList.add('active');
    };
  });

  // Work item expand
  document.querySelectorAll('.expand-btn').forEach(btn => {
    btn.onclick = () => {
      const row = document.querySelector(`[data-wi-detail="${btn.dataset.wi}"]`);
      const showing = row.style.display !== 'none';
      row.style.display = showing ? 'none' : '';
      btn.textContent = showing ? 'details' : 'hide';
    };
  });

  // Add work item button
  const addBtn = document.getElementById('add-work-item');
  if (addBtn) addBtn.onclick = () => showWorkItemModal(null);

  // Edit buttons
  document.querySelectorAll('.edit-btn').forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.wiEdit);
      const wi = currentWorkItems[idx];
      if (wi) showWorkItemModal(wi);
    };
  });

  // Delete buttons
  document.querySelectorAll('.delete-btn').forEach(btn => {
    btn.onclick = async () => {
      const idx = parseInt(btn.dataset.wiDel);
      const wi = currentWorkItems[idx];
      if (!wi) return;
      if (!confirm(`Delete task ${wi.id}: "${wi.title}"?`)) return;
      try {
        const resp = await fetch(`/api/work-items/${wi.id}`, { method: 'DELETE' });
        const result = await resp.json();
        if (!resp.ok) throw new Error(result.error || 'Delete failed');
        backlog = null;
        await buildTree();
        route();
      } catch (e) {
        alert('Delete failed: ' + e.message);
      }
    };
  });

  // Dispatch buttons
  document.querySelectorAll('.dispatch-btn').forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.wiIdx);
      const wi = currentWorkItems[idx];
      if (wi) dispatchWorkItem(wi, currentProjectKey);
    };
  });

  // Status badge click (component view)
  document.querySelectorAll('[data-status-click]').forEach(badge => {
    badge.onclick = (e) => {
      e.stopPropagation();
      showStatusDropdown(badge, badge.dataset.statusClick, badge.dataset.currentStatus);
    };
  });

  // Session log submit buttons
  document.querySelectorAll('[data-log-submit]').forEach(btn => {
    btn.onclick = async () => {
      const wid = btn.dataset.logSubmit;
      const input = document.querySelector(`[data-log-wi="${wid}"]`);
      const message = input?.value?.trim();
      if (!message) return;
      btn.disabled = true; btn.textContent = '...';
      try {
        const resp = await fetch(`/api/work-items/${wid}/log`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
        });
        if (!resp.ok) throw new Error('Failed');
        backlog = null;
        route();
      } catch (e) {
        alert('Error: ' + e.message);
        btn.disabled = false; btn.textContent = 'Add Log';
      }
    };
  });

  // Work item plan buttons
  document.querySelectorAll('[data-wi-plan]').forEach(btn => {
    btn.onclick = () => loadItemArtifact(btn.dataset.wiPlan, 'plan');
  });

  // Work item doc buttons
  document.querySelectorAll('[data-wi-doc]').forEach(btn => {
    btn.onclick = () => loadItemArtifact(btn.dataset.wiDoc, 'doc');
  });

  // Work item files buttons
  document.querySelectorAll('[data-wi-files]').forEach(btn => {
    btn.onclick = () => loadItemArtifacts(btn.dataset.wiFiles);
  });

  // Epic badge navigation
  document.querySelectorAll('[data-epic-nav]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      location.hash = `#epic/${el.dataset.epicNav}`;
    };
  });

  // Discuss with Agent button
  const discussBtn = document.getElementById('discuss-agent');
  if (discussBtn) discussBtn.onclick = () => showDiscussModal();
  const reviewBtn = document.getElementById('review-prs');
  if (reviewBtn) reviewBtn.onclick = () => showReviewModal(currentProjectKey);

  // Filter bar
  bindFilterBar();

  // Doc links
  document.querySelectorAll('.file-link').forEach(link => {
    link.onclick = async () => {
      document.querySelectorAll('.file-link').forEach(l => l.classList.remove('active'));
      link.classList.add('active');
      const hash = location.hash.slice(1).split('/');
      // #component/org/proj/comp
      const [, org, proj] = hash;
      const render = $('#doc-render');
      try {
        render.innerHTML = '<p style="color:var(--text-light)">Loading...</p>';
        const text = await apiText(`doc/${org}/${proj}/${link.dataset.doc}`);
        render.innerHTML = renderMd(text);
      } catch (e) {
        render.innerHTML = `<p style="color:var(--red)">Failed to load: ${esc(String(e))}</p>`;
      }
    };
  });
}

// --- Inline Status Dropdown ---
function showStatusDropdown(badge, itemId, currentStatus) {
  // Remove any existing dropdown
  document.querySelectorAll('.status-dropdown').forEach(d => d.remove());
  const statuses = ['open', 'in-progress', 'blocked', 'done', 'cancelled'];
  const dropdown = document.createElement('div');
  dropdown.className = 'status-dropdown';
  for (const s of statuses) {
    const btn = document.createElement('button');
    btn.className = 'status-option' + (s === currentStatus ? ' current' : '');
    btn.textContent = s;
    btn.onclick = async (e) => {
      e.stopPropagation();
      dropdown.remove();
      if (s === currentStatus) return;
      try {
        const resp = await fetch(`/api/work-items/${itemId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: s }),
        });
        if (!resp.ok) { const r = await resp.json(); throw new Error(r.error || 'Failed'); }
        backlog = null; epicCache = null;
        await Promise.all([buildTree(), buildEpicTree()]);
        route();
      } catch (err) {
        alert('Status update failed: ' + err.message);
      }
    };
    dropdown.appendChild(btn);
  }
  const rect = badge.getBoundingClientRect();
  dropdown.style.position = 'fixed';
  dropdown.style.top = (rect.bottom + 4) + 'px';
  dropdown.style.left = rect.left + 'px';
  document.body.appendChild(dropdown);
  const close = (e) => { if (!dropdown.contains(e.target) && e.target !== badge) { dropdown.remove(); document.removeEventListener('click', close); } };
  setTimeout(() => document.addEventListener('click', close), 0);
}

// --- Filter bar logic ---
function bindFilterBar() {
  const bar = document.getElementById('wi-filter-bar');
  if (!bar) return;

  // Exclusion model: unchecked = hidden. Default: done + cancelled excluded.
  const excludedStatus = new Set(['done', 'cancelled']);
  const excludedPriority = new Set();
  const activeFilters = { epic: '', tags: '' };
  const prefsKey = 'wi_filters';

  // Restore from server preferences (async, applies on load)
  (async () => {
    try {
      const res = await fetch('/api/settings/preferences');
      const prefs = await res.json();
      if (prefs[prefsKey]) {
        const saved = JSON.parse(prefs[prefsKey]);
        excludedStatus.clear();
        if (saved.excludedStatus) saved.excludedStatus.forEach(s => excludedStatus.add(s));
        excludedPriority.clear();
        if (saved.excludedPriority) saved.excludedPriority.forEach(p => excludedPriority.add(p));
        activeFilters.epic = saved.epic || '';
        activeFilters.tags = saved.tags || '';
        // Sync checkbox UI
        bar.querySelectorAll('input[data-wi-status]').forEach(cb => {
          cb.checked = !excludedStatus.has(cb.dataset.wiStatus);
        });
        bar.querySelectorAll('input[data-wi-priority]').forEach(cb => {
          cb.checked = !excludedPriority.has(cb.dataset.wiPriority);
        });
        const epicSel = document.getElementById('wi-filter-epic');
        if (epicSel && activeFilters.epic) epicSel.value = activeFilters.epic;
        const tagsInput = document.getElementById('wi-filter-tags');
        if (tagsInput && activeFilters.tags) tagsInput.value = activeFilters.tags;
        applyFilters();
      } else {
        applyFilters(); // apply defaults
      }
    } catch { applyFilters(); }
  })();

  function saveFilters() {
    const payload = JSON.stringify({
      excludedStatus: [...excludedStatus],
      excludedPriority: [...excludedPriority],
      epic: activeFilters.epic,
      tags: activeFilters.tags,
    });
    fetch('/api/settings/preferences', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ [prefsKey]: payload }),
    }).catch(() => {});
  }

  function applyFilters() {
    const rows = document.querySelectorAll('[data-wi-row]');
    let visible = 0;
    const total = rows.length;
    const hasFilters = excludedStatus.size || excludedPriority.size || activeFilters.epic || activeFilters.tags;

    // Build set of work item IDs that have active sessions
    const wiIdsWithActiveSessions = new Set();
    for (const d of activeDispatches) { if (d.status === 'running' && d.work_item_id) wiIdsWithActiveSessions.add(d.work_item_id); }
    for (const t of activeTerminals) { if (t.status === 'running' && t.work_item_id) wiIdsWithActiveSessions.add(t.work_item_id); }

    rows.forEach(row => {
      let show = true;
      if (excludedStatus.has(row.dataset.wiStatusVal)) show = false;
      if (excludedPriority.has(row.dataset.wiPriorityVal)) show = false;
      if (activeFilters.epic && row.dataset.wiEpicVal !== activeFilters.epic) show = false;
      if (activeFilters.tags) {
        const rowTags = (row.dataset.wiTagsVal || '').toLowerCase();
        if (!rowTags.includes(activeFilters.tags.toLowerCase())) show = false;
      }
      // Force-show rows with active sessions even if filtered out
      const wiId = row.querySelector('code')?.textContent;
      const hasActiveSessions = wiId && wiIdsWithActiveSessions.has(wiId);
      if (!show && hasActiveSessions) {
        show = true;
        row.style.opacity = '0.7';
        row.style.borderLeft = '3px solid var(--orange)';
        row.title = 'Hidden by filters but has active sessions';
      } else {
        row.style.opacity = '';
        row.style.borderLeft = '';
        row.title = '';
      }
      row.style.display = show ? '' : 'none';
      const idx = row.dataset.wiRow;
      const detail = document.querySelector(`[data-wi-detail="${idx}"]`);
      const sessions = document.querySelector(`[data-wi-sessions="${wiId}"]`);
      if (detail && !show) detail.style.display = 'none';
      if (sessions) sessions.style.display = show ? '' : 'none';
      if (show) visible++;
    });

    const countEl = document.getElementById('wi-filter-count');
    if (countEl) countEl.textContent = hasFilters ? `${visible} of ${total} tasks` : `${total} tasks`;
    const clearBtn = document.getElementById('wi-filter-clear');
    if (clearBtn) clearBtn.style.display = hasFilters ? '' : 'none';
    saveFilters();
  }

  // Status checkboxes
  bar.querySelectorAll('input[data-wi-status]').forEach(cb => {
    cb.onchange = () => {
      const val = cb.dataset.wiStatus;
      if (cb.checked) excludedStatus.delete(val);
      else excludedStatus.add(val);
      applyFilters();
    };
  });

  // Priority checkboxes
  bar.querySelectorAll('input[data-wi-priority]').forEach(cb => {
    cb.onchange = () => {
      const val = cb.dataset.wiPriority;
      if (cb.checked) excludedPriority.delete(val);
      else excludedPriority.add(val);
      applyFilters();
    };
  });

  // Epic dropdown
  const epicSel = document.getElementById('wi-filter-epic');
  if (epicSel) epicSel.onchange = () => { activeFilters.epic = epicSel.value; applyFilters(); };

  // Tags input
  const tagsInput = document.getElementById('wi-filter-tags');
  if (tagsInput) tagsInput.oninput = () => { activeFilters.tags = tagsInput.value; applyFilters(); };

  // Clear button — resets to show all
  const clearBtn = document.getElementById('wi-filter-clear');
  if (clearBtn) clearBtn.onclick = () => {
    excludedStatus.clear();
    excludedPriority.clear();
    activeFilters.epic = '';
    activeFilters.tags = '';
    bar.querySelectorAll('input[data-wi-status], input[data-wi-priority]').forEach(cb => { cb.checked = true; });
    if (epicSel) epicSel.value = '';
    if (tagsInput) tagsInput.value = '';
    applyFilters();
  };

  // Column sorting
  const wiTable = document.getElementById('wi-table');
  if (wiTable) {
    const priorityOrder = { critical: 0, high: 1, medium: 2, low: 3 };
    const statusOrder = { 'open': 0, 'in-progress': 1, 'blocked': 2, 'done': 3, 'cancelled': 4 };
    let sortCol = null, sortAsc = true;

    wiTable.querySelectorAll('th[data-wi-sort]').forEach(th => {
      th.onclick = () => {
        const col = th.dataset.wiSort;
        if (sortCol === col) sortAsc = !sortAsc;
        else { sortCol = col; sortAsc = true; }
        // Update header indicators
        wiTable.querySelectorAll('th[data-wi-sort]').forEach(h => {
          h.textContent = h.textContent.replace(/ [↑↓⇅]$/, '') + (h.dataset.wiSort === sortCol ? (sortAsc ? ' ↑' : ' ↓') : ' ⇅');
        });
        // Sort visible rows
        const tbody = wiTable.querySelector('tbody');
        const rows = [...tbody.querySelectorAll('[data-wi-row]')];
        rows.sort((a, b) => {
          let va, vb;
          if (col === 'id') {
            va = parseInt((a.querySelector('code')?.textContent || '').replace(/\D/g, '')) || 0;
            vb = parseInt((b.querySelector('code')?.textContent || '').replace(/\D/g, '')) || 0;
          } else if (col === 'status') {
            va = statusOrder[a.dataset.wiStatusVal] ?? 99;
            vb = statusOrder[b.dataset.wiStatusVal] ?? 99;
          } else if (col === 'priority') {
            va = priorityOrder[a.dataset.wiPriorityVal] ?? 99;
            vb = priorityOrder[b.dataset.wiPriorityVal] ?? 99;
          }
          return sortAsc ? va - vb : vb - va;
        });
        // Re-append rows in sorted order (detail + session rows follow their parent)
        rows.forEach(row => {
          const idx = row.dataset.wiRow;
          tbody.appendChild(row);
          const detail = tbody.querySelector(`[data-wi-detail="${idx}"]`);
          if (detail) tbody.appendChild(detail);
          const wiId = row.querySelector('code')?.textContent;
          const sessions = tbody.querySelector(`[data-wi-sessions="${wiId}"]`);
          if (sessions) tbody.appendChild(sessions);
        });
      };
    });
  }
}

// --- Work Item Modal ---
function showWorkItemModal(existingItem = null) {
  const isEdit = !!existingItem;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>${isEdit ? `Edit ${esc(existingItem.id)}` : 'New Task'}</h3>
      <div class="field">
        <label>Title *</label>
        <input type="text" id="wi-title" value="${isEdit ? esc(existingItem.title) : ''}" />
      </div>
      <div class="field">
        <label>Status</label>
        <select id="wi-status">
          ${['open','in-progress','blocked','done','cancelled'].map(s => `<option value="${s}"${(isEdit ? existingItem.status : 'open') === s ? ' selected' : ''}>${s}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Priority</label>
        <select id="wi-priority">
          ${['critical','high','medium','low'].map(p => `<option value="${p}"${(isEdit ? existingItem.priority : 'medium') === p ? ' selected' : ''}>${p}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="wi-description">${isEdit && existingItem.description ? esc(existingItem.description) : ''}</textarea>
      </div>
      <div class="field">
        <label>Tags (comma-separated)</label>
        <input type="text" id="wi-tags" value="${isEdit && existingItem.tags ? esc(existingItem.tags.join(', ')) : ''}" />
      </div>
      <div class="field">
        <label>Depends On (comma-separated W-XXX IDs)</label>
        <input type="text" id="wi-depends" value="${isEdit && existingItem.depends_on ? esc(existingItem.depends_on.join(', ')) : ''}" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="wi-cancel">Cancel</button>
        <button class="btn btn-dispatch" id="wi-save">${isEdit ? 'Save' : 'Create'}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.querySelector('#wi-cancel').onclick = () => overlay.remove();
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  overlay.querySelector('#wi-save').onclick = async () => {
    const title = overlay.querySelector('#wi-title').value.trim();
    if (!title) { alert('Title is required'); return; }

    const btn = overlay.querySelector('#wi-save');
    btn.disabled = true;
    btn.textContent = isEdit ? 'Saving...' : 'Creating...';

    const payload = {
      title,
      status: overlay.querySelector('#wi-status').value,
      priority: overlay.querySelector('#wi-priority').value,
      description: overlay.querySelector('#wi-description').value.trim(),
      tags: overlay.querySelector('#wi-tags').value.split(',').map(t => t.trim()).filter(Boolean),
      depends_on: overlay.querySelector('#wi-depends').value.split(',').map(t => t.trim()).filter(Boolean),
    };

    try {
      const url = isEdit ? `/api/work-items/${existingItem.id}` : '/api/work-items';
      const method = isEdit ? 'PATCH' : 'POST';
      if (!isEdit) payload.project_key = currentProjectKey;

      const resp = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const result = await resp.json();
      if (!resp.ok) throw new Error(result.error || 'Failed');

      overlay.remove();
      backlog = null; epicCache = null; // bust cache
      await Promise.all([buildTree(), buildEpicTree()]);
      route();
    } catch (e) {
      btn.disabled = false;
      btn.textContent = isEdit ? 'Save' : 'Create';
      alert('Error: ' + e.message);
    }
  };
}

// --- Discuss Modal ---
function showDiscussModal() {
  createDispatchOverlay({
    title: 'Discuss with Agent',
    cancelId: 'discuss-cancel',
    submitId: 'discuss-submit',
    buildFields: () => `
      <div class="field">
        <label>Project</label>
        <div style="font-size:13px"><code>${esc(currentProjectKey)}</code></div>
      </div>
      <div class="field">
        <label>Prompt / Instructions *</label>
        <textarea id="discuss-instructions" placeholder="What would you like to discuss? e.g., architecture decisions, code exploration, questions about the project..."></textarea>
      </div>
      <div class="field">
        <label for="discuss-agent-type">Agent</label>
        <select id="discuss-agent-type">
          <option value="claude" selected>Claude</option>
          <option value="shell">Shell</option>
          <option value="codex">Codex</option>
          <option value="gemini">Gemini</option>
        </select>
      </div>
      ${permissionModeSelect('discuss-perm-mode')}
      ${skipPermissionsCheckbox('discuss-skip-perms')}
    `,
    onSubmit: async (overlay) => {
      const instructions = overlay.querySelector('#discuss-instructions').value.trim();
      if (!instructions) { throw new Error('Instructions are required'); }
      const agentType = overlay.querySelector('#discuss-agent-type')?.value || 'claude';
      const permMode = getPermissionMode(overlay, 'discuss-perm-mode');
      const skipPerms = overlay.querySelector('#discuss-skip-perms').checked;

      const body = {
        project_key: currentProjectKey,
        additional_instructions: instructions,
        permission_mode: permMode,
        skip_permissions: skipPerms,
        agentType,
      };
      const resp = await fetch('/api/terminal', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const result = await resp.json();
      if (!resp.ok) throw new Error(result.error || 'Dispatch failed');

      let projectPath = '';
      if (currentProjectKey === ARCHITECT_KEY) {
        projectPath = '(architect root)';
      } else {
        try {
          const registry = await api('registry');
          for (const [path, entry] of Object.entries(registry.entries)) {
            if (`${entry.org}/${entry.project}/${entry.component}` === currentProjectKey) {
              projectPath = path;
              break;
            }
          }
        } catch {}
      }

      const terminalInfo = {
        id: result.terminal_id,
        agent_type: agentType,
        work_item_id: null,
        project_key: currentProjectKey,
        project_path: projectPath,
        title: instructions.slice(0, 60) + (instructions.length > 60 ? '...' : ''),
        permission_mode: permMode,
        skip_permissions: skipPerms,
        status: 'running',
        started_at: new Date().toISOString(),
      };
      activeTerminals.push(terminalInfo);
      syncSessionState();
      createTerminalPanel(terminalInfo);
      placeSessionPanels();
      await initSession(terminalInfo);
    },
  });
}

async function showReviewModal(projectKey) {
  let prs = [];

  const { overlay } = createDispatchOverlay({
    title: 'Review Pull Requests',
    cancelId: 'review-cancel',
    submitId: 'review-submit',
    submitLabel: 'Review',
    buildFields: () => `
      <div class="field">
        <label>Project</label>
        <div style="font-size:13px"><code>${esc(projectKey)}</code></div>
      </div>

        </div>
      </div>

      </div>

    `,
    onSubmit: async (overlay) => {
      const checked = overlay.querySelectorAll('[data-pr-number]:checked');
      const instructions = overlay.querySelector('#review-instructions').value.trim();

      if (!checked.length && !instructions) {

      const permMode = getPermissionMode(overlay, 'review-perm-mode');
      const skipPerms = overlay.querySelector('#review-skip-perms').checked;

      let reviewPrompt = '';
      if (selectedPRs.length) {
        reviewPrompt += 'Review the following pull requests using /review:\n\n';
        for (const pr of selectedPRs) {
          reviewPrompt += `- PR #${pr.number}: "${pr.title}" (branch: ${pr.headRefName})\n`;
        }
      }
      if (instructions) {
        reviewPrompt += `\nAdditional instructions:\n${instructions}`;
      }

      const titleText = selectedPRs.length
        ? `Review: ${selectedPRs.map(p => `#${p.number}`).join(', ')}`
        : 'Review: custom';

      const resp = await fetch('/api/dispatch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          project_key: projectKey,
          additional_instructions: reviewPrompt,
          permission_mode: permMode || 'plan',
          skip_permissions: skipPerms,
          title: titleText,
        }),
      });
      const result = await resp.json();
      if (!resp.ok) throw new Error(result.error || 'Dispatch failed');

      const dispatch = {
        id: result.dispatch_id,
        work_item_id: null,
        project_key: projectKey,
        title: titleText,
        permission_mode: permMode || 'plan',
        skip_permissions: skipPerms,
        needs_input: false,
        status: 'running',
        started_at: new Date().toISOString(),
      };
      activeDispatches.push(dispatch);
      syncSessionState();
      createDispatchPanel(dispatch);
      placeSessionPanels();
      loadDispatchContent(dispatch);
    },
  });

  overlay.querySelector('.modal').style.maxWidth = '560px';

  const [org, proj, comp] = projectKey.split('/');
  try {
    prs = await api(`project/${org}/${proj}/${comp}/prs`);
    const listEl = overlay.querySelector('#review-pr-list');
    if (!listEl) return;
    if (!prs.length) {
      listEl.innerHTML = '<span style="color:var(--text-light);font-size:13px">No open PRs found</span>';
    } else {
      listEl.innerHTML = prs.map((pr, i) => `
        <label style="display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--border);cursor:pointer;font-size:13px">
          <input type="checkbox" data-pr-idx="${i}" data-pr-number="${pr.number}" style="flex-shrink:0" />
          <span style="font-weight:600;color:var(--accent);flex-shrink:0">#${pr.number}</span>
          <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(pr.title)}</span>
          <span style="font-size:11px;color:var(--text-light);flex-shrink:0">${esc(pr.headRefName)}</span>
        </label>
      `).join('');
    }
  } catch (e) {
    const listEl = overlay.querySelector('#review-pr-list');
    if (listEl) listEl.innerHTML = `<span style="color:var(--red);font-size:13px">Failed to fetch PRs</span>`;
  }
}

async function showEpicDiscussModal(epicId) {
  const epic = await api(`epics/${epicId}`);
  let projectKeys = epic.project_keys || [];
  const p = epic.progress || { done: 0, total: 0 };

  let registryKeys = [];
  if (!projectKeys.length) {
    try {
      const registry = await api('registry');
      for (const [, entry] of Object.entries(registry.entries)) {
        registryKeys.push(`${entry.org}/${entry.project}/${entry.component}`);
      }
      registryKeys.sort();
    } catch {}
    projectKeys = registryKeys;
  }
  if (!projectKeys.includes(ARCHITECT_KEY)) projectKeys.unshift(ARCHITECT_KEY);

  const { overlay } = createDispatchOverlay({
    title: 'Discuss Epic with Agent',
    cancelId: 'epic-discuss-cancel',
    submitId: 'epic-discuss-submit',
    submitLabel: 'Discuss',
    buildFields: () => `
      <div style="margin-bottom:14px">
        <strong>${esc(epic.title)}</strong>
        <div style="font-size:12px;color:var(--text-light);margin-top:4px">Progress: ${p.done}/${p.total}</div>
      </div>
      <div class="field">
        <label>Target Project</label>
        <select id="epic-discuss-project">
          ${projectKeys.map(k => `<option value="${esc(k)}">${esc(k)}</option>`).join('')}
        </select>
        ${registryKeys.length ? '<div style="font-size:11px;color:var(--text-light);margin-top:2px">No linked projects — showing all registry projects</div>' : ''}
      </div>
      <div class="field">
        <label>Prompt / Instructions *</label>
        <textarea id="epic-discuss-instructions" placeholder="What would you like to discuss? e.g., architecture decisions, scope planning, implementation strategy..."></textarea>
      </div>
      <div class="field">
        <label for="epic-discuss-agent-type">Agent</label>
        <select id="epic-discuss-agent-type">
          <option value="claude" selected>Claude</option>
          <option value="shell">Shell</option>
          <option value="codex">Codex</option>
          <option value="gemini">Gemini</option>
        </select>
      </div>
      ${permissionModeSelect('epic-discuss-perm-mode')}
      ${skipPermissionsCheckbox('epic-discuss-skip-perms')}
    `,
    onSubmit: async (overlay) => {
      const instructions = overlay.querySelector('#epic-discuss-instructions').value.trim();
      if (!instructions) { throw new Error('Instructions are required'); }
      const agentType = overlay.querySelector('#epic-discuss-agent-type')?.value || 'claude';
      const permMode = getPermissionMode(overlay, 'epic-discuss-perm-mode');
      const skipPerms = overlay.querySelector('#epic-discuss-skip-perms').checked;
      const pk = overlay.querySelector('#epic-discuss-project').value || projectKeys[0];

      if (!pk) { throw new Error('No project key available. Onboard a project first.'); }

      const body = {
        epic_id: epicId,
        project_key: pk,
        additional_instructions: instructions,
        permission_mode: permMode,
        skip_permissions: skipPerms,
        agentType,
      };

      const resp = await fetch('/api/terminal', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const result = await resp.json();
      if (!resp.ok) throw new Error(result.error || 'Dispatch failed');

      let projectPath = '';
      if (pk === ARCHITECT_KEY) {
        projectPath = '(architect root)';
      } else {
        try {
          const registry = await api('registry');
          for (const [path, entry] of Object.entries(registry.entries)) {
            if (`${entry.org}/${entry.project}/${entry.component}` === pk) { projectPath = path; break; }
          }
        } catch {}
      }

      const terminalInfo = {
        id: result.terminal_id,
        agent_type: agentType,
        work_item_id: null,
        epic_id: epicId,
        project_key: pk,
        project_path: projectPath,
        title: instructions.slice(0, 60) + (instructions.length > 60 ? '...' : ''),
        permission_mode: permMode,
        skip_permissions: skipPerms,
        status: 'running',
        started_at: new Date().toISOString(),
      };
      activeTerminals.push(terminalInfo);
      syncSessionState();
      createTerminalPanel(terminalInfo);
      placeSessionPanels();
      await initSession(terminalInfo);
    },
  });

  overlay.querySelector('[data-modal-submit]').style.background = 'var(--teal)';
}

// --- Epic Views ---

function renderEpicListView(epics) {
  const isInactive = s => s === 'done' || s === 'cancelled' || s === 'archived';
  const hasCompleted = epics.some(e => isInactive(e.status));
  let html = `<div class="card"><h2>Epics</h2>`;
  html += `<button class="btn-add-wi" id="create-epic">+ New Epic</button>`;
  if (hasCompleted) {
    html += `<label class="filter-checkbox" style="margin-left:12px"><input type="checkbox" id="epic-show-done" />Show completed &amp; archived</label>`;
  }
  if (epics.length) {
    html += `<table><thead><tr><th>ID</th><th>Title</th><th>Status</th><th>Priority</th><th>Progress</th><th>Projects</th><th>Target</th><th></th></tr></thead><tbody>`;
    for (const epic of epics) {
      const p = epic.progress || { done: 0, total: 0 };
      const pct = p.total ? Math.round(p.done / p.total * 100) : 0;
      const hideCompleted = isInactive(epic.status) ? ' style="display:none"' : '';
      const statusBadge = epic.status === 'active' ? 'open' : epic.status === 'done' ? 'done' : epic.status === 'archived' ? 'archived' : 'medium';
      const canArchive = epic.status === 'done' || epic.status === 'cancelled';
      html += `<tr data-epic-list-status="${esc(epic.status)}"${hideCompleted}>`;
      html += `<td><code style="cursor:pointer" data-epic-nav="${esc(epic.id)}">${esc(epic.id)}</code></td>`;
      html += `<td>${esc(epic.title)}</td>`;
      html += `<td><span class="badge badge-${statusBadge}">${esc(epic.status)}</span></td>`;
      html += `<td><span class="badge badge-${epic.priority || 'medium'}">${esc(epic.priority || 'medium')}</span></td>`;
      html += `<td>${p.done}/${p.total} (${pct}%)</td>`;
      html += `<td>${(epic.project_keys || []).map(k => `<span class="tag">${esc(k)}</span>`).join('')}</td>`;
      html += `<td>${epic.target_date || '—'}</td>`;
      html += `<td><button class="dispatch-btn" data-epic-dispatch="${esc(epic.id)}">dispatch</button><button class="dispatch-btn" data-epic-discuss="${esc(epic.id)}" style="background:var(--teal);margin-left:4px">discuss</button>${canArchive ? `<button class="dispatch-btn" data-epic-archive="${esc(epic.id)}" style="background:#94a3b8;margin-left:4px">archive</button>` : ''}</td>`;
      html += `</tr>`;
    }
    html += `</tbody></table>`;
  } else {
    html += `<p class="empty">No epics yet.</p>`;
  }
  html += `</div>`;
  return html;
}

function bindEpicListEvents() {
  document.querySelectorAll('[data-epic-nav]').forEach(el => {
    el.onclick = () => { location.hash = `#epic/${el.dataset.epicNav}`; };
  });
  const createBtn = document.getElementById('create-epic');
  if (createBtn) createBtn.onclick = () => showEpicModal(null);
  const showDone = document.getElementById('epic-show-done');
  if (showDone) showDone.onchange = () => {
    document.querySelectorAll('[data-epic-list-status="done"], [data-epic-list-status="cancelled"], [data-epic-list-status="archived"]').forEach(row => {
      row.style.display = showDone.checked ? '' : 'none';
    });
  };
  document.querySelectorAll('[data-epic-dispatch]').forEach(btn => {
    btn.onclick = () => showEpicDispatchModal(btn.dataset.epicDispatch);
  });
  document.querySelectorAll('[data-epic-discuss]').forEach(btn => {
    btn.onclick = () => showEpicDiscussModal(btn.dataset.epicDiscuss);
  });
  document.querySelectorAll('[data-epic-archive]').forEach(btn => {
    btn.onclick = async () => {
      const eid = btn.dataset.epicArchive;
      if (!confirm(`Archive epic ${eid}? It will be hidden from the main view.`)) return;
      try {
        const resp = await fetch(`/api/epics/${eid}/archive`, { method: 'POST' });
        if (!resp.ok) throw new Error('Archive failed');
        backlog = null; epicCache = null;
        await buildEpicTree();
        route();
      } catch (e) {
        alert('Error: ' + e.message);
      }
    };
  });
}

function bindEpicDetailEvents(epicId) {
  // Tabs
  const tabs = document.querySelectorAll('#epic-tabs .tab');
  tabs.forEach(tab => {
    tab.onclick = () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      document.querySelectorAll('.tab-content').forEach(p => p.classList.remove('active'));
      document.querySelector(`.tab-content[data-panel="${tab.dataset.tab}"]`).classList.add('active');
      if (tab.dataset.tab === '1') loadEpicPlan(epicId);
      if (tab.dataset.tab === '2') loadEpicDoc(epicId);
    };
  });

  // Epic task filter bar
  const efBar = document.getElementById('epic-filter-bar');
  if (efBar) {
    const excludedStatus = new Set(['done', 'cancelled']);
    function applyEpicFilters() {
      const rows = document.querySelectorAll('[data-ef-row]');
      let visible = 0;
      rows.forEach(row => {
        const show = !excludedStatus.has(row.dataset.efStatusVal);
        row.style.display = show ? '' : 'none';
        // Hide associated detail and session rows
        const id = row.querySelector('code')?.textContent;
        if (id) {
          const detail = document.querySelector(`[data-epic-wi-detail="${id}"]`);
          const sessions = document.querySelector(`[data-wi-sessions="${id}"]`);
          if (detail && !show) detail.style.display = 'none';
          if (sessions && !show) sessions.style.display = 'none';
        }
        if (show) visible++;
      });
      const total = rows.length;
      const countEl = document.getElementById('epic-filter-count');
      if (countEl) countEl.textContent = excludedStatus.size ? `${visible} of ${total} tasks` : `${total} tasks`;
      const clearBtn = document.getElementById('epic-filter-clear');
      if (clearBtn) clearBtn.style.display = excludedStatus.size ? '' : 'none';
    }
    efBar.querySelectorAll('input[data-ef-status]').forEach(cb => {
      cb.onchange = () => {
        if (cb.checked) excludedStatus.delete(cb.dataset.efStatus);
        else excludedStatus.add(cb.dataset.efStatus);
        applyEpicFilters();
      };
    });
    const efClear = document.getElementById('epic-filter-clear');
    if (efClear) efClear.onclick = () => {
      excludedStatus.clear();
      efBar.querySelectorAll('input[data-ef-status]').forEach(cb => { cb.checked = true; });
      applyEpicFilters();
    };
    applyEpicFilters(); // apply defaults (hide done+cancelled)
  }

  // Unlink buttons
  document.querySelectorAll('[data-unlink-item]').forEach(btn => {
    btn.onclick = async () => {
      const wid = btn.dataset.unlinkItem;
      if (!confirm(`Unlink ${wid} from ${epicId}?`)) return;
      await fetch(`/api/epics/${epicId}/unlink`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ work_item_id: wid }),
      });
      backlog = null; epicCache = null;
      await buildEpicTree();
      route();
    };
  });

  // Link item button
  const linkBtn = document.getElementById('epic-link-item');
  if (linkBtn) linkBtn.onclick = () => showLinkItemModal(epicId);

  // Create task button
  const createTaskBtn = document.getElementById('epic-create-task');
  if (createTaskBtn) createTaskBtn.onclick = () => showCreateEpicTaskModal(epicId);

  // Archive epic button (header)
  const archiveBtn = document.getElementById('epic-archive-btn');
  if (archiveBtn) archiveBtn.onclick = async () => {
    if (!confirm(`Archive epic ${epicId}? It will be hidden from the main view.`)) return;
    try {
      const resp = await fetch(`/api/epics/${epicId}/archive`, { method: 'POST' });
      if (!resp.ok) throw new Error('Archive failed');
      backlog = null; epicCache = null;
      await buildEpicTree();
      location.hash = '#epics';
      route();
    } catch (e) {
      alert('Error: ' + e.message);
    }
  };

  // Delete epic button
  const deleteBtn = document.getElementById('epic-delete-btn');
  if (deleteBtn) deleteBtn.onclick = async () => {
    if (!confirm(`Delete epic ${epicId}? It will be marked as cancelled and all linked items will be unlinked.`)) return;
    try {
      const resp = await fetch(`/api/epics/${epicId}`, { method: 'DELETE' });
      if (!resp.ok) throw new Error('Delete failed');
      backlog = null; epicCache = null;
      await buildEpicTree();
      location.hash = '#epics';
      route();
    } catch (e) {
      alert('Error: ' + e.message);
    }
  };

  // Edit details
  const editBtn = document.getElementById('epic-edit-details');
  if (editBtn) editBtn.onclick = async () => {
    const epic = await api(`epics/${epicId}`);
    showEpicModal(epic);
  };

  // Dispatch from detail
  const dispatchBtn = document.getElementById('epic-dispatch-btn');
  if (dispatchBtn) dispatchBtn.onclick = () => showEpicDispatchModal(epicId);

  // Discuss from detail
  const discussBtn = document.getElementById('epic-discuss-btn');
  if (discussBtn) discussBtn.onclick = () => showEpicDiscussModal(epicId);
  const discussBtnTasks = document.getElementById('epic-discuss-btn-tasks');
  if (discussBtnTasks) discussBtnTasks.onclick = () => showEpicDiscussModal(epicId);

  // Task dispatch buttons
  document.querySelectorAll('[data-epic-task-dispatch]').forEach(btn => {
    btn.onclick = async () => {
      const wid = btn.dataset.epicTaskDispatch;
      let pk = btn.dataset.epicTaskPk;
      const bl = await getBacklog();
      let wi = null;
      for (const group of Object.values(bl.projects)) {
        if (!group.items) continue;
        wi = group.items.find(i => i.id === wid);
        if (wi) break;
      }
      // Fallback: if pk is empty, use epic's project_keys[0]
      if (!pk && epic.project_keys && epic.project_keys.length) {
        pk = epic.project_keys[0];
      }
      if (wi && pk) dispatchWorkItem(wi, pk);
      else if (wi) alert('No project key available. Link a project to this epic first.');
    };
  });

  // Epic view: expand detail rows
  document.querySelectorAll('[data-epic-wi-expand]').forEach(btn => {
    btn.onclick = () => {
      const wid = btn.dataset.epicWiExpand;
      const row = document.querySelector(`[data-epic-wi-detail="${wid}"]`);
      if (row) row.style.display = row.style.display === 'none' ? '' : 'none';
    };
  });

  // Epic view: edit buttons
  document.querySelectorAll('[data-epic-wi-edit]').forEach(btn => {
    btn.onclick = async () => {
      const wid = btn.dataset.epicWiEdit;
      const bl = await getBacklog();
      let wi = null;
      for (const group of Object.values(bl.projects)) {
        if (!group.items) continue;
        wi = group.items.find(i => i.id === wid);
        if (wi) break;
      }
      if (wi) showWorkItemModal(wi);
    };
  });

  // Epic view: delete buttons
  document.querySelectorAll('[data-epic-wi-del]').forEach(btn => {
    btn.onclick = async () => {
      const wid = btn.dataset.epicWiDel;
      const bl = await getBacklog();
      let wi = null;
      for (const group of Object.values(bl.projects)) {
        if (!group.items) continue;
        wi = group.items.find(i => i.id === wid);
        if (wi) break;
      }
      if (!wi) return;
      if (!confirm(`Delete task ${wi.id}: "${wi.title}"?`)) return;
      try {
        const resp = await fetch(`/api/work-items/${wi.id}`, { method: 'DELETE' });
        const result = await resp.json();
        if (!resp.ok) throw new Error(result.error || 'Delete failed');
        backlog = null; epicCache = null;
        await Promise.all([buildTree(), buildEpicTree()]);
        route();
      } catch (e) {
        alert('Delete failed: ' + e.message);
      }
    };
  });

  // Epic view: status badge click
  document.querySelectorAll('[data-status-click]').forEach(badge => {
    if (!badge._statusBound) {
      badge._statusBound = true;
      badge.onclick = (e) => {
        e.stopPropagation();
        showStatusDropdown(badge, badge.dataset.statusClick, badge.dataset.currentStatus);
      };
    }
  });

  // Epic view: plan/docs/files buttons (reuse same handlers)
  document.querySelectorAll('[data-epic-wi-detail] [data-wi-plan]').forEach(btn => {
    btn.onclick = () => loadItemArtifact(btn.dataset.wiPlan, 'plan');
  });
  document.querySelectorAll('[data-epic-wi-detail] [data-wi-doc]').forEach(btn => {
    btn.onclick = () => loadItemArtifact(btn.dataset.wiDoc, 'doc');
  });
  document.querySelectorAll('[data-epic-wi-detail] [data-wi-files]').forEach(btn => {
    btn.onclick = () => loadItemArtifacts(btn.dataset.wiFiles);
  });
}

async function loadItemArtifact(itemId, type) {
  const container = document.querySelector(`[data-artifact-for="${itemId}"]`);
  if (!container) return;
  container.innerHTML = '<p style="color:var(--muted);font-size:12px">Loading...</p>';
  try {
    const resp = await fetch(`/api/work-items/${itemId}/${type}`);
    const content = await resp.text();
    const label = type === 'plan' ? 'Plan' : 'Documentation';
    if (content.trim()) {
      container.innerHTML = `<div style="border:1px solid var(--border);border-radius:6px;max-height:300px;overflow:auto" class="md-container">${renderMd(content)}</div><button class="btn-add-wi" id="edit-wi-${type}-${itemId}" style="margin-top:4px;padding:4px 10px;font-size:11px">Edit ${label}</button>`;
    } else {
      container.innerHTML = `<p class="empty" style="font-size:12px">No ${label.toLowerCase()} yet.</p><button class="btn-add-wi" id="edit-wi-${type}-${itemId}" style="padding:4px 10px;font-size:11px">Create ${label}</button>`;
    }
    document.getElementById(`edit-wi-${type}-${itemId}`).onclick = () => showMdEditorModal(label, content, async (newContent) => {
      await fetch(`/api/work-items/${itemId}/${type}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: newContent }),
      });
      loadItemArtifact(itemId, type);
    });
  } catch {
    container.innerHTML = `<p class="empty" style="font-size:12px">Failed to load.</p>`;
  }
}

async function loadItemArtifacts(itemId) {
  const container = document.querySelector(`[data-artifact-for="${itemId}"]`);
  if (!container) return;
  container.innerHTML = '<p style="color:var(--muted);font-size:12px">Loading files...</p>';
  try {
    const data = await api(`work-items/${itemId}/artifacts`);
    const customFiles = (data.files || []).filter(f => f !== 'plan.md' && f !== 'docs.md' && f.endsWith('.md'));
    let html = '';
    if (customFiles.length) {
      html += `<div style="border:1px solid var(--border);border-radius:6px;padding:10px;font-size:12px;max-height:300px;overflow:auto">`;
      for (const file of customFiles) {
        html += `<div style="display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid #f0f0f0">`;
        html += `<code style="flex:1">${esc(file)}</code>`;
        html += `<button class="btn-add-wi" data-af-view="${esc(file)}" style="margin:0;padding:2px 8px;font-size:10px">View</button>`;
        html += `<button class="btn-add-wi" data-af-edit="${esc(file)}" style="margin:0;padding:2px 8px;font-size:10px">Edit</button>`;
        html += `<button class="delete-btn" data-af-del="${esc(file)}" style="padding:2px 8px;font-size:10px">Delete</button>`;
        html += `</div>`;
      }
      html += `</div>`;
    } else {
      html += `<p class="empty" style="font-size:12px">No custom artifacts.</p>`;
    }
    html += `<button class="btn-add-wi" data-af-add="1" style="margin-top:4px;padding:4px 10px;font-size:11px">+ Add File</button>`;
    html += `<div class="af-content-area" style="margin-top:8px"></div>`;
    container.innerHTML = html;

    const contentArea = container.querySelector('.af-content-area');

    container.querySelectorAll('[data-af-view]').forEach(btn => {
      btn.onclick = async () => {
        const fname = btn.dataset.afView;
        contentArea.innerHTML = '<p style="font-size:12px;color:var(--text-light)">Loading...</p>';
        try {
          const resp = await fetch(`/api/work-items/${itemId}/artifacts/${fname}`);
          if (!resp.ok) throw new Error('Not found');
          const content = await resp.text();
          contentArea.innerHTML = `<div style="border:1px solid var(--border);border-radius:6px;max-height:300px;overflow:auto" class="md-container">${renderMd(content)}</div>`;
        } catch {
          contentArea.innerHTML = '<p class="empty" style="font-size:12px">Failed to load.</p>';
        }
      };
    });

    container.querySelectorAll('[data-af-edit]').forEach(btn => {
      btn.onclick = async () => {
        const fname = btn.dataset.afEdit;
        let content = '';
        try {
          const resp = await fetch(`/api/work-items/${itemId}/artifacts/${fname}`);
          if (resp.ok) content = await resp.text();
        } catch {}
        showMdEditorModal(fname, content, async (newContent) => {
          await fetch(`/api/work-items/${itemId}/artifacts/${fname}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: newContent }),
          });
          loadItemArtifacts(itemId);
        });
      };
    });

    container.querySelectorAll('[data-af-del]').forEach(btn => {
      btn.onclick = async () => {
        const fname = btn.dataset.afDel;
        if (!confirm(`Delete artifact "${fname}"?`)) return;
        await fetch(`/api/work-items/${itemId}/artifacts/${fname}`, { method: 'DELETE' });
        loadItemArtifacts(itemId);
      };
    });

    container.querySelector('[data-af-add]').onclick = () => {
      const fname = prompt('Filename (must end with .md):', 'notes.md');
      if (!fname) return;
      if (!fname.endsWith('.md') || !/^[a-zA-Z0-9_-]+\.md$/.test(fname)) {
        alert('Filename must match [a-zA-Z0-9_-]+.md');
        return;
      }
      if (fname === 'plan.md' || fname === 'docs.md') {
        alert('Use the Plan/Docs buttons for those files.');
        return;
      }
      showMdEditorModal(fname, '', async (newContent) => {
        await fetch(`/api/work-items/${itemId}/artifacts/${fname}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: newContent }),
        });
        loadItemArtifacts(itemId);
      });
    };
  } catch {
    container.innerHTML = '<p class="empty" style="font-size:12px">Failed to load files.</p>';
  }
}

async function showEpicModal(existingEpic = null) {
  const isEdit = !!existingEpic;

  // Fetch registry for project multi-select
  let registryKeys = [];
  try {
    const registry = await api('registry');
    for (const [, entry] of Object.entries(registry.entries)) {
      registryKeys.push(`${entry.org}/${entry.project}/${entry.component}`);
    }
    registryKeys.sort();
  } catch {}

  const selectedKeys = isEdit && existingEpic.project_keys ? existingEpic.project_keys : [];

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>${isEdit ? `Edit ${esc(existingEpic.id)}` : 'New Epic'}</h3>
      <div class="field">
        <label>Title *</label>
        <input type="text" id="epic-title" value="${isEdit ? esc(existingEpic.title) : ''}" />
      </div>
      ${isEdit ? `<div class="field">
        <label>Status</label>
        <select id="epic-status">
          ${['draft','active','done','cancelled'].map(s => `<option value="${s}"${existingEpic.status === s ? ' selected' : ''}>${s}</option>`).join('')}
        </select>
      </div>` : ''}
      <div class="field">
        <label>Priority</label>
        <select id="epic-priority">
          ${['critical','high','medium','low'].map(p => `<option value="${p}"${(isEdit ? existingEpic.priority : 'medium') === p ? ' selected' : ''}>${p}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Projects</label>
        <select id="epic-projects" multiple style="min-height:80px">
          ${registryKeys.map(k => `<option value="${esc(k)}"${selectedKeys.includes(k) ? ' selected' : ''}>${esc(k)}</option>`).join('')}
        </select>
        <div style="font-size:11px;color:var(--text-light);margin-top:2px">Ctrl/Cmd+click to select multiple</div>
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="epic-description">${isEdit && existingEpic.description ? esc(existingEpic.description) : ''}</textarea>
      </div>
      <div class="field">
        <label>Acceptance Criteria (markdown)</label>
        <textarea id="epic-ac">${isEdit && existingEpic.acceptance_criteria ? esc(existingEpic.acceptance_criteria) : ''}</textarea>
      </div>
      <div class="field">
        <label>Target Date</label>
        <input type="text" id="epic-target" placeholder="YYYY-MM-DD" value="${isEdit && existingEpic.target_date ? esc(existingEpic.target_date) : ''}" />
      </div>
      <div class="field">
        <label>Tags (comma-separated)</label>
        <input type="text" id="epic-tags" value="${isEdit && existingEpic.tags ? esc(existingEpic.tags.join(', ')) : ''}" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="epic-cancel">Cancel</button>
        <button class="btn btn-dispatch" id="epic-save">${isEdit ? 'Save' : 'Create'}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#epic-cancel').onclick = () => overlay.remove();
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  overlay.querySelector('#epic-save').onclick = async () => {
    const title = overlay.querySelector('#epic-title').value.trim();
    if (!title) { alert('Title is required'); return; }
    const btn = overlay.querySelector('#epic-save');
    btn.disabled = true; btn.textContent = isEdit ? 'Saving...' : 'Creating...';

    const projectsEl = overlay.querySelector('#epic-projects');
    const project_keys = [...projectsEl.selectedOptions].map(o => o.value);

    const payload = {
      title,
      priority: overlay.querySelector('#epic-priority').value,
      description: overlay.querySelector('#epic-description').value.trim(),
      acceptance_criteria: overlay.querySelector('#epic-ac').value.trim(),
      target_date: overlay.querySelector('#epic-target').value.trim(),
      tags: overlay.querySelector('#epic-tags').value.split(',').map(t => t.trim()).filter(Boolean),
      project_keys,
    };
    if (isEdit) {
      const statusEl = overlay.querySelector('#epic-status');
      if (statusEl) payload.status = statusEl.value;
    }

    try {
      const url = isEdit ? `/api/epics/${existingEpic.id}` : '/api/epics';
      const method = isEdit ? 'PATCH' : 'POST';
      const resp = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const result = await resp.json();
      if (!resp.ok) throw new Error(result.error || 'Failed');
      overlay.remove();
      backlog = null; epicCache = null;
      await buildEpicTree();
      if (isEdit) location.hash = `#epic/${existingEpic.id}`;
      route();
    } catch (e) {
      btn.disabled = false; btn.textContent = isEdit ? 'Save' : 'Create';
      alert('Error: ' + e.message);
    }
  };
}

async function showLinkItemModal(epicId) {
  const bl = await api('backlog');
  const allItems = [];
  for (const [key, group] of Object.entries(bl.projects || {})) {
    for (const item of (group.items || [])) {
      if (!item.epic_id && (item.status === 'open' || item.status === 'in-progress')) {
        allItems.push({ ...item, project_key: key });
      }
    }
  }

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Link Items to ${esc(epicId)}</h3>
      <div class="field">
        <label>Search Items</label>
        <input type="text" id="link-search" placeholder="Filter by title or ID..." />
      </div>
      <div id="link-items-list" style="max-height:300px;overflow-y:auto"></div>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="link-cancel">Cancel</button>
        <button class="btn btn-dispatch" id="link-save">Link Selected</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const selected = new Set();
  function renderItems(filter) {
    const listEl = document.getElementById('link-items-list');
    const filtered = filter ? allItems.filter(i => i.id.toLowerCase().includes(filter) || i.title.toLowerCase().includes(filter)) : allItems;
    if (!filtered.length) { listEl.innerHTML = '<p class="empty">No unlinked items found.</p>'; return; }
    listEl.innerHTML = filtered.map(i => `
      <label style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f0f0f0;font-size:13px;cursor:pointer">
        <input type="checkbox" data-link-wid="${esc(i.id)}" ${selected.has(i.id) ? 'checked' : ''} />
        <code>${esc(i.id)}</code>
        <span style="flex:1">${esc(i.title)}</span>
        <span class="tag">${esc(i.project_key)}</span>
      </label>
    `).join('');
    listEl.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.onchange = () => {
        if (cb.checked) selected.add(cb.dataset.linkWid);
        else selected.delete(cb.dataset.linkWid);
      };
    });
  }
  renderItems('');
  overlay.querySelector('#link-search').oninput = (e) => renderItems(e.target.value.toLowerCase());
  overlay.querySelector('#link-cancel').onclick = () => overlay.remove();
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  overlay.querySelector('#link-save').onclick = async () => {
    if (!selected.size) { overlay.remove(); return; }
    const btn = overlay.querySelector('#link-save');
    btn.disabled = true; btn.textContent = 'Linking...';
    try {
      const resp = await fetch(`/api/epics/${epicId}/link`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ work_item_ids: [...selected] }),
      });
      if (!resp.ok) throw new Error('Link failed');
      overlay.remove();
      backlog = null; epicCache = null;
      await buildEpicTree();
      route();
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Link Selected';
      alert('Error: ' + e.message);
    }
  };
}

        <label>Priority</label>

          ${['critical','high','medium','low'].map(p => `<option value="${p}"${p === 'medium' ? ' selected' : ''}>${p}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="ct-description"></textarea>
      </div>
      <div class="field">
        <label>Tags (comma-separated)</label>
        <input type="text" id="ct-tags" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="ct-cancel">Cancel</button>
        <button class="btn btn-dispatch" id="ct-save">Create & Link</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.querySelector('#ct-project').onchange = (e) => {
    document.getElementById('ct-new-pk-field').style.display = e.target.value === '__new__' ? '' : 'none';
  };
  overlay.querySelector('#ct-cancel').onclick = () => overlay.remove();
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  overlay.querySelector('#ct-save').onclick = async () => {
    const title = overlay.querySelector('#ct-title').value.trim();
    if (!title) { alert('Title is required'); return; }

    let projectKey = overlay.querySelector('#ct-project').value;
    if (projectKey === '__new__') {
      projectKey = overlay.querySelector('#ct-new-pk').value.trim();
      if (!projectKey) { alert('Project key is required'); return; }
    }

    const btn = overlay.querySelector('#ct-save');
    btn.disabled = true; btn.textContent = 'Creating...';

    try {
      const resp = await fetch('/api/work-items', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          project_key: projectKey,
          title,
          priority: overlay.querySelector('#ct-priority').value,
          description: overlay.querySelector('#ct-description').value.trim(),
          tags: overlay.querySelector('#ct-tags').value.split(',').map(t => t.trim()).filter(Boolean),
        }),
      });
      const item = await resp.json();
      if (!resp.ok) throw new Error(item.error || 'Create failed');

      const linkResp = await fetch(`/api/epics/${epicId}/link`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ work_item_ids: [item.id] }),
      });
      if (!linkResp.ok) throw new Error('Link failed');

      overlay.remove();
      backlog = null; epicCache = null;
      await buildEpicTree();
      route();
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Create & Link';
      alert('Error: ' + e.message);
    }
  };
}

async function showEpicDispatchModal(epicId) {
  const epic = await api(`epics/${epicId}`);
  const items = epic.resolved_items || [];
  const openItems = items.filter(i => i.status === 'open' || i.status === 'in-progress');
  let projectKeys = epic.project_keys || [];
  const p = epic.progress || { done: 0, total: 0 };

  // If no project keys, fetch registry as fallback
  let registryKeys = [];
  if (!projectKeys.length) {
    try {
      const registry = await api('registry');
      for (const [, entry] of Object.entries(registry.entries)) {
        registryKeys.push(`${entry.org}/${entry.project}/${entry.component}`);
      }
      registryKeys.sort();
    } catch {}
    projectKeys = registryKeys;
  }
  if (!projectKeys.includes(ARCHITECT_KEY)) projectKeys.unshift(ARCHITECT_KEY);

  const { overlay } = createDispatchOverlay({
    title: `Dispatch from ${epic.id}`,
    cancelId: 'epic-dispatch-cancel',
    submitId: 'epic-dispatch-go',
    buildFields: () => `
      <div style="margin-bottom:14px">
        <strong>${esc(epic.title)}</strong>
        <div style="font-size:12px;color:var(--text-light);margin-top:4px">Progress: ${p.done}/${p.total}</div>
      </div>
      <div class="field">
        <label>Mode</label>
        <select id="epic-dispatch-mode">
          <option value="general">Work on epic (general)</option>
          ${openItems.map(i => `<option value="${esc(i.id)}">${esc(i.id)}: ${esc(i.title)}</option>`).join('')}
        </select>
      </div>
      <div class="field" id="epic-dispatch-project-field">
        <label>Target Project</label>
        <select id="epic-dispatch-project">
          ${projectKeys.map(k => `<option value="${esc(k)}">${esc(k)}</option>`).join('')}
        </select>
        ${registryKeys.length ? '<div style="font-size:11px;color:var(--text-light);margin-top:2px">No linked projects — showing all registry projects</div>' : ''}
      </div>
      <div class="field">
        <label>Additional Instructions</label>
        <textarea id="epic-dispatch-instructions" placeholder="Optional context..."></textarea>
      </div>
      ${permissionModeSelect('epic-dispatch-perm-mode')}
      ${skipPermissionsCheckbox('epic-dispatch-skip-perms')}
    `,
    onSubmit: async (overlay) => {
      const modeSelect = overlay.querySelector('#epic-dispatch-mode');
      const projectSelect = overlay.querySelector('#epic-dispatch-project');
      const mode = modeSelect.value;
      const instructions = overlay.querySelector('#epic-dispatch-instructions').value.trim();
      const permMode = getPermissionMode(overlay, 'epic-dispatch-perm-mode');
      const skipPerms = overlay.querySelector('#epic-dispatch-skip-perms').checked;

      let pk, wid;
      if (mode === 'general') {
        pk = projectSelect.value || projectKeys[0];
        wid = null;
      } else {
        wid = mode;
        const item = openItems.find(i => i.id === wid);
        pk = item ? item.project_key : (projectSelect.value || projectKeys[0]);
      }

      if (!pk) { throw new Error('No project key available for dispatch. Onboard a project first.'); }

      const resp = await fetch('/api/dispatch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          work_item_id: wid,
          epic_id: epicId,
          project_key: pk,
          title: wid ? `${wid} (${epic.title})` : epic.title,
          additional_instructions: instructions,
          permission_mode: permMode,
          skip_permissions: skipPerms,
        }),
      });
      const result = await resp.json();
      if (!resp.ok) throw new Error(result.error || 'Dispatch failed');

      let projectPath = '';
      if (pk === ARCHITECT_KEY) {
        projectPath = '(architect root)';
      } else {
        try {
          const registry = await api('registry');
          for (const [path, entry] of Object.entries(registry.entries)) {
            if (`${entry.org}/${entry.project}/${entry.component}` === pk) { projectPath = path; break; }
          }
        } catch {}
      }

      const dispatch = {
        id: result.dispatch_id,
        work_item_id: wid,
        project_key: pk,
        project_path: projectPath,
        title: wid ? `${wid} (${epic.title})` : epic.title,
        permission_mode: permMode,
        skip_permissions: skipPerms,
        status: 'running',
        started_at: new Date().toISOString(),
      };
      activeDispatches.push(dispatch);
      syncSessionState();
      createDispatchPanel(dispatch);
      placeSessionPanels();
      loadDispatchContent(dispatch);
    },
  });

  const modeSelect = overlay.querySelector('#epic-dispatch-mode');
  const projectSelect = overlay.querySelector('#epic-dispatch-project');
  modeSelect.onchange = () => {
    if (modeSelect.value !== 'general') {
      const item = openItems.find(i => i.id === modeSelect.value);
      if (item) { projectSelect.value = item.project_key; }
    }
  };
}

// --- Onboard Modal ---
function showOnboardModal() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Onboard Project</h3>
      <div class="field">
        <label>Project Path *</label>
        <input type="text" id="onboard-path" placeholder="/absolute/path/to/project" />
      </div>
      <div class="field">
        <label>Organization (optional)</label>
        <input type="text" id="onboard-org" placeholder="Auto-detect if empty" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="onboard-cancel">Cancel</button>
        <button class="btn btn-dispatch" id="onboard-go">Onboard</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.querySelector('#onboard-cancel').onclick = () => overlay.remove();
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  overlay.querySelector('#onboard-go').onclick = async () => {
    const path = overlay.querySelector('#onboard-path').value.trim();
    if (!path) { alert('Path is required'); return; }

    const org = overlay.querySelector('#onboard-org').value.trim();
    const btn = overlay.querySelector('#onboard-go');
    btn.disabled = true; btn.textContent = 'Dispatching...';

    try {
      const resp = await fetch('/api/onboard', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path, organization: org || undefined }),
      });
      const result = await resp.json();
      if (!resp.ok) throw new Error(result.error || 'Onboard failed');

      const dispatch = {
        id: result.dispatch_id,
        work_item_id: null,
        project_key: 'onboard',
        project_path: path,
        title: `Onboard: ${path.split('/').pop()}`,

  };
