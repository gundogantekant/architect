services:
  postgres:
    image: postgres:16-alpine
    container_name: architect-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ARCHITECT_PG_PORT:-3778}:5432"
    environment:
      POSTGRES_DB: ${ARCHITECT_PG_DB:-architect}
      POSTGRES_USER: ${ARCHITECT_PG_USER:-architect}
      POSTGRES_PASSWORD: ${ARCHITECT_PG_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - architect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ARCHITECT_PG_USER:-architect} -d ${ARCHITECT_PG_DB:-architect}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: postgres -c max_connections=200
    shm_size: 256mb
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  architect_pgdata:
    name: architect_pgdata
